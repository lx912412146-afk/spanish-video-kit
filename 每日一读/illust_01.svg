    <rect width="400" height="260" fill="url(#wall)"/>
    <rect x="0" y="196" width="400" height="64" fill="url(#floor)"/>
    <g stroke="#d7b893" stroke-width="0.8" opacity="0.7">
      <line x1="0" y1="212" x2="400" y2="212"/><line x1="0" y1="231" x2="400" y2="231"/><line x1="0" y1="250" x2="400" y2="250"/>
      <line x1="60" y1="196" x2="56" y2="212"/><line x1="190" y1="212" x2="186" y2="231"/><line x1="300" y1="196" x2="297" y2="212"/>
      <line x1="110" y1="231" x2="106" y2="250"/><line x1="350" y1="231" x2="347" y2="250"/><line x1="250" y1="250" x2="248" y2="260"/>
    </g>
    <rect x="0" y="193" width="400" height="4" fill="#e7cfb0"/>

    <g filter="url(#wc)">
      <!-- 落地玻璃门：天空、云、远处屋顶 -->
      <rect x="150" y="12" width="168" height="182" fill="url(#sky)"/>
      <g filter="url(#soft2)" fill="#ffffff" opacity="0.85">
        <ellipse cx="195" cy="48" rx="22" ry="7"/><ellipse cx="212" cy="44" rx="14" ry="7"/>
        <ellipse cx="282" cy="72" rx="20" ry="5.5"/><ellipse cx="270" cy="69" rx="11" ry="5"/>
      </g>
      <g opacity="0.9">
        <path d="M150,150 L150,128 L168,128 L168,118 L186,118 L186,132 L204,132 L204,122 L222,110 L240,122 L240,140 L262,140 L262,124 L280,124 L280,116 L298,116 L298,132 L318,132 L318,194 L150,194 Z" fill="#e9d9cb"/>
        <path d="M150,194 L150,160 L176,160 L176,150 L200,150 L200,164 L232,164 L232,152 L258,152 L258,166 L290,166 L290,156 L318,156 L318,194 Z" fill="#dfcab9"/>
        <g fill="#f3ebe0"><rect x="172" y="122" width="3" height="4"/><rect x="178" y="122" width="3" height="4"/><rect x="266" y="128" width="3" height="4"/><rect x="284" y="120" width="3" height="4"/><rect x="290" y="120" width="3" height="4"/></g>
      </g>
      <!-- 门框 -->
      <g fill="none" stroke="#e4cfb2" stroke-linejoin="round">
        <rect x="148" y="10" width="172" height="186" stroke-width="7"/>
        <line x1="234" y1="10" x2="234" y2="196" stroke-width="5"/>
      </g>
      <rect x="140" y="4" width="188" height="7" fill="#efdcc2"/>
      <!-- 栏杆 -->
      <g stroke="#f4ece0" stroke-width="2.2" opacity="0.95">
        <line x1="152" y1="150" x2="316" y2="150"/>
        <line x1="166" y1="150" x2="166" y2="194"/><line x1="184" y1="150" x2="184" y2="194"/><line x1="202" y1="150" x2="202" y2="194"/><line x1="220" y1="150" x2="220" y2="194"/>
        <line x1="248" y1="150" x2="248" y2="194"/><line x1="266" y1="150" x2="266" y2="194"/><line x1="284" y1="150" x2="284" y2="194"/><line x1="302" y1="150" x2="302" y2="194"/>
      </g>

      <!-- 左墙的小木架和草莓盆 -->
      <rect x="22" y="112" width="92" height="6" rx="1.5" fill="#d6b48c"/>
      <path d="M30,118 L36,128 M106,118 L100,128" stroke="#c9a57c" stroke-width="2"/>
      <path d="M44,92 L92,92 L86,112 L50,112 Z" fill="url(#pot)"/>
      <rect x="41" y="88" width="54" height="6" rx="2" fill="#d98b62"/>
      <g fill="#79b062">
        <use href="#bleaf" transform="translate(56,88) rotate(-140) scale(1.2)"/>
        <use href="#bleaf" transform="translate(62,86) rotate(-100) scale(1.25)"/>
        <use href="#bleaf" transform="translate(70,86) rotate(-70) scale(1.3)"/>
        <use href="#bleaf" transform="translate(80,88) rotate(-35) scale(1.2)"/>
        <use href="#bleaf" transform="translate(48,92) rotate(150) scale(1.1)"/>
        <use href="#bleaf" transform="translate(88,92) rotate(25) scale(1.1)"/>
      </g>
      <g fill="#8cc171">
        <use href="#bleaf" transform="translate(66,88) rotate(-120) scale(1)"/>
        <use href="#bleaf" transform="translate(76,88) rotate(-55) scale(1)"/>
      </g>
      <path d="M46,94 C40,104 38,116 40,128 M90,94 C96,104 98,114 96,126" stroke="#6f9f55" stroke-width="1.2" fill="none"/>
      <use href="#berry" transform="translate(40,131) scale(1.05)"/>
      <use href="#berry" transform="translate(96,129)"/>
      <use href="#berry" transform="translate(58,116) scale(0.9)"/>

      <!-- 阳光 -->
      <g filter="url(#soft)" opacity="0.5">
        <path d="M160,196 L232,196 L290,256 L196,256 Z" fill="#fffaf0"/>
      </g>

      <!-- 长花槽和番茄 -->
      <g stroke="#a98058" stroke-width="2.2" stroke-linecap="round">
        <line x1="178" y1="186" x2="174" y2="70"/><line x1="228" y1="186" x2="230" y2="58"/><line x1="280" y1="186" x2="284" y2="76"/>
      </g>
      <g stroke="#6f9f52" stroke-width="2" fill="none" stroke-linecap="round">
        <path d="M180,186 C176,160 182,130 176,100 C174,90 176,82 175,76"/>
        <path d="M178,150 C190,144 196,138 200,128"/><path d="M177,120 C166,114 162,108 158,100"/>
        <path d="M228,186 C232,160 224,130 230,100 C232,86 229,72 231,62"/>
        <path d="M229,140 C240,136 248,128 252,118"/><path d="M230,110 C218,104 212,96 210,88"/>
        <path d="M280,186 C276,162 284,134 280,108 C279,96 283,88 283,80"/>
        <path d="M280,146 C292,142 300,134 304,124"/><path d="M281,118 C270,112 266,104 262,98"/>
      </g>
      <g fill="#6aa357">
        <use href="#leaf" transform="translate(176,96) rotate(-160) scale(1.1)"/><use href="#leaf" transform="translate(176,84) rotate(-30) scale(1.1)"/>
        <use href="#leaf" transform="translate(200,128) rotate(-40) scale(1.05)"/><use href="#leaf" transform="translate(158,100) rotate(-150) scale(1)"/>
        <use href="#leaf" transform="translate(179,168) rotate(170) scale(1.05)"/><use href="#leaf" transform="translate(181,138) rotate(15) scale(1)"/>
        <use href="#leaf" transform="translate(230,78) rotate(-150) scale(1.1)"/><use href="#leaf" transform="translate(231,66) rotate(-40) scale(1.05)"/>
        <use href="#leaf" transform="translate(252,118) rotate(-35) scale(1.05)"/><use href="#leaf" transform="translate(210,88) rotate(-145) scale(1.05)"/>
        <use href="#leaf" transform="translate(228,160) rotate(165) scale(1.05)"/><use href="#leaf" transform="translate(231,128) rotate(10) scale(1)"/>
        <use href="#leaf" transform="translate(282,92) rotate(-30) scale(1.05)"/><use href="#leaf" transform="translate(281,100) rotate(-165) scale(1)"/>
        <use href="#leaf" transform="translate(304,124) rotate(-30) scale(1.05)"/><use href="#leaf" transform="translate(262,98) rotate(-150) scale(1)"/>
        <use href="#leaf" transform="translate(279,166) rotate(170) scale(1)"/><use href="#leaf" transform="translate(282,134) rotate(10) scale(1)"/>
      </g>
      <g fill="#8cc170">
        <use href="#leaf" transform="translate(178,110) rotate(20) scale(0.9)"/><use href="#leaf" transform="translate(176,152) rotate(-170) scale(0.9)"/>
        <use href="#leaf" transform="translate(229,96) rotate(25) scale(0.9)"/><use href="#leaf" transform="translate(230,146) rotate(-175) scale(0.9)"/>
        <use href="#leaf" transform="translate(281,116) rotate(20) scale(0.9)"/><use href="#leaf" transform="translate(280,152) rotate(-170) scale(0.9)"/>
        <use href="#leaf" transform="translate(190,144) rotate(-60) scale(0.8)"/><use href="#leaf" transform="translate(240,136) rotate(-55) scale(0.8)"/><use href="#leaf" transform="translate(292,142) rotate(-55) scale(0.8)"/>
      </g>
      <g fill="#5d9a4e" opacity="0.95">
        <use href="#leaf" transform="translate(175,74) rotate(-100) scale(1.15)"/><use href="#leaf" transform="translate(178,128) rotate(-170) scale(1.2)"/>
        <use href="#leaf" transform="translate(180,176) rotate(-10) scale(1.1)"/><use href="#leaf" transform="translate(163,104) rotate(160) scale(0.95)"/>
        <use href="#leaf" transform="translate(231,62) rotate(-85) scale(1.15)"/><use href="#leaf" transform="translate(229,118) rotate(-168) scale(1.2)"/>
        <use href="#leaf" transform="translate(230,172) rotate(-12) scale(1.1)"/><use href="#leaf" transform="translate(212,92) rotate(150) scale(0.95)"/>
        <use href="#leaf" transform="translate(283,80) rotate(-95) scale(1.1)"/><use href="#leaf" transform="translate(280,126) rotate(-170) scale(1.2)"/>
        <use href="#leaf" transform="translate(281,174) rotate(-8) scale(1.1)"/><use href="#leaf" transform="translate(300,128) rotate(30) scale(0.9)"/>
        <use href="#leaf" transform="translate(196,132) rotate(40) scale(0.9)"/><use href="#leaf" transform="translate(250,122) rotate(35) scale(0.9)"/>
      </g>
      <g>
        <use href="#tomato" transform="translate(196,136)"/><use href="#tomatoO" transform="translate(186,148)"/><use href="#tomatoG" transform="translate(164,108)"/>
        <use href="#tomato" transform="translate(248,126)"/><use href="#tomato" transform="translate(238,140)"/><use href="#tomatoO" transform="translate(214,96)"/>
        <use href="#tomato" transform="translate(300,132)"/><use href="#tomatoG" transform="translate(290,146)"/><use href="#tomato" transform="translate(266,106)"/>
        <use href="#tomatoO" transform="translate(176,124)"/>
      </g>
      <!-- 花槽 -->
      <rect x="128" y="182" width="200" height="40" rx="2" fill="url(#box)"/>
      <rect x="124" y="178" width="208" height="7" rx="1.5" fill="#d9b088"/>
      <g stroke="#a7794f" stroke-width="0.9" opacity="0.8"><line x1="128" y1="197" x2="328" y2="197"/><line x1="128" y1="210" x2="328" y2="210"/></g>
      <rect x="136" y="222" width="8" height="6" fill="#9e7450"/><rect x="312" y="222" width="8" height="6" fill="#9e7450"/>
      <!-- 生菜 -->
      <g>
        <circle cx="146" cy="176" r="11" fill="url(#let)"/><circle cx="139" cy="172" r="6.5" fill="#c9e39b"/><circle cx="153" cy="171" r="6.5" fill="#bfdc8f"/><circle cx="146" cy="168" r="5" fill="#e1f0bd"/>
        <circle cx="312" cy="176" r="11" fill="url(#let)"/><circle cx="305" cy="172" r="6.5" fill="#bfdc8f"/><circle cx="319" cy="171" r="6.5" fill="#c9e39b"/><circle cx="312" cy="168" r="5" fill="#e1f0bd"/>
        <circle cx="256" cy="178" r="9" fill="url(#let)"/><circle cx="250" cy="174" r="5.5" fill="#c9e39b"/><circle cx="262" cy="174" r="5.5" fill="#bfdc8f"/><circle cx="256" cy="171" r="4.2" fill="#e1f0bd"/>
      </g>

      <!-- 地上的罗勒盆 -->
      <path d="M44,212 L94,212 L88,246 L50,246 Z" fill="url(#pot)"/>
      <rect x="40" y="207" width="58" height="7" rx="2" fill="#dc9067"/>
      <g fill="#7fbf63">
        <use href="#bleaf" transform="translate(69,206) rotate(-90) scale(1.2)"/><use href="#bleaf" transform="translate(66,204) rotate(-125) scale(1.25)"/>
        <use href="#bleaf" transform="translate(72,204) rotate(-55) scale(1.25)"/><use href="#bleaf" transform="translate(60,206) rotate(-160) scale(1.2)"/>
        <use href="#bleaf" transform="translate(78,206) rotate(-20) scale(1.2)"/><use href="#bleaf" transform="translate(64,192) rotate(-110) scale(1.05)"/>
        <use href="#bleaf" transform="translate(74,192) rotate(-70) scale(1.05)"/><use href="#bleaf" transform="translate(52,200) rotate(-150) scale(1)"/>
        <use href="#bleaf" transform="translate(86,200) rotate(-30) scale(1)"/>
      </g>
      <g fill="#a2d184">
        <use href="#bleaf" transform="translate(69,190) rotate(-95) scale(0.95)"/><use href="#bleaf" transform="translate(62,198) rotate(-140) scale(0.85)"/>
        <use href="#bleaf" transform="translate(77,198) rotate(-40) scale(0.85)"/>
      </g>

      <!-- 洒水壶 -->
      <path d="M336,212 C336,206 340,204 346,204 L370,204 C376,204 380,206 380,212 L378,244 C378,247 375,248 372,248 L344,248 C341,248 338,247 338,244 Z" fill="url(#can)"/>
      <path d="M338,218 C326,214 318,206 312,196" stroke="#8fc0bb" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M307,192 L316,190 L317,199 L309,199 Z" fill="#7fb0ab"/>
      <path d="M346,204 C346,190 370,190 370,204" stroke="#83b3ae" stroke-width="3.5" fill="none"/>
      <rect x="338" y="224" width="40" height="3" fill="#a8d0ca" opacity="0.8"/>
      <ellipse cx="350" cy="214" rx="3" ry="7" fill="#fff" opacity="0.35"/>
    </g>

    <!-- 地面阴影 -->
    <g filter="url(#soft2)" opacity="0.18" fill="#8a6a4a">
      <ellipse cx="228" cy="230" rx="104" ry="5"/><ellipse cx="69" cy="248" rx="26" ry="3"/><ellipse cx="358" cy="250" rx="24" ry="3"/>
    </g>
    <!-- 纸纹 -->
    <rect width="400" height="260" filter="url(#grain)"/>
    <!-- 标题 -->
    <text x="20" y="34" font-family="Georgia, 'Times New Roman', serif" font-size="14.5" fill="#55524c">Mi pequeño huerto.</text>
  </g>
</svg>
