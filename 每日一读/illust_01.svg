<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 260" width="400" height="260">
  <!-- 原创插图：阳台小菜园（水彩风格，纯 SVG 手绘，无外部素材） -->
  <defs>
    <filter id="wc" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="0.35"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="g"/>
      <feColorMatrix in="g" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.38  0 0 0 0 0.3  0 0 0 0.09 0"/>
    </filter>
    <filter id="edge" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="5"/></filter>
    <mask id="fade" maskUnits="userSpaceOnUse" x="0" y="0" width="400" height="260">
      <rect x="7" y="7" width="386" height="246" rx="4" fill="#fff" filter="url(#edge)"/>
    </mask>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf3e6"/><stop offset="0.6" stop-color="#f8e9d6"/><stop offset="1" stop-color="#f4dfc8"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe4ee"/><stop offset="0.7" stop-color="#e6f0ef"/><stop offset="1" stop-color="#f4f2e6"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ead2b4"/><stop offset="1" stop-color="#e2c4a2"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c99d74"/><stop offset="1" stop-color="#b3865f"/>
    </linearGradient>
    <linearGradient id="pot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d4835c"/><stop offset="0.45" stop-color="#e59b74"/><stop offset="1" stop-color="#c8734d"/>
    </linearGradient>
    <linearGradient id="can" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8fc0bb"/><stop offset="0.5" stop-color="#b3d8d2"/><stop offset="1" stop-color="#83b3ae"/>
    </linearGradient>
    <radialGradient id="tom" cx="0.38" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#f69a86"/><stop offset="0.55" stop-color="#e9604f"/><stop offset="1" stop-color="#cf4338"/>
    </radialGradient>
    <radialGradient id="tomO" cx="0.38" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#f8c48a"/><stop offset="0.6" stop-color="#f09a55"/><stop offset="1" stop-color="#df7d3c"/>
    </radialGradient>
    <radialGradient id="tomG" cx="0.38" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#d4e8a8"/><stop offset="1" stop-color="#93bf6a"/>
    </radialGradient>
    <radialGradient id="let" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#e3f1b8"/><stop offset="0.7" stop-color="#b6d98a"/><stop offset="1" stop-color="#93c46e"/>
    </radialGradient>
    <path id="leaf" d="M0,0 C4,-5.5 12,-5.5 16,0 C12,5.5 4,5.5 0,0 Z"/>
    <path id="bleaf" d="M0,0 C3,-6 10,-7 13,0 C10,6 3,6 0,0 Z"/>
    <g id="tomato"><circle r="7" fill="url(#tom)"/><path d="M-3.5,-6 L0,-4.2 L3.5,-6 L1.6,-3.6 L4.5,-2.6 L0,-3 L-4.5,-2.6 L-1.6,-3.6 Z" fill="#5f9a4c"/><ellipse cx="-2.4" cy="-1.6" rx="1.8" ry="1.1" fill="#fff" opacity="0.55"/></g>
    <g id="tomatoO"><circle r="6.5" fill="url(#tomO)"/><path d="M-3.2,-5.6 L0,-4 L3.2,-5.6 L1.5,-3.4 L4.2,-2.4 L0,-2.8 L-4.2,-2.4 L-1.5,-3.4 Z" fill="#5f9a4c"/><ellipse cx="-2.2" cy="-1.5" rx="1.6" ry="1" fill="#fff" opacity="0.5"/></g>
    <g id="tomatoG"><circle r="5.5" fill="url(#tomG)"/><path d="M-2.8,-4.8 L0,-3.5 L2.8,-4.8 L1.3,-2.9 L3.6,-2 L0,-2.4 L-3.6,-2 L-1.3,-2.9 Z" fill="#5f9a4c"/></g>
    <g id="berry"><path d="M0,-4 C3.2,-4.4 5,-2 4.2,0.8 C3.4,3.6 1.4,5.6 0,6.4 C-1.4,5.6 -3.4,3.6 -4.2,0.8 C-5,-2 -3.2,-4.4 0,-4 Z" fill="#e2564d"/><g fill="#f7dc8a"><circle cx="-1.6" cy="-0.6" r="0.45"/><circle cx="1.5" cy="-0.4" r="0.45"/><circle cx="0" cy="1.6" r="0.45"/><circle cx="-1.8" cy="2.6" r="0.4"/><circle cx="1.7" cy="2.6" r="0.4"/><circle cx="0" cy="4.2" r="0.4"/></g><path d="M-3,-4 L0,-2.6 L3,-4 L1.4,-5.4 L0,-4.4 L-1.4,-5.4 Z" fill="#6aa357"/></g>
  </defs>

  <g mask="url(#fade)">
