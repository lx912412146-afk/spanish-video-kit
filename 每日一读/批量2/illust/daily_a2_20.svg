<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 260" width="400" height="260">
  <!-- 原创插图：我的第一次长跑（公园里的跑步赛道：终点彩带拱门、路边的水杯桌、一双跑鞋、树；水彩风格，纯 SVG 手绘） -->
  <defs>
    <filter id="wc" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="0.35"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="g"/>
      <feColorMatrix in="g" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.38  0 0 0 0 0.3  0 0 0 0.09 0"/>
    </filter>
    <filter id="edge" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="5"/></filter>
    <mask id="fade" maskUnits="userSpaceOnUse" x="0" y="0" width="400" height="260">
      <rect x="7" y="7" width="386" height="246" rx="4" fill="#fff" filter="url(#edge)"/>
    </mask>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dae8ef"/><stop offset="0.3" stop-color="#ebf1ec"/><stop offset="0.5" stop-color="#f8f2e3"/><stop offset="1" stop-color="#f8f2e3"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cde1a4"/><stop offset="0.5" stop-color="#bdd795"/><stop offset="1" stop-color="#abc985"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6ddd0"/><stop offset="1" stop-color="#d6cbbb"/>
    </linearGradient>
    <linearGradient id="trunk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ab8566"/><stop offset="0.6" stop-color="#957257"/><stop offset="1" stop-color="#7e5f47"/>
    </linearGradient>
    <linearGradient id="shoe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ec9a7c"/><stop offset="1" stop-color="#d9785c"/>
    </linearGradient>
    <linearGradient id="shoeB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#df8d70"/><stop offset="1" stop-color="#c96d53"/>
    </linearGradient>
    <linearGradient id="jug" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9fc4d8"/><stop offset="0.5" stop-color="#c3dce8"/><stop offset="1" stop-color="#93b9ce"/>
    </linearGradient>
    <path id="clump" d="M-22,8 C-29,3 -26,-8 -17,-9 C-17,-18 -6,-22 0,-17 C6,-23 18,-19 17,-10 C26,-9 28,3 21,8 C17,14 6,13 0,12 C-8,14 -17,13 -22,8 Z"/>
    <g id="cup"><path d="M-2.6,-7 L2.6,-7 L2,0 L-2,0 Z" fill="#fbf9f4"/><ellipse cx="0" cy="-7" rx="2.6" ry="0.8" fill="#dbe8ee"/><rect x="-2.3" y="-4.4" width="4.6" height="1.2" fill="#a9c9dc" opacity="0.8"/></g>
    <g id="balloon"><path d="M0,0 C-5,0 -7,-6 -7,-10 C-7,-15 -4,-18 0,-18 C4,-18 7,-15 7,-10 C7,-6 5,0 0,0 Z"/><path d="M-1.4,0 L1.4,0 L0,2 Z"/><ellipse cx="-2.6" cy="-12.6" rx="1.6" ry="2.6" fill="#ffffff" opacity="0.45"/></g>
    <g id="sneaker">
      <path d="M3,-7 C0,-10 2,-14 9,-15 C17,-16 24,-18 29,-23 C31,-25 33,-26 36,-26 L47,-26 C51,-26 54,-24 57,-21 C60,-18 61,-14 61,-9 Z"/>
      <path d="M-1,-1 C-3,-4 -1,-7 3,-7 L61,-9.4 C63,-9.4 64,-6 63,-3 C62,0 60,0 57,0 L2,0 Z" fill="#faf8f3"/>
      <path d="M1,-3.2 L61,-4" stroke="#e3ddd2" stroke-width="0.9"/>
      <path d="M3,-7 C0,-10 2,-14 9,-15 C12,-15.4 15,-15.8 17,-16.4 C14,-13 13,-10 14,-7.4 Z" fill="#f4b49a"/>
      <path d="M52,-25 C55,-23 58,-20 59.6,-16 C61,-13 61,-11 61,-9.2 L52,-8.8 C53,-14 53,-20 52,-25 Z" fill="#7fb0ab"/>
      <path d="M31,-24.6 C31,-28 33,-31 36,-31 C38,-31 39,-29 38.6,-26 Z" fill="#e8a084"/>
      <path d="M36,-26 L47,-26 C49,-26 50,-25 50,-24 L37,-24 Z" fill="#c1664d" opacity="0.7"/>
      <g stroke="#faf6ee" stroke-width="1.3" stroke-linecap="round"><line x1="17" y1="-17.4" x2="20.6" y2="-14"/><line x1="20.6" y1="-19.2" x2="24.4" y2="-15.6"/><line x1="24.2" y1="-21.4" x2="28" y2="-17.6"/><line x1="27.6" y1="-23.6" x2="31.4" y2="-19.8"/></g>
      <g fill="#f3a98d" opacity="0.85"><circle cx="36" cy="-17" r="0.7"/><circle cx="40" cy="-17" r="0.7"/><circle cx="44" cy="-17" r="0.7"/><circle cx="38" cy="-13" r="0.7"/><circle cx="42" cy="-13" r="0.7"/><circle cx="46" cy="-13" r="0.7"/></g>
    </g>
  </defs>

  <g mask="url(#fade)">
    <!-- 天空 -->
    <rect width="400" height="260" fill="url(#sky)"/>

    <g filter="url(#wc)">
      <g filter="url(#soft2)" fill="#ffffff" opacity="0.85">
        <ellipse cx="300" cy="36" rx="24" ry="6"/><ellipse cx="314" cy="32" rx="12" ry="5.5"/><ellipse cx="200" cy="58" rx="16" ry="4"/>
      </g>
      <!-- 远处的树林 -->
      <g fill="#c4daaa">
        <use href="#clump" transform="translate(120,128) scale(1.1)"/><use href="#clump" transform="translate(160,124) scale(0.9)"/><use href="#clump" transform="translate(200,120) scale(1)"/>
        <use href="#clump" transform="translate(240,124) scale(0.95)"/><use href="#clump" transform="translate(282,126) scale(1.1)"/>
      </g>
      <g fill="#d3e4bd"><use href="#clump" transform="translate(140,120) scale(0.6)"/><use href="#clump" transform="translate(222,116) scale(0.6)"/><use href="#clump" transform="translate(268,120) scale(0.55)"/></g>
      <!-- 草地 -->
      <path d="M0,140 C80,136 160,138 240,137 C300,136 350,138 400,138 L400,260 L0,260 Z" fill="url(#grass)"/>
      <!-- 跑道 -->
      <path d="M186,138 L216,138 C240,180 290,222 350,262 L66,262 C116,222 160,180 186,138 Z" fill="url(#road)"/>
      <g fill="none" stroke="#f2ece2" stroke-width="1.3" opacity="0.9"><path d="M186,138 C160,180 116,222 66,262"/><path d="M216,138 C240,180 290,222 350,262"/></g>
      <g stroke="#f6f2ea" stroke-width="1.6" stroke-linecap="round" opacity="0.85"><line x1="201" y1="142" x2="201" y2="148"/><line x1="201.4" y1="156" x2="201.6" y2="164"/><line x1="202" y1="196" x2="202.4" y2="208"/><line x1="203" y1="224" x2="203.4" y2="240"/></g>
      <!-- 终点线（灰白格子） -->
      <g>
        <path d="M160,176 L244,176 L247,183 L156,183 Z" fill="#f8f6f0"/>
        <g fill="#8e8b86">
          <rect x="160" y="176" width="7" height="3.5"/><rect x="174" y="176" width="7" height="3.5"/><rect x="188" y="176" width="7" height="3.5"/><rect x="202" y="176" width="7" height="3.5"/><rect x="216" y="176" width="7" height="3.5"/><rect x="230" y="176" width="7" height="3.5"/>
          <rect x="165.5" y="179.5" width="7.4" height="3.5"/><rect x="179.5" y="179.5" width="7.4" height="3.5"/><rect x="193.5" y="179.5" width="7.4" height="3.5"/><rect x="207.5" y="179.5" width="7.4" height="3.5"/><rect x="221.5" y="179.5" width="7.4" height="3.5"/><rect x="235.5" y="179.5" width="7.4" height="3.5"/>
        </g>
      </g>

      <!-- 终点拱门 -->
      <path d="M140,180 L140,120 C140,96 168,84 204,84 C240,84 268,96 268,120 L268,180" fill="none" stroke="#e48b6d" stroke-width="14" stroke-linecap="round"/>
      <path d="M135,178 L135,121 C135,99 160,88 204,88" fill="none" stroke="#f2b79f" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
      <path d="M144.6,178 L144.6,122 M263.4,178 L263.4,122" stroke="#d27458" stroke-width="2" opacity="0.6"/>
      <g fill="#f4ede0" opacity="0.95">
        <rect x="133" y="132" width="14" height="5" transform="skewY(-8) translate(0,19)"/><rect x="133" y="154" width="14" height="5" transform="skewY(-8) translate(0,22)"/>
        <rect x="261" y="132" width="14" height="5" transform="skewY(8) translate(0,-38)"/><rect x="261" y="154" width="14" height="5" transform="skewY(8) translate(0,-39)"/>
      </g>
      <g fill="#c9a37a"><rect x="133" y="178" width="14" height="5" rx="1.4"/><rect x="261" y="178" width="14" height="5" rx="1.4"/></g>
      <!-- 拱门下的三角彩旗 -->
      <path d="M146,104 Q204,124 262,104" fill="none" stroke="#a99a86" stroke-width="0.8"/>
      <g>
        <polygon points="152,106.4 160,108.8 155,117" fill="#efcd7e"/><polygon points="162,109.4 170,111.4 165,120" fill="#93b6cc"/><polygon points="172,112 180,113.6 175.6,122.4" fill="#9cc08a"/>
        <polygon points="182,114 190,115 186,124" fill="#e39a7a"/><polygon points="192,115.2 200,115.8 196.2,124.8" fill="#efcd7e"/><polygon points="202,115.8 210,115.6 206.2,124.8" fill="#93b6cc"/>
        <polygon points="212,115.4 220,114.6 216.4,123.6" fill="#9cc08a"/><polygon points="222,114.2 230,112.8 226.6,121.8" fill="#e39a7a"/><polygon points="232,112.2 240,110.4 236.6,119.4" fill="#efcd7e"/>
        <polygon points="242,109.6 250,107.4 246.6,116" fill="#93b6cc"/><polygon points="252,106.6 259,104.6 256,112.6" fill="#9cc08a"/>
      </g>
      <!-- 顶上飘的彩带 -->
      <g fill="none" stroke-width="1.8" stroke-linecap="round">
        <path d="M176,90 C174,100 180,106 176,116" stroke="#93b6cc"/><path d="M204,86 C201,96 207,102 203,112" stroke="#efcd7e"/><path d="M232,90 C234,100 228,106 232,116" stroke="#9cc08a"/>
      </g>
      <!-- 拱门两边的气球 -->
      <g stroke="#b9a996" stroke-width="0.6" fill="none"><path d="M133,124 C128,114 124,106 122,98"/><path d="M134,126 C132,114 130,104 130,92"/><path d="M275,124 C280,114 284,106 286,98"/><path d="M274,126 C276,114 278,104 278,92"/></g>
      <use href="#balloon" transform="translate(122,98)" fill="#efcd7e"/><use href="#balloon" transform="translate(130,92) scale(0.9)" fill="#93b6cc"/>
      <use href="#balloon" transform="translate(286,98)" fill="#9cc08a"/><use href="#balloon" transform="translate(278,92) scale(0.9)" fill="#efcd7e"/>

      <!-- 左边的大树 -->
      <path d="M36,206 C40,180 42,150 40,120 L52,120 C52,150 56,180 62,206 Z" fill="url(#trunk)"/>
      <g stroke="#8a6a50" stroke-width="3" fill="none" stroke-linecap="round"><path d="M44,132 C36,124 28,120 18,118"/><path d="M48,128 C56,120 64,116 76,114"/></g>
      <g fill="#6f9f55">
        <use href="#clump" transform="translate(24,108) scale(1.1)"/><use href="#clump" transform="translate(54,94) scale(-1.3,1.3)"/><use href="#clump" transform="translate(30,76) scale(1.05)"/><use href="#clump" transform="translate(76,110) scale(0.95)"/><use href="#clump" transform="translate(70,76) scale(-0.9,0.9)"/>
      </g>
      <g fill="#86b569">
        <use href="#clump" transform="translate(21,103) scale(-0.75,0.7)"/><use href="#clump" transform="translate(51,89) scale(0.95)"/><use href="#clump" transform="translate(27,71) scale(-0.7,0.65)"/><use href="#clump" transform="translate(73,105) scale(0.6)"/>
      </g>
      <g fill="#a2ca82"><use href="#clump" transform="translate(48,84) scale(0.5)"/><use href="#clump" transform="translate(24,66) scale(0.4)"/></g>
      <!-- 右边的树 -->
      <path d="M368,190 C371,168 372,146 370,120 L380,120 C380,146 383,168 388,190 Z" fill="url(#trunk)"/>
      <g fill="#78a85d">
        <use href="#clump" transform="translate(356,106) scale(1.1)"/><use href="#clump" transform="translate(384,90) scale(-1.3,1.3)"/><use href="#clump" transform="translate(360,70) scale(1)"/><use href="#clump" transform="translate(396,62) scale(1.1)"/>
      </g>
      <g fill="#92bf74">
        <use href="#clump" transform="translate(353,101) scale(-0.75,0.7)"/><use href="#clump" transform="translate(381,85) scale(0.95)"/><use href="#clump" transform="translate(357,65) scale(-0.7,0.65)"/>
      </g>

      <!-- 路边的水杯桌 -->
      <g>
        <g stroke="#a88a6a" stroke-width="2" stroke-linecap="round"><line x1="292" y1="196" x2="306" y2="222"/><line x1="306" y1="196" x2="292" y2="222"/><line x1="346" y1="196" x2="360" y2="222"/><line x1="360" y1="196" x2="346" y2="222"/></g>
        <polygon points="286,190 366,190 370,197 282,197" fill="#f2ebe0"/>
        <rect x="282" y="197" width="88" height="5" fill="#e4d9c8"/>
        <path d="M282,202 L370,202 L370,206 C360,208 350,205 340,207 C330,205 320,208 310,206 C300,208 290,205 282,207 Z" fill="#e9dfcf"/>
        <!-- 水桶 -->
        <rect x="290" y="172" width="16" height="20" rx="3" fill="url(#jug)"/>
        <rect x="294" y="168" width="8" height="5" rx="1.5" fill="#86aec6"/>
        <rect x="292" y="180" width="12" height="1.4" fill="#e3f0f6" opacity="0.8"/>
        <rect x="304" y="184" width="4" height="2.4" fill="#86aec6"/>
        <!-- 纸杯 -->
        <use href="#cup" transform="translate(316,190)"/><use href="#cup" transform="translate(323,190)"/><use href="#cup" transform="translate(330,190)"/><use href="#cup" transform="translate(337,190)"/><use href="#cup" transform="translate(344,190)"/><use href="#cup" transform="translate(351,190)"/><use href="#cup" transform="translate(358,190)"/>
        <use href="#cup" transform="translate(319.5,194)"/><use href="#cup" transform="translate(326.5,194)"/><use href="#cup" transform="translate(333.5,194)"/><use href="#cup" transform="translate(340.5,194)"/><use href="#cup" transform="translate(347.5,194)"/><use href="#cup" transform="translate(354.5,194)"/><use href="#cup" transform="translate(361.5,194)"/>
      </g>
      <!-- 路边的小锥桶 -->
      <g>
        <path d="M262,212 L266,198 L268,198 L272,212 Z" fill="#e8946f"/><rect x="263.6" y="203" width="6.8" height="2.4" fill="#f8efe2"/><rect x="259" y="211" width="16" height="2.6" rx="1" fill="#d9805f"/>
        <path d="M140,200 L143.4,188 L145,188 L148.4,200 Z" fill="#e8946f"/><rect x="141.4" y="192.4" width="5.8" height="2" fill="#f8efe2"/><rect x="137.4" y="199" width="13.6" height="2.4" rx="1" fill="#d9805f"/>
      </g>

      <!-- 前景的一双跑鞋 -->
      <use href="#sneaker" transform="translate(84,230) scale(0.92)" fill="url(#shoeB)"/>
      <use href="#sneaker" transform="translate(58,240)" fill="url(#shoe)"/>
      <path d="M86,222 C84,214 88,208 92,210 C94,214 92,218 90,222" fill="none" stroke="#faf6ee" stroke-width="1" stroke-linecap="round"/>

      <!-- 草叶和小花 -->
      <g stroke="#93b672" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.85">
        <path d="M20,248 l2,-8 M24,248 l-1,-7 M28,248 l3,-6 M370,244 l2,-7 M374,244 l-1,-6 M378,244 l3,-6 M300,236 l2,-6 M304,236 l-1,-5 M150,252 l2,-6 M154,252 l-1,-5"/>
      </g>
      <g fill="#f8f2e6"><circle cx="24" cy="242" r="1.6"/><circle cx="374" cy="238" r="1.6"/></g>
      <g fill="#f3d27e"><circle cx="20" cy="244" r="1.4"/><circle cx="378" cy="239" r="1.4"/><circle cx="302" cy="231" r="1.3"/></g>
    </g>

    <!-- 地面阴影 -->
    <g filter="url(#soft2)" opacity="0.2" fill="#5f6a45">
      <ellipse cx="112" cy="237" rx="50" ry="3.4"/><ellipse cx="326" cy="222" rx="44" ry="2.6"/><ellipse cx="50" cy="206" rx="26" ry="3"/><ellipse cx="378" cy="190" rx="18" ry="2.4"/>
      <ellipse cx="140" cy="183" rx="10" ry="1.6"/><ellipse cx="268" cy="183" rx="10" ry="1.6"/><ellipse cx="267" cy="214" rx="9" ry="1.4"/><ellipse cx="144" cy="202" rx="8" ry="1.3"/>
    </g>
    <!-- 纸纹 -->
    <rect width="400" height="260" filter="url(#grain)"/>
  </g>
</svg>
