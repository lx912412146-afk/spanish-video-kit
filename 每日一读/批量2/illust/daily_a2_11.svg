<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 260" width="400" height="260">
  <!-- 原创插图：第一次看见大海（从沙丘上看海：沙丘草、蓝色的海和浪花、远处的帆船、沙地上一双小凉鞋；水彩风格，纯 SVG 手绘） -->
  <defs>
    <filter id="wc" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="0.35"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="g"/>
      <feColorMatrix in="g" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.38  0 0 0 0 0.3  0 0 0 0.09 0"/>
    </filter>
    <filter id="edge" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="5"/></filter>
    <mask id="fade" maskUnits="userSpaceOnUse" x="0" y="0" width="400" height="260">
      <rect x="7" y="7" width="386" height="246" rx="4" fill="#fff" filter="url(#edge)"/>
    </mask>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9e9f0"/><stop offset="0.25" stop-color="#e8f0ef"/><stop offset="0.42" stop-color="#f6f1e4"/><stop offset="1" stop-color="#f6f1e4"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#86b6c8"/><stop offset="0.45" stop-color="#9ccbd3"/><stop offset="1" stop-color="#bde0da"/>
    </linearGradient>
    <linearGradient id="beach" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6d3ae"/><stop offset="1" stop-color="#efdfc0"/>
    </linearGradient>
    <linearGradient id="dune" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5e6c8"/><stop offset="0.5" stop-color="#efd9b2"/><stop offset="1" stop-color="#e6c99d"/>
    </linearGradient>
    <linearGradient id="duneS" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e3c595"/><stop offset="1" stop-color="#ecd4ab"/>
    </linearGradient>
    <linearGradient id="sail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fffdf7"/><stop offset="1" stop-color="#ece6da"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fffbea"/><stop offset="0.5" stop-color="#fdf2d4" stop-opacity="0.8"/><stop offset="1" stop-color="#fbeccb" stop-opacity="0"/>
    </radialGradient>
    <g id="tuft" fill="none" stroke-linecap="round">
      <path d="M0,0 C-2,-12 -8,-22 -16,-28"/><path d="M1,0 C0,-14 -2,-26 -6,-36"/><path d="M2,0 C3,-12 4,-24 3,-38"/>
      <path d="M3,0 C6,-12 10,-22 16,-30"/><path d="M4,0 C8,-8 14,-14 22,-18"/><path d="M-1,0 C-5,-6 -11,-10 -20,-12"/>
      <path d="M2,0 C1,-10 -4,-18 -10,-22"/>
    </g>
    <g id="sandal">
      <path d="M0,-15 C5.5,-15 7.5,-10 7.5,-4 C7.5,2 5.5,6 5.5,10 C5.5,15 3,17 0,17 C-3,17 -5.5,15 -5.5,10 C-5.5,6 -7.5,2 -7.5,-4 C-7.5,-10 -5.5,-15 0,-15 Z" fill="#c4825d" transform="translate(0,2.4)"/>
      <path d="M0,-15 C5.5,-15 7.5,-10 7.5,-4 C7.5,2 5.5,6 5.5,10 C5.5,15 3,17 0,17 C-3,17 -5.5,15 -5.5,10 C-5.5,6 -7.5,2 -7.5,-4 C-7.5,-10 -5.5,-15 0,-15 Z" fill="#e7a983"/>
      <path d="M0,-12.5 C4,-12.5 5.6,-8.5 5.6,-3.6 C5.6,1.6 4,5 4,9 C4,13 2,14.6 0,14.6 C-2,14.6 -4,13 -4,9 C-4,5 -5.6,1.6 -5.6,-3.6 C-5.6,-8.5 -4,-12.5 0,-12.5 Z" fill="#f4d3b2"/>
      <path d="M-7.6,-6 C-4.5,-11 4.5,-11 7.6,-6 L7.6,-1.6 C4.5,-6.4 -4.5,-6.4 -7.6,-1.6 Z" fill="#6ea5a4"/>
      <path d="M-6.4,3 C-3,-0.4 3,-0.4 6.4,3 L6.2,6.8 C3,3.4 -3,3.4 -6.2,6.8 Z" fill="#6ea5a4"/>
      <path d="M-5.4,8.5 C-6.4,16.5 6.4,16.5 5.4,8.5" fill="none" stroke="#5c9493" stroke-width="2.2"/>
      <rect x="4.4" y="2.6" width="3" height="3.4" rx="0.6" fill="#efd89c"/>
      <path d="M-4,-7.6 C-1.5,-9.4 1.5,-9.4 4,-7.6" stroke="#a6d0cd" stroke-width="0.9" fill="none"/>
    </g>
  </defs>

  <g mask="url(#fade)">
    <!-- 天空 -->
    <rect width="400" height="260" fill="url(#sky)"/>

    <g filter="url(#wc)">
      <!-- 太阳和云 -->
      <circle cx="338" cy="38" r="30" fill="url(#sun)"/>
      <circle cx="338" cy="38" r="10" fill="#fdf5dc"/>
      <g filter="url(#soft2)" fill="#ffffff" opacity="0.85">
        <ellipse cx="262" cy="58" rx="24" ry="5.5"/><ellipse cx="276" cy="54" rx="13" ry="5.5"/>
        <ellipse cx="96" cy="80" rx="22" ry="4.5"/><ellipse cx="108" cy="77" rx="11" ry="4"/>
      </g>
      <!-- 海鸥 -->
      <g fill="none" stroke="#8b8f93" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round">
        <path d="M290,72 q4,-3.5 7,0 q3,-3.5 7,0"/><path d="M312,64 q3,-2.6 5.5,0 q2.5,-2.6 5.5,0"/><path d="M276,82 q2.4,-2 4.4,0 q2,-2 4.4,0"/>
      </g>

      <!-- 远处的岬角 -->
      <path d="M282,105 C300,96 322,88 346,87 C366,86 384,90 400,95 L400,106 L282,106 Z" fill="#bccdd1"/>
      <path d="M316,106 C334,99 356,96 378,98 C390,99 396,101 400,102 L400,106 Z" fill="#aec2c8"/>

      <!-- 大海 -->
      <rect x="0" y="104" width="400" height="66" fill="url(#sea)"/>
      <rect x="0" y="104" width="400" height="2" fill="#a9c9d3" opacity="0.8"/>
      <g fill="none" stroke="#e9f4f2" stroke-linecap="round" opacity="0.75">
        <path d="M14,113 C30,111.6 46,113.4 62,112" stroke-width="0.9"/><path d="M120,111 C140,109.6 158,111.6 176,110.4" stroke-width="0.9"/>
        <path d="M206,115 C222,113.6 238,115.4 252,114" stroke-width="0.9"/><path d="M300,112 C318,110.6 336,112.4 352,111" stroke-width="0.9"/>
        <path d="M40,124 C64,121.6 88,124.6 112,122.6" stroke-width="1.1"/><path d="M168,126 C192,123.6 214,126.6 238,124.6" stroke-width="1.1"/>
        <path d="M282,123 C306,120.6 330,123.6 356,121.6" stroke-width="1.1"/>
        <path d="M0,138 C30,134.6 62,139 92,136 C118,133.6 140,137.6 160,136" stroke-width="1.4"/>
        <path d="M206,140 C236,136.6 266,140.6 296,137.6 C322,135.4 350,139 380,137" stroke-width="1.4"/>
      </g>
      <!-- 浪花 -->
      <path d="M0,150 C22,146 40,152 62,148 C86,144 104,151 128,148 C152,145 170,151 194,148 C220,145 240,151 264,147.6 C290,144 312,151 338,148 C362,145 384,150 400,148 L400,153 C380,155 360,151 338,153 C312,156 292,150 264,152.4 C240,155 220,150 194,153 C170,156 152,150 128,153 C104,156 86,149 62,153 C40,157 22,151 0,155 Z" fill="#f6fbf8" opacity="0.92"/>
      <path d="M0,160 C30,157 60,162 96,159 C130,156 160,161 196,158.6 C232,156 262,161 300,158.6 C336,156 370,160 400,158.4 L400,164 L0,164 Z" fill="#f3faf6" opacity="0.85"/>
      <path d="M0,161 C40,158.6 70,163 110,160.4 C150,158 180,162.6 220,160.4 C262,158 300,162.6 340,160.4 C366,159 384,160.6 400,160" fill="none" stroke="#cfe6e2" stroke-width="0.8"/>

      <!-- 沙滩 -->
      <rect x="0" y="163" width="400" height="44" fill="url(#beach)"/>
      <path d="M0,163 C40,165 90,162.6 140,164.6 C200,166.6 260,163 320,165 C360,166 384,164.4 400,165 L400,170 C350,171 300,169 240,171 C180,173 120,169.6 60,171 C30,171.6 12,170.4 0,171 Z" fill="#dcc7a0" opacity="0.7"/>

      <!-- 远处的帆船 -->
      <g>
        <path d="M241,103 L265,103 L261,107.4 L245,107.4 Z" fill="#b98a6c"/>
        <line x1="253.5" y1="76" x2="253.5" y2="103" stroke="#8d7564" stroke-width="0.9"/>
        <path d="M254.4,77 C259,84 263,93 265,101.6 L254.4,101.6 Z" fill="url(#sail)"/>
        <path d="M252.6,82 C249,88 246,95 244.4,101.6 L252.6,101.6 Z" fill="#f4ede0"/>
        <path d="M241,108.6 C247,110 259,110 265,108.6" fill="none" stroke="#e6f2f1" stroke-width="0.9" opacity="0.8"/>
      </g>
      <g>
        <path d="M156,104 L168,104 L166,106.4 L158,106.4 Z" fill="#9f8576"/>
        <line x1="162.2" y1="91" x2="162.2" y2="104" stroke="#8d7564" stroke-width="0.7"/>
        <path d="M162.8,92 C165.6,96 167.6,100 168.6,103 L162.8,103 Z" fill="#e8a689"/>
        <path d="M161.6,94.4 C159.8,97.6 158.4,100.4 157.6,103 L161.6,103 Z" fill="#f6efe4"/>
      </g>

      <!-- 前景沙丘 -->
      <path d="M0,170 C26,166 60,170 96,180 C134,190 176,198 222,199 C272,200 330,192 400,182 L400,260 L0,260 Z" fill="url(#dune)"/>
      <path d="M0,170 C26,166 60,170 96,180 C120,186 138,190 152,194 C120,192 86,186 56,182 C34,179 14,178 0,179 Z" fill="url(#duneS)" opacity="0.75"/>
      <path d="M400,182 C360,188 330,192 300,195 C330,196 368,194 400,192 Z" fill="#e5c899" opacity="0.6"/>
      <!-- 风吹出的沙纹 -->
      <g fill="none" stroke="#dcbe8e" stroke-width="0.9" stroke-linecap="round" opacity="0.65">
        <path d="M120,214 C150,210 186,212 214,209"/><path d="M234,218 C262,215 290,216 318,212"/>
        <path d="M90,236 C124,232 156,236 186,232"/><path d="M250,240 C282,236 318,238 352,233"/>
        <path d="M24,222 C46,219 66,221 84,219"/><path d="M300,224 C322,221 344,222 364,219"/>
      </g>
      <!-- 通往海滩的脚印 -->
      <g fill="#d8bb8c" opacity="0.7">
        <ellipse cx="222" cy="230" rx="2.8" ry="1.6" transform="rotate(-30 222 230)"/>
        <ellipse cx="226" cy="221" rx="2.6" ry="1.5" transform="rotate(-30 226 221)"/>
        <ellipse cx="232" cy="214" rx="2.3" ry="1.3" transform="rotate(-30 232 214)"/><ellipse cx="242" cy="210" rx="2.3" ry="1.3" transform="rotate(-30 242 210)"/>
        <ellipse cx="247" cy="204" rx="2" ry="1.1" transform="rotate(-30 247 204)"/><ellipse cx="256" cy="201" rx="2" ry="1.1" transform="rotate(-30 256 201)"/>
      </g>

      <!-- 左边的沙丘草 -->
      <g stroke="#9db274" stroke-width="1.4">
        <use href="#tuft" transform="translate(24,176) scale(1.25)"/><use href="#tuft" transform="translate(58,182) scale(1.05)"/>
        <use href="#tuft" transform="translate(92,190) scale(-0.9,0.9)"/><use href="#tuft" transform="translate(8,186) scale(-1,1)"/>
      </g>
      <g stroke="#b7c38a" stroke-width="1.2">
        <use href="#tuft" transform="translate(40,180) scale(-1.1,1.1)"/><use href="#tuft" transform="translate(74,186) scale(0.85)"/>
        <use href="#tuft" transform="translate(16,182) scale(0.8)"/>
      </g>
      <g stroke="#879f62" stroke-width="1.3">
        <use href="#tuft" transform="translate(32,184) scale(0.75)"/><use href="#tuft" transform="translate(66,190) scale(-0.7,0.7)"/>
      </g>
      <g fill="#e2cfa0">
        <ellipse cx="26" cy="132" rx="1.4" ry="5" transform="rotate(-6 26 132)"/><ellipse cx="54" cy="143" rx="1.3" ry="4.4" transform="rotate(8 54 143)"/>
        <ellipse cx="94" cy="160" rx="1.2" ry="4" transform="rotate(-4 94 160)"/>
      </g>
      <g stroke="#cdb784" stroke-width="0.8"><line x1="26" y1="137" x2="26.6" y2="150"/><line x1="54" y1="147" x2="53.4" y2="158"/><line x1="94" y1="164" x2="94.4" y2="172"/></g>

      <!-- 右边的沙丘草和旧木桩 -->
      <g fill="#b39a7c">
        <path d="M318,206 L322,174 L327,175 L324,207 Z"/><path d="M342,203 L344,170 L349,170.6 L348,204 Z"/><path d="M366,199 L370,166 L375,167 L372,200 Z"/>
      </g>
      <g fill="#c9b293"><path d="M322,174 L327,175 L326.6,178 L321.6,177 Z"/><path d="M344,170 L349,170.6 L348.8,173.6 L343.8,173 Z"/><path d="M370,166 L375,167 L374.6,170 L369.6,169 Z"/></g>
      <path d="M324,182 C333,186 338,186 345,180 C352,184 360,183 371,176" fill="none" stroke="#c8ad86" stroke-width="1"/>
      <g stroke="#9db274" stroke-width="1.4">
        <use href="#tuft" transform="translate(306,212) scale(1.1)"/><use href="#tuft" transform="translate(356,206) scale(-1.2,1.2)"/>
        <use href="#tuft" transform="translate(390,198) scale(1)"/>
      </g>
      <g stroke="#b7c38a" stroke-width="1.2">
        <use href="#tuft" transform="translate(332,210) scale(-0.95,0.95)"/><use href="#tuft" transform="translate(378,204) scale(0.85)"/>
      </g>
      <g stroke="#879f62" stroke-width="1.3">
        <use href="#tuft" transform="translate(320,214) scale(0.7)"/><use href="#tuft" transform="translate(368,208) scale(-0.7,0.7)"/>
      </g>

      <!-- 小贝壳 -->
      <g transform="translate(236,240)">
        <path d="M-5,2 C-5,-4 5,-4 5,2 Z" fill="#f4d5c4"/>
        <g stroke="#ddb09c" stroke-width="0.6"><line x1="0" y1="2" x2="0" y2="-2.4"/><line x1="0" y1="2" x2="-3" y2="-1.4"/><line x1="0" y1="2" x2="3" y2="-1.4"/></g>
        <rect x="-1.6" y="1.6" width="3.2" height="1.6" rx="0.6" fill="#e8bfa8"/>
      </g>

      <!-- 一双小凉鞋 -->
      <use href="#sandal" transform="translate(160,228) scale(1.6,1.02) rotate(-16)"/>
      <use href="#sandal" transform="translate(196,224) scale(1.6,1.02) rotate(10)"/>
    </g>

    <!-- 地面阴影 -->
    <g filter="url(#soft2)" opacity="0.2" fill="#8a6a4a">
      <ellipse cx="162" cy="246" rx="15" ry="3"/><ellipse cx="198" cy="242" rx="15" ry="3"/>
      <ellipse cx="346" cy="206" rx="34" ry="3"/>
    </g>
    <!-- 纸纹 -->
    <rect width="400" height="260" filter="url(#grain)"/>
  </g>
</svg>
