<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 260" width="400" height="260">
  <!-- 原创插图：夕阳下山坡上的古老石拱和断墙，长满青草和野花（虚构的废墟，不是任何真实遗址；水彩风格，纯 SVG 手绘） -->
  <defs>
    <filter id="wc" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="0.35"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="g"/>
      <feColorMatrix in="g" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.38  0 0 0 0 0.3  0 0 0 0.09 0"/>
    </filter>
    <filter id="edge" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="5"/></filter>
    <mask id="fade" maskUnits="userSpaceOnUse" x="0" y="0" width="400" height="260">
      <rect x="7" y="7" width="386" height="246" rx="4" fill="#fff" filter="url(#edge)"/>
    </mask>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6efe3"/><stop offset="0.45" stop-color="#f9e4cb"/><stop offset="1" stop-color="#f5caa4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff1cf"/><stop offset="0.35" stop-color="#fbdcae" stop-opacity="0.8"/><stop offset="1" stop-color="#f6cda6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cdd49a"/><stop offset="0.5" stop-color="#b6c788"/><stop offset="1" stop-color="#a0b97a"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cbb79c"/><stop offset="0.6" stop-color="#ddc6a6"/><stop offset="1" stop-color="#ecd1a8"/>
    </linearGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d7c6cc"/><stop offset="1" stop-color="#e6d3cc"/>
    </linearGradient>
    <g id="poppy"><circle r="2.6" fill="#e2655a"/><circle cx="-0.6" cy="-0.6" r="1.2" fill="#f0897a"/><circle r="0.7" fill="#6a5048"/></g>
    <g id="dz"><g fill="#fbf7ee"><ellipse cx="0" cy="-1.8" rx="1" ry="1.7"/><ellipse cx="0" cy="1.8" rx="1" ry="1.7"/><ellipse cx="-1.8" cy="0" rx="1.7" ry="1"/><ellipse cx="1.8" cy="0" rx="1.7" ry="1"/></g><circle r="0.9" fill="#efc35c"/></g>
    <path id="tuft" d="M0,0 C-1,-4 -3,-7 -5,-8 C-2,-6 -0.5,-4 0,-1 C0.5,-5 1,-8 2,-10 C1.6,-6 1.2,-3 1,0 C2,-3 4,-6 6,-7 C4,-4 2.6,-2 2,0 Z"/>
  </defs>

  <g mask="url(#fade)">
    <!-- 夕阳的天空 -->
    <rect width="400" height="260" fill="url(#sky)"/>
    <ellipse cx="336" cy="128" rx="120" ry="80" fill="url(#glow)"/>
    <circle cx="336" cy="130" r="14" fill="#fdebc4"/>
    <circle cx="336" cy="130" r="10" fill="#fff4dc"/>
    <g filter="url(#soft2)" opacity="0.75">
      <ellipse cx="300" cy="70" rx="44" ry="4" fill="#f4cdb8"/><ellipse cx="340" cy="62" rx="28" ry="3.4" fill="#f2c4b4"/><ellipse cx="372" cy="92" rx="30" ry="3.2" fill="#f6d2bc"/>
    </g>

    <g filter="url(#wc)">
      <!-- 远处的山 -->
      <path d="M0,150 C40,138 80,132 120,136 C160,140 190,128 230,126 C270,124 300,134 330,138 C360,142 384,136 400,134 L400,180 L0,180 Z" fill="url(#far)"/>
      <path d="M0,162 C50,154 100,150 150,152 C200,154 250,146 300,148 C340,150 372,146 400,148 L400,190 L0,190 Z" fill="#d9cfb9" opacity="0.9"/>

      <!-- 山坡 -->
      <path d="M-4,186 C46,166 104,154 166,151 C232,148 300,150 404,170 L404,264 L-4,264 Z" fill="url(#hill)"/>
      <path d="M60,170 C110,158 170,154 230,152 C290,152 340,158 390,168" stroke="#e3dca0" stroke-width="3" fill="none" opacity="0.6"/>
    </g>

    <g filter="url(#wc)">
      <!-- 断墙（带小拱窗） -->
      <path d="M98,156 L98,121 L104,116 L111,118 L118,110 L127,112 L134,106 L141,110 L143,156 Z M112,142 L112,131 A6,6 0 0,1 124,131 L124,142 Z" fill="#c7b296" fill-rule="evenodd" transform="translate(3,-2)"/>
      <path d="M98,156 L98,121 L104,116 L111,118 L118,110 L127,112 L134,106 L141,110 L143,156 Z M112,142 L112,131 A6,6 0 0,1 124,131 L124,142 Z" fill="url(#stone)" fill-rule="evenodd"/>
      <g stroke="#bda585" stroke-width="0.8" opacity="0.8" fill="none">
        <path d="M98,130 L110,130 M126,128 L142,128 M98,146 L111,146 M125,146 L143,146 M104,122 L104,130 M134,128 L134,146 M118,146 L118,156 M130,114 L142,114"/>
      </g>

      <!-- 石拱廊：两孔完整，第三孔只剩半边 -->
      <path d="M146,152 L146,96 L151,84 L160,82 L166,76 L178,78 L186,72 L198,74 L208,70 L220,74 L230,72 L238,78 L244,84 L250,86 L254,92 L253,98 A15,15 0 0,0 244,112 L244,152 L232,152 L232,112 A15,15 0 0,0 202,112 L202,152 L190,152 L190,112 A15,15 0 0,0 160,112 L160,152 Z" fill="#c2ac8f" transform="translate(4,-3)"/>
      <path d="M146,152 L146,96 L151,84 L160,82 L166,76 L178,78 L186,72 L198,74 L208,70 L220,74 L230,72 L238,78 L244,84 L250,86 L254,92 L253,98 A15,15 0 0,0 244,112 L244,152 L232,152 L232,112 A15,15 0 0,0 202,112 L202,152 L190,152 L190,112 A15,15 0 0,0 160,112 L160,152 Z" fill="url(#stone)"/>
      <path d="M274,152 L274,131 L278,126 L283,128 L286,131 L286,152 Z" fill="#c2ac8f" transform="translate(3,-2)"/>
      <path d="M274,152 L274,131 L278,126 L283,128 L286,131 L286,152 Z" fill="url(#stone)"/>
      <!-- 拱石和石缝 -->
      <g stroke="#bda585" stroke-width="0.9" fill="none" opacity="0.85">
        <path d="M160,112 L154,111 M163,103 L157,100 M169,98.5 L166,93 M175,97 L175,91 M181,98.5 L184,93 M187,103 L193,100 M190,112 L196,111"/>
        <path d="M202,112 L196,111 M205,103 L199,100 M211,98.5 L208,93 M217,97 L217,91 M223,98.5 L226,93 M229,103 L235,100 M232,112 L238,111"/>
        <path d="M244,112 L250,111 M247,103 L253,100"/>
        <path d="M146,126 L160,126 M190,126 L202,126 M232,126 L244,126 M146,140 L160,140 M190,140 L202,140 M232,140 L244,140 M274,140 L286,140"/>
        <path d="M153,126 L153,140 M196,112 L196,126 M238,126 L238,140 M196,140 L196,152 M280,140 L280,152"/>
        <path d="M160,86 L196,86 M204,84 L240,84 M176,86 L176,93 M222,84 L222,91"/>
      </g>
      <!-- 柱头的线脚 -->
      <g fill="#e9d4b2"><rect x="144" y="110" width="18" height="3"/><rect x="188" y="110" width="16" height="3"/><rect x="230" y="110" width="16" height="3"/></g>
      <!-- 夕照在石头右侧的暖光 -->
      <g fill="#f6dcae" opacity="0.7"><rect x="157" y="114" width="3" height="38"/><rect x="199" y="114" width="3" height="38"/><rect x="241" y="114" width="3" height="38"/><rect x="283" y="131" width="3" height="21"/></g>

      <!-- 爬藤和石缝里的草 -->
      <g fill="#93b277">
        <ellipse cx="148" cy="100" rx="5" ry="3.4"/><ellipse cx="150" cy="108" rx="4" ry="3"/><ellipse cx="147" cy="118" rx="4.4" ry="3"/><ellipse cx="149" cy="128" rx="3.6" ry="2.6"/>
        <ellipse cx="236" cy="76" rx="5" ry="3"/><ellipse cx="244" cy="82" rx="4" ry="2.6"/><ellipse cx="190" cy="73" rx="4" ry="2.4"/>
        <ellipse cx="100" cy="122" rx="4.4" ry="3"/><ellipse cx="138" cy="108" rx="4" ry="2.6"/>
      </g>
      <g fill="#a8c48a"><ellipse cx="151" cy="104" rx="3" ry="2"/><ellipse cx="240" cy="78" rx="3" ry="1.8"/><ellipse cx="148" cy="124" rx="2.6" ry="1.8"/></g>
      <g fill="#e2655a"><circle cx="238" cy="73" r="1.6"/><circle cx="152" cy="99" r="1.4"/></g>

      <!-- 远处一棵树 -->
      <rect x="375" y="140" width="3" height="22" fill="#94775a"/>
      <ellipse cx="376" cy="134" rx="14" ry="11" fill="#9fb27c"/><ellipse cx="370" cy="138" rx="8" ry="6" fill="#8fa672"/><ellipse cx="381" cy="131" rx="7" ry="5" fill="#b8c88e"/>

      <!-- 盖住墙脚的草 -->
      <path d="M90,158 C94,154 98,156 102,153 C108,156 114,152 120,155 C130,152 140,156 150,152 C160,155 170,151 180,154 C190,151 200,155 210,152 C222,155 232,151 244,154 C256,151 266,155 276,152 C286,155 292,152 298,156 L300,162 L88,164 Z" fill="#cad398"/>
      <g fill="#a3bb80">
        <use href="#tuft" transform="translate(104,156)"/><use href="#tuft" transform="translate(150,154) scale(1.1)"/><use href="#tuft" transform="translate(196,155)"/><use href="#tuft" transform="translate(240,154) scale(1.1)"/><use href="#tuft" transform="translate(282,155)"/>
      </g>

      <!-- 掉落的石块 -->
      <path d="M118,192 L140,190 L142,201 L120,203 Z" fill="#d7c1a0"/><path d="M118,192 L140,190 L143,187 L121,189 Z" fill="#e8d4b4"/>
      <path d="M296,178 L312,177 L313,186 L297,187 Z" fill="#d7c1a0"/><path d="M296,178 L312,177 L315,174 L299,175 Z" fill="#e8d4b4"/>
      <path d="M214,176 L226,175 L227,182 L215,183 Z" fill="#d3bd9c"/>
      <path d="M60,214 L80,212 L81,222 L61,224 Z" fill="#d7c1a0"/><path d="M60,214 L80,212 L83,209 L63,211 Z" fill="#e8d4b4"/>

      <!-- 前景的草和野花 -->
      <g fill="#97b276">
        <use href="#tuft" transform="translate(30,232) scale(1.6)"/><use href="#tuft" transform="translate(96,246) scale(1.7)"/><use href="#tuft" transform="translate(170,236) scale(1.4)"/>
        <use href="#tuft" transform="translate(250,244) scale(1.6)"/><use href="#tuft" transform="translate(330,232) scale(1.5)"/><use href="#tuft" transform="translate(372,214) scale(1.3)"/>
        <use href="#tuft" transform="translate(140,206) scale(1.2)"/><use href="#tuft" transform="translate(262,196) scale(1.1)"/><use href="#tuft" transform="translate(40,196) scale(1.1)"/>
      </g>
      <g>
        <use href="#poppy" transform="translate(40,222)"/><use href="#poppy" transform="translate(56,236) scale(1.1)"/><use href="#poppy" transform="translate(150,224)"/><use href="#poppy" transform="translate(186,244) scale(1.2)"/>
        <use href="#poppy" transform="translate(236,214)"/><use href="#poppy" transform="translate(300,226) scale(1.1)"/><use href="#poppy" transform="translate(352,240) scale(1.2)"/><use href="#poppy" transform="translate(110,214) scale(0.9)"/>
        <use href="#poppy" transform="translate(270,186) scale(0.8)"/><use href="#poppy" transform="translate(178,184) scale(0.8)"/><use href="#poppy" transform="translate(80,190) scale(0.8)"/><use href="#poppy" transform="translate(340,196) scale(0.85)"/>
      </g>
      <g>
        <use href="#dz" transform="translate(76,236)"/><use href="#dz" transform="translate(126,230)"/><use href="#dz" transform="translate(212,226)"/><use href="#dz" transform="translate(276,238)"/>
        <use href="#dz" transform="translate(320,212)"/><use href="#dz" transform="translate(200,198) scale(0.8)"/><use href="#dz" transform="translate(98,200) scale(0.8)"/><use href="#dz" transform="translate(380,232)"/>
      </g>
      <g fill="#b7a6d3"><circle cx="62" cy="208" r="1.6"/><circle cx="160" cy="214" r="1.6"/><circle cx="226" cy="240" r="1.8"/><circle cx="310" cy="246" r="1.8"/><circle cx="252" cy="206" r="1.4"/></g>
      <g fill="#f1cf6e"><circle cx="90" cy="226" r="1.6"/><circle cx="196" cy="214" r="1.6"/><circle cx="292" cy="204" r="1.4"/><circle cx="360" cy="222" r="1.7"/><circle cx="24" cy="246" r="1.8"/></g>

      <g fill="#8fac70">
        <use href="#tuft" transform="translate(16,258) scale(2.4)"/><use href="#tuft" transform="translate(30,258) scale(2.1)"/><use href="#tuft" transform="translate(372,258) scale(2.3)"/><use href="#tuft" transform="translate(386,258) scale(2)"/>
      </g>
      <g><use href="#poppy" transform="translate(22,234) scale(1.5)"/><use href="#poppy" transform="translate(38,244) scale(1.4)"/><use href="#poppy" transform="translate(366,236) scale(1.5)"/><use href="#dz" transform="translate(384,242) scale(1.3)"/><use href="#dz" transform="translate(10,248) scale(1.3)"/></g>
      <path d="M22,236 L22,258 M38,246 L38,258 M366,238 L366,258" stroke="#8fac70" stroke-width="1.1"/>

      <!-- 两只归鸟 -->
      <g stroke="#a58a7c" stroke-width="1" fill="none" stroke-linecap="round">
        <path d="M296,104 C299,101 301,101 303,104 C305,101 307,101 310,104"/><path d="M316,96 C318,94 320,94 321,96 C322,94 324,94 326,96"/>
      </g>
    </g>

    <!-- 废墟投下的长影（夕阳在右边） -->
    <g filter="url(#soft)" opacity="0.34" fill="#7d7a5a">
      <path d="M146,154 L40,166 L40,172 L146,160 Z"/><path d="M98,156 L20,168 L20,174 L98,161 Z"/><path d="M286,152 L240,158 L240,161 L286,156 Z"/>
    </g>

    <!-- 地面阴影 -->
    <g filter="url(#soft2)" opacity="0.2" fill="#6f7a4a">
      <ellipse cx="130" cy="203" rx="14" ry="2"/><ellipse cx="304" cy="187" rx="10" ry="1.6"/><ellipse cx="70" cy="224" rx="12" ry="2"/>
    </g>
    <!-- 纸纹 -->
    <rect width="400" height="260" filter="url(#grain)"/>
  </g>
</svg>
