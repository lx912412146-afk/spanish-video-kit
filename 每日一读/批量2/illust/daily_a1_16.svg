      <path d="M11,1 C15,4 18,8 22,9 M11,0 C16,2 20,3 24,2" stroke="#e2765a" stroke-width="0.6" fill="none"/>
    </g>
    <g id="mussel"><path d="M0,-7.5 C5.5,-6 6.5,4 1,8.5 C-4.5,5 -5.5,-5 0,-7.5 Z" fill="#6f7387"/><path d="M0,-5.5 C3.4,-4 4.2,3 1,6.2 C-2.4,4 -3.2,-3.4 0,-5.5 Z" fill="#f2a36d"/><path d="M-0.8,-4 C0,-1 0.2,2 0.4,4.6" stroke="#fff" stroke-width="0.6" opacity="0.45" fill="none"/></g>
    <g id="pep"><rect x="-6" y="-1.4" width="12" height="2.8" rx="1.4" fill="#d9534a"/><rect x="-5" y="-1.2" width="9" height="1" rx="0.5" fill="#ee8a7c"/></g>
    <g id="wedge"><path d="M-9,0 A9,5.5 0 0 0 9,0 Z" fill="#efc844"/><path d="M-7.4,0.3 A7.4,4.2 0 0 0 7.4,0.3 Z" fill="#faeaa0"/><path d="M0,0.3 L0,4.3 M0,0.3 L-4.6,3.4 M0,0.3 L4.6,3.4" stroke="#f3d873" stroke-width="0.6"/></g>
  </defs>

