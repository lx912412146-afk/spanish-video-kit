      <path d="M-7,1 C-7,-4 -2,-7 4,-7" stroke="#f7b494" stroke-width="1.8" fill="none" opacity="0.8"/>
      <path d="M-5,-4 l-3,-1.5 M-1,-7 l-1,-3 M4,-8 l1,-3" stroke="#d8704f" stroke-width="0.8"/>
      <path d="M-8,5 L-13,9 L-7,10 L-5,7 Z" fill="#e2765a"/>
