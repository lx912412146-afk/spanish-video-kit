<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 260" width="400" height="260">
  <!-- 原创插图：暴风雨之夜（从室内看窗外的暴雨和远处的闪电，窗台上的蜡烛、毯子和热饮；水彩风格，纯 SVG 手绘） -->
  <defs>
    <filter id="wc" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="0.35"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="g"/>
      <feColorMatrix in="g" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.38  0 0 0 0 0.3  0 0 0 0.09 0"/>
    </filter>
    <filter id="edge" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="5"/></filter>
    <mask id="fade" maskUnits="userSpaceOnUse" x="0" y="0" width="400" height="260">
      <rect x="7" y="7" width="386" height="246" rx="4" fill="#fff" filter="url(#edge)"/>
    </mask>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8eedf"/><stop offset="0.55" stop-color="#f1dfc6"/><stop offset="1" stop-color="#e6cdac"/>
    </linearGradient>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a6780"/><stop offset="0.6" stop-color="#6f7b93"/><stop offset="1" stop-color="#7f88a0"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ddc2a0"/><stop offset="1" stop-color="#cfb08a"/>
    </linearGradient>
    <linearGradient id="sill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ead3b2"/><stop offset="1" stop-color="#dcc09a"/>
    </linearGradient>
    <linearGradient id="bench" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2c8a4"/><stop offset="1" stop-color="#d4b68f"/>
    </linearGradient>
    <linearGradient id="curtain" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a9bca9"/><stop offset="0.25" stop-color="#c1d0bd"/><stop offset="0.5" stop-color="#a5b8a4"/><stop offset="0.75" stop-color="#bfcebb"/><stop offset="1" stop-color="#a3b6a2"/>
    </linearGradient>
    <linearGradient id="candle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#efe3cc"/><stop offset="0.45" stop-color="#fbf5e8"/><stop offset="1" stop-color="#e8d9bd"/>
    </linearGradient>
    <linearGradient id="mug" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c97b5e"/><stop offset="0.45" stop-color="#df9677"/><stop offset="1" stop-color="#bb6e52"/>
    </linearGradient>
    <linearGradient id="pot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d4835c"/><stop offset="0.45" stop-color="#e59b74"/><stop offset="1" stop-color="#c8734d"/>
    </linearGradient>
    <radialGradient id="flame" cx="0.5" cy="0.65" r="0.6">
      <stop offset="0" stop-color="#fffbe6"/><stop offset="0.45" stop-color="#fbe08e"/><stop offset="1" stop-color="#f0a65a"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff0c4" stop-opacity="0.85"/><stop offset="0.5" stop-color="#fbe3b0" stop-opacity="0.35"/><stop offset="1" stop-color="#f8dcaa" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="glass"><rect x="182" y="62" width="176" height="108"/></clipPath>
    <path id="mleaf" d="M0,0 C6,-10 20,-12 28,-4 C24,6 10,8 0,0 Z"/>
