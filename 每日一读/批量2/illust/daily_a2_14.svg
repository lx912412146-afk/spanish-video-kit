        <g stroke="#b9c4d2" stroke-width="0.9" opacity="0.6" fill="none"><path d="M292,80 C292.4,86 291.6,90 292,96"/><path d="M218,104 C218.4,110 217.6,114 218,120"/><path d="M310,130 C310.4,136 309.6,140 310,146"/></g>
