<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 260" width="400" height="260">
  <!-- 原创插图：街角的花店（水彩风格，纯 SVG 手绘，无外部素材） -->
  <defs>
    <filter id="wc" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="0.35"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="g"/>
      <feColorMatrix in="g" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.38  0 0 0 0 0.3  0 0 0 0.09 0"/>
    </filter>
    <filter id="edge" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="5"/></filter>
    <mask id="fade" maskUnits="userSpaceOnUse" x="0" y="0" width="400" height="260">
      <rect x="7" y="7" width="386" height="246" rx="4" fill="#fff" filter="url(#edge)"/>
    </mask>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf3e6"/><stop offset="0.6" stop-color="#f8e9d6"/><stop offset="1" stop-color="#f4dfc8"/>
    </linearGradient>
    <linearGradient id="pave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ece2d4"/><stop offset="1" stop-color="#e2d2bd"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3ecea"/><stop offset="0.55" stop-color="#d3e1df"/><stop offset="1" stop-color="#c4d5d3"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d3e6ee"/><stop offset="1" stop-color="#eef3ee"/>
    </linearGradient>
    <linearGradient id="awn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.25"/><stop offset="1" stop-color="#b78a6a" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cda57f"/><stop offset="1" stop-color="#b78b63"/>
    </linearGradient>
    <linearGradient id="zinc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a9b8bd"/><stop offset="0.45" stop-color="#dbe4e5"/><stop offset="1" stop-color="#9fb0b6"/>
    </linearGradient>
    <linearGradient id="pot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d4835c"/><stop offset="0.45" stop-color="#e59b74"/><stop offset="1" stop-color="#c8734d"/>
    </linearGradient>
    <path id="leaf" d="M0,0 C4,-5.5 12,-5.5 16,0 C12,5.5 4,5.5 0,0 Z"/>
    <path id="bigleaf" d="M0,0 C5,-8 17,-9 24,0 C17,9 5,8 0,0 Z"/>
    <path id="tlf" d="M0,0 C-2,-8 -1,-16 2,-22 C2,-14 3,-7 2,0 Z"/>
    <g id="bucket">
      <path d="M-14,0 L14,0 L11.5,24 L-11.5,24 Z" fill="url(#zinc)"/>
      <ellipse cx="0" cy="0" rx="14" ry="3" fill="#e6ecec"/>
      <ellipse cx="0" cy="0.4" rx="12" ry="2.1" fill="#8e9ea4"/>
      <g stroke="#93a4aa" stroke-width="0.8" opacity="0.8"><line x1="-13" y1="7" x2="13" y2="7"/><line x1="-12" y1="18" x2="12" y2="18"/></g>
      <ellipse cx="-6" cy="12" rx="1.6" ry="7" fill="#fff" opacity="0.35"/>
    </g>
    <g id="rose"><circle r="4.3"/><path d="M-2.2,-0.4 C-1.8,-2.8 2,-2.6 2.2,0 C2.2,2 -0.6,2.4 -1,0.6" stroke="#fff" stroke-opacity="0.55" stroke-width="0.9" fill="none"/><circle cx="-1.4" cy="-1.6" r="1.1" fill="#fff" opacity="0.3"/></g>
    <g id="tulip"><path d="M-3.4,1 C-4.4,-3 -3.8,-6.2 -2.7,-7.8 L-1.2,-5.2 L0,-8.6 L1.2,-5.2 L2.7,-7.8 C3.8,-6.2 4.4,-3 3.4,1 C1.7,2.5 -1.7,2.5 -3.4,1 Z"/><path d="M-1.8,-4 C-2.2,-2 -2,0 -1.2,1" stroke="#fff" stroke-opacity="0.45" stroke-width="0.9" fill="none"/></g>
    <g id="sunf">
      <g fill="#f0b94a">
        <ellipse cy="-6.6" rx="2.3" ry="4" transform="rotate(15)"/><ellipse cy="-6.6" rx="2.3" ry="4" transform="rotate(45)"/><ellipse cy="-6.6" rx="2.3" ry="4" transform="rotate(75)"/><ellipse cy="-6.6" rx="2.3" ry="4" transform="rotate(105)"/><ellipse cy="-6.6" rx="2.3" ry="4" transform="rotate(135)"/><ellipse cy="-6.6" rx="2.3" ry="4" transform="rotate(165)"/>
        <ellipse cy="-6.6" rx="2.3" ry="4" transform="rotate(195)"/><ellipse cy="-6.6" rx="2.3" ry="4" transform="rotate(225)"/><ellipse cy="-6.6" rx="2.3" ry="4" transform="rotate(255)"/><ellipse cy="-6.6" rx="2.3" ry="4" transform="rotate(285)"/><ellipse cy="-6.6" rx="2.3" ry="4" transform="rotate(315)"/><ellipse cy="-6.6" rx="2.3" ry="4" transform="rotate(345)"/>
      </g>
      <g fill="#f7d36a">
        <ellipse cy="-6.2" rx="2" ry="3.8"/><ellipse cy="-6.2" rx="2" ry="3.8" transform="rotate(60)"/><ellipse cy="-6.2" rx="2" ry="3.8" transform="rotate(120)"/><ellipse cy="-6.2" rx="2" ry="3.8" transform="rotate(180)"/><ellipse cy="-6.2" rx="2" ry="3.8" transform="rotate(240)"/><ellipse cy="-6.2" rx="2" ry="3.8" transform="rotate(300)"/>
      </g>
      <circle r="4.6" fill="#9a6a44"/><circle cx="-1" cy="-1" r="2.6" fill="#b07d52" opacity="0.7"/>
    </g>
  </defs>

  <g mask="url(#fade)">
    <!-- 墙面和人行道 -->
    <rect width="400" height="260" fill="url(#wall)"/>
    <rect x="0" y="206" width="400" height="54" fill="url(#pave)"/>
    <g stroke="#d6c5ae" stroke-width="0.8" opacity="0.75">
      <line x1="0" y1="220" x2="400" y2="220"/><line x1="0" y1="238" x2="400" y2="238"/><line x1="0" y1="256" x2="400" y2="256"/>
      <line x1="40" y1="206" x2="36" y2="220"/><line x1="230" y1="220" x2="226" y2="238"/><line x1="372" y1="206" x2="369" y2="220"/>
      <line x1="120" y1="238" x2="116" y2="256"/><line x1="300" y1="238" x2="297" y2="256"/>
    </g>
    <rect x="0" y="204" width="400" height="3" fill="#e4d4bf"/>

    <g filter="url(#wc)">
      <!-- 楼上的窗 -->
      <rect x="284" y="8" width="12" height="34" fill="#a9c2a4"/><rect x="348" y="8" width="12" height="34" fill="#a9c2a4"/>
      <g stroke="#93ad8e" stroke-width="0.8"><line x1="285" y1="14" x2="295" y2="14"/><line x1="285" y1="20" x2="295" y2="20"/><line x1="285" y1="26" x2="295" y2="26"/><line x1="285" y1="32" x2="295" y2="32"/><line x1="349" y1="14" x2="359" y2="14"/><line x1="349" y1="20" x2="359" y2="20"/><line x1="349" y1="26" x2="359" y2="26"/><line x1="349" y1="32" x2="359" y2="32"/></g>
      <rect x="298" y="8" width="48" height="34" fill="url(#sky)"/>
      <g fill="none" stroke="#efe2cf" stroke-width="2.4"><rect x="298" y="8" width="48" height="34"/><line x1="322" y1="8" x2="322" y2="42"/></g>
      <rect x="292" y="41" width="60" height="4" rx="1" fill="#e8d5bb"/>

      <!-- 店面 -->
      <rect x="40" y="80" width="320" height="126" fill="#a7c1a1"/>
      <rect x="40" y="190" width="320" height="16" fill="#93ae8e"/>
      <!-- 左橱窗 -->
      <rect x="52" y="96" width="154" height="92" fill="url(#glass)"/>
      <g opacity="0.55">
        <line x1="52" y1="146" x2="206" y2="146" stroke="#c2ceca" stroke-width="2"/>
        <g fill="#b9d3ad"><circle cx="70" cy="136" r="9"/><circle cx="96" cy="132" r="11"/><circle cx="184" cy="134" r="10"/><circle cx="74" cy="176" r="10"/><circle cx="190" cy="174" r="9"/></g>
        <g fill="#f0c4bb"><circle cx="92" cy="126" r="3"/><circle cx="100" cy="130" r="2.6"/><circle cx="180" cy="128" r="2.6"/></g>
      </g>
      <g fill="#fff" opacity="0.4"><polygon points="60,188 96,96 110,96 74,188"/><polygon points="120,188 150,96 156,96 126,188"/></g>
      <rect x="52" y="96" width="154" height="92" fill="none" stroke="#bcd0b6" stroke-width="2"/>
      <!-- 门 -->
      <rect x="218" y="96" width="54" height="110" fill="#97b292"/>
      <rect x="225" y="103" width="40" height="86" fill="url(#glass)"/>
      <g fill="#fff" opacity="0.38"><polygon points="229,189 248,103 256,103 237,189"/></g>
      <rect x="225" y="192" width="40" height="10" fill="#8aa685"/>
      <circle cx="260" cy="152" r="2" fill="#d9c08f"/>
      <!-- 右橱窗 -->
      <rect x="284" y="96" width="66" height="92" fill="url(#glass)"/>
      <g opacity="0.5"><line x1="284" y1="146" x2="350" y2="146" stroke="#c2ceca" stroke-width="2"/><g fill="#b9d3ad"><circle cx="300" cy="134" r="9"/><circle cx="334" cy="136" r="8"/></g></g>
      <g fill="#fff" opacity="0.4"><polygon points="290,188 316,96 326,96 300,188"/></g>
      <rect x="284" y="96" width="66" height="92" fill="none" stroke="#bcd0b6" stroke-width="2"/>

      <!-- 条纹遮阳篷 -->
      <polygon points="46,48 354,48 370,80 30,80" fill="#fbf1e2"/>
      <g fill="#e69c86">
        <polygon points="46,48 71.7,48 58.3,80 30,80"/><polygon points="97.3,48 123,48 115,80 86.7,80"/><polygon points="148.7,48 174.3,48 171.7,80 143.3,80"/>
        <polygon points="200,48 225.7,48 228.3,80 200,80"/><polygon points="251.3,48 277,48 285,80 256.7,80"/><polygon points="302.7,48 328.3,48 341.7,80 313.3,80"/>
      </g>
      <polygon points="46,48 354,48 370,80 30,80" fill="url(#awn)"/>
      <g fill="#f4e6d2">
        <path d="M58.3,80 L86.7,80 L86.7,86 Q72.5,95 58.3,86 Z"/><path d="M115,80 L143.3,80 L143.3,86 Q129.2,95 115,86 Z"/><path d="M171.7,80 L200,80 L200,86 Q185.8,95 171.7,86 Z"/>
        <path d="M228.3,80 L256.7,80 L256.7,86 Q242.5,95 228.3,86 Z"/><path d="M285,80 L313.3,80 L313.3,86 Q299.2,95 285,86 Z"/><path d="M341.7,80 L370,80 L370,86 Q355.8,95 341.7,86 Z"/>
      </g>
      <g fill="#dc8d76">
        <path d="M30,80 L58.3,80 L58.3,86 Q44.2,95 30,86 Z"/><path d="M86.7,80 L115,80 L115,86 Q100.8,95 86.7,86 Z"/><path d="M143.3,80 L171.7,80 L171.7,86 Q157.5,95 143.3,86 Z"/>
        <path d="M200,80 L228.3,80 L228.3,86 Q214.2,95 200,86 Z"/><path d="M256.7,80 L285,80 L285,86 Q270.8,95 256.7,86 Z"/><path d="M313.3,80 L341.7,80 L341.7,86 Q327.5,95 313.3,86 Z"/>
      </g>
      <rect x="44" y="45" width="312" height="4" rx="1.5" fill="#d9c3a6"/>
    </g>
    <!-- 遮阳篷投在店面上的影子 -->
    <rect x="40" y="90" width="320" height="12" fill="#6e5c4c" opacity="0.13" filter="url(#soft2)"/>

    <g filter="url(#wc)">
      <!-- 木架：后层 -->
      <g fill="#b48862"><rect x="63" y="150" width="4" height="66"/><rect x="199" y="150" width="4" height="66"/></g>
      <rect x="59" y="146" width="148" height="6" rx="1.2" fill="url(#box)"/>
      <rect x="59" y="145" width="148" height="2" fill="#dcb68e"/>
      <!-- 后层两桶向日葵 -->
      <g stroke="#6f9f52" stroke-width="1.6" fill="none" stroke-linecap="round">
        <path d="M94,124 C90,116 88,112 86,106"/><path d="M98,124 C98,112 99,104 100,96"/><path d="M103,124 C106,118 110,114 113,108"/>
        <path d="M160,124 C156,116 154,110 152,104"/><path d="M164,124 C164,112 165,104 166,96"/><path d="M169,124 C173,120 176,116 178,110"/>
      </g>
      <g fill="#6aa357">
        <use href="#leaf" transform="translate(98,116) rotate(-160) scale(0.9)"/><use href="#leaf" transform="translate(100,110) rotate(-25) scale(0.85)"/>
        <use href="#leaf" transform="translate(164,116) rotate(-155) scale(0.9)"/><use href="#leaf" transform="translate(166,108) rotate(-20) scale(0.85)"/>
      </g>
      <g fill="#86bd6c"><use href="#leaf" transform="translate(104,120) rotate(-10) scale(0.7)"/><use href="#leaf" transform="translate(158,120) rotate(-170) scale(0.7)"/></g>
      <use href="#sunf" transform="translate(86,106) scale(0.95)"/><use href="#sunf" transform="translate(113,108) scale(0.9)"/><use href="#sunf" transform="translate(100,96)"/>
      <use href="#sunf" transform="translate(152,104) scale(0.95)"/><use href="#sunf" transform="translate(178,110) scale(0.9)"/><use href="#sunf" transform="translate(166,96)"/>
      <use href="#bucket" transform="translate(98,126) scale(0.85)"/><use href="#bucket" transform="translate(164,126) scale(0.85)"/>

      <!-- 木架：前层 -->
      <g fill="#a97f5a"><rect x="56" y="184" width="4.5" height="44"/><rect x="206" y="184" width="4.5" height="44"/></g>
      <path d="M60,200 L206,214" stroke="#b48862" stroke-width="2.4"/>
      <rect x="52" y="180" width="162" height="7" rx="1.4" fill="url(#box)"/>
      <rect x="52" y="179" width="162" height="2" fill="#dcb68e"/>
      <!-- 红玫瑰 -->
      <g fill="#5d9a4e">
        <use href="#leaf" transform="translate(82,158) rotate(-165) scale(0.85)"/><use href="#leaf" transform="translate(86,158) rotate(-15) scale(0.85)"/><use href="#leaf" transform="translate(84,146) rotate(-120) scale(0.7)"/><use href="#leaf" transform="translate(84,146) rotate(-60) scale(0.7)"/>
      </g>
      <g fill="#7db466"><use href="#leaf" transform="translate(80,152) rotate(-150) scale(0.65)"/><use href="#leaf" transform="translate(88,152) rotate(-30) scale(0.65)"/></g>
      <g fill="#df5f5a"><use href="#rose" transform="translate(80,143) scale(1.12)"/><use href="#rose" transform="translate(89,143) scale(1.12)"/><use href="#rose" transform="translate(74,149) scale(1.12)"/><use href="#rose" transform="translate(84,149) scale(1.12)"/><use href="#rose" transform="translate(94,149) scale(1.12)"/><use href="#rose" transform="translate(78,155.5) scale(1.12)"/><use href="#rose" transform="translate(90,155.5) scale(1.12)"/></g>
      <use href="#bucket" transform="translate(84,160) scale(0.85)"/>
      <!-- 郁金香 -->
      <g fill="#79b062">
        <use href="#tlf" transform="translate(126,160) rotate(-22)"/><use href="#tlf" transform="translate(140,160) rotate(24) scale(-1,1)"/><use href="#tlf" transform="translate(132,160) rotate(-6) scale(0.95)"/><use href="#tlf" transform="translate(136,160) rotate(8) scale(-0.9,0.9)"/>
      </g>
      <g stroke="#6f9f52" stroke-width="1.4" fill="none" stroke-linecap="round">
        <path d="M128,160 C125,156 123,151 122,147"/><path d="M131,160 C130,152 129,145 128,139"/><path d="M135,160 C135,152 136,144 137,137"/><path d="M138,160 C141,155 143,150 144,146"/>
        <path d="M130,160 C128,158 127,155 126,152"/><path d="M133,160 C133,155 133,151 133,148"/><path d="M136,160 C138,158 140,156 141,153"/>
      </g>
      <use href="#tulip" transform="translate(122,147) scale(1.05)" fill="#ee8ea2"/><use href="#tulip" transform="translate(128,139) scale(1.05)" fill="#f2c95a"/><use href="#tulip" transform="translate(137,137) scale(1.05)" fill="#ee8ea2"/><use href="#tulip" transform="translate(144,146) scale(1.05)" fill="#ef9a5c"/>
      <use href="#tulip" transform="translate(133,148) scale(1.05)" fill="#ef9a5c"/><use href="#tulip" transform="translate(126,153)" fill="#f2c95a"/><use href="#tulip" transform="translate(141,153)" fill="#f2c95a"/>
      <use href="#bucket" transform="translate(133,160) scale(0.85)"/>
      <!-- 粉玫瑰 -->
      <g fill="#5d9a4e">
        <use href="#leaf" transform="translate(180,158) rotate(-165) scale(0.85)"/><use href="#leaf" transform="translate(184,158) rotate(-15) scale(0.85)"/><use href="#leaf" transform="translate(182,146) rotate(-120) scale(0.7)"/><use href="#leaf" transform="translate(182,146) rotate(-60) scale(0.7)"/>
      </g>
      <g fill="#7db466"><use href="#leaf" transform="translate(178,152) rotate(-150) scale(0.65)"/><use href="#leaf" transform="translate(186,152) rotate(-30) scale(0.65)"/></g>
      <g fill="#f19aa6"><use href="#rose" transform="translate(178,143) scale(1.12)"/><use href="#rose" transform="translate(187,143) scale(1.12)"/><use href="#rose" transform="translate(172,149) scale(1.12)"/><use href="#rose" transform="translate(182,149) scale(1.12)"/><use href="#rose" transform="translate(192,149) scale(1.12)"/><use href="#rose" transform="translate(176,155.5) scale(1.12)"/><use href="#rose" transform="translate(188,155.5) scale(1.12)"/></g>
      <use href="#bucket" transform="translate(182,160) scale(0.85)"/>

      <!-- 门边地上的一桶紫色郁金香 -->
      <g fill="#79b062"><use href="#tlf" transform="translate(238,212) rotate(-16)"/><use href="#tlf" transform="translate(250,212) rotate(18) scale(-1,1)"/></g>
      <g stroke="#6f9f52" stroke-width="1.4" fill="none" stroke-linecap="round">
        <path d="M240,212 C238,204 236,198 235,194"/><path d="M244,212 C244,202 244,196 244,188"/><path d="M248,212 C250,206 252,200 253,195"/>
      </g>
      <use href="#tulip" transform="translate(235,194)" fill="#b9a0d0"/><use href="#tulip" transform="translate(244,188)" fill="#fbf6ee"/><use href="#tulip" transform="translate(253,195)" fill="#b9a0d0"/>
      <use href="#bucket" transform="translate(244,212) scale(0.9)"/>

      <!-- 大盆绿植 -->
      <g stroke="#6b8f4e" stroke-width="1.6" fill="none" stroke-linecap="round">
        <path d="M318,196 C316,176 318,156 316,132"/><path d="M318,190 C326,176 332,166 340,156"/><path d="M317,186 C308,174 302,166 296,158"/>
      </g>
      <g fill="#5f9a52">
        <use href="#bigleaf" transform="translate(316,134) rotate(-120)"/><use href="#bigleaf" transform="translate(316,136) rotate(-60)"/><use href="#bigleaf" transform="translate(340,156) rotate(-40)"/>
        <use href="#bigleaf" transform="translate(296,158) rotate(-150)"/><use href="#bigleaf" transform="translate(317,170) rotate(-15) scale(0.95)"/><use href="#bigleaf" transform="translate(317,176) rotate(-170) scale(0.95)"/>
      </g>
      <g fill="#7db466">
        <use href="#bigleaf" transform="translate(317,150) rotate(-150) scale(0.9)"/><use href="#bigleaf" transform="translate(317,148) rotate(-30) scale(0.9)"/><use href="#bigleaf" transform="translate(330,166) rotate(10) scale(0.8)"/>
        <use href="#bigleaf" transform="translate(304,166) rotate(170) scale(0.8)"/><use href="#bigleaf" transform="translate(316,132) rotate(-92) scale(0.8)"/>
      </g>
      <path d="M300,198 L336,198 L331,232 L305,232 Z" fill="url(#pot)"/>
      <rect x="297" y="193" width="42" height="7" rx="2" fill="#dc9067"/>
      <!-- 小盆圆球植物 -->
      <g fill="#86b46c"><circle cx="364" cy="200" r="13"/></g>
      <g fill="#9fc884"><circle cx="360" cy="196" r="8"/></g>
      <path d="M350,212 L378,212 L374,236 L354,236 Z" fill="url(#pot)"/>
      <rect x="348" y="208" width="32" height="6" rx="2" fill="#dc9067"/>
    </g>

    <!-- 地面阴影 -->
    <g filter="url(#soft2)" opacity="0.18" fill="#8a6a4a">
      <ellipse cx="133" cy="226" rx="86" ry="4.5"/><ellipse cx="244" cy="235" rx="16" ry="2.6"/><ellipse cx="318" cy="234" rx="22" ry="3"/><ellipse cx="364" cy="237" rx="16" ry="2.4"/>
    </g>
    <!-- 纸纹 -->
    <rect width="400" height="260" filter="url(#grain)"/>
  </g>
</svg>
