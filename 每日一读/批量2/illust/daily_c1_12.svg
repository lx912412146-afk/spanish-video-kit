<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 260" width="400" height="260">
  <!-- 原创插图：清晨的山间湖泊，平静水面、倒影、薄雾、一条空着的小木码头（水彩风格，纯 SVG 手绘） -->
  <defs>
    <filter id="wc" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="0.35"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="g"/>
      <feColorMatrix in="g" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.38  0 0 0 0 0.3  0 0 0 0.09 0"/>
    </filter>
    <filter id="edge" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="5"/></filter>
    <mask id="fade" maskUnits="userSpaceOnUse" x="0" y="0" width="400" height="260">
      <rect x="7" y="7" width="386" height="246" rx="4" fill="#fff" filter="url(#edge)"/>
    </mask>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6eeed"/><stop offset="0.55" stop-color="#f3f0e6"/><stop offset="1" stop-color="#f8e8d6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff4dc"/><stop offset="0.5" stop-color="#fbe9cd" stop-opacity="0.6"/><stop offset="1" stop-color="#f8e8d6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6ece6"/><stop offset="0.35" stop-color="#d2e1df"/><stop offset="1" stop-color="#b8cfcf"/>
    </linearGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c3cfd6"/><stop offset="1" stop-color="#d6dde0"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aebfbe"/><stop offset="1" stop-color="#c3cfcb"/>
    </linearGradient>
    <linearGradient id="plank" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfae8a"/><stop offset="1" stop-color="#b98e67"/>
    </linearGradient>
    <path id="pine" d="M0,0 L-5,0 L-2,-5 L-4,-5 L-1,-10 L-2.6,-10 L0,-16 L2.6,-10 L1,-10 L4,-5 L2,-5 L5,0 Z"/>
    <g id="land">
      <path d="M0,100 C26,92 52,74 80,64 C96,58 112,68 134,78 C160,90 188,76 218,60 C240,48 264,42 288,52 C316,64 342,76 368,70 C384,67 394,70 400,72 L400,133 L0,133 Z" fill="url(#far)"/>
      <path d="M0,114 C36,106 66,98 98,102 C128,106 150,94 182,98 C212,102 238,110 270,104 C300,98 330,90 360,98 C380,102 392,106 400,108 L400,133 L0,133 Z" fill="url(#mid)"/>
      <g fill="#9fb4a5">
        <use href="#pine" transform="translate(10,132) scale(1.1)"/><use href="#pine" transform="translate(20,132) scale(1.4)"/><use href="#pine" transform="translate(31,132) scale(1)"/>
        <use href="#pine" transform="translate(46,132) scale(1.3)"/><use href="#pine" transform="translate(58,132) scale(0.9)"/><use href="#pine" transform="translate(70,132) scale(1.2)"/>
        <use href="#pine" transform="translate(150,132) scale(1)"/><use href="#pine" transform="translate(160,132) scale(1.3)"/><use href="#pine" transform="translate(171,132) scale(0.9)"/>
        <use href="#pine" transform="translate(300,132) scale(1.2)"/><use href="#pine" transform="translate(312,132) scale(1.5)"/><use href="#pine" transform="translate(324,132) scale(1.1)"/>
        <use href="#pine" transform="translate(336,132) scale(1.4)"/><use href="#pine" transform="translate(349,132) scale(1)"/><use href="#pine" transform="translate(362,132) scale(1.3)"/>
        <use href="#pine" transform="translate(376,132) scale(1.1)"/><use href="#pine" transform="translate(390,132) scale(1.4)"/>
      </g>
      <path d="M0,133 L0,128 C40,125 80,127 120,126 C170,125 220,127 270,126 C320,125 360,127 400,126 L400,133 Z" fill="#a8bbab"/>
    </g>
  </defs>

  <g mask="url(#fade)">
    <!-- 天空和晨光 -->
    <rect width="400" height="134" fill="url(#sky)"/>
    <ellipse cx="300" cy="80" rx="90" ry="54" fill="url(#glow)"/>
    <!-- 湖水 -->
    <rect x="0" y="132" width="400" height="128" fill="url(#water)"/>
    <ellipse cx="300" cy="170" rx="60" ry="26" fill="url(#glow)" opacity="0.7"/>

    <!-- 倒影 -->
    <g opacity="0.85" filter="url(#soft2)">
      <use href="#land" transform="translate(0,266) scale(1,-1)"/>
    </g>

    <g filter="url(#wc)">
      <!-- 远山、松林、对岸 -->
      <use href="#land"/>
      <g filter="url(#soft2)" fill="#ffffff" opacity="0.7">
        <ellipse cx="330" cy="30" rx="20" ry="5"/><ellipse cx="346" cy="27" rx="12" ry="4.5"/>
      </g>
    </g>

    <!-- 薄雾 -->
    <g filter="url(#soft)" fill="#ffffff">
      <ellipse cx="90" cy="124" rx="110" ry="8" opacity="0.75"/>
      <ellipse cx="300" cy="128" rx="120" ry="7" opacity="0.7"/>
      <ellipse cx="200" cy="112" rx="70" ry="5" opacity="0.45"/>
      <ellipse cx="140" cy="142" rx="130" ry="6" opacity="0.55"/>
      <ellipse cx="360" cy="104" rx="50" ry="4" opacity="0.4"/>
    </g>

    <g filter="url(#wc)">
      <!-- 水面的光纹 -->
      <g stroke="#f6f8f4" stroke-width="1.2" stroke-linecap="round" opacity="0.85">
        <line x1="40" y1="160" x2="96" y2="160"/><line x1="130" y1="152" x2="168" y2="152"/><line x1="274" y1="158" x2="326" y2="158"/>
        <line x1="20" y1="196" x2="64" y2="196"/><line x1="118" y1="184" x2="180" y2="184"/><line x1="70" y1="226" x2="128" y2="226"/>
        <line x1="160" y1="212" x2="204" y2="212"/><line x1="330" y1="180" x2="370" y2="180"/>
      </g>
      <g stroke="#e8f0ee" stroke-width="0.9" stroke-linecap="round" opacity="0.8">
        <line x1="200" y1="146" x2="236" y2="146"/><line x1="60" y1="142" x2="100" y2="142"/><line x1="10" y1="240" x2="46" y2="240"/><line x1="150" y1="244" x2="196" y2="244"/>
      </g>

      <!-- 码头：木桩、水圈和倒影 -->
      <g fill="#a98058" opacity="0.3">
        <rect x="229.5" y="196" width="3" height="9"/><rect x="279" y="222" width="4.5" height="13"/><rect x="337.5" y="250" width="6" height="12"/>
      </g>
      <g fill="#9e7450">
        <rect x="229.5" y="183" width="3" height="13"/><rect x="279" y="202" width="4.5" height="20"/><rect x="337.5" y="225" width="6" height="25"/>
      </g>
      <g fill="none" stroke="#eef4f1" stroke-width="0.9" opacity="0.9">
        <ellipse cx="231" cy="196" rx="5" ry="1.2"/><ellipse cx="281.2" cy="222" rx="7" ry="1.6"/><ellipse cx="340.5" cy="250" rx="9" ry="2"/>
      </g>
      <!-- 码头侧面和桥面 -->
      <path d="M200,171 L398,247 L398,256 L200,174.5 Z" fill="#9e7450"/>
      <path d="M212,164 L419,204 L398,247 L200,171 Z" fill="url(#plank)"/>
      <path d="M212,163 L200,170 L200,172.5 L212,165.5 Z" fill="#dcbd97"/>
      <g stroke="#a98058" stroke-width="0.9" opacity="0.7">
        <line x1="223.3" y1="166.2" x2="210.8" y2="175.1"/><line x1="236.4" y1="168.7" x2="223.4" y2="180.0"/><line x1="251.5" y1="171.6" x2="237.8" y2="185.5"/><line x1="268.4" y1="174.8" x2="254.0" y2="191.7"/><line x1="287.2" y1="178.4" x2="272.0" y2="198.6"/><line x1="307.9" y1="182.4" x2="291.8" y2="206.2"/><line x1="330.4" y1="186.7" x2="313.4" y2="214.5"/><line x1="354.9" y1="191.4" x2="336.8" y2="223.4"/><line x1="381.2" y1="196.4" x2="362.0" y2="233.1"/>
      </g>
      <path d="M216,166 L404,203" stroke="#e7cfae" stroke-width="1.6" opacity="0.6"/>
      <!-- 系船桩和一卷绳子 -->
      <rect x="341" y="193" width="8" height="17" rx="1.5" fill="#9e7450"/>
      <ellipse cx="345" cy="193" rx="4" ry="1.6" fill="#c49870"/>
      <g fill="none" stroke="#e2cfa8" stroke-width="1.8">
        <ellipse cx="345" cy="208" rx="9" ry="3"/><ellipse cx="345" cy="206" rx="7" ry="2.4"/>
      </g>
      <path d="M345,198 C351,199 353,202 351,205" stroke="#e2cfa8" stroke-width="1.6" fill="none"/>

      <!-- 左下角的芦苇 -->
      <g stroke-linecap="round" fill="none">
        <path d="M22,262 C22,236 20,214 18,196" stroke="#8fae78" stroke-width="2"/>
        <path d="M32,262 C32,240 34,222 38,206" stroke="#7fa16b" stroke-width="2"/>
        <path d="M12,262 C12,246 8,232 4,222" stroke="#9bb983" stroke-width="2"/>
        <path d="M44,262 C44,248 48,238 54,228" stroke="#9bb983" stroke-width="1.6"/>
        <path d="M26,262 C30,244 40,232 52,224" stroke="#a8c48f" stroke-width="1.4"/>
      </g>
      <rect x="15" y="182" width="5" height="16" rx="2.5" fill="#b08860"/>
      <rect x="36" y="194" width="5" height="14" rx="2.5" fill="#a87b58" transform="rotate(14 38 201)"/>
      <!-- 远处两只鸟 -->
      <g stroke="#9aa6a8" stroke-width="1" fill="none" stroke-linecap="round">
        <path d="M262,70 C265,67 267,67 269,70 C271,67 273,67 276,70"/><path d="M282,62 C284,60 286,60 287,62 C288,60 290,60 292,62"/>
      </g>
    </g>

    <!-- 码头在水上的阴影、系船桩的阴影 -->
    <g filter="url(#soft2)" opacity="0.16" fill="#55707a">
      <path d="M200,176 L400,254 L400,264 L200,180 Z"/>
    </g>
    <g filter="url(#soft2)" opacity="0.2" fill="#8a6a4a"><ellipse cx="347" cy="210" rx="12" ry="2.4"/></g>
    <!-- 纸纹 -->
    <rect width="400" height="260" filter="url(#grain)"/>
  </g>
</svg>
