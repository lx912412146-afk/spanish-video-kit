<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 260" width="400" height="260">
  <!-- 原创插图：一场足球赛（小足球场：草地、球门和球网、足球、场边看台和几面纯色小旗；水彩风格，纯 SVG 手绘） -->
  <defs>
    <filter id="wc" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="0.35"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="g"/>
      <feColorMatrix in="g" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.38  0 0 0 0 0.3  0 0 0 0.09 0"/>
    </filter>
    <filter id="edge" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="5"/></filter>
    <mask id="fade" maskUnits="userSpaceOnUse" x="0" y="0" width="400" height="260">
      <rect x="7" y="7" width="386" height="246" rx="4" fill="#fff" filter="url(#edge)"/>
    </mask>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dae8ef"/><stop offset="0.25" stop-color="#ebf1ee"/><stop offset="0.45" stop-color="#f7f2e5"/><stop offset="1" stop-color="#f7f2e5"/>
    </linearGradient>
    <linearGradient id="stand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe6d8"/><stop offset="1" stop-color="#e3d6c3"/>
    </linearGradient>
    <linearGradient id="roofS" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9cbb8"/><stop offset="1" stop-color="#cbbba5"/>
    </linearGradient>
    <linearGradient id="post" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9e7e0"/><stop offset="0.5" stop-color="#ffffff"/><stop offset="1" stop-color="#dcd9d1"/>
    </linearGradient>
    <radialGradient id="ball" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.6" stop-color="#f1eee8"/><stop offset="1" stop-color="#d6d0c6"/>
    </radialGradient>
    <clipPath id="ballclip"><circle r="11"/></clipPath>
    <clipPath id="netclip"><polygon points="140,122 260,122 260,168 252,160 148,160 140,168"/></clipPath>
    <path id="clump" d="M-22,8 C-29,3 -26,-8 -17,-9 C-17,-18 -6,-22 0,-17 C6,-23 18,-19 17,-10 C26,-9 28,3 21,8 C17,14 6,13 0,12 C-8,14 -17,13 -22,8 Z"/>
  </defs>

  <g mask="url(#fade)">
    <!-- 天空 -->
    <rect width="400" height="260" fill="url(#sky)"/>

    <g filter="url(#wc)">
      <g filter="url(#soft2)" fill="#ffffff" opacity="0.85">
        <ellipse cx="300" cy="40" rx="24" ry="6"/><ellipse cx="314" cy="36" rx="12" ry="5.5"/><ellipse cx="90" cy="64" rx="18" ry="4"/>
      </g>
      <!-- 看台后面的树 -->
      <g fill="#b6cf9a">
        <use href="#clump" transform="translate(30,90) scale(1.2)"/><use href="#clump" transform="translate(76,86) scale(1.1,1.2)"/><use href="#clump" transform="translate(124,90) scale(1)"/>
        <use href="#clump" transform="translate(276,88) scale(1.1)"/><use href="#clump" transform="translate(326,82) scale(1.3)"/><use href="#clump" transform="translate(376,88) scale(1.2)"/>
      </g>
      <g fill="#c7dbae">
        <use href="#clump" transform="translate(28,86) scale(0.7)"/><use href="#clump" transform="translate(74,82) scale(0.65)"/><use href="#clump" transform="translate(324,78) scale(0.75)"/><use href="#clump" transform="translate(374,84) scale(0.7)"/>
      </g>

      <!-- 看台 -->
      <rect x="100" y="86" width="200" height="16" fill="#e8ddcc"/>
      <polygon points="96,82 304,82 300,89 100,89" fill="url(#roofS)"/>
      <g fill="#cbbfae"><rect x="104" y="89" width="2.4" height="12"/><rect x="199" y="89" width="2.4" height="12"/><rect x="294" y="89" width="2.4" height="12"/></g>
      <rect x="14" y="100" width="372" height="42" fill="url(#stand)"/>
      <g fill="#dfd2bf"><rect x="14" y="109" width="372" height="1.6"/><rect x="14" y="119" width="372" height="1.6"/><rect x="14" y="129" width="372" height="1.6"/></g>
      <g fill="#a9c4cf">
        <rect x="14" y="105" width="372" height="3.6"/><rect x="14" y="115" width="372" height="3.6"/><rect x="14" y="125" width="372" height="3.6"/>
      </g>
      <g fill="#c7d9df" opacity="0.8"><rect x="14" y="105" width="372" height="1.2"/><rect x="14" y="115" width="372" height="1.2"/><rect x="14" y="125" width="372" height="1.2"/></g>
      <!-- 过道 -->
      <g fill="#efe6d8"><rect x="92" y="100" width="8" height="36"/><rect x="196" y="100" width="8" height="36"/><rect x="300" y="100" width="8" height="36"/></g>
      <g stroke="#ddd0bd" stroke-width="0.7"><line x1="92" y1="104" x2="100" y2="104"/><line x1="92" y1="114" x2="100" y2="114"/><line x1="92" y1="124" x2="100" y2="124"/><line x1="196" y1="104" x2="204" y2="104"/><line x1="196" y1="114" x2="204" y2="114"/><line x1="196" y1="124" x2="204" y2="124"/><line x1="300" y1="104" x2="308" y2="104"/><line x1="300" y1="114" x2="308" y2="114"/><line x1="300" y1="124" x2="308" y2="124"/></g>
      <rect x="10" y="134" width="380" height="9" fill="#e6dccb"/>
      <g stroke="#b9b3a8" stroke-width="0.9"><line x1="10" y1="133" x2="390" y2="133"/></g>
      <g stroke="#b9b3a8" stroke-width="0.8"><line x1="20" y1="133" x2="20" y2="138"/><line x1="60" y1="133" x2="60" y2="138"/><line x1="100" y1="133" x2="100" y2="138"/><line x1="140" y1="133" x2="140" y2="138"/><line x1="180" y1="133" x2="180" y2="138"/><line x1="220" y1="133" x2="220" y2="138"/><line x1="260" y1="133" x2="260" y2="138"/><line x1="300" y1="133" x2="300" y2="138"/><line x1="340" y1="133" x2="340" y2="138"/><line x1="380" y1="133" x2="380" y2="138"/></g>
      <!-- 看台顶上的纯色小旗 -->
      <g stroke="#a99a86" stroke-width="1" stroke-linecap="round"><line x1="112" y1="82" x2="112" y2="60"/><line x1="156" y1="82" x2="156" y2="60"/><line x1="244" y1="82" x2="244" y2="60"/><line x1="288" y1="82" x2="288" y2="60"/></g>
      <path d="M112.5,60 C117,58 121,62 126,60 L126,68.6 C121,70.6 117,66.6 112.5,68.6 Z" fill="#e39a7a"/>
      <path d="M156.5,60 C161,58 165,62 170,60 L170,68.6 C165,70.6 161,66.6 156.5,68.6 Z" fill="#efcd7e"/>
      <path d="M244.5,60 C249,58 253,62 258,60 L258,68.6 C253,70.6 249,66.6 244.5,68.6 Z" fill="#9cc08a"/>
      <path d="M288.5,60 C293,58 297,62 302,60 L302,68.6 C297,70.6 293,66.6 288.5,68.6 Z" fill="#93b6cc"/>

      <!-- 草地（修剪出的条纹） -->
      <rect x="0" y="142" width="400" height="118" fill="#b5d28d"/>
      <g fill="#a8c882">
        <rect x="0" y="148" width="400" height="9"/><rect x="0" y="168" width="400" height="13"/><rect x="0" y="197" width="400" height="20"/><rect x="0" y="241" width="400" height="19"/>
      </g>
      <rect x="0" y="142" width="400" height="3" fill="#a3c07e" opacity="0.7"/>
      <!-- 白线 -->
      <g fill="none" stroke="#f7f6ee" stroke-linecap="round">
        <line x1="0" y1="168" x2="400" y2="168" stroke-width="1.6"/>
        <path d="M156,168 L148,190 L252,190 L244,168" stroke-width="1.6"/>
        <path d="M104,168 L74,232 L326,232 L296,168" stroke-width="1.8"/>
        <path d="M168,232 C178,246 222,246 232,232" stroke-width="1.8"/>
        <path d="M366,168 C366,172 370,174 376,174" stroke-width="1.4"/>
      </g>
      <ellipse cx="200" cy="214" rx="2.4" ry="1.2" fill="#f7f6ee"/>
      <!-- 球门里的阴影 -->
      <polygon points="140,168 148,160 252,160 260,168" fill="#9dbd78" opacity="0.8"/>

      <!-- 球网 -->
      <g clip-path="url(#netclip)">
        <rect x="136" y="120" width="128" height="50" fill="#f4f5f1" opacity="0.28"/>
        <g stroke="#e2e5e3" stroke-width="0.6" opacity="0.9">
          <line x1="138" y1="120" x2="138" y2="170"/><line x1="143" y1="120" x2="143" y2="170"/><line x1="148" y1="120" x2="148" y2="170"/><line x1="153" y1="120" x2="153" y2="170"/><line x1="158" y1="120" x2="158" y2="170"/><line x1="163" y1="120" x2="163" y2="170"/><line x1="168" y1="120" x2="168" y2="170"/><line x1="173" y1="120" x2="173" y2="170"/><line x1="178" y1="120" x2="178" y2="170"/><line x1="183" y1="120" x2="183" y2="170"/><line x1="188" y1="120" x2="188" y2="170"/><line x1="193" y1="120" x2="193" y2="170"/><line x1="198" y1="120" x2="198" y2="170"/><line x1="203" y1="120" x2="203" y2="170"/><line x1="208" y1="120" x2="208" y2="170"/><line x1="213" y1="120" x2="213" y2="170"/><line x1="218" y1="120" x2="218" y2="170"/><line x1="223" y1="120" x2="223" y2="170"/><line x1="228" y1="120" x2="228" y2="170"/><line x1="233" y1="120" x2="233" y2="170"/><line x1="238" y1="120" x2="238" y2="170"/><line x1="243" y1="120" x2="243" y2="170"/><line x1="248" y1="120" x2="248" y2="170"/><line x1="253" y1="120" x2="253" y2="170"/><line x1="258" y1="120" x2="258" y2="170"/>
          <line x1="136" y1="127" x2="264" y2="127"/><line x1="136" y1="132" x2="264" y2="132"/><line x1="136" y1="137" x2="264" y2="137"/><line x1="136" y1="142" x2="264" y2="142"/><line x1="136" y1="147" x2="264" y2="147"/><line x1="136" y1="152" x2="264" y2="152"/><line x1="136" y1="157" x2="264" y2="157"/><line x1="136" y1="162" x2="264" y2="162"/><line x1="136" y1="167" x2="264" y2="167"/>
        </g>
      </g>
      <g stroke="#d9dcda" stroke-width="0.9" fill="none">
        <path d="M148,126 L252,126 L252,160 L148,160 Z"/><line x1="141" y1="123" x2="148" y2="126"/><line x1="259" y1="123" x2="252" y2="126"/>
      </g>
      <!-- 球门框 -->
      <rect x="138" y="121" width="4" height="48" fill="url(#post)"/>
      <rect x="258" y="121" width="4" height="48" fill="url(#post)"/>
      <rect x="138" y="120" width="124" height="4" fill="#fbfaf6"/>
      <rect x="138" y="123" width="124" height="1.2" fill="#dedad2"/>

      <!-- 角旗 -->
      <line x1="376" y1="172" x2="376" y2="140" stroke="#f2efe6" stroke-width="1.6"/>
      <path d="M377,140 C382,139 386,143 391,141 L388,147 L391,152 C386,154 382,150 377,151 Z" fill="#e8866a"/>

      <!-- 足球 -->
      <g transform="translate(214,222)">
        <circle r="11" fill="url(#ball)"/>
        <g clip-path="url(#ballclip)">
          <g fill="#6a5f55">
            <polygon points="0.00,-4.00 3.80,-1.24 2.35,3.24 -2.35,3.24 -3.80,-1.24"/>
            <polygon points="0.00,-7.00 -3.99,-9.90 -2.47,-14.60 2.47,-14.60 3.99,-9.90"/><polygon points="6.66,-2.16 8.18,-6.86 13.12,-6.86 14.65,-2.16 10.65,0.74"/><polygon points="4.11,5.66 9.05,5.66 10.58,10.36 6.58,13.26 2.59,10.36"/><polygon points="-4.11,5.66 -2.59,10.36 -6.58,13.26 -10.58,10.36 -9.05,5.66"/><polygon points="-6.66,-2.16 -10.65,0.74 -14.65,-2.16 -13.12,-6.86 -8.18,-6.86"/>
          </g>
          <g stroke="#b9b2a7" stroke-width="0.6">
            <line x1="0" y1="-4" x2="0" y2="-7"/><line x1="3.8" y1="-1.24" x2="6.66" y2="-2.16"/><line x1="2.35" y1="3.24" x2="4.11" y2="5.66"/><line x1="-2.35" y1="3.24" x2="-4.11" y2="5.66"/><line x1="-3.8" y1="-1.24" x2="-6.66" y2="-2.16"/>
          </g>
          <circle r="11" fill="none" stroke="#c9c2b6" stroke-width="1"/>
        </g>
        <ellipse cx="-4" cy="-5" rx="3" ry="1.8" fill="#ffffff" opacity="0.55" transform="rotate(-30 -4 -5)"/>
      </g>

      <!-- 草叶 -->
      <g stroke="#97b874" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.85">
        <path d="M30,250 l2,-7 M34,250 l-1,-6 M38,250 l3,-6 M120,246 l2,-6 M124,246 l-1,-5 M300,252 l2,-7 M304,252 l-1,-6 M308,252 l3,-6 M360,240 l2,-6 M364,240 l-1,-5 M196,236 l1,-4 M232,235 l-1,-4"/>
      </g>
    </g>

    <!-- 地面阴影 -->
    <g filter="url(#soft2)" opacity="0.22" fill="#4f6b3a">
      <ellipse cx="216" cy="233" rx="12" ry="2.4"/><ellipse cx="200" cy="169" rx="64" ry="1.6"/>
    </g>
    <g filter="url(#soft2)" opacity="0.14" fill="#8a6a4a"><rect x="12" y="141" width="376" height="3"/></g>
    <!-- 纸纹 -->
    <rect width="400" height="260" filter="url(#grain)"/>
  </g>
</svg>
