<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 260" width="400" height="260">
  <!-- 原创插图：雪中的周末（雪山脚下的小木屋：屋顶积雪、门边的滑雪板、雪地里的松树；水彩风格，纯 SVG 手绘） -->
  <defs>
    <filter id="wc" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="0.35"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="g"/>
      <feColorMatrix in="g" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.38  0 0 0 0 0.3  0 0 0 0.09 0"/>
    </filter>
    <filter id="edge" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="5"/></filter>
    <mask id="fade" maskUnits="userSpaceOnUse" x="0" y="0" width="400" height="260">
      <rect x="7" y="7" width="386" height="246" rx="4" fill="#fff" filter="url(#edge)"/>
    </mask>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8e6ef"/><stop offset="0.3" stop-color="#e9f0f2"/><stop offset="0.55" stop-color="#f6f4ee"/><stop offset="1" stop-color="#f6f4ee"/>
    </linearGradient>
    <linearGradient id="mtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bccbd7"/><stop offset="1" stop-color="#d3dde5"/>
    </linearGradient>
    <linearGradient id="snow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafa"/><stop offset="0.6" stop-color="#eef3f5"/><stop offset="1" stop-color="#e2eaef"/>
    </linearGradient>
    <linearGradient id="log" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c99a70"/><stop offset="1" stop-color="#b3845d"/>
    </linearGradient>
    <linearGradient id="logS" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b48760"/><stop offset="1" stop-color="#9f7552"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbe6a8"/><stop offset="1" stop-color="#f1c77c"/>
    </linearGradient>
    <linearGradient id="ski" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e48a6c"/><stop offset="1" stop-color="#cf6d52"/>
    </linearGradient>
    <linearGradient id="roofsnow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdfefe"/><stop offset="1" stop-color="#e6edf2"/>
    </linearGradient>
    <g id="pine">
      <rect x="-2.6" y="-10" width="5.2" height="12" fill="#8e6f55"/>
      <path d="M-22,-8 C-14,-13 -7,-22 0,-36 C7,-22 14,-13 22,-8 C12,-5 -12,-5 -22,-8 Z" fill="#6e9580"/>
      <path d="M-17,-26 C-11,-31 -5,-39 0,-50 C5,-39 11,-31 17,-26 C9,-23 -9,-23 -17,-26 Z" fill="#76a08a"/>
      <path d="M-12,-42 C-8,-46 -3,-53 0,-62 C3,-53 8,-46 12,-42 C6,-39.6 -6,-39.6 -12,-42 Z" fill="#7da790"/>
      <path d="M-7,-56 C-4,-59 -1.6,-64 0,-72 C1.6,-64 4,-59 7,-56 C3,-54 -3,-54 -7,-56 Z" fill="#84ad96"/>
      <g fill="#fbfdfd">
        <path d="M0,-36 C-2.6,-31 -5,-27.4 -8,-24.6 C-6,-23.6 -4.6,-25.6 -2.6,-24.8 C-0.6,-24 1.4,-26 3.4,-25 C5,-24.2 6.4,-24.6 7.6,-24.4 C4.6,-27.4 2.4,-31 0,-36 Z"/>
        <path d="M0,-50 C-2,-46 -4,-43 -6.4,-41 C-4.6,-40.2 -3.4,-41.8 -1.8,-41.2 C0,-40.6 1.6,-42.2 3,-41.4 C4.4,-40.6 5.4,-41 6.2,-41 C4,-43 2,-46 0,-50 Z"/>
        <path d="M0,-62 C-1.4,-59 -2.8,-57 -4.6,-55.4 C-3,-54.8 -2,-56 -0.6,-55.4 C0.8,-54.8 2,-56 3.2,-55.4 C4,-55 4.4,-55.4 4.6,-55.4 C3,-57 1.4,-59 0,-62 Z"/>
        <path d="M0,-72 C-1,-69 -2,-67 -3.2,-65.6 C-1.6,-65 0,-66.2 1.6,-65.4 C1,-67.4 0.6,-69.6 0,-72 Z"/>
        <path d="M-22,-8 C-19,-9.6 -16.6,-10.6 -15,-11.4 C-13,-9.4 -10,-9.4 -8,-10 C-5,-8.6 -1,-9.4 2,-8.8 C6,-8.4 9,-9.4 12,-9 C15,-9.6 18,-9.4 22,-8 C12,-5.6 -12,-5.6 -22,-8 Z"/>
        <path d="M-17,-26 C-14,-27.4 -12,-28.4 -10.6,-29.2 C-9,-27.6 -6.4,-27.6 -4.6,-28 C-2,-27 1,-27.6 3.6,-27.2 C6.6,-27 9,-27.6 11.4,-27.4 C13.6,-27.6 15.4,-27 17,-26 C9,-23.4 -9,-23.4 -17,-26 Z"/>
        <path d="M-12,-42 C-10,-43 -8.6,-43.8 -7.4,-44.4 C-6,-43.2 -4,-43.2 -2.6,-43.6 C-0.6,-42.8 1.6,-43.4 3.6,-43 C6,-43 8,-43.4 9.4,-43.2 C10.6,-43 11.4,-42.6 12,-42 C6,-39.8 -6,-39.8 -12,-42 Z"/>
      </g>
    </g>
  </defs>

  <g mask="url(#fade)">
    <!-- 天空 -->
    <rect width="400" height="260" fill="url(#sky)"/>

    <g filter="url(#wc)">
      <g filter="url(#soft2)" fill="#ffffff" opacity="0.85">
        <ellipse cx="364" cy="56" rx="22" ry="5"/><ellipse cx="376" cy="52" rx="11" ry="5"/>
        <ellipse cx="216" cy="62" rx="18" ry="4"/>
      </g>

      <!-- 远处的雪山 -->
      <path d="M-10,126 C20,108 48,86 72,72 C84,66 90,68 100,76 C124,94 160,110 196,124 L196,140 L-10,140 Z" fill="#d7e0e7"/>
      <path d="M72,72 C84,66 90,68 100,76 C108,82 116,88 122,92 C114,90 110,95 104,92 C98,89 94,95 88,90 C82,86 78,92 72,88 C66,85 60,90 54,88 C60,82 66,76 72,72 Z" fill="#f7f9fa"/>
      <path d="M140,140 C180,116 230,84 266,58 C280,48 292,40 302,40 C312,40 322,50 336,62 C356,78 380,90 410,100 L410,150 L140,150 Z" fill="url(#mtn)"/>
      <path d="M302,40 C312,40 322,50 336,62 C356,78 380,90 410,100 L410,150 L300,150 C306,126 312,96 302,40 Z" fill="#b2c2cf" opacity="0.7"/>
      <path d="M266,58 C280,48 292,40 302,40 C312,40 322,50 336,62 C346,70 354,76 362,80 C352,80 348,86 340,82 C332,78 328,88 318,82 C310,78 306,90 298,84 C290,78 284,88 276,82 C270,78 262,84 254,80 C246,76 240,84 232,82 C242,74 254,66 266,58 Z" fill="#f8fafb"/>
      <path d="M302,40 C312,40 322,50 336,62 C346,70 354,76 362,80 C352,80 348,86 340,82 C332,78 328,88 318,82 C312,80 308,86 304,84 C306,70 306,54 302,40 Z" fill="#dfe8ef"/>
      <g fill="none" stroke="#a9bac7" stroke-width="0.9" opacity="0.6"><path d="M286,96 C292,104 296,112 302,118"/><path d="M322,98 C326,108 332,116 338,124"/><path d="M250,104 C256,110 262,118 266,126"/></g>

      <!-- 远处的松林 -->
      <g fill="#a7bfb6">
        <path d="M0,150 L0,138 L6,128 L12,138 L18,126 L25,138 L32,130 L38,140 L46,128 L54,140 L60,132 L66,142 L74,130 L82,142 L90,134 L96,144 L104,150 Z"/>
        <path d="M250,152 L256,140 L262,148 L270,134 L278,148 L286,138 L294,150 L302,136 L310,150 L318,140 L326,152 L334,138 L342,150 L350,142 L358,152 L366,136 L374,150 L382,142 L390,152 L400,140 L400,156 L250,156 Z"/>
      </g>

      <!-- 雪地 -->
      <path d="M-10,150 C40,144 100,148 150,152 C200,156 260,150 320,150 C360,150 390,152 410,150 L410,260 L-10,260 Z" fill="url(#snow)"/>
      <g fill="#dbe5ec" opacity="0.7">
        <path d="M-10,214 C40,206 80,212 120,222 C80,226 30,226 -10,224 Z"/>
        <path d="M250,232 C290,222 340,222 410,228 L410,240 C350,240 300,238 250,232 Z"/>
      </g>

      <!-- 小木屋：右侧山墙 -->
      <polygon points="244,206 244,150 266,120 288,146 288,200" fill="url(#logS)"/>
      <g stroke="#916a49" stroke-width="0.9" opacity="0.8">
        <line x1="244" y1="158" x2="288" y2="154"/><line x1="244" y1="166" x2="288" y2="162"/><line x1="244" y1="174" x2="288" y2="170"/><line x1="244" y1="182" x2="288" y2="178"/><line x1="244" y1="190" x2="288" y2="186"/><line x1="244" y1="198" x2="288" y2="194"/>
        <line x1="252" y1="142" x2="282" y2="139"/><line x1="258" y1="133" x2="276" y2="131"/>
      </g>
      <rect x="258" y="152" width="16" height="14" fill="url(#warm)" stroke="#e8ddd0" stroke-width="1.6" transform="skewY(-5) translate(0,24)"/>
      <!-- 正面墙 -->
      <rect x="120" y="150" width="124" height="58" fill="url(#log)"/>
      <g stroke="#9f7552" stroke-width="1" opacity="0.75">
        <line x1="120" y1="158" x2="244" y2="158"/><line x1="120" y1="166" x2="244" y2="166"/><line x1="120" y1="174" x2="244" y2="174"/><line x1="120" y1="182" x2="244" y2="182"/><line x1="120" y1="190" x2="244" y2="190"/><line x1="120" y1="198" x2="244" y2="198"/>
      </g>
      <g stroke="#dcb48a" stroke-width="0.8" opacity="0.6">
        <line x1="120" y1="152" x2="244" y2="152"/><line x1="120" y1="160" x2="244" y2="160"/><line x1="120" y1="168" x2="244" y2="168"/><line x1="120" y1="176" x2="244" y2="176"/><line x1="120" y1="184" x2="244" y2="184"/><line x1="120" y1="192" x2="244" y2="192"/><line x1="120" y1="200" x2="244" y2="200"/>
      </g>
      <!-- 木头的端头 -->
      <g fill="#d8b38a" stroke="#a27a56" stroke-width="0.7">
        <circle cx="119" cy="154" r="3.6"/><circle cx="119" cy="162" r="3.6"/><circle cx="119" cy="170" r="3.6"/><circle cx="119" cy="178" r="3.6"/><circle cx="119" cy="186" r="3.6"/><circle cx="119" cy="194" r="3.6"/>
        <circle cx="245" cy="154" r="3.6"/><circle cx="245" cy="162" r="3.6"/><circle cx="245" cy="170" r="3.6"/><circle cx="245" cy="178" r="3.6"/><circle cx="245" cy="186" r="3.6"/><circle cx="245" cy="194" r="3.6"/>
      </g>
      <g fill="#c9a079"><circle cx="119" cy="154" r="1.4"/><circle cx="119" cy="162" r="1.4"/><circle cx="119" cy="170" r="1.4"/><circle cx="119" cy="178" r="1.4"/><circle cx="119" cy="186" r="1.4"/><circle cx="119" cy="194" r="1.4"/><circle cx="245" cy="154" r="1.4"/><circle cx="245" cy="162" r="1.4"/><circle cx="245" cy="170" r="1.4"/><circle cx="245" cy="178" r="1.4"/><circle cx="245" cy="186" r="1.4"/><circle cx="245" cy="194" r="1.4"/></g>
      <!-- 窗：暖光 -->
      <rect x="136" y="160" width="30" height="24" fill="url(#warm)"/>
      <path d="M151,160 L151,184 M136,172 L166,172" stroke="#8f6a4c" stroke-width="1.8"/>
      <rect x="136" y="160" width="30" height="24" fill="none" stroke="#8f6a4c" stroke-width="2.4"/>
      <path d="M132,185 L170,185 L170,189 L132,189 Z" fill="#a27a56"/>
      <path d="M131,185 C136,181 146,182 152,183 C160,181 166,182 171,185 Z" fill="#fbfdfd"/>
      <!-- 门 -->
      <rect x="186" y="164" width="24" height="44" fill="#956a49"/>
      <rect x="189" y="167" width="18" height="41" fill="#a77b56"/>
      <g stroke="#8b6243" stroke-width="0.9"><line x1="195" y1="167" x2="195" y2="208"/><line x1="201" y1="167" x2="201" y2="208"/></g>
      <rect x="192" y="171" width="12" height="9" fill="url(#warm)" opacity="0.9"/>
      <circle cx="204" cy="190" r="1.3" fill="#e0c17c"/>
      <!-- 门边的滑雪板和雪杖 -->
      <g>
        <path d="M216,208 L219,154 C219,150 221,147 224,147.6 C225.4,148 225,150 223.4,151 L222.6,156 L220.6,208 Z" fill="url(#ski)"/>
        <path d="M222,208 L226,156 C226.4,152 228.6,149.4 231.6,150.4 C232.8,151 232,153 230.4,153.8 L229.4,158 L226.4,208 Z" fill="url(#ski)"/>
        <g stroke="#f6e1d2" stroke-width="0.8"><line x1="218.6" y1="200" x2="221.4" y2="160"/><line x1="224.6" y1="200" x2="228" y2="162"/></g>
        <rect x="215.6" y="186" width="6" height="2.4" fill="#5f7c8c" transform="rotate(3 218 187)"/><rect x="221.6" y="186" width="6" height="2.4" fill="#5f7c8c" transform="rotate(4 224 187)"/>
        <g stroke="#8e969c" stroke-width="1.1" stroke-linecap="round"><line x1="234" y1="208" x2="238" y2="160"/><line x1="238" y1="208" x2="241" y2="162"/></g>
        <g fill="#5f7c8c"><rect x="236.6" y="156" width="2.8" height="7" rx="1.2" transform="rotate(5 238 160)"/><rect x="239.6" y="158" width="2.8" height="7" rx="1.2" transform="rotate(4 241 162)"/></g>
        <g fill="none" stroke="#8e969c" stroke-width="0.8"><ellipse cx="234.4" cy="203" rx="2.6" ry="1"/><ellipse cx="238.3" cy="203" rx="2.6" ry="1"/></g>
      </g>
      <!-- 墙脚的积雪 -->
      <path d="M112,210 C116,202 126,200 136,204 C146,200 156,202 166,206 C176,202 184,206 186,208 L210,208 C214,204 224,204 232,206 C240,200 252,198 262,202 C272,196 284,196 294,202 L296,212 L112,214 Z" fill="#f8fafa"/>

      <!-- 屋顶和厚厚的积雪 -->
      <polygon points="110,154 254,154 270,118 128,118" fill="#a2785a"/>
      <path d="M126,118 L268,118 L272,112 C262,106 244,108 232,106 C210,103 186,107 164,104 C148,102 134,106 124,110 Z" fill="url(#roofsnow)"/>
      <path d="M128,118 L270,118 L254,154 L110,154 Z" fill="url(#roofsnow)"/>
      <path d="M266,116 L288,146 L292,150 C294,146 290,138 284,132 C278,124 272,116 266,112 Z" fill="#f4f7f9"/>
      <path d="M244,150 L266,118 L270,120 L248,152 Z" fill="#d8e2ea"/>
      <!-- 屋檐的雪檐和冰柱 -->
      <path d="M104,152 C104,148 110,148 118,150 C140,149 170,150 200,149 C226,148 246,149 256,150 C262,150 264,154 260,158 C246,160 226,158 200,159 C170,160 140,158 118,159 C108,160 102,157 104,152 Z" fill="#fbfdfd"/>
      <path d="M104,155 C106,158 112,160 118,159 C140,158 170,160 200,159 C226,158 246,160 260,158" fill="none" stroke="#d3dee7" stroke-width="1.2"/>
      <g fill="#e8f0f5">
        <path d="M126,159 L128,166 L130,159 Z"/><path d="M146,159 L147.4,164 L149,159 Z"/><path d="M174,159.6 L176,168 L178,159.6 Z"/><path d="M212,159 L213.6,165 L215,159 Z"/><path d="M236,159 L238,167 L240,159 Z"/><path d="M252,158.6 L253.4,163 L255,158.6 Z"/>
      </g>
      <g fill="#dfe8ef" opacity="0.8"><path d="M138,124 C160,122 190,126 220,123 C240,121 256,124 262,126 L258,134 C240,132 220,136 196,133 C170,130 150,134 134,132 Z"/></g>
      <!-- 烟囱和炊烟 -->
      <rect x="222" y="94" width="13" height="22" fill="#b5866a"/>
      <g stroke="#9e7258" stroke-width="0.6"><line x1="222" y1="100" x2="235" y2="100"/><line x1="222" y1="106" x2="235" y2="106"/><line x1="222" y1="112" x2="235" y2="112"/><line x1="228" y1="94" x2="228" y2="100"/><line x1="226" y1="100" x2="226" y2="106"/><line x1="231" y1="106" x2="231" y2="112"/></g>
      <path d="M219,95 C219,90 224,89 228.5,90 C233,89 238,90 238,95 Z" fill="#fbfdfd"/>
      <g filter="url(#soft2)" fill="#dde2e6" opacity="0.85">
        <ellipse cx="229" cy="84" rx="4" ry="4.4"/><ellipse cx="226" cy="75" rx="5" ry="5"/><ellipse cx="230" cy="65" rx="6" ry="5.4"/>
        <ellipse cx="237" cy="55" rx="6.6" ry="5.4"/><ellipse cx="247" cy="47" rx="7.4" ry="5.4"/><ellipse cx="260" cy="41" rx="8" ry="5"/>
      </g>

      <!-- 小屋前的脚印小路 -->
      <g fill="#d4dfe8" opacity="0.9">
        <ellipse cx="200" cy="214" rx="2.6" ry="1.2"/><ellipse cx="194" cy="220" rx="2.8" ry="1.3"/><ellipse cx="202" cy="226" rx="3" ry="1.4"/><ellipse cx="194" cy="233" rx="3.2" ry="1.5"/>
        <ellipse cx="203" cy="240" rx="3.4" ry="1.6"/><ellipse cx="194" cy="248" rx="3.6" ry="1.7"/>
      </g>

      <!-- 左边的松树 -->
      <use href="#pine" transform="translate(84,196) scale(1.05)"/>
      <use href="#pine" transform="translate(30,212) scale(1.45)"/>
      <use href="#pine" transform="translate(62,228) scale(0.85)"/>
      <!-- 右边的松树 -->
      <use href="#pine" transform="translate(320,204) scale(1.25)"/>
      <use href="#pine" transform="translate(364,222) scale(1.6)"/>
      <use href="#pine" transform="translate(296,224) scale(0.8)"/>
      <!-- 树下的雪堆 -->
      <g fill="#f8fafa">
        <ellipse cx="30" cy="214" rx="26" ry="5"/><ellipse cx="84" cy="198" rx="18" ry="4"/><ellipse cx="62" cy="229" rx="14" ry="3.4"/>
        <ellipse cx="320" cy="206" rx="22" ry="4.4"/><ellipse cx="364" cy="224" rx="30" ry="5.4"/><ellipse cx="296" cy="225" rx="13" ry="3.2"/>
      </g>

      <!-- 飘落的雪花 -->
      <g fill="#ffffff" opacity="0.9">
        <circle cx="262" cy="88" r="1.3"/><circle cx="290" cy="108" r="1.1"/><circle cx="330" cy="96" r="1.4"/><circle cx="372" cy="118" r="1.2"/><circle cx="350" cy="70" r="1.1"/><circle cx="388" cy="84" r="1.3"/>
        <circle cx="40" cy="104" r="1.2"/><circle cx="74" cy="122" r="1.3"/><circle cx="20" cy="140" r="1.1"/><circle cx="110" cy="96" r="1.1"/><circle cx="150" cy="84" r="1.2"/><circle cx="176" cy="98" r="1"/>
        <circle cx="300" cy="170" r="1.2"/><circle cx="104" cy="176" r="1.2"/><circle cx="380" cy="160" r="1.1"/><circle cx="16" cy="170" r="1.2"/>
      </g>
    </g>

    <!-- 地面阴影 -->
    <g filter="url(#soft2)" opacity="0.18" fill="#6c7f94">
      <ellipse cx="204" cy="212" rx="96" ry="3.6"/><ellipse cx="34" cy="216" rx="24" ry="2.6"/><ellipse cx="366" cy="227" rx="28" ry="2.6"/><ellipse cx="322" cy="208" rx="18" ry="2.2"/>
    </g>
    <!-- 纸纹 -->
    <rect width="400" height="260" filter="url(#grain)"/>
  </g>
</svg>
