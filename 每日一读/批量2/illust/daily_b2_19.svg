<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 260" width="400" height="260">
  <!-- 原创插图：修理工作台，拆开的台灯、螺丝刀和钳子、旧收音机、一卷电线，墙上的工具板（水彩风格，纯 SVG 手绘，无外部素材） -->
  <defs>
    <filter id="wc" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="0.35"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="g"/>
      <feColorMatrix in="g" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.38  0 0 0 0 0.3  0 0 0 0.09 0"/>
    </filter>
    <filter id="edge" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="5"/></filter>
    <mask id="fade" maskUnits="userSpaceOnUse" x="0" y="0" width="400" height="260">
      <rect x="7" y="7" width="386" height="246" rx="4" fill="#fff" filter="url(#edge)"/>
    </mask>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf3e6"/><stop offset="0.6" stop-color="#f8e9d6"/><stop offset="1" stop-color="#f4dfc8"/>
    </linearGradient>
    <linearGradient id="peg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ecd5b3"/><stop offset="1" stop-color="#e3c9a3"/>
    </linearGradient>
    <linearGradient id="bench" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dcb58a"/><stop offset="1" stop-color="#cfa679"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6cfb0"/><stop offset="1" stop-color="#dcc19e"/>
    </linearGradient>
    <linearGradient id="radio" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b98761"/><stop offset="0.5" stop-color="#c99872"/><stop offset="1" stop-color="#ab7b57"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9fc8c2"/><stop offset="1" stop-color="#7fb0aa"/>
    </linearGradient>
    <linearGradient id="copper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3a472"/><stop offset="0.5" stop-color="#d48c5a"/><stop offset="1" stop-color="#c27a4c"/>
    </linearGradient>
    <radialGradient id="bulb" cx="0.4" cy="0.35" r="0.65">
      <stop offset="0" stop-color="#fffbea"/><stop offset="1" stop-color="#f3e2a8"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6dc" stop-opacity="0.8"/><stop offset="1" stop-color="#fff6dc" stop-opacity="0"/>
    </radialGradient>
    <!-- 洞洞板上的一行孔 -->
    <g id="holes" fill="#d0b08a"><circle cx="0" cy="0" r="0.9"/><circle cx="10" cy="0" r="0.9"/><circle cx="20" cy="0" r="0.9"/><circle cx="30" cy="0" r="0.9"/><circle cx="40" cy="0" r="0.9"/><circle cx="50" cy="0" r="0.9"/><circle cx="60" cy="0" r="0.9"/><circle cx="70" cy="0" r="0.9"/><circle cx="80" cy="0" r="0.9"/><circle cx="90" cy="0" r="0.9"/></g>
    <g id="screw"><circle r="1.6" fill="#b5b9b8"/><line x1="-1" y1="0" x2="1" y2="0" stroke="#8b908f" stroke-width="0.5"/></g>
  </defs>

  <g mask="url(#fade)">
    <!-- 墙面和地板 -->
    <rect width="400" height="260" fill="url(#wall)"/>
    <rect x="0" y="220" width="400" height="40" fill="url(#floor)"/>
    <rect x="0" y="217" width="400" height="4" fill="#e7cfb0"/>

    <circle cx="300" cy="100" r="80" fill="url(#glow)"/>

    <g filter="url(#wc)">
      <!-- 洞洞板 -->
      <rect x="176" y="54" width="206" height="98" rx="2" fill="url(#peg)"/>
      <rect x="176" y="54" width="206" height="98" rx="2" fill="none" stroke="#d6b88f" stroke-width="2"/>
      <g opacity="0.8">
        <use href="#holes" transform="translate(186,62)"/><use href="#holes" transform="translate(286,62)"/>
        <use href="#holes" transform="translate(186,72)"/><use href="#holes" transform="translate(286,72)"/>
        <use href="#holes" transform="translate(186,82)"/><use href="#holes" transform="translate(286,82)"/>
        <use href="#holes" transform="translate(186,92)"/><use href="#holes" transform="translate(286,92)"/>
        <use href="#holes" transform="translate(186,102)"/><use href="#holes" transform="translate(286,102)"/>
        <use href="#holes" transform="translate(186,112)"/><use href="#holes" transform="translate(286,112)"/>
        <use href="#holes" transform="translate(186,122)"/><use href="#holes" transform="translate(286,122)"/>
        <use href="#holes" transform="translate(186,132)"/><use href="#holes" transform="translate(286,132)"/>
        <use href="#holes" transform="translate(186,142)"/><use href="#holes" transform="translate(286,142)"/>
      </g>
      <!-- 挂着的工具 -->
      <!-- 锤子 -->
      <rect x="194" y="74" width="4" height="40" rx="1.5" fill="#c69a6c"/>
      <path d="M186,66 L206,66 C208,66 208,74 206,74 L186,74 C184,74 184,70 186,66 Z" fill="#9aa1a3"/>
      <!-- 扳手 -->
      <path d="M220,68 C214,68 212,76 216,79 L218,80 L218,118 C218,121 224,121 224,118 L224,80 L226,79 C230,76 228,68 222,68 L222,74 L220,74 Z" fill="#b4babb"/>
      <!-- 手锯 -->
      <path d="M240,66 L258,66 C262,66 262,80 258,80 L254,80 L254,72 L244,72 L244,80 L240,80 C236,80 236,66 240,66 Z" fill="#d9846b"/>
      <path d="M244,80 L254,80 L254,134 L244,128 Z" fill="#c9cfd0"/>
      <g stroke="#aab1b3" stroke-width="0.6"><line x1="244" y1="88" x2="246" y2="88"/><line x1="244" y1="96" x2="246" y2="96"/><line x1="244" y1="104" x2="246" y2="104"/><line x1="244" y1="112" x2="246" y2="112"/><line x1="244" y1="120" x2="246" y2="120"/></g>
      <!-- 卷尺 -->
      <rect x="270" y="70" width="20" height="18" rx="5" fill="#f0c95c"/><circle cx="280" cy="79" r="4" fill="#e3b448"/><rect x="288" y="84" width="6" height="3" fill="#c9cfd0"/>
      <!-- 剪刀 -->
      <g fill="none" stroke="#8fc0bb" stroke-width="2.4"><circle cx="302" cy="74" r="4"/><circle cx="312" cy="74" r="4"/></g>
      <path d="M304,78 L310,104 L311,104 L308,78 Z M310,78 L304,104 L305,104 L314,78 Z" fill="#c4cacb"/>
      <!-- 一排小螺丝刀 -->
      <rect x="326" y="66" width="48" height="4" rx="1" fill="#c9a57c"/>
      <g><rect x="331" y="70" width="5" height="12" rx="2" fill="#d9846b"/><rect x="341" y="70" width="5" height="12" rx="2" fill="#8fc0bb"/><rect x="351" y="70" width="5" height="12" rx="2" fill="#f0c95c"/><rect x="361" y="70" width="5" height="12" rx="2" fill="#9db4c6"/></g>
      <g fill="#c4cacb"><rect x="333" y="82" width="1.2" height="12"/><rect x="343" y="82" width="1.2" height="14"/><rect x="353" y="82" width="1.2" height="11"/><rect x="363" y="82" width="1.2" height="13"/></g>
      <!-- 挂钩上的一圈胶带和线 -->
      <circle cx="350" cy="122" r="9" fill="#efe4cf"/><circle cx="350" cy="122" r="4.4" fill="url(#peg)"/>

      <!-- 左墙上的小搁板和螺丝罐 -->
      <rect x="20" y="84" width="66" height="4" rx="1" fill="#d6b48c"/>
      <path d="M28,88 L33,96 M78,88 L73,96" stroke="#c9a57c" stroke-width="1.6"/>
      <g>
        <rect x="26" y="70" width="12" height="14" rx="2" fill="#e8eef0" opacity="0.9"/><rect x="25" y="67" width="14" height="4" rx="1" fill="#c9a66e"/>
        <rect x="44" y="72" width="12" height="12" rx="2" fill="#e8eef0" opacity="0.9"/><rect x="43" y="69" width="14" height="4" rx="1" fill="#9db4c6"/>
        <rect x="62" y="70" width="12" height="14" rx="2" fill="#e8eef0" opacity="0.9"/><rect x="61" y="67" width="14" height="4" rx="1" fill="#d9846b"/>
      </g>
      <g fill="#b5b9b8"><circle cx="30" cy="78" r="1"/><circle cx="33" cy="81" r="1"/><circle cx="49" cy="79" r="1"/><circle cx="52" cy="81" r="1"/><circle cx="66" cy="78" r="1"/><circle cx="70" cy="80" r="1"/></g>

      <!-- 工作台 -->
      <path d="M10,160 L396,160 L400,176 L4,176 Z" fill="url(#bench)"/>
      <rect x="4" y="176" width="396" height="8" fill="#bf946a"/>
      <g stroke="#c49b70" stroke-width="0.8" opacity="0.7"><line x1="10" y1="166" x2="398" y2="166"/><line x1="8" y1="171" x2="399" y2="171"/></g>
      <rect x="20" y="184" width="8" height="40" fill="#a98058"/><rect x="372" y="184" width="8" height="40" fill="#a98058"/>
      <rect x="20" y="206" width="360" height="4" fill="#b88d62" opacity="0.8"/>
      <!-- 台下的工具箱 -->
      <rect x="290" y="190" width="56" height="18" rx="2" fill="#d9775e"/>
      <rect x="290" y="194" width="56" height="2" fill="#b65a47"/>
      <path d="M308,190 L308,186 L328,186 L328,190" stroke="#8c7a6a" stroke-width="1.8" fill="none"/>

      <!-- 拆开的台灯：底座和灯臂 -->
      <ellipse cx="72" cy="168" rx="18" ry="4.6" fill="#7fb0aa"/>
      <path d="M54,168 C54,163 90,163 90,168 L90,170 C90,175 54,175 54,170 Z" fill="#8fc0bb"/>
      <circle cx="72" cy="163" r="3" fill="#c4cacb"/>
      <path d="M71,162 L60,124" stroke="#a9b1b2" stroke-width="3.2" stroke-linecap="round"/>
      <circle cx="60" cy="124" r="3.2" fill="#c4cacb"/>
      <path d="M60,124 L84,108" stroke="#a9b1b2" stroke-width="2.8" stroke-linecap="round"/>
      <circle cx="84" cy="108" r="2.6" fill="#c4cacb"/>
      <!-- 从灯臂里露出的电线 -->
      <path d="M84,108 C92,112 90,120 98,124 C104,127 104,134 100,140" stroke="#d48c5a" stroke-width="1" fill="none"/>
      <path d="M84,108 C94,108 98,116 106,118" stroke="#9db4c6" stroke-width="1" fill="none"/>
      <!-- 取下来的灯罩，侧放在台面上 -->
      <path d="M100,148 L132,140 L140,168 L106,170 Z" fill="url(#shade)"/>
      <ellipse cx="136" cy="154" rx="5" ry="14.4" transform="rotate(-14 136 154)" fill="#6c9d97"/>
      <ellipse cx="136" cy="154" rx="3.6" ry="12" transform="rotate(-14 136 154)" fill="#e4efe9"/>
      <ellipse cx="103" cy="159" rx="2.4" ry="5.6" transform="rotate(-14 103 159)" fill="#8fc0bb"/>
      <!-- 灯泡 -->
      <circle cx="160" cy="163" r="6" fill="url(#bulb)"/>
      <rect x="164.4" y="160" width="6" height="6" rx="1" fill="#c4cacb"/>
      <g stroke="#a9b1b2" stroke-width="0.6"><line x1="166" y1="160.4" x2="166" y2="165.6"/><line x1="168" y1="160.4" x2="168" y2="165.6"/></g>
      <!-- 散落的螺丝 -->
      <use href="#screw" transform="translate(96,172)"/><use href="#screw" transform="translate(150,173)"/><use href="#screw" transform="translate(178,169)"/><use href="#screw" transform="translate(42,173)"/>

      <!-- 螺丝刀 -->
      <g transform="translate(190,172) rotate(-14)">
        <rect x="0" y="-2.8" width="18" height="5.6" rx="2.6" fill="#8fc0bb"/>
        <rect x="2" y="-1" width="14" height="1.2" fill="#b3d8d2"/>
        <rect x="18" y="-0.8" width="20" height="1.6" fill="#c4cacb"/>
        <path d="M38,-0.8 L41,-0.4 L41,0.4 L38,0.8 Z" fill="#a9b1b2"/>
      </g>
      <!-- 钳子 -->
      <g transform="translate(232,170)">
        <path d="M0,0 C6,-2 14,-4 22,-3 L22,-1 C14,-1 6,1 0,3 Z" fill="#d9775e"/>
        <path d="M0,6 C6,5 14,4 22,1 L22,3 C14,6 6,8 0,9 Z" fill="#d9775e"/>
        <path d="M22,-3 L32,-1 L33,1 L22,3 Z" fill="#b4babb"/>
        <circle cx="23" cy="0" r="2" fill="#9aa1a3"/>
      </g>

      <!-- 旧收音机 -->
      <path d="M266,166 L266,126 C266,110 280,102 298,102 C316,102 330,110 330,126 L330,166 Z" fill="url(#radio)"/>
      <path d="M272,160 L272,128 C272,116 284,110 298,110 C312,110 324,116 324,128 L324,160 Z" fill="#e8d4b4"/>
      <g stroke="#d6c09c" stroke-width="0.9"><line x1="276" y1="122" x2="320" y2="122"/><line x1="274" y1="128" x2="322" y2="128"/><line x1="274" y1="134" x2="322" y2="134"/><line x1="274" y1="140" x2="322" y2="140"/></g>
      <rect x="276" y="146" width="44" height="8" rx="2" fill="#f3e6cc"/>
      <rect x="296" y="146" width="1.4" height="8" fill="#d9775e"/>
      <circle cx="282" cy="162" r="3.2" fill="#8c6a50"/><circle cx="314" cy="162" r="3.2" fill="#8c6a50"/>
      <rect x="264" y="164" width="68" height="4" rx="1" fill="#9a6e4c"/>

      <!-- 电线卷 -->
      <ellipse cx="362" cy="152" rx="5" ry="16" fill="#c9a57c"/>
      <rect x="350" y="140" width="12" height="24" fill="url(#copper)"/>
      <g stroke="#b86e42" stroke-width="0.6" opacity="0.8"><line x1="350" y1="144" x2="362" y2="144"/><line x1="350" y1="148" x2="362" y2="148"/><line x1="350" y1="152" x2="362" y2="152"/><line x1="350" y1="156" x2="362" y2="156"/><line x1="350" y1="160" x2="362" y2="160"/></g>
      <ellipse cx="350" cy="152" rx="5" ry="16" fill="#d9b58a"/>
      <ellipse cx="350" cy="152" rx="1.8" ry="5" fill="#b38b62"/>
      <path d="M356,164 C350,172 338,170 334,174" stroke="#d48c5a" stroke-width="1.2" fill="none"/>
    </g>

    <!-- 台面和地面阴影 -->
    <g filter="url(#soft2)" opacity="0.2" fill="#8a6a4a">
      <ellipse cx="200" cy="226" rx="186" ry="4"/>
      <ellipse cx="72" cy="174" rx="20" ry="2"/><ellipse cx="122" cy="172" rx="22" ry="2"/><ellipse cx="298" cy="170" rx="36" ry="2.4"/><ellipse cx="356" cy="170" rx="12" ry="2"/>
    </g>
    <!-- 纸纹 -->
    <rect width="400" height="260" filter="url(#grain)"/>
  </g>
</svg>
