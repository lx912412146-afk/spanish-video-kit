<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 260" width="400" height="260">
  <!-- 原创插图：学开车（空旷的停车场：一辆没有字和车标的小汽车、一排橙色路锥、远处的树；水彩风格，纯 SVG 手绘） -->
  <defs>
    <filter id="wc" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="0.35"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="g"/>
      <feColorMatrix in="g" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.38  0 0 0 0 0.3  0 0 0 0.09 0"/>
    </filter>
    <filter id="edge" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="5"/></filter>
    <mask id="fade" maskUnits="userSpaceOnUse" x="0" y="0" width="400" height="260">
      <rect x="7" y="7" width="386" height="246" rx="4" fill="#fff" filter="url(#edge)"/>
    </mask>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2edf1"/><stop offset="0.6" stop-color="#eff2eb"/><stop offset="1" stop-color="#f6f1e3"/>
    </linearGradient>
    <linearGradient id="asphalt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ddd7cd"/><stop offset="1" stop-color="#cec6ba"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8d2cc"/><stop offset="0.55" stop-color="#8fc0b9"/><stop offset="1" stop-color="#76a8a2"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f2f4"/><stop offset="1" stop-color="#bcd3dc"/>
    </linearGradient>
    <linearGradient id="coneg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e3874e"/><stop offset="0.45" stop-color="#f3a86e"/><stop offset="1" stop-color="#d97c45"/>
    </linearGradient>
    <g id="cone">
      <path d="M-2.2,-24 C-1,-25.5 1,-25.5 2.2,-24 L8,-3 L-8,-3 Z" fill="url(#coneg)"/>
      <path d="M-4.6,-15 L4.6,-15 L6,-10 L-6,-10 Z" fill="#f7efe2"/>
      <path d="M-11,-3 L11,-3 L12,1 L-12,1 Z" fill="#d97c45"/>
      <path d="M-10.5,-3 L10.5,-3" stroke="#f3b384" stroke-width="0.9"/>
    </g>
    <g id="wheel">
      <circle r="13" fill="#6b625a"/><circle r="7.5" fill="#d8d4cc"/><circle r="3" fill="#b9b3a9"/>
      <g stroke="#b9b3a9" stroke-width="1"><line x1="0" y1="-7" x2="0" y2="-3"/><line x1="6.6" y1="-2.2" x2="2.9" y2="-0.9"/><line x1="4.1" y1="5.7" x2="1.8" y2="2.4"/><line x1="-4.1" y1="5.7" x2="-1.8" y2="2.4"/><line x1="-6.6" y1="-2.2" x2="-2.9" y2="-0.9"/></g>
    </g>
  </defs>

  <g mask="url(#fade)">
    <!-- 天空 -->
    <rect width="400" height="260" fill="url(#sky)"/>
    <g filter="url(#soft2)" fill="#ffffff" opacity="0.85">
      <ellipse cx="300" cy="44" rx="22" ry="6"/><ellipse cx="316" cy="40" rx="13" ry="6"/><ellipse cx="360" cy="66" rx="14" ry="4"/>
    </g>

    <g filter="url(#wc)">
      <!-- 远处的树 -->
      <g>
        <path d="M30,140 C26,120 30,98 36,84 C42,98 46,120 42,140 Z" fill="#a3c08d"/>
        <path d="M52,140 C48,118 52,96 58,82 C64,96 68,118 64,140 Z" fill="#97b783"/>
        <circle cx="96" cy="122" r="20" fill="#b3cc9d"/><circle cx="122" cy="116" r="22" fill="#a8c493"/><circle cx="150" cy="124" r="17" fill="#b8d0a2"/>
        <circle cx="236" cy="120" r="19" fill="#b3cc9d"/><circle cx="262" cy="112" r="24" fill="#a3c08d"/><circle cx="292" cy="122" r="18" fill="#b8d0a2"/>
        <path d="M320,140 C316,118 320,94 326,80 C332,94 336,118 332,140 Z" fill="#97b783"/>
        <circle cx="360" cy="120" r="22" fill="#a8c493"/><circle cx="390" cy="126" r="18" fill="#b3cc9d"/>
        <circle cx="190" cy="128" r="14" fill="#bcd3a7"/>
      </g>
      <rect x="0" y="134" width="400" height="10" fill="#c9dbb2"/>
      <!-- 停车场 -->
      <rect x="0" y="142" width="400" height="118" fill="url(#asphalt)"/>
      <rect x="0" y="141" width="400" height="3" fill="#e9e3d8"/>
      <g stroke="#f6f2ea" stroke-width="1.6" opacity="0.9" stroke-linecap="round">
        <line x1="20" y1="146" x2="12" y2="164"/><line x1="58" y1="146" x2="52" y2="164"/><line x1="96" y1="146" x2="92" y2="164"/><line x1="134" y1="146" x2="132" y2="164"/>
        <line x1="172" y1="146" x2="172" y2="164"/><line x1="210" y1="146" x2="212" y2="164"/><line x1="248" y1="146" x2="252" y2="164"/><line x1="286" y1="146" x2="292" y2="164"/>
        <line x1="324" y1="146" x2="332" y2="164"/><line x1="362" y1="146" x2="372" y2="164"/>
        <line x1="0" y1="164.5" x2="400" y2="164.5"/>
      </g>
      <g stroke="#f6f2ea" stroke-width="2.4" opacity="0.85" stroke-linecap="round">
        <line x1="10" y1="246" x2="60" y2="244"/><line x1="90" y1="243" x2="140" y2="241.5"/><line x1="170" y1="240.5" x2="220" y2="239.5"/>
        <line x1="250" y1="239" x2="300" y2="238.5"/><line x1="330" y1="238" x2="380" y2="237.5"/>
      </g>
      <g fill="#c4bcaf" opacity="0.6"><ellipse cx="60" cy="200" rx="10" ry="1.6"/><ellipse cx="330" cy="178" rx="12" ry="1.6"/><ellipse cx="240" cy="226" rx="8" ry="1.4"/></g>
      <!-- 路灯 -->
      <line x1="366" y1="88" x2="366" y2="150" stroke="#9aa5ae" stroke-width="2.4"/>
      <path d="M366,90 C366,84 372,82 378,84" stroke="#9aa5ae" stroke-width="2" fill="none"/>
      <path d="M374,84 L386,84 L384,89 L376,89 Z" fill="#a9b3bb"/>

      <!-- 小汽车（车头朝右） -->
      <g transform="translate(400,0) scale(-1,1)">
        <path d="M186,212 L186,192 C186,186 190,182 198,180 L228,175 C238,162 248,154 260,152 L298,152 C307,152 313,158 317,167 L322,180 C327,183 329,190 329,198 L329,212 Z" fill="url(#body)"/>
        <path d="M232,174 C241,163 250,157.5 260,157 L277,157 L277,175 Z" fill="url(#glass)"/>
        <path d="M281,157 L296,157 C303,157 307,162 310,169 L312,175 L281,175 Z" fill="url(#glass)"/>
        <path d="M240,170 L252,160" stroke="#fff" stroke-width="1.4" opacity="0.6" stroke-linecap="round"/>
        <path d="M286,170 L294,160" stroke="#fff" stroke-width="1.2" opacity="0.5" stroke-linecap="round"/>
        <line x1="279" y1="156" x2="279" y2="207" stroke="#6f9f99" stroke-width="1"/>
        <path d="M232,176 L232,207" stroke="#6f9f99" stroke-width="0.9" opacity="0.8"/>
        <rect x="263" y="182" width="9" height="2.4" rx="1.2" fill="#d8ece8"/><rect x="291" y="182" width="9" height="2.4" rx="1.2" fill="#d8ece8"/>
        <path d="M229,175 L236,170 L238,176 Z" fill="#7fb0aa"/>
        <path d="M200,182 L322,182" stroke="#bfe0da" stroke-width="1.3" opacity="0.7"/>
        <ellipse cx="193" cy="187" rx="5" ry="3.2" fill="#fbf0c8"/>
        <rect x="322" y="182" width="5" height="8" rx="1.5" fill="#e07a66"/>
        <rect x="185" y="200" width="20" height="6" rx="2.5" fill="#e9eeeb"/><rect x="314" y="200" width="16" height="6" rx="2.5" fill="#e9eeeb"/>
        <path d="M197,212 C197,200 227,200 227,212 Z" fill="#5f8f8a" opacity="0.55"/>
        <path d="M285,212 C285,200 315,200 315,212 Z" fill="#5f8f8a" opacity="0.55"/>
        <use href="#wheel" transform="translate(212,212)"/>
        <use href="#wheel" transform="translate(300,212)"/>
      </g>

      <!-- 路锥：一排绕桩练习 -->
      <use href="#cone" transform="translate(222,164) scale(0.62)"/>
      <use href="#cone" transform="translate(240,177) scale(0.75)"/>
      <use href="#cone" transform="translate(264,194) scale(0.9)"/>
      <use href="#cone" transform="translate(298,216) scale(1.05)"/>
      <use href="#cone" transform="translate(344,244) scale(1.25)"/>
    </g>

    <!-- 地面阴影 -->
    <g filter="url(#soft2)" opacity="0.22" fill="#6f665a">
      <ellipse cx="146" cy="225" rx="74" ry="5"/>
      <ellipse cx="225" cy="165" rx="8" ry="1.5"/><ellipse cx="244" cy="178" rx="9" ry="1.8"/><ellipse cx="268" cy="195.5" rx="11" ry="2"/>
      <ellipse cx="303" cy="217.5" rx="13" ry="2.2"/><ellipse cx="350" cy="246" rx="16" ry="2.6"/>
    </g>
    <!-- 纸纹 -->
    <rect width="400" height="260" filter="url(#grain)"/>
  </g>
</svg>
