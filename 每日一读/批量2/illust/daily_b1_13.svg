<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 260" width="400" height="260">
  <!-- 原创插图：跨年夜（餐桌上的两碗葡萄、香槟杯、一瓶起泡酒、蜡烛，墙上的钟快到十二点，右边窗外夜空里的烟花；左上保持明亮；水彩风格，纯 SVG 手绘） -->
  <defs>
    <filter id="wc" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="0.35"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="g"/>
      <feColorMatrix in="g" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.38  0 0 0 0 0.3  0 0 0 0.09 0"/>
    </filter>
    <filter id="edge" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="5"/></filter>
    <mask id="fade" maskUnits="userSpaceOnUse" x="0" y="0" width="400" height="260">
      <rect x="7" y="7" width="386" height="246" rx="4" fill="#fff" filter="url(#edge)"/>
    </mask>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf3e6"/><stop offset="0.6" stop-color="#f8e9d6"/><stop offset="1" stop-color="#f4dfc8"/>
    </linearGradient>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#55668f"/><stop offset="0.6" stop-color="#7479a0"/><stop offset="1" stop-color="#ad98ae"/>
    </linearGradient>
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dcbb94"/><stop offset="1" stop-color="#d2ad85"/>
    </linearGradient>
    <linearGradient id="candle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eadbc0"/><stop offset="0.45" stop-color="#fbf5ea"/><stop offset="1" stop-color="#e2d0b2"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c99f5c"/><stop offset="0.45" stop-color="#ead08f"/><stop offset="1" stop-color="#bf9452"/>
    </linearGradient>
    <linearGradient id="bowl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e3e3dc"/><stop offset="0.45" stop-color="#fbfaf5"/><stop offset="1" stop-color="#d8d8d0"/>
    </linearGradient>
    <linearGradient id="bubbly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8e6b0"/><stop offset="1" stop-color="#ebc77a"/>
    </linearGradient>
    <linearGradient id="bottle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#557562"/><stop offset="0.4" stop-color="#83a38b"/><stop offset="1" stop-color="#4f6d5a"/>
    </linearGradient>
    <radialGradient id="grape" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#eef3c4"/><stop offset="0.6" stop-color="#cbdc8a"/><stop offset="1" stop-color="#a7c066"/>
    </radialGradient>
    <g id="gbowl">
      <path d="M-20,0 C-20,14 -10,20 0,20 C10,20 20,14 20,0 Z" fill="url(#bowl)"/>
      <path d="M-18,7 C-12,9 12,9 18,7" stroke="#9fb7c6" stroke-width="1.4" fill="none"/>
      <ellipse cx="0" cy="0" rx="20" ry="4.2" fill="#f4f1ea"/>
      <g fill="url(#grape)">
        <circle cx="-7.5" cy="-13" r="4.3"/><circle cx="0" cy="-14" r="4.3"/><circle cx="7.5" cy="-13" r="4.3"/>
        <circle cx="-11" cy="-7" r="4.3"/><circle cx="-3.7" cy="-7.5" r="4.3"/><circle cx="3.7" cy="-7.5" r="4.3"/><circle cx="11" cy="-7" r="4.3"/>
        <circle cx="-15" cy="-1.5" r="4.3"/><circle cx="-7.5" cy="-1" r="4.3"/><circle cx="0" cy="-1" r="4.3"/><circle cx="7.5" cy="-1" r="4.3"/><circle cx="15" cy="-1.5" r="4.3"/>
      </g>
      <g fill="#fff" opacity="0.6">
        <circle cx="-9" cy="-14.5" r="1"/><circle cx="-1.5" cy="-15.5" r="1"/><circle cx="6" cy="-14.5" r="1"/><circle cx="-12.5" cy="-8.5" r="1"/><circle cx="2.2" cy="-9" r="1"/><circle cx="9.5" cy="-8.5" r="1"/><circle cx="-9" cy="-2.5" r="1"/><circle cx="6" cy="-2.5" r="1"/>
      </g>
      <path d="M0,-18 C1,-21 3,-22 5,-22" stroke="#9c7a52" stroke-width="1" fill="none"/>
    </g>
    <g id="flute">
      <ellipse cx="0" cy="0" rx="9" ry="2.2" fill="#e9e4da"/>
      <line x1="0" y1="-1" x2="0" y2="-23" stroke="#e3ddd1" stroke-width="1.8"/>
      <path d="M-7,-60 L7,-60 C7.5,-44 6,-30 0,-23 C-6,-30 -7.5,-44 -7,-60 Z" fill="#f2f1ec" opacity="0.6" stroke="#d6d0c4" stroke-width="0.8"/>
      <path d="M-6.6,-50 L6.6,-50 C7,-40 5.6,-30 0,-24.5 C-5.6,-30 -7,-40 -6.6,-50 Z" fill="url(#bubbly)"/>
      <ellipse cx="0" cy="-50" rx="6.6" ry="1.2" fill="#fbefc8"/>
      <g fill="#fff" opacity="0.8"><circle cx="-1.5" cy="-33" r="0.6"/><circle cx="1" cy="-38" r="0.55"/><circle cx="-1" cy="-43" r="0.6"/><circle cx="1.8" cy="-46" r="0.5"/><circle cx="0.4" cy="-29" r="0.5"/></g>
      <path d="M-5.2,-57 C-5.4,-46 -4.6,-36 -2,-29" stroke="#fff" stroke-width="0.9" fill="none" opacity="0.7"/>
    </g>
  </defs>

  <g mask="url(#fade)">
    <!-- 墙面 -->
    <rect width="400" height="260" fill="url(#wall)"/>

    <g filter="url(#wc)">
      <!-- 窗外夜空 -->
      <rect x="246" y="26" width="128" height="122" fill="url(#night)"/>
      <g filter="url(#soft)" opacity="0.35">
        <circle cx="300" cy="62" r="24" fill="#f7d68e"/><circle cx="350" cy="96" r="16" fill="#f4aaa2"/><circle cx="272" cy="104" r="12" fill="#b6e2d8"/>
      </g>
      <!-- 烟花 -->
      <path d="M308.4,62.0 L320.2,62.0 M307.7,65.2 L318.7,69.7 M305.9,67.9 L314.3,76.3 M303.2,69.7 L307.7,80.7 M300.0,70.4 L300.0,82.2 M296.8,69.7 L292.3,80.7 M294.1,67.9 L285.7,76.3 M292.3,65.2 L281.3,69.7 M291.6,62.0 L279.8,62.0 M292.3,58.8 L281.3,54.3 M294.1,56.1 L285.7,47.7 M296.8,54.3 L292.3,43.3 M300.0,53.6 L300.0,41.8 M303.2,54.3 L307.7,43.3 M305.9,56.1 L314.3,47.7 M307.7,58.8 L318.7,54.3" stroke="#f7d68e" stroke-width="1.3" stroke-linecap="round" fill="none"/>
      <g fill="#f7d68e"><circle cx="323.8" cy="62.0" r="1.2"/><circle cx="322.0" cy="71.1" r="1.2"/><circle cx="316.8" cy="78.8" r="1.2"/><circle cx="309.1" cy="84.0" r="1.2"/><circle cx="300.0" cy="85.8" r="1.2"/><circle cx="290.9" cy="84.0" r="1.2"/><circle cx="283.2" cy="78.8" r="1.2"/><circle cx="278.0" cy="71.1" r="1.2"/><circle cx="276.2" cy="62.0" r="1.2"/><circle cx="278.0" cy="52.9" r="1.2"/><circle cx="283.2" cy="45.2" r="1.2"/><circle cx="290.9" cy="40.0" r="1.2"/><circle cx="300.0" cy="38.2" r="1.2"/><circle cx="309.1" cy="40.0" r="1.2"/><circle cx="316.8" cy="45.2" r="1.2"/><circle cx="322.0" cy="52.9" r="1.2"/></g>
      <circle cx="300" cy="62" r="2.2" fill="#fbe8b8"/>
      <path d="M355.5,97.5 L363.3,99.6 M354.0,100.0 L359.8,105.8 M351.5,101.5 L353.6,109.3 M348.5,101.5 L346.4,109.3 M346.0,100.0 L340.2,105.8 M344.5,97.5 L336.7,99.6 M344.5,94.5 L336.7,92.4 M346.0,92.0 L340.2,86.2 M348.5,90.5 L346.4,82.7 M351.5,90.5 L353.6,82.7 M354.0,92.0 L359.8,86.2 M355.5,94.5 L363.3,92.4" stroke="#f4aaa2" stroke-width="1.1" stroke-linecap="round" fill="none"/>
      <g fill="#f4aaa2"><circle cx="365.6" cy="100.2" r="1.0"/><circle cx="361.5" cy="107.5" r="1.0"/><circle cx="354.2" cy="111.6" r="1.0"/><circle cx="345.8" cy="111.6" r="1.0"/><circle cx="338.5" cy="107.5" r="1.0"/><circle cx="334.4" cy="100.2" r="1.0"/><circle cx="334.4" cy="91.8" r="1.0"/><circle cx="338.5" cy="84.5" r="1.0"/><circle cx="345.8" cy="80.4" r="1.0"/><circle cx="354.2" cy="80.4" r="1.0"/><circle cx="361.5" cy="84.5" r="1.0"/><circle cx="365.6" cy="91.8" r="1.0"/></g>
      <path d="M276.1,104.7 L282.0,105.6 M275.0,107.0 L279.2,111.2 M272.7,108.1 L273.6,114.0 M270.1,107.7 L267.4,113.0 M268.3,105.9 L263.0,108.6 M267.9,103.3 L262.0,102.4 M269.0,101.0 L264.8,96.8 M271.3,99.9 L270.4,94.0 M273.9,100.3 L276.6,95.0 M275.7,102.1 L281.0,99.4" stroke="#b6e2d8" stroke-width="1.0" stroke-linecap="round" fill="none"/>
      <g fill="#b6e2d8"><circle cx="283.7" cy="105.9" r="0.9"/><circle cx="280.4" cy="112.4" r="0.9"/><circle cx="273.9" cy="115.7" r="0.9"/><circle cx="266.6" cy="114.6" r="0.9"/><circle cx="261.4" cy="109.4" r="0.9"/><circle cx="260.3" cy="102.1" r="0.9"/><circle cx="263.6" cy="95.6" r="0.9"/><circle cx="270.1" cy="92.3" r="0.9"/><circle cx="277.4" cy="93.4" r="0.9"/><circle cx="282.6" cy="98.6" r="0.9"/></g>
      <g fill="#f3e3c0" opacity="0.8"><circle cx="262" cy="44" r="0.8"/><circle cx="340" cy="40" r="0.8"/><circle cx="364" cy="58" r="0.7"/><circle cx="326" cy="118" r="0.7"/><circle cx="254" cy="72" r="0.7"/></g>
      <!-- 远处屋顶 -->
      <path d="M246,148 L246,128 L262,128 L262,120 L280,120 L280,132 L298,132 L298,124 L312,116 L326,124 L326,134 L344,134 L344,122 L360,122 L360,130 L374,130 L374,148 Z" fill="#6c7194"/>
      <g fill="#f3d39a" opacity="0.85">
        <rect x="252" y="134" width="3" height="4"/><rect x="268" y="126" width="3" height="4"/><rect x="286" y="138" width="3" height="4"/>
        <rect x="314" y="128" width="3" height="4"/><rect x="332" y="140" width="3" height="4"/><rect x="350" y="128" width="3" height="4"/><rect x="364" y="136" width="3" height="4"/>
      </g>
      <!-- 窗框、窗台和纱帘 -->
      <g fill="none" stroke="#eee0c9" stroke-linejoin="round">
        <rect x="246" y="26" width="128" height="122" stroke-width="7"/>
        <line x1="310" y1="26" x2="310" y2="148" stroke-width="4.5"/>
      </g>
      <rect x="240" y="20" width="140" height="7" fill="#f2e3cb"/>
      <rect x="238" y="146" width="144" height="7" rx="1.5" fill="#f2e3cb"/>
      <path d="M240,26 L256,26 C252,64 250,104 256,148 L240,148 Z" fill="#f3d9c2" opacity="0.92"/>
      <path d="M380,26 L364,26 C368,64 370,104 364,148 L380,148 Z" fill="#f3d9c2" opacity="0.92"/>
      <path d="M246,40 C246,80 247,120 250,146" stroke="#e8c6aa" stroke-width="1" fill="none"/>
      <path d="M374,40 C374,80 373,120 370,146" stroke="#e8c6aa" stroke-width="1" fill="none"/>
      <!-- 小灯串 -->
      <path d="M240,24 Q310,40 380,24" stroke="#c9b08a" stroke-width="0.8" fill="none"/>
      <g fill="#fbe3a0"><circle cx="256" cy="28" r="1.8"/><circle cx="274" cy="31.5" r="1.8"/><circle cx="292" cy="33.5" r="1.8"/><circle cx="310" cy="34" r="1.8"/><circle cx="328" cy="33.5" r="1.8"/><circle cx="346" cy="31.5" r="1.8"/><circle cx="364" cy="28" r="1.8"/></g>

      <!-- 墙上的钟：差一分钟十二点 -->
      <circle cx="112" cy="92" r="19.5" fill="#fbf6ec" stroke="#c9a57c" stroke-width="3"/>
      <g stroke="#b39a7c" stroke-width="1.2" stroke-linecap="round">
        <line x1="112" y1="78.5" x2="112" y2="76"/><line x1="118.75" y1="80.31" x2="120" y2="78.14"/><line x1="123.69" y1="85.25" x2="125.86" y2="84"/>
        <line x1="125.5" y1="92" x2="128" y2="92"/><line x1="123.69" y1="98.75" x2="125.86" y2="100"/><line x1="118.75" y1="103.69" x2="120" y2="105.86"/>
        <line x1="112" y1="105.5" x2="112" y2="108"/><line x1="105.25" y1="103.69" x2="104" y2="105.86"/><line x1="100.31" y1="98.75" x2="98.14" y2="100"/>
        <line x1="98.5" y1="92" x2="96" y2="92"/><line x1="100.31" y1="85.25" x2="98.14" y2="84"/><line x1="105.25" y1="80.31" x2="104" y2="78.14"/>
      </g>
      <g stroke="#6e5c4c" stroke-linecap="round"><line x1="112" y1="92" x2="112" y2="81.5" stroke-width="2"/><line x1="112" y1="92" x2="110.4" y2="77.2" stroke-width="1.3"/></g>
      <circle cx="112" cy="92" r="1.6" fill="#6e5c4c"/>

      <!-- 木餐桌 -->
      <rect x="0" y="176" width="400" height="70" fill="url(#table)"/>
      <rect x="0" y="174" width="400" height="4" fill="#e6c9a4"/>
      <rect x="0" y="246" width="400" height="14" fill="#c29a72"/>
      <rect x="0" y="245" width="400" height="2.5" fill="#dcb991"/>
      <g stroke="#c9a47c" stroke-width="0.8" fill="none" opacity="0.6">
        <path d="M0,196 C80,193 160,198 240,195 C310,193 360,196 400,195"/><path d="M0,222 C70,219 150,224 230,221 C300,219 350,223 400,221"/>
        <path d="M30,186 C60,185 90,187 120,186"/><path d="M250,236 C290,235 320,237 360,236"/>
      </g>
      <!-- 烛光 -->
      <g filter="url(#soft)" opacity="0.55" fill="#fff0c2">
        <circle cx="50" cy="142" r="18"/><circle cx="78" cy="156" r="15"/>
      </g>
      <!-- 蜡烛 -->
      <rect x="45.5" y="150" width="9" height="46" rx="1.5" fill="url(#candle)"/>
      <ellipse cx="50" cy="196" rx="7.5" ry="2.6" fill="#e2c27e"/>
      <rect x="47" y="196" width="6" height="16" fill="url(#brass)"/>
      <ellipse cx="50" cy="213" rx="11" ry="3.2" fill="url(#brass)"/>
      <line x1="50" y1="150" x2="50" y2="146.5" stroke="#6e5c4c" stroke-width="0.8"/>
      <path d="M50,134 C53.5,139 54.5,143 50,147.5 C45.5,143 46.5,139 50,134 Z" fill="#f4bd5a"/>
      <path d="M50,138.5 C51.6,141 52,143.5 50,146 C48,143.5 48.4,141 50,138.5 Z" fill="#fde9ae"/>
      <rect x="73.5" y="164" width="9" height="32" rx="1.5" fill="url(#candle)"/>
      <ellipse cx="78" cy="196" rx="7.5" ry="2.6" fill="#e2c27e"/>
      <rect x="75" y="196" width="6" height="11" fill="url(#brass)"/>
      <ellipse cx="78" cy="208" rx="10" ry="3" fill="url(#brass)"/>
      <line x1="78" y1="164" x2="78" y2="160.5" stroke="#6e5c4c" stroke-width="0.8"/>
      <path d="M78,148.5 C81.3,153 82.2,157 78,161.5 C73.8,157 74.7,153 78,148.5 Z" fill="#f4bd5a"/>
      <path d="M78,152.5 C79.5,155 79.9,157.5 78,160 C76.1,157.5 76.5,155 78,152.5 Z" fill="#fde9ae"/>

      <!-- 两碗十二颗葡萄 -->
      <use href="#gbowl" transform="translate(142,200)"/>
      <use href="#gbowl" transform="translate(200,220) scale(1.12)"/>

      <!-- 香槟杯 -->
      <use href="#flute" transform="translate(262,216)"/>
      <use href="#flute" transform="translate(288,224) scale(1.05)"/>

      <!-- 起泡酒 -->
      <path d="M326,226 L326,190 C326,182 331,178 334,172 L334,158 L342,158 L342,172 C345,178 350,182 350,190 L350,226 C350,228 348,229 346,229 L330,229 C328,229 326,228 326,226 Z" fill="url(#bottle)"/>
      <path d="M333.5,156 L342.5,156 L342.5,170 C340,172 336,172 333.5,170 Z" fill="#e4c47e"/>
      <rect x="333" y="155" width="10" height="3" rx="1" fill="#efd79e"/>
      <path d="M330,196 C330,190 332,186 334,183" stroke="#a9c7af" stroke-width="2" fill="none" opacity="0.7" stroke-linecap="round"/>

      <!-- 彩纸屑和彩带 -->
      <g opacity="0.9">
        <rect x="104" y="232" width="4" height="2.5" rx="0.6" fill="#e9b45f" transform="rotate(20 106 233)"/>
        <rect x="236" y="238" width="4" height="2.5" rx="0.6" fill="#ef9f95" transform="rotate(-30 238 239)"/>
        <rect x="310" y="242" width="4" height="2.5" rx="0.6" fill="#94c6be" transform="rotate(40 312 243)"/>
        <rect x="170" y="190" width="3.5" height="2.2" rx="0.6" fill="#94c6be" transform="rotate(-15 172 191)"/>
        <rect x="364" y="210" width="3.5" height="2.2" rx="0.6" fill="#e9b45f" transform="rotate(25 366 211)"/>
        <circle cx="92" cy="222" r="1.4" fill="#ef9f95"/><circle cx="250" cy="196" r="1.3" fill="#e9b45f"/><circle cx="378" cy="232" r="1.4" fill="#ef9f95"/><circle cx="22" cy="232" r="1.3" fill="#94c6be"/>
      </g>
      <path d="M92,240 C100,232 108,244 116,236 C122,230 128,240 134,234" stroke="#e9b45f" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <path d="M352,240 C358,233 366,242 372,235" stroke="#ef9f95" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    </g>

    <!-- 阴影 -->
    <g filter="url(#soft2)" opacity="0.2" fill="#8a6a4a">
      <rect x="240" y="154" width="140" height="4"/><rect x="0" y="177" width="400" height="3"/>
      <ellipse cx="50" cy="215" rx="13" ry="2.5"/><ellipse cx="78" cy="210" rx="12" ry="2.5"/>
      <ellipse cx="142" cy="220" rx="20" ry="3"/><ellipse cx="200" cy="242" rx="22" ry="3"/>
      <ellipse cx="263" cy="217" rx="10" ry="2"/><ellipse cx="289" cy="225" rx="10" ry="2"/><ellipse cx="338" cy="230" rx="14" ry="2.5"/>
    </g>
    <!-- 纸纹 -->
    <rect width="400" height="260" filter="url(#grain)"/>
  </g>
</svg>
