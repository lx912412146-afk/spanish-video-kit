<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 260" width="400" height="260">
  <!-- 原创插图：明亮的工作室，桌上一只机械臂、一台电脑（屏幕只有色块）、一盆绿植，窗外是城市（水彩风格，纯 SVG 手绘，无外部素材） -->
  <defs>
    <filter id="wc" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="0.35"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="g"/>
      <feColorMatrix in="g" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.38  0 0 0 0 0.3  0 0 0 0.09 0"/>
    </filter>
    <filter id="edge" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="5"/></filter>
    <mask id="fade" maskUnits="userSpaceOnUse" x="0" y="0" width="400" height="260">
      <rect x="7" y="7" width="386" height="246" rx="4" fill="#fff" filter="url(#edge)"/>
    </mask>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf5ea"/><stop offset="0.6" stop-color="#f8ecdc"/><stop offset="1" stop-color="#f3e2cd"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe4ee"/><stop offset="0.7" stop-color="#e4eff0"/><stop offset="1" stop-color="#f2f1e6"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8d2b6"/><stop offset="1" stop-color="#dfc5a5"/>
    </linearGradient>
    <linearGradient id="deskTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ecd6b8"/><stop offset="1" stop-color="#e2c8a4"/>
    </linearGradient>
    <linearGradient id="armG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfbf8"/><stop offset="0.6" stop-color="#eceeeb"/><stop offset="1" stop-color="#d2d6d3"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9ddda"/><stop offset="0.45" stop-color="#f3f4f1"/><stop offset="1" stop-color="#c9cecb"/>
    </linearGradient>
    <linearGradient id="bldA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9d7df"/><stop offset="1" stop-color="#bccbd4"/>
    </linearGradient>
    <linearGradient id="bldB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dbe3e6"/><stop offset="1" stop-color="#ccd7dc"/>
    </linearGradient>
    <linearGradient id="pot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8e4dc"/><stop offset="0.5" stop-color="#f6f3ec"/><stop offset="1" stop-color="#d9d4ca"/>
    </linearGradient>
    <radialGradient id="light" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fffaf0" stop-opacity="0.8"/><stop offset="1" stop-color="#fffaf0" stop-opacity="0"/>
    </radialGradient>
    <!-- 龟背竹叶 -->
    <path id="mleaf" d="M0,0 C-2,-8 -1,-18 6,-24 C14,-30 26,-28 30,-20 C34,-12 30,-2 20,2 C12,5 4,4 0,0 Z"/>
  </defs>

  <g mask="url(#fade)">
    <!-- 墙面和地板 -->
    <rect width="400" height="260" fill="url(#wall)"/>
    <rect x="0" y="214" width="400" height="46" fill="url(#floor)"/>
    <rect x="0" y="211" width="400" height="4" fill="#ecdcc4"/>

    <g filter="url(#wc)">
      <!-- 大窗户和窗外的城市 -->
      <rect x="246" y="26" width="140" height="132" fill="url(#sky)"/>
      <g filter="url(#soft2)" fill="#ffffff" opacity="0.85">
        <ellipse cx="290" cy="50" rx="18" ry="5"/><ellipse cx="302" cy="46" rx="10" ry="5"/><ellipse cx="360" cy="68" rx="14" ry="4"/>
      </g>
      <g>
        <rect x="250" y="96" width="22" height="62" fill="url(#bldB)"/>
        <rect x="270" y="74" width="26" height="84" fill="url(#bldA)"/>
        <path d="M296,158 L296,86 C302,80 312,78 318,84 L318,158 Z" fill="url(#bldB)"/>
        <rect x="318" y="62" width="22" height="96" fill="url(#bldA)"/>
        <rect x="340" y="92" width="24" height="66" fill="url(#bldB)"/>
        <rect x="362" y="78" width="22" height="80" fill="url(#bldA)"/>
      </g>
      <g stroke="#e8eff2" stroke-width="0.8" opacity="0.9">
        <line x1="274" y1="84" x2="292" y2="84"/><line x1="274" y1="94" x2="292" y2="94"/><line x1="274" y1="104" x2="292" y2="104"/><line x1="274" y1="114" x2="292" y2="114"/><line x1="274" y1="124" x2="292" y2="124"/>
        <line x1="322" y1="72" x2="336" y2="72"/><line x1="322" y1="82" x2="336" y2="82"/><line x1="322" y1="92" x2="336" y2="92"/><line x1="322" y1="102" x2="336" y2="102"/><line x1="322" y1="112" x2="336" y2="112"/>
        <line x1="366" y1="88" x2="380" y2="88"/><line x1="366" y1="98" x2="380" y2="98"/><line x1="366" y1="108" x2="380" y2="108"/><line x1="366" y1="118" x2="380" y2="118"/>
      </g>
      <g stroke="#c2d0d8" stroke-width="0.8" opacity="0.9">
        <line x1="300" y1="96" x2="300" y2="150"/><line x1="307" y1="90" x2="307" y2="150"/><line x1="314" y1="96" x2="314" y2="150"/>
        <line x1="254" y1="106" x2="268" y2="106"/><line x1="254" y1="116" x2="268" y2="116"/><line x1="344" y1="102" x2="360" y2="102"/><line x1="344" y1="112" x2="360" y2="112"/>
      </g>
      <!-- 楼顶的小绿植和远处的风机 -->
      <g fill="#a9cc8e"><circle cx="344" cy="90" r="3"/><circle cx="350" cy="89" r="3.4"/><circle cx="357" cy="90" r="3"/></g>
      <g stroke="#f5f6f2" stroke-width="1"><line x1="258" y1="96" x2="258" y2="72"/><line x1="258" y1="72" x2="251" y2="66"/><line x1="258" y1="72" x2="266" y2="69"/><line x1="258" y1="72" x2="257" y2="81"/></g>
      <!-- 窗框 -->
      <g fill="none" stroke="#eee4d6" stroke-linejoin="round">
        <rect x="244" y="24" width="144" height="136" stroke-width="6"/>
        <line x1="316" y1="24" x2="316" y2="160" stroke-width="4"/>
      </g>
      <rect x="238" y="158" width="156" height="6" rx="1.5" fill="#efe3d2"/>
    </g>

    <!-- 窗光 -->
    <g filter="url(#soft)" opacity="0.45">
      <path d="M246,176 L388,176 L360,214 L222,214 Z" fill="#fffaf0"/>
    </g>

    <g filter="url(#wc)">
      <!-- 桌子 -->
      <path d="M14,166 L400,166 L400,180 L8,180 Z" fill="url(#deskTop)"/>
      <rect x="8" y="180" width="392" height="6" fill="#cfae86"/>
      <rect x="22" y="186" width="5" height="40" fill="#b9946c"/><rect x="380" y="186" width="5" height="40" fill="#b9946c"/>
      <rect x="196" y="186" width="5" height="30" fill="#c19c74" opacity="0.8"/>

      <!-- 桌下的抽屉柜 -->
      <rect x="300" y="186" width="48" height="38" rx="2" fill="#dfe6e7"/>
      <rect x="300" y="186" width="48" height="38" rx="2" fill="none" stroke="#cbd5d7" stroke-width="0.8"/>
      <g stroke="#c6d0d2" stroke-width="0.9"><line x1="302" y1="198" x2="346" y2="198"/><line x1="302" y1="210" x2="346" y2="210"/></g>
      <g fill="#b3c0c4"><rect x="318" y="191" width="12" height="2" rx="1"/><rect x="318" y="203" width="12" height="2" rx="1"/><rect x="318" y="215" width="12" height="2" rx="1"/></g>
      <g fill="#a9b2b4"><circle cx="306" cy="226" r="2"/><circle cx="342" cy="226" r="2"/></g>
      <!-- 地上的扫地机器人 -->
      <ellipse cx="132" cy="238" rx="22" ry="7" fill="#d6dbdb"/>
      <ellipse cx="132" cy="235" rx="21" ry="6" fill="#eef1f0"/>
      <ellipse cx="132" cy="234" rx="6" ry="2" fill="#cfd8db"/>
      <circle cx="141" cy="235" r="1.2" fill="#8fc0bb"/>
      <!-- 机械臂 -->
      <rect x="88" y="164" width="48" height="10" rx="3" fill="#cfd4d1"/>
      <path d="M96,164 L128,164 L124,148 L100,148 Z" fill="url(#base)"/>
      <ellipse cx="112" cy="148" rx="13" ry="4" fill="#eef0ed"/>
      <!-- 下臂 -->
      <rect x="0" y="-7.5" width="56" height="15" rx="7.5" fill="url(#armG)" transform="translate(112,142) rotate(-61.6)"/>
      <rect x="10" y="-2.4" width="34" height="2" rx="1" fill="#d6dad7" transform="translate(112,142) rotate(-61.6)"/>
      <circle cx="112" cy="142" r="9.5" fill="#8fc0bb"/><circle cx="112" cy="142" r="4" fill="#b3d8d2"/>
      <!-- 上臂 -->
      <rect x="0" y="-6" width="48" height="12" rx="6" fill="url(#armG)" transform="translate(138,94) rotate(24.4)"/>
      <circle cx="138" cy="94" r="8.5" fill="#8fc0bb"/><circle cx="138" cy="94" r="3.4" fill="#b3d8d2"/>
      <!-- 腕部和夹爪 -->
      <circle cx="182" cy="114" r="6.4" fill="#e29a74"/><circle cx="182" cy="114" r="2.4" fill="#f2c0a4"/>
      <rect x="176" y="119" width="12" height="9" rx="2" fill="#e7e9e6"/>
      <path d="M177,128 L176,140 L179,140 L180,128 Z" fill="#b9bfbc"/><path d="M187,128 L188,140 L185,140 L184,128 Z" fill="#b9bfbc"/>
      <!-- 夹着的小方块 -->
      <rect x="178" y="136" width="8" height="8" rx="1" fill="#f0c95c"/>
      <rect x="178" y="136" width="8" height="2.4" fill="#f6dc8e"/>
      <!-- 线缆 -->
      <path d="M118,150 C130,150 136,128 132,112 C130,104 138,100 146,104" stroke="#9aa3a0" stroke-width="1" fill="none"/>
      <!-- 零件托盘 -->
      <path d="M160,166 L204,166 L202,174 L162,174 Z" fill="#c9d6dc"/>
      <rect x="158" y="164" width="48" height="3" rx="1" fill="#dce5e9"/>
      <g><rect x="166" y="158" width="8" height="8" rx="1" fill="#e29a74"/><rect x="176" y="159" width="7" height="7" rx="1" fill="#8fc0bb"/><rect x="186" y="158" width="8" height="8" rx="1" fill="#f0c95c"/></g>
      <g fill="#ffffff" opacity="0.4"><rect x="166" y="158" width="8" height="2"/><rect x="186" y="158" width="8" height="2"/></g>

      <!-- 杯子 -->
      <path d="M216,160 L228,160 L227,174 L217,174 Z" fill="#9db4c6"/>
      <path d="M228,163 C233,163 233,170 227.6,170" stroke="#9db4c6" stroke-width="1.8" fill="none"/>
      <ellipse cx="222" cy="160" rx="6" ry="1.4" fill="#b9cbd7"/>

      <!-- 电脑显示器（屏幕只画色块） -->
      <rect x="280" y="158" width="8" height="10" fill="#c3c7c6"/>
      <ellipse cx="284" cy="169" rx="14" ry="2.6" fill="#cfd3d2"/>
      <rect x="236" y="98" width="96" height="62" rx="3" fill="#8b9096"/>
      <rect x="240" y="102" width="88" height="54" rx="1" fill="#eef4f5"/>
      <rect x="240" y="102" width="88" height="7" fill="#9db4c6"/>
      <rect x="240" y="109" width="18" height="47" fill="#d4e3e8"/>
      <g fill="#b9cbd6"><rect x="243" y="113" width="12" height="3" rx="1"/><rect x="243" y="119" width="12" height="3" rx="1"/><rect x="243" y="125" width="12" height="3" rx="1"/></g>
      <rect x="263" y="113" width="30" height="18" rx="1.5" fill="#bfdba6"/>
      <circle cx="310" cy="122" r="8" fill="#f3d9c6"/><path d="M310,122 L310,114 A8,8 0 0 1 317.6,124.6 Z" fill="#e29a74"/>
      <g fill="#f0c95c"><rect x="265" y="146" width="5" height="6"/><rect x="272" y="141" width="5" height="11"/><rect x="279" y="144" width="5" height="8"/><rect x="286" y="137" width="5" height="15"/></g>
      <rect x="298" y="136" width="26" height="16" rx="1.5" fill="#d8e6ef"/>
      <rect x="236" y="98" width="96" height="62" rx="3" fill="none" stroke="#7d828a" stroke-width="0.6"/>
      <!-- 键盘 -->
      <path d="M250,170 L316,170 L319,177 L247,177 Z" fill="#eceeed"/>
      <g stroke="#d3d7d6" stroke-width="0.6"><line x1="252" y1="172.4" x2="314" y2="172.4"/><line x1="250" y1="174.8" x2="317" y2="174.8"/></g>
      <ellipse cx="330" cy="174" rx="4" ry="2.4" fill="#eceeed"/>

      <!-- 绿植 -->
      <path d="M348,146 L378,146 L374,174 L352,174 Z" fill="url(#pot)"/>
      <rect x="346" y="143" width="34" height="5" rx="1.5" fill="#f1ede5"/>
      <g stroke="#6f9f55" stroke-width="1.3" fill="none">
        <path d="M360,144 C356,130 350,118 344,108"/><path d="M364,144 C366,126 370,112 376,100"/><path d="M362,144 C362,132 360,124 360,116"/>
      </g>
      <g fill="#6aa357">
        <use href="#mleaf" transform="translate(344,108) rotate(-150) scale(0.95)"/>
        <use href="#mleaf" transform="translate(376,100) rotate(-40) scale(0.95)"/>
      </g>
      <g fill="#80b867">
        <use href="#mleaf" transform="translate(360,116) rotate(-100) scale(0.85)"/>
        <use href="#mleaf" transform="translate(366,136) rotate(-20) scale(0.7)"/>
        <use href="#mleaf" transform="translate(356,136) rotate(-170) scale(0.7)"/>
      </g>
      <g stroke="#a3cf88" stroke-width="0.8" opacity="0.8" fill="none">
        <path d="M333,98 L323,92 M339,102 L333,93"/><path d="M386,92 L396,84 M383,88 L389,78"/>
      </g>

      <!-- 左墙上的小搁板 -->
      <rect x="22" y="104" width="54" height="4" rx="1" fill="#d6b48c"/>
      <rect x="28" y="88" width="5" height="16" rx="0.6" fill="#9db4c6"/><rect x="33" y="91" width="4" height="13" rx="0.6" fill="#e4b766"/><rect x="37" y="89" width="5" height="15" rx="0.6" fill="#8fae86"/>
      <path d="M54,94 L66,94 L64,104 L56,104 Z" fill="#dc9067"/>
      <g fill="#86b46c"><circle cx="57" cy="91" r="3"/><circle cx="62" cy="90" r="3.4"/><circle cx="60" cy="87" r="2.6"/></g>
    </g>

    <!-- 地面和桌面阴影 -->
    <g filter="url(#soft2)" opacity="0.2" fill="#8a6a4a">
      <ellipse cx="204" cy="228" rx="190" ry="4"/><ellipse cx="133" cy="244" rx="22" ry="2.6"/>
      <ellipse cx="112" cy="174" rx="28" ry="2.4"/><ellipse cx="284" cy="171" rx="20" ry="2"/><ellipse cx="363" cy="175" rx="16" ry="2"/><ellipse cx="182" cy="175" rx="24" ry="2"/>
    </g>
    <!-- 纸纹 -->
    <rect width="400" height="260" filter="url(#grain)"/>
  </g>
</svg>
