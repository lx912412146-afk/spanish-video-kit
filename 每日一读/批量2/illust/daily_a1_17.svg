<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 260" width="400" height="260">
  <!-- 原创插图：早上的公交车（水彩风格，纯 SVG 手绘，无外部素材） -->
  <defs>
    <filter id="wc" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="0.35"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="g"/>
      <feColorMatrix in="g" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.38  0 0 0 0 0.3  0 0 0 0.09 0"/>
    </filter>
    <filter id="edge" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="5"/></filter>
    <mask id="fade" maskUnits="userSpaceOnUse" x="0" y="0" width="400" height="260">
      <rect x="7" y="7" width="386" height="246" rx="4" fill="#fff" filter="url(#edge)"/>
    </mask>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8e7ee"/><stop offset="0.55" stop-color="#eef0e8"/><stop offset="1" stop-color="#f9ebd6"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3dcd1"/><stop offset="1" stop-color="#d8cfc3"/>
    </linearGradient>
    <linearGradient id="walk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe6d8"/><stop offset="1" stop-color="#e8dccb"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2edef"/><stop offset="1" stop-color="#cddfe2"/>
    </linearGradient>
    <linearGradient id="busup" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf5ea"/><stop offset="1" stop-color="#f1e6d3"/>
    </linearGradient>
    <linearGradient id="buslow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9a084"/><stop offset="1" stop-color="#d98a6e"/>
    </linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d6e7ec"/><stop offset="1" stop-color="#b9d0d8"/>
    </linearGradient>
    <linearGradient id="trunk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a5805e"/><stop offset="0.45" stop-color="#bf9a74"/><stop offset="1" stop-color="#94704f"/>
    </linearGradient>
    <g id="wheel"><circle r="13" fill="#6b655f"/><circle r="7.5" fill="#c9c4bc"/><circle r="3" fill="#9a948c"/></g>
  </defs>

  <g mask="url(#fade)">
    <!-- 清晨的天空 -->
    <rect width="400" height="260" fill="url(#sky)"/>
    <circle cx="330" cy="70" r="40" fill="#fff4d8" opacity="0.7" filter="url(#soft)"/>
    <circle cx="330" cy="70" r="13" fill="#fbe7b4" opacity="0.9" filter="url(#soft2)"/>
    <g filter="url(#soft2)" fill="#ffffff" opacity="0.8">
      <ellipse cx="200" cy="40" rx="22" ry="5.5"/><ellipse cx="214" cy="36" rx="12" ry="5"/>
    </g>

    <g filter="url(#wc)">
      <!-- 远处的楼房 -->
      <g opacity="0.85">
        <rect x="-4" y="88" width="56" height="64" fill="#ece0d2"/><rect x="50" y="102" width="40" height="50" fill="#e3e5df"/>
        <rect x="88" y="78" width="52" height="74" fill="#efe1d1"/><rect x="85" y="74" width="58" height="5" fill="#e0c9b4"/>
        <rect x="140" y="96" width="44" height="56" fill="#e7dccd"/><rect x="230" y="84" width="48" height="68" fill="#ebdfd0"/>
        <rect x="276" y="100" width="40" height="52" fill="#e2e5e0"/><rect x="316" y="80" width="56" height="72" fill="#efe1cf"/><rect x="313" y="76" width="62" height="5" fill="#e0c9b4"/>
        <rect x="370" y="96" width="34" height="56" fill="#e7dccd"/>
        <g fill="#cdd9dd">
          <rect x="6" y="96" width="6" height="7"/><rect x="20" y="96" width="6" height="7"/><rect x="34" y="96" width="6" height="7"/><rect x="6" y="110" width="6" height="7"/><rect x="34" y="110" width="6" height="7"/>
          <rect x="58" y="110" width="6" height="7"/><rect x="74" y="110" width="6" height="7"/><rect x="58" y="124" width="6" height="7"/>
          <rect x="96" y="86" width="6" height="7"/><rect x="110" y="86" width="6" height="7"/><rect x="124" y="86" width="6" height="7"/><rect x="96" y="100" width="6" height="7"/><rect x="124" y="100" width="6" height="7"/><rect x="110" y="114" width="6" height="7"/>
          <rect x="148" y="104" width="6" height="7"/><rect x="164" y="104" width="6" height="7"/>
          <rect x="238" y="92" width="6" height="7"/><rect x="252" y="92" width="6" height="7"/><rect x="266" y="92" width="6" height="7"/>
          <rect x="324" y="88" width="6" height="7"/><rect x="338" y="88" width="6" height="7"/><rect x="352" y="88" width="6" height="7"/><rect x="324" y="102" width="6" height="7"/><rect x="352" y="102" width="6" height="7"/>
          <rect x="378" y="104" width="6" height="7"/><rect x="392" y="104" width="6" height="7"/>
        </g>
        <g fill="#f6dc9c"><rect x="20" y="110" width="6" height="7"/><rect x="110" y="100" width="6" height="7"/><rect x="74" y="124" width="6" height="7"/><rect x="338" y="102" width="6" height="7"/><rect x="252" y="106" width="6" height="7"/></g>
      </g>

      <!-- 对面的人行道、马路、近处的人行道 -->
      <rect x="0" y="150" width="400" height="24" fill="url(#walk)"/>
      <g stroke="#dccdb9" stroke-width="0.7" opacity="0.8"><line x1="0" y1="160" x2="400" y2="160"/><line x1="40" y1="150" x2="38" y2="160"/><line x1="130" y1="160" x2="128" y2="174"/><line x1="250" y1="150" x2="248" y2="160"/><line x1="330" y1="160" x2="328" y2="174"/></g>
      <rect x="0" y="172" width="400" height="5" fill="#d8cab7"/>
      <rect x="0" y="177" width="400" height="52" fill="url(#road)"/>
      <g fill="#f8f3ea" opacity="0.9"><rect x="6" y="212" width="26" height="3" rx="1"/><rect x="62" y="212" width="26" height="3" rx="1"/><rect x="118" y="212" width="26" height="3" rx="1"/><rect x="174" y="212" width="26" height="3" rx="1"/><rect x="230" y="212" width="26" height="3" rx="1"/><rect x="286" y="212" width="26" height="3" rx="1"/><rect x="342" y="212" width="26" height="3" rx="1"/></g>
      <rect x="0" y="227" width="400" height="5" fill="#d8cab7"/>
      <rect x="0" y="231" width="400" height="29" fill="url(#walk)"/>
      <g stroke="#dccdb9" stroke-width="0.7" opacity="0.8"><line x1="0" y1="246" x2="400" y2="246"/><line x1="150" y1="231" x2="147" y2="246"/><line x1="260" y1="246" x2="257" y2="260"/><line x1="350" y1="231" x2="347" y2="246"/></g>
      <!-- 近处的花槽 -->
      <rect x="18" y="238" width="96" height="22" rx="2" fill="#c9a27a"/>
      <rect x="15" y="234" width="102" height="6" rx="1.5" fill="#dbb68c"/>
      <g fill="#86b46c"><circle cx="28" cy="232" r="8"/><circle cx="46" cy="230" r="9"/><circle cx="66" cy="231" r="8"/><circle cx="86" cy="229" r="9"/><circle cx="104" cy="232" r="8"/></g>
      <g fill="#a2cd86"><circle cx="38" cy="227" r="5"/><circle cx="76" cy="226" r="5"/><circle cx="96" cy="226" r="4"/></g>
      <g fill="#f19aa6"><circle cx="32" cy="226" r="2.4"/><circle cx="58" cy="224" r="2.4"/><circle cx="90" cy="223" r="2.4"/></g>
      <g fill="#f4d06e"><circle cx="46" cy="224" r="2.2"/><circle cx="72" cy="227" r="2.2"/><circle cx="106" cy="226" r="2.2"/></g>
      <g fill="#fbf6ee"><circle cx="24" cy="230" r="2"/><circle cx="82" cy="231" r="2"/></g>

      <!-- 行道树 -->
      <path d="M194,152 C196,130 196,110 195,92 L200,92 C200,110 200,130 203,152 Z" fill="url(#trunk)"/>
      <g fill="#97be7a"><circle cx="198" cy="76" r="24"/><circle cx="178" cy="90" r="16"/><circle cx="218" cy="90" r="17"/></g>
      <g fill="#aacd8c"><circle cx="192" cy="70" r="15"/><circle cx="212" cy="82" r="10"/></g>
      <circle cx="188" cy="66" r="7" fill="#c2dea5" opacity="0.7" filter="url(#soft2)"/>
      <g fill="#97be7a"><circle cx="300" cy="72" r="26"/><circle cx="278" cy="88" r="17"/><circle cx="322" cy="88" r="18"/></g>
      <g fill="#aacd8c"><circle cx="294" cy="64" r="16"/><circle cx="316" cy="80" r="10"/></g>
      <circle cx="288" cy="60" r="7" fill="#c2dea5" opacity="0.7" filter="url(#soft2)"/>
      <path d="M296,152 L297,110 L303,110 L305,152 Z" fill="url(#trunk)"/>
      <path d="M8,152 C10,134 10,118 9,104 L14,104 C14,118 14,134 17,152 Z" fill="url(#trunk)"/>
      <g fill="#97be7a"><circle cx="12" cy="90" r="20"/><circle cx="-2" cy="100" r="13"/><circle cx="28" cy="102" r="14"/></g>
      <circle cx="8" cy="84" r="11" fill="#aacd8c"/>

      <!-- 候车亭 -->
      <rect x="44" y="92" width="126" height="64" fill="url(#glass)" opacity="0.9"/>
      <g fill="#ffffff" opacity="0.45"><polygon points="54,156 80,92 88,92 62,156"/><polygon points="104,156 122,92 126,92 108,156"/></g>
      <rect x="146" y="98" width="22" height="50" rx="1.5" fill="#f6efe2"/>
      <rect x="149" y="101" width="16" height="44" fill="#d9e7e2"/>
      <circle cx="157" cy="114" r="4" fill="#f4d58a"/><path d="M149,145 L149,130 C154,126 160,126 165,132 L165,145 Z" fill="#a9cd8e"/>
      <rect x="36" y="84" width="142" height="9" rx="2" fill="#8fb3a8"/>
      <rect x="36" y="84" width="142" height="2.6" rx="1.3" fill="#b5d0c7"/>
      <g fill="#7f9f95"><rect x="42" y="92" width="4" height="74"/><rect x="168" y="92" width="4" height="74"/></g>
      <rect x="62" y="136" width="78" height="5" rx="1.5" fill="#d2aa80"/>
      <rect x="62" y="136" width="78" height="1.6" fill="#e6c49d"/>
      <g fill="#8e9ba0"><rect x="68" y="141" width="3" height="23"/><rect x="131" y="141" width="3" height="23"/></g>

      <!-- 站牌（只画一个公交小图标） -->
      <rect x="184" y="104" width="3" height="66" fill="#8e9ba0"/>
      <circle cx="185.5" cy="98" r="10" fill="#e9a084"/>
      <circle cx="185.5" cy="98" r="8" fill="none" stroke="#fbf3e6" stroke-width="1"/>
      <rect x="180" y="93" width="11" height="8.5" rx="2" fill="#fbf3e6"/><rect x="181.5" y="94.6" width="8" height="3" rx="0.6" fill="#e9a084"/>
      <circle cx="182.5" cy="102.2" r="1.2" fill="#fbf3e6"/><circle cx="188.5" cy="102.2" r="1.2" fill="#fbf3e6"/>

      <!-- 开过来的公交车 -->
      <path d="M218,120 L392,120 C396,120 398,123 398,127 L398,196 L206,196 L206,140 C206,128 210,120 218,120 Z" fill="url(#busup)"/>
      <path d="M206,164 L398,164 L398,196 L206,196 Z" fill="url(#buslow)"/>
      <rect x="206" y="160" width="192" height="4" fill="#f3c7a4"/>
      <rect x="250" y="114" width="60" height="7" rx="2" fill="#e8dccb"/>
      <!-- 车窗 -->
      <path d="M210,140 C210,132 213,126 220,126 L226,126 L226,156 L210,156 Z" fill="url(#win)"/>
      <rect x="230" y="126" width="22" height="66" rx="1.5" fill="url(#win)"/>
      <line x1="241" y1="126" x2="241" y2="192" stroke="#f1e6d3" stroke-width="1.6"/>
      <rect x="258" y="126" width="30" height="28" rx="2" fill="url(#win)"/><rect x="292" y="126" width="30" height="28" rx="2" fill="url(#win)"/>
      <rect x="326" y="126" width="30" height="28" rx="2" fill="url(#win)"/><rect x="360" y="126" width="34" height="28" rx="2" fill="url(#win)"/>
      <g fill="#ffffff" opacity="0.55">
        <polygon points="214,156 222,128 225,128 217,156"/><polygon points="262,154 272,126 276,126 266,154"/><polygon points="296,154 306,126 309,126 299,154"/>
        <polygon points="330,154 340,126 343,126 333,154"/><polygon points="364,154 374,126 377,126 367,154"/><polygon points="233,190 244,128 247,128 236,190"/>
      </g>
      <!-- 车灯、后视镜、保险杠 -->
      <circle cx="211" cy="176" r="10" fill="#fff1c4" opacity="0.7" filter="url(#soft2)"/>
      <rect x="207" y="172" width="8" height="6" rx="2" fill="#fbe7a6"/>
      <path d="M210,130 C204,128 200,130 200,136" stroke="#8e9ba0" stroke-width="1.6" fill="none"/>
      <rect x="197" y="135" width="5" height="9" rx="1.5" fill="#8e9ba0"/>
      <rect x="204" y="190" width="10" height="6" rx="1.5" fill="#c9c4bc"/>
      <rect x="394" y="168" width="4" height="8" rx="1" fill="#f2a98a"/>
      <!-- 车轮 -->
      <path d="M252,196 C252,180 284,180 284,196 Z" fill="#c97d63"/><path d="M342,196 C342,180 374,180 374,196 Z" fill="#c97d63"/>
      <use href="#wheel" transform="translate(268,198)"/><use href="#wheel" transform="translate(358,198)"/>
    </g>

    <!-- 地面阴影 -->
    <g filter="url(#soft2)" opacity="0.18" fill="#7a6a58">
      <ellipse cx="302" cy="211" rx="100" ry="5"/><ellipse cx="106" cy="166" rx="70" ry="3"/><ellipse cx="66" cy="259" rx="54" ry="3"/><ellipse cx="200" cy="153" rx="12" ry="2"/><ellipse cx="300" cy="153" rx="12" ry="2"/>
    </g>
    <!-- 纸纹 -->
    <rect width="400" height="260" filter="url(#grain)"/>
  </g>
</svg>
