      <g fill="#e9a94f"><use href="#lf" transform="translate(246,225) rotate(57) scale(0.84)"/><use href="#lf" transform="translate(303,189) rotate(185) scale(0.54)"/><use href="#lf" transform="translate(383,201) rotate(305) scale(0.64)"/><use href="#lf" transform="translate(386,196) rotate(273) scale(0.60)"/><use href="#lf" transform="translate(241,256) rotate(208) scale(1.10)"/><use href="#lf" transform="translate(119,196) rotate(26) scale(0.60)"/><use href="#lf" transform="translate(261,209) rotate(222) scale(0.71)"/><use href="#lf" transform="translate(367,191) rotate(73) scale(0.56)"/><use href="#lf" transform="translate(165,172) rotate(90) scale(0.40)"/><use href="#lf" transform="translate(31,209) rotate(309) scale(0.70)"/><use href="#lf" transform="translate(5,200) rotate(26) scale(0.63)"/><use href="#lf" transform="translate(54,185) rotate(126) scale(0.51)"/><use href="#lf" transform="translate(393,242) rotate(163) scale(0.98)"/><use href="#lf" transform="translate(54,168) rotate(164) scale(0.36)"/></g>
      <g fill="#e58b5a"><use href="#lf" transform="translate(25,241) rotate(13) scale(0.97)"/><use href="#lf" transform="translate(47,224) rotate(151) scale(0.83)"/><use href="#lf" transform="translate(363,180) rotate(294) scale(0.47)"/><use href="#lf" transform="translate(288,182) rotate(25) scale(0.48)"/><use href="#lf" transform="translate(148,182) rotate(206) scale(0.48)"/><use href="#lf" transform="translate(276,225) rotate(210) scale(0.84)"/><use href="#lf" transform="translate(27,173) rotate(112) scale(0.41)"/><use href="#lf" transform="translate(374,170) rotate(265) scale(0.38)"/><use href="#lf" transform="translate(241,169) rotate(173) scale(0.37)"/><use href="#lf" transform="translate(100,202) rotate(228) scale(0.65)"/><use href="#lf" transform="translate(380,230) rotate(100) scale(0.88)"/></g>
      <g fill="#d9704a"><use href="#lf" transform="translate(307,172) rotate(144) scale(0.40)"/><use href="#lf" transform="translate(270,184) rotate(121) scale(0.50)"/><use href="#lf" transform="translate(255,185) rotate(6) scale(0.51)"/><use href="#lf" transform="translate(95,253) rotate(254) scale(1.07)"/><use href="#lf" transform="translate(55,174) rotate(162) scale(0.42)"/><use href="#lf" transform="translate(369,219) rotate(171) scale(0.79)"/><use href="#lf" transform="translate(102,249) rotate(4) scale(1.04)"/><use href="#lf" transform="translate(245,179) rotate(187) scale(0.46)"/><use href="#lf" transform="translate(177,225) rotate(321) scale(0.84)"/><use href="#lf" transform="translate(154,245) rotate(210) scale(1.01)"/></g>
      <g fill="#f0c36a"><use href="#lf" transform="translate(224,207) rotate(333) scale(0.69)"/><use href="#lf" transform="translate(246,209) rotate(67) scale(0.71)"/><use href="#lf" transform="translate(238,223) rotate(143) scale(0.83)"/><use href="#lf" transform="translate(208,242) rotate(231) scale(0.98)"/><use href="#lf" transform="translate(34,166) rotate(236) scale(0.35)"/><use href="#lf" transform="translate(371,185) rotate(19) scale(0.51)"/><use href="#lf" transform="translate(283,178) rotate(4) scale(0.45)"/><use href="#lf" transform="translate(71,238) rotate(201) scale(0.95)"/><use href="#lf" transform="translate(394,212) rotate(277) scale(0.73)"/><use href="#lf" transform="translate(354,193) rotate(76) scale(0.58)"/><use href="#lf" transform="translate(181,199) rotate(345) scale(0.63)"/><use href="#lf" transform="translate(229,244) rotate(225) scale(1.00)"/><use href="#lf" transform="translate(374,196) rotate(250) scale(0.60)"/><use href="#lf" transform="translate(189,176) rotate(333) scale(0.43)"/></g>
      <g fill="#c98a4b"><use href="#lf" transform="translate(342,207) rotate(68) scale(0.69)"/><use href="#lf" transform="translate(311,220) rotate(117) scale(0.80)"/><use href="#lf" transform="translate(346,166) rotate(351) scale(0.35)"/><use href="#lf" transform="translate(85,255) rotate(93) scale(1.09)"/><use href="#lf" transform="translate(63,231) rotate(226) scale(0.89)"/><use href="#lf" transform="translate(380,184) rotate(318) scale(0.50)"/><use href="#lf" transform="translate(19,173) rotate(39) scale(0.41)"/><use href="#lf" transform="translate(362,204) rotate(177) scale(0.67)"/><use href="#lf" transform="translate(335,206) rotate(30) scale(0.68)"/><use href="#lf" transform="translate(228,230) rotate(111) scale(0.88)"/></g>
      <g fill="#e7b25c"><use href="#lf" transform="translate(36,193) rotate(291) scale(0.58)"/><use href="#lf" transform="translate(398,256) rotate(302) scale(1.10)"/><use href="#lf" transform="translate(159,254) rotate(26) scale(1.09)"/><use href="#lf" transform="translate(54,241) rotate(139) scale(0.97)"/><use href="#lf" transform="translate(385,229) rotate(8) scale(0.88)"/><use href="#lf" transform="translate(30,256) rotate(197) scale(1.10)"/><use href="#lf" transform="translate(366,237) rotate(127) scale(0.94)"/><use href="#lf" transform="translate(397,224) rotate(317) scale(0.83)"/><use href="#lf" transform="translate(45,252) rotate(281) scale(1.07)"/><use href="#lf" transform="translate(208,200) rotate(242) scale(0.64)"/><use href="#lf" transform="translate(111,241) rotate(219) scale(0.97)"/></g>
      <!-- 前景的几片枫叶 -->
      <use href="#ml" transform="translate(132,236) rotate(-20) scale(1.3)" fill="#e0794f"/><use href="#ml" transform="translate(320,246) rotate(30) scale(1.4)" fill="#eab04f"/><use href="#ml" transform="translate(196,222) rotate(10) scale(1.1)" fill="#d9704a"/>
      <!-- 飘落的叶子 -->
      <use href="#lf" transform="translate(252,128) rotate(40) scale(0.9)" fill="#efbf63"/><use href="#lf" transform="translate(150,152) rotate(-30) scale(0.8)" fill="#e58b5a"/>
      <use href="#ml" transform="translate(296,150) rotate(15) scale(0.8)" fill="#e9a94f"/><use href="#lf" transform="translate(370,148) rotate(70) scale(0.8)" fill="#e3a94f"/>
      <use href="#lf" transform="translate(42,150) rotate(-60) scale(0.8)" fill="#d97a4d"/><use href="#ml" transform="translate(212,104) rotate(-25) scale(0.7)" fill="#efbf63"/>
    </g>

    <!-- 地面阴影 -->
    <g filter="url(#soft2)" opacity="0.18" fill="#8a6a4a">
      <ellipse cx="90" cy="203" rx="30" ry="3.5"/><ellipse cx="340" cy="219" rx="34" ry="4"/><ellipse cx="271" cy="208" rx="44" ry="3"/><ellipse cx="274" cy="155" rx="12" ry="2"/>
    </g>
    <!-- 纸纹 -->
    <rect width="400" height="260" filter="url(#grain)"/>
