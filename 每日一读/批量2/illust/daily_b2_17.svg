<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 260" width="400" height="260">
  <!-- 原创插图：黎明时分海边发射台上的白色火箭，远处的海和淡淡的星星（水彩风格，纯 SVG 手绘，无外部素材，不写字、无旗帜） -->
  <defs>
    <filter id="wc" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="0.35"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="g"/>
      <feColorMatrix in="g" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.38  0 0 0 0 0.3  0 0 0 0.09 0"/>
    </filter>
    <filter id="edge" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="5"/></filter>
    <mask id="fade" maskUnits="userSpaceOnUse" x="0" y="0" width="400" height="260">
      <rect x="7" y="7" width="386" height="246" rx="4" fill="#fff" filter="url(#edge)"/>
    </mask>
    <!-- 黎明的天空：上面浅浅的灰紫，地平线是暖暖的杏色 -->
    <linearGradient id="sky" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="152">
      <stop offset="0" stop-color="#e2e2ec"/><stop offset="0.4" stop-color="#ece4e6"/><stop offset="0.75" stop-color="#f6e2d4"/><stop offset="1" stop-color="#f9dcbd"/>
    </linearGradient>
    <radialGradient id="nightCorner" gradientUnits="userSpaceOnUse" cx="400" cy="0" r="190">
      <stop offset="0" stop-color="#8e9cc0" stop-opacity="0.6"/><stop offset="0.55" stop-color="#a9b3cf" stop-opacity="0.25"/><stop offset="1" stop-color="#b9c1d9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sunGlow" gradientUnits="userSpaceOnUse" cx="344" cy="150" r="90">
      <stop offset="0" stop-color="#fff1d0" stop-opacity="1"/><stop offset="0.3" stop-color="#fbe2b8" stop-opacity="0.7"/><stop offset="1" stop-color="#f8dcbd" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c4ccd8"/><stop offset="1" stop-color="#aebdcc"/>
    </linearGradient>
    <linearGradient id="land" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2d4b6"/><stop offset="1" stop-color="#d6c4a2"/>
    </linearGradient>
    <linearGradient id="dune" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ecdcbc"/><stop offset="1" stop-color="#e2cfaa"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d3d6de"/><stop offset="0.35" stop-color="#f1f0ec"/><stop offset="0.7" stop-color="#fbf8f2"/><stop offset="1" stop-color="#f7e6d4"/>
    </linearGradient>
    <linearGradient id="booster" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cfd2da"/><stop offset="0.5" stop-color="#f2f1ec"/><stop offset="1" stop-color="#ecdfd2"/>
    </linearGradient>
    <linearGradient id="pad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4cdc6"/><stop offset="1" stop-color="#c2b9b1"/>
    </linearGradient>
    <path id="star4" d="M0,-4 C0.4,-1 1,-0.4 4,0 C1,0.4 0.4,1 0,4 C-0.4,1 -1,0.4 -4,0 C-1,-0.4 -0.4,-1 0,-4 Z"/>
    <g id="grassTuft"><path d="M0,0 C-1,-4 -3,-6 -6,-7 M0,0 C0,-4 0,-7 1,-10 M0,0 C1,-4 3,-6 6,-6" stroke="#a9b07e" stroke-width="0.9" fill="none" stroke-linecap="round"/></g>
  </defs>

  <g mask="url(#fade)">
    <!-- 天空 -->
    <rect width="400" height="260" fill="url(#sky)"/>
    <rect width="400" height="260" fill="url(#nightCorner)"/>
    <rect width="400" height="260" fill="url(#sunGlow)"/>
    <!-- 淡淡的星星和一弯残月 -->
    <g fill="#fdfaf0" opacity="0.9">
      <circle cx="318" cy="18" r="0.9"/><circle cx="340" cy="34" r="0.8"/><circle cx="362" cy="14" r="1"/><circle cx="384" cy="30" r="0.8"/>
      <circle cx="392" cy="56" r="0.8"/><circle cx="372" cy="62" r="0.7"/><circle cx="352" cy="58" r="0.6"/><circle cx="300" cy="40" r="0.7"/>
      <circle cx="330" cy="70" r="0.6"/><circle cx="388" cy="80" r="0.6"/><circle cx="286" cy="22" r="0.6" opacity="0.7"/><circle cx="306" cy="62" r="0.5" opacity="0.7"/>
    </g>
    <g fill="#fffcf2"><use href="#star4" transform="translate(348,22) scale(0.75)"/><use href="#star4" transform="translate(394,42) scale(0.6)"/></g>
    <path d="M376,42 C368,40 364,32 367,25 C369,21 372,19 375,18 C370,23 370,31 374,36 C376,39 379,41 383,41 C381,42 379,42.4 376,42 Z" fill="#fbf3dc" opacity="0.9"/>
    <g filter="url(#soft2)" opacity="0.7">
      <ellipse cx="150" cy="104" rx="30" ry="3.4" fill="#f7dcd0"/><ellipse cx="176" cy="100" rx="16" ry="2.8" fill="#f8e2d6"/>
      <ellipse cx="368" cy="116" rx="26" ry="3" fill="#fae2c8"/>
    </g>

    <g filter="url(#wc)">
      <!-- 海 -->
      <rect x="0" y="150" width="400" height="40" fill="url(#sea)"/>
      <!-- 刚露头的太阳 -->
      <path d="M332,150.5 C332,143 337.4,138 344,138 C350.6,138 356,143 356,150.5 Z" fill="#fde6b4"/>
      <!-- 海面上的光 -->
      <g fill="#fbe8c6" opacity="0.9">
        <rect x="330" y="153" width="28" height="1.6" rx="0.8"/><rect x="334" y="157" width="20" height="1.5" rx="0.75"/><rect x="326" y="161" width="16" height="1.4" rx="0.7"/>
        <rect x="346" y="161" width="12" height="1.4" rx="0.7"/><rect x="336" y="166" width="14" height="1.4" rx="0.7"/><rect x="322" y="171" width="10" height="1.3" rx="0.65"/>
        <rect x="344" y="171" width="16" height="1.3" rx="0.65"/><rect x="332" y="177" width="12" height="1.3" rx="0.65"/>
      </g>
      <g stroke="#d3dbe4" stroke-width="0.8" opacity="0.8">
        <line x1="20" y1="160" x2="60" y2="160"/><line x1="96" y1="166" x2="130" y2="166"/><line x1="150" y1="158" x2="180" y2="158"/><line x1="40" y1="174" x2="80" y2="174"/>
        <line x1="380" y1="166" x2="398" y2="166"/>
      </g>

      <!-- 海岸平地 -->
      <path d="M0,186 C80,182 160,180 240,182 C300,183 360,181 400,180 L400,260 L0,260 Z" fill="url(#land)"/>

      <!-- 远处的总装厂房和小楼 -->
      <rect x="66" y="146" width="54" height="40" fill="#ddd5cf"/>
      <rect x="66" y="146" width="54" height="3" fill="#e9e2dc"/>
      <rect x="112" y="146" width="8" height="40" fill="#cec5bf"/>
      <rect x="80" y="156" width="20" height="30" fill="#d1c8c2"/>
      <g stroke="#c6bdb7" stroke-width="0.7"><line x1="80" y1="164" x2="100" y2="164"/><line x1="80" y1="172" x2="100" y2="172"/><line x1="80" y1="180" x2="100" y2="180"/></g>
      <rect x="120" y="170" width="34" height="16" fill="#e4ddd6"/>
      <rect x="118" y="168" width="38" height="3" fill="#d6cec8"/>
      <g fill="#f3e2c2"><rect x="125" y="175" width="4" height="3"/><rect x="133" y="175" width="4" height="3"/><rect x="141" y="175" width="4" height="3"/></g>
      <rect x="40" y="176" width="22" height="10" fill="#e2dbd4"/>
      <!-- 远处的照明塔 -->
      <g stroke="#b2aaa6" stroke-width="1.2">
        <line x1="178" y1="186" x2="178" y2="132"/><line x1="356" y1="186" x2="356" y2="136"/>
      </g>
      <g fill="#fbefd0"><rect x="173" y="128" width="10" height="5" rx="1"/><rect x="351" y="132" width="10" height="5" rx="1"/></g>

      <!-- 发射台底座 -->
      <path d="M196,186 L324,186 L330,198 L190,198 Z" fill="url(#pad)"/>
      <rect x="190" y="197" width="140" height="5" fill="#b9afa6"/>
      <rect x="232" y="180" width="62" height="8" fill="#c9c0b8"/>

      <!-- 发射塔（格构架） -->
      <rect x="216" y="50" width="22" height="132" fill="#ead9cc" opacity="0.35"/>
      <g fill="none" stroke="#cf9676" stroke-width="1.1">
        <path d="M216,50 L238,72 L216,94 L238,116 L216,138 L238,160 L216,182"/>
        <path d="M238,50 L216,72 L238,94 L216,116 L238,138 L216,160 L238,182"/>
        <path d="M216,72 L238,72 M216,94 L238,94 M216,116 L238,116 M216,138 L238,138 M216,160 L238,160"/>
      </g>
      <g stroke="#c4825f" stroke-width="2.4"><line x1="216" y1="50" x2="216" y2="182"/><line x1="238" y1="50" x2="238" y2="182"/></g>
      <rect x="212" y="46" width="30" height="5" fill="#c08060"/>
      <!-- 通往舱门的连接臂 -->
      <rect x="238" y="62" width="16" height="5" fill="#cf9676"/>
      <rect x="238" y="67" width="16" height="1.4" fill="#b67a5c"/>

      <!-- 火箭 -->
      <g transform="translate(263,180) scale(1.15,1.08) translate(-263,-180)">
      <!-- 两侧助推器 -->
      <path d="M244,120 C244,112 246,106 249,102 C252,106 254,112 254,120 L254,172 L244,172 Z" fill="url(#booster)"/>
      <path d="M272,120 C272,112 274,106 277,102 C280,106 282,112 282,120 L282,172 L272,172 Z" fill="url(#booster)"/>
      <!-- 主体 -->
      <path d="M254,62 C254,48 258,40 263,32 C268,40 272,48 272,62 L272,174 L254,174 Z" fill="url(#body)"/>
      <!-- 舱段分隔、舷窗 -->
      <rect x="254" y="80" width="18" height="2.4" fill="#c9cdd6"/>
      <rect x="254" y="132" width="18" height="2" fill="#d3d6de"/>
      <g fill="#a9bdd0"><circle cx="263" cy="66" r="2.2"/><circle cx="263" cy="74" r="1.6"/></g>
      <g fill="#ffffff" opacity="0.7"><circle cx="262.3" cy="65.3" r="0.8"/></g>
      <rect x="244" y="150" width="10" height="2" fill="#d3d6de"/><rect x="272" y="150" width="10" height="2" fill="#d3d6de"/>
      <!-- 尾翼和喷口 -->
      <path d="M254,158 L248,174 L254,174 Z" fill="#c8a593"/><path d="M272,158 L278,174 L272,174 Z" fill="#d8b4a0"/>
      <path d="M256,174 L270,174 L268,180 L258,180 Z" fill="#a9a5a7"/>
      <path d="M245,172 L253,172 L252,177 L246,177 Z" fill="#a9a5a7"/><path d="M273,172 L281,172 L280,177 L274,177 Z" fill="#a9a5a7"/>
      <!-- 鼻锥上一点暖色反光 -->
      <path d="M266,40 C269,46 271,52 271.4,60 L268.6,60 C268.4,52 267.4,46 266,40 Z" fill="#fbe6cf" opacity="0.8"/>
      </g>

      <!-- 前景的沙丘和海边灌木 -->
      <path d="M0,214 C50,204 110,204 160,212 C200,218 230,222 260,218 C310,210 360,206 400,210 L400,260 L0,260 Z" fill="url(#dune)"/>
      <g fill="#aab384">
        <circle cx="34" cy="210" r="7"/><circle cx="44" cy="206" r="8.5"/><circle cx="56" cy="209" r="7"/><circle cx="64" cy="212" r="5"/>
        <circle cx="324" cy="210" r="6.5"/><circle cx="334" cy="206" r="7.5"/><circle cx="345" cy="209" r="6"/>
        <circle cx="116" cy="192" r="4"/><circle cx="122" cy="190" r="4.6"/><circle cx="128" cy="192" r="3.6"/>
        <circle cx="372" cy="190" r="3.6"/><circle cx="378" cy="188" r="4.2"/>
      </g>
      <g fill="#c3c99a"><circle cx="42" cy="202" r="4.4"/><circle cx="54" cy="205" r="3.4"/><circle cx="332" cy="202" r="4"/><circle cx="121" cy="188" r="2.4"/><circle cx="377" cy="186" r="2.2"/></g>
      <g fill="#949d72" opacity="0.7"><ellipse cx="48" cy="215" rx="16" ry="2.6"/><ellipse cx="335" cy="214" rx="13" ry="2.4"/></g>
      <g>
        <use href="#grassTuft" transform="translate(90,226)"/><use href="#grassTuft" transform="translate(104,232) scale(1.2)"/><use href="#grassTuft" transform="translate(196,238) scale(1.1)"/>
        <use href="#grassTuft" transform="translate(282,232) scale(1.2)"/><use href="#grassTuft" transform="translate(300,240)"/><use href="#grassTuft" transform="translate(372,228) scale(1.1)"/>
        <use href="#grassTuft" transform="translate(24,240) scale(1.2)"/><use href="#grassTuft" transform="translate(150,246) scale(1.3)"/>
      </g>
      <!-- 通往发射台的小路 -->
      <path d="M226,262 C230,240 246,222 256,202 L266,202 C262,222 254,242 254,262 Z" fill="#efe3c8" opacity="0.9"/>
    </g>

    <!-- 发射台下的白色水汽 -->
    <g filter="url(#soft)" opacity="0.85" fill="#fbf8f2">
      <ellipse cx="240" cy="190" rx="22" ry="7"/><ellipse cx="286" cy="191" rx="18" ry="6"/><ellipse cx="300" cy="186" rx="10" ry="6"/>
    </g>
    <g filter="url(#soft2)" opacity="0.18" fill="#7a6a5e">
      <ellipse cx="260" cy="203" rx="72" ry="3"/>
    </g>

    <!-- 纸纹 -->
    <rect width="400" height="260" filter="url(#grain)"/>
  </g>
</svg>
