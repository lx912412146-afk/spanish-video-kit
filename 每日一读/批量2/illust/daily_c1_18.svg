        <ellipse cx="159.0" cy="165" rx="3.6" ry="3.0"/><ellipse cx="170.1" cy="165" rx="3.6" ry="3.0"/><ellipse cx="181.2" cy="165" rx="3.6" ry="3.0"/><ellipse cx="192.3" cy="165" rx="3.6" ry="3.0"/><ellipse cx="203.4" cy="165" rx="3.6" ry="3.0"/><ellipse cx="214.6" cy="165" rx="3.6" ry="3.0"/><ellipse cx="225.7" cy="165" rx="3.6" ry="3.0"/><ellipse cx="236.8" cy="165" rx="3.6" ry="3.0"/><ellipse cx="247.9" cy="165" rx="3.6" ry="3.0"/><ellipse cx="259.0" cy="165" rx="3.6" ry="3.0"/>
        <ellipse cx="152.0" cy="174" rx="3.9" ry="3.2"/><ellipse cx="164.0" cy="174" rx="3.9" ry="3.2"/><ellipse cx="176.0" cy="174" rx="3.9" ry="3.2"/><ellipse cx="188.0" cy="174" rx="3.9" ry="3.2"/><ellipse cx="200.0" cy="174" rx="3.9" ry="3.2"/><ellipse cx="212.0" cy="174" rx="3.9" ry="3.2"/><ellipse cx="224.0" cy="174" rx="3.9" ry="3.2"/><ellipse cx="236.0" cy="174" rx="3.9" ry="3.2"/><ellipse cx="248.0" cy="174" rx="3.9" ry="3.2"/><ellipse cx="260.0" cy="174" rx="3.9" ry="3.2"/>
        <ellipse cx="156.0" cy="183" rx="4.2" ry="3.4"/><ellipse cx="168.5" cy="183" rx="4.2" ry="3.4"/><ellipse cx="181.0" cy="183" rx="4.2" ry="3.4"/><ellipse cx="193.5" cy="183" rx="4.2" ry="3.4"/><ellipse cx="206.0" cy="183" rx="4.2" ry="3.4"/><ellipse cx="218.5" cy="183" rx="4.2" ry="3.4"/><ellipse cx="231.0" cy="183" rx="4.2" ry="3.4"/><ellipse cx="243.5" cy="183" rx="4.2" ry="3.4"/><ellipse cx="256.0" cy="183" rx="4.2" ry="3.4"/>
      </g>
      <g fill="#efe7d8">
