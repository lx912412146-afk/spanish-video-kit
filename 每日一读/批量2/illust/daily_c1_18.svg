        <path d="M-6,-5 L-1,-2 L5,-6 M-1,-2 L0,3 L7,4 M0,3 L-4,6 M-8,1 L-1,-2 M2,7 L0,3" stroke="#dccdb2" stroke-width="0.8" fill="none"/>
        <path d="M-1,-8 L-1,-2 L8,-1" stroke="#e8dcc6" stroke-width="0.6" fill="none"/>
