      <g stroke="#9aaea4" stroke-width="0.7"><line x1="206" y1="146" x2="186" y2="142.6"/><line x1="206" y1="146" x2="194" y2="141.4"/><line x1="206" y1="146" x2="202" y2="140.8"/><line x1="206" y1="146" x2="210" y2="140.8"/><line x1="206" y1="146" x2="218" y2="141.4"/><line x1="206" y1="146" x2="226" y2="142.6"/></g>
      <g><circle cx="168" cy="143" r="5.2" fill="#c8734d"/><circle cx="168" cy="143" r="1.8" fill="#e9dfcb"/><circle cx="244" cy="143" r="5.2" fill="#c8734d"/><circle cx="244" cy="143" r="1.8" fill="#e9dfcb"/></g>
      <!-- 键盘 -->
