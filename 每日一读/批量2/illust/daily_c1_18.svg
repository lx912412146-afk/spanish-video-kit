    </g>

    <!-- 台灯的光 -->
    <ellipse cx="282" cy="200" rx="90" ry="26" fill="url(#lampGlow)" opacity="0.8"/>

    <!-- 桌上物件的阴影 -->
    <g filter="url(#soft2)" opacity="0.22" fill="#8a6a4a">
      <ellipse cx="206" cy="202" rx="76" ry="5"/><ellipse cx="80" cy="222" rx="46" ry="4"/><ellipse cx="306" cy="222" rx="22" ry="3"/>
      <ellipse cx="358" cy="214" rx="20" ry="3"/><ellipse cx="190" cy="230" rx="34" ry="2"/>
    </g>

