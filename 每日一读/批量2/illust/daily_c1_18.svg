<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 260" width="400" height="260">
  <!-- 原创插图：书桌上的老式打字机、一叠空白稿纸、钢笔、一杯咖啡和台灯（水彩风格，纯 SVG 手绘） -->
  <defs>
    <filter id="wc" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="0.35"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="g"/>
      <feColorMatrix in="g" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.38  0 0 0 0 0.3  0 0 0 0.09 0"/>
    </filter>
    <filter id="edge" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="5"/></filter>
    <mask id="fade" maskUnits="userSpaceOnUse" x="0" y="0" width="400" height="260">
      <rect x="7" y="7" width="386" height="246" rx="4" fill="#fff" filter="url(#edge)"/>
    </mask>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf3e6"/><stop offset="0.6" stop-color="#f8e9d6"/><stop offset="1" stop-color="#f3dec6"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ddb995"/><stop offset="1" stop-color="#cfa77f"/>
    </linearGradient>
    <linearGradient id="deskF" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b98e67"/><stop offset="1" stop-color="#a77d58"/>
    </linearGradient>
    <linearGradient id="tw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a6bdb3"/><stop offset="1" stop-color="#83a092"/>
    </linearGradient>
    <linearGradient id="twD" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7a978a"/><stop offset="0.5" stop-color="#90ab9e"/><stop offset="1" stop-color="#718e81"/>
    </linearGradient>
    <linearGradient id="platen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a8079"/><stop offset="0.45" stop-color="#6f665f"/><stop offset="1" stop-color="#5d554f"/>
    </linearGradient>
    <linearGradient id="sheet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4eddf"/><stop offset="0.4" stop-color="#fdfaf2"/><stop offset="1" stop-color="#efe6d4"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e59b74"/><stop offset="1" stop-color="#c8734d"/>
    </linearGradient>
    <linearGradient id="cup" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ece5d8"/><stop offset="0.4" stop-color="#fbf8f1"/><stop offset="1" stop-color="#ddd3c3"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3d6"/><stop offset="1" stop-color="#fff3d6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g mask="url(#fade)">
    <!-- 墙面 -->
    <rect width="400" height="260" fill="url(#wall)"/>
    <g filter="url(#soft2)" opacity="0.14" fill="#8a6a4a">
      <rect x="32" y="76" width="78" height="60"/>
    </g>

    <g filter="url(#wc)">
      <g transform="translate(-14,0)">
      <!-- 墙上的软木板和空白卡片 -->
      <rect x="40" y="70" width="80" height="60" fill="#c99d74"/>
      <rect x="44" y="74" width="72" height="52" fill="#dcb98f"/>
      <g fill="#cfa97e" opacity="0.6"><circle cx="52" cy="82" r="1"/><circle cx="70" cy="120" r="1.2"/><circle cx="108" cy="80" r="1"/><circle cx="96" cy="118" r="1"/><circle cx="60" cy="104" r="0.9"/></g>
      <rect x="50" y="80" width="24" height="17" fill="#fbf6ea" transform="rotate(-4 62 88)"/>
      <rect x="80" y="78" width="22" height="16" fill="#f4e3b4" transform="rotate(3 91 86)"/>
      <rect x="56" y="102" width="22" height="16" fill="#dfe7e2" transform="rotate(2 67 110)"/>
      <rect x="84" y="100" width="24" height="18" fill="#fbf6ea" transform="rotate(-3 96 109)"/>
      <g fill="#d0805c"><circle cx="62" cy="81.5" r="1.6"/><circle cx="91" cy="79.5" r="1.6"/><circle cx="67" cy="103.5" r="1.6"/><circle cx="96" cy="101.5" r="1.6"/></g>

      </g>
      <!-- 书桌 -->
      <rect x="0" y="172" width="400" height="62" fill="url(#desk)"/>
      <rect x="0" y="170" width="400" height="3" fill="#e9cfae"/>
      <rect x="0" y="234" width="400" height="26" fill="url(#deskF)"/>
      <rect x="0" y="232" width="400" height="3" fill="#e4c6a0"/>
      <g stroke="#c49e76" stroke-width="0.8" opacity="0.5" fill="none">
        <path d="M0,186 C80,184 160,188 240,185 C300,183 360,186 400,185"/><path d="M0,214 C90,212 170,217 260,213 C320,211 370,214 400,213"/>
