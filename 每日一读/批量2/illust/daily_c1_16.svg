<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 260" width="400" height="260">
  <!-- 原创插图：湖边树林里的一座小木屋，门口一把椅子、一摞木柴，烟囱冒着淡淡的烟（水彩风格，纯 SVG 手绘） -->
  <defs>
    <filter id="wc" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="0.35"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="g"/>
      <feColorMatrix in="g" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.38  0 0 0 0 0.3  0 0 0 0.09 0"/>
    </filter>
    <filter id="edge" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="5"/></filter>
    <mask id="fade" maskUnits="userSpaceOnUse" x="0" y="0" width="400" height="260">
      <rect x="7" y="7" width="386" height="246" rx="4" fill="#fff" filter="url(#edge)"/>
    </mask>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3edee"/><stop offset="0.6" stop-color="#eff1e8"/><stop offset="1" stop-color="#f5efe2"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dfe9e6"/><stop offset="1" stop-color="#b9d2d0"/>
    </linearGradient>
    <linearGradient id="mtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bccbd2"/><stop offset="1" stop-color="#d3dcdc"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bcd49b"/><stop offset="1" stop-color="#a2c084"/>
    </linearGradient>
    <linearGradient id="logs" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c49a70"/><stop offset="1" stop-color="#b78c64"/>
    </linearGradient>
    <linearGradient id="gable" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d8b28a"/><stop offset="1" stop-color="#cba37b"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#94807a"/><stop offset="1" stop-color="#7f6c66"/>
    </linearGradient>
    <linearGradient id="pineG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8fb38a"/><stop offset="1" stop-color="#729a73"/>
    </linearGradient>
    <g id="pine">
      <rect x="-2" y="-8" width="4" height="10" fill="#94775a"/>
      <path d="M0,-70 L-12,-44 L-6,-46 L-18,-24 L-10,-26 L-24,-4 L24,-4 L10,-26 L18,-24 L6,-46 L12,-44 Z" fill="url(#pineG)"/>
      <path d="M0,-70 L-12,-44 L-6,-46 L-18,-24 L-10,-26 L-24,-4 L0,-4 Z" fill="#a3c39a" opacity="0.45"/>
    </g>
    <path id="spine" d="M0,0 L-4,0 L-1.6,-4 L-3,-4 L0,-10 L3,-4 L1.6,-4 L4,0 Z"/>
    <g id="logEnd"><circle r="4.2" fill="#9e7450"/><circle r="3.3" fill="#e9cca0"/><circle r="1.8" fill="none" stroke="#cfa77c" stroke-width="0.6"/></g>
  </defs>

  <g mask="url(#fade)">
    <!-- 天空 -->
    <rect width="400" height="260" fill="url(#sky)"/>
    <g filter="url(#soft2)" fill="#ffffff" opacity="0.8">
      <ellipse cx="160" cy="62" rx="20" ry="5"/><ellipse cx="172" cy="58" rx="12" ry="5"/>
    </g>

    <g filter="url(#wc)">
      <!-- 远山和对岸 -->
      <path d="M0,112 C30,100 60,84 92,88 C120,92 142,78 170,82 C200,86 226,100 250,110 L250,130 L0,130 Z" fill="url(#mtn)"/>
      <g fill="#a7bfae">
        <use href="#spine" transform="translate(12,130) scale(1.1)"/><use href="#spine" transform="translate(22,130) scale(1.4)"/><use href="#spine" transform="translate(34,130)"/><use href="#spine" transform="translate(48,130) scale(1.3)"/>
        <use href="#spine" transform="translate(120,130) scale(1.1)"/><use href="#spine" transform="translate(130,130) scale(1.4)"/><use href="#spine" transform="translate(142,130) scale(1)"/><use href="#spine" transform="translate(186,130) scale(1.2)"/><use href="#spine" transform="translate(198,130) scale(1.5)"/>
      </g>
      <path d="M0,131 L0,127 C60,125 140,127 250,126 L250,131 Z" fill="#b2c6ae"/>
    </g>

    <!-- 湖面 -->
    <path d="M0,130 L250,130 L250,196 C190,198 120,204 60,212 C30,216 10,218 0,220 Z" fill="url(#water)"/>
    <g opacity="0.35" filter="url(#soft2)">
      <path d="M0,148 C30,160 60,176 92,172 C120,168 142,182 170,178 C200,174 226,160 250,150 L250,130 L0,130 Z" fill="#9fb4bd"/>
    </g>

    <g filter="url(#wc)">
      <g stroke="#f4f7f3" stroke-width="1.1" stroke-linecap="round" opacity="0.85">
        <line x1="30" y1="150" x2="70" y2="150"/><line x1="110" y1="160" x2="150" y2="160"/><line x1="40" y1="186" x2="90" y2="186"/><line x1="150" y1="182" x2="186" y2="182"/><line x1="16" y1="204" x2="44" y2="204"/>
      </g>

      <!-- 屋后的松林 -->
      <use href="#pine" transform="translate(262,166) scale(1.25)"/>
      <use href="#pine" transform="translate(378,168) scale(1.7)"/>
      <use href="#pine" transform="translate(338,164) scale(1.55)"/>
      <use href="#pine" transform="translate(300,160) scale(1.35)"/>
      <use href="#pine" transform="translate(222,160) scale(0.95)"/>

      <!-- 岸边的草地 -->
      <path d="M100,206 C140,192 190,178 230,172 C280,166 340,162 404,160 L404,264 L-4,264 L-4,226 C30,220 64,214 100,206 Z" fill="url(#grass)"/>
      <path d="M100,206 C140,192 190,178 230,172" stroke="#d6e3bf" stroke-width="2" fill="none" opacity="0.7"/>
    </g>

    <!-- 木屋的影子 -->
    <g filter="url(#soft2)" opacity="0.2" fill="#5f7a4a">
      <path d="M200,186 L322,190 L340,196 L214,194 Z"/>
    </g>

    <!-- 炊烟 -->
    <g filter="url(#soft2)" fill="#d6d2cc">
      <ellipse cx="293" cy="83" rx="4" ry="3.4" opacity="0.95"/><ellipse cx="290" cy="75" rx="5" ry="4" opacity="0.9"/><ellipse cx="294" cy="66" rx="6" ry="4.4" opacity="0.82"/>
      <ellipse cx="301" cy="57" rx="7" ry="4.8" opacity="0.72"/><ellipse cx="310" cy="48" rx="8" ry="5" opacity="0.6"/><ellipse cx="321" cy="40" rx="9" ry="5" opacity="0.46"/><ellipse cx="333" cy="34" rx="9" ry="4.4" opacity="0.32"/>
      <ellipse cx="291" cy="79" rx="4.2" ry="3.4" opacity="0.85"/><ellipse cx="291.5" cy="70.5" rx="5.2" ry="4" opacity="0.78"/><ellipse cx="297" cy="61.5" rx="6.2" ry="4.4" opacity="0.7"/><ellipse cx="305" cy="52.5" rx="7.2" ry="4.6" opacity="0.58"/><ellipse cx="315" cy="44" rx="8.2" ry="4.8" opacity="0.46"/><ellipse cx="327" cy="37" rx="8.6" ry="4.4" opacity="0.34"/>
    </g>
    <g filter="url(#soft2)" fill="#f6f4ef">
      <ellipse cx="291" cy="74" rx="2.6" ry="2" opacity="0.8"/><ellipse cx="295" cy="65" rx="3.4" ry="2.4" opacity="0.7"/><ellipse cx="302" cy="56" rx="4" ry="2.6" opacity="0.6"/><ellipse cx="311" cy="47" rx="4.4" ry="2.6" opacity="0.5"/>
    </g>

    <g filter="url(#wc)">
      <!-- 木屋：山墙一端 -->
      <path d="M200,184 L200,136 L214,112 L228,138 L228,190 Z" fill="url(#gable)"/>
      <g stroke="#b8916a" stroke-width="0.8" opacity="0.8">
        <line x1="205" y1="128" x2="205" y2="186"/><line x1="210" y1="119" x2="210" y2="187"/><line x1="215" y1="114" x2="215" y2="188"/><line x1="220" y1="120" x2="220" y2="189"/><line x1="225" y1="130" x2="225" y2="189"/>
      </g>
      <path d="M207,146 L220,148 L220,162 L207,160 Z" fill="#cfe0e0"/>
      <path d="M207,146 L220,148 L220,162 L207,160 Z" fill="none" stroke="#efe3cc" stroke-width="1.6"/>
      <path d="M213.5,147 L213.5,161" stroke="#efe3cc" stroke-width="1"/>
      <!-- 正面的原木墙 -->
      <rect x="228" y="138" width="88" height="52" fill="url(#logs)"/>
      <g stroke="#a47a55" stroke-width="1" opacity="0.75">
        <line x1="228" y1="145" x2="316" y2="145"/><line x1="228" y1="152" x2="316" y2="152"/><line x1="228" y1="159" x2="316" y2="159"/><line x1="228" y1="166" x2="316" y2="166"/>
        <line x1="228" y1="173" x2="316" y2="173"/><line x1="228" y1="180" x2="316" y2="180"/>
      </g>
      <g fill="#d9b58c">
        <circle cx="228" cy="141.5" r="3"/><circle cx="228" cy="148.5" r="3"/><circle cx="228" cy="155.5" r="3"/><circle cx="228" cy="162.5" r="3"/><circle cx="228" cy="169.5" r="3"/><circle cx="228" cy="176.5" r="3"/><circle cx="228" cy="183.5" r="3"/>
      </g>
      <!-- 屋顶和烟囱 -->
      <rect x="286" y="90" width="13" height="26" fill="#bfb1a2"/>
      <rect x="284" y="87" width="17" height="5" rx="1" fill="#a89a8c"/>
      <g stroke="#a89a8c" stroke-width="0.8"><line x1="286" y1="100" x2="299" y2="100"/><line x1="286" y1="108" x2="299" y2="108"/><line x1="292" y1="92" x2="292" y2="100"/><line x1="290" y1="100" x2="290" y2="108"/><line x1="295" y1="108" x2="295" y2="116"/></g>
      <path d="M214,110 L306,110 L324,142 L226,142 Z" fill="url(#roof)"/>
      <g stroke="#a9978f" stroke-width="0.8" opacity="0.8"><line x1="218" y1="118" x2="310" y2="118"/><line x1="221" y1="126" x2="315" y2="126"/><line x1="224" y1="134" x2="319" y2="134"/></g>
      <path d="M214,108 L196,138 L200,139 L214,115 L228,142 L232,142 Z" fill="#7a6660"/>
      <rect x="226" y="141" width="98" height="3" fill="#6f5d57" opacity="0.8"/>
      <!-- 门、窗、台阶 -->
      <rect x="246" y="152" width="18" height="36" fill="#9c6e4c"/>
      <g stroke="#875d3f" stroke-width="0.8"><line x1="252" y1="153" x2="252" y2="188"/><line x1="258" y1="153" x2="258" y2="188"/></g>
      <rect x="244" y="150" width="22" height="3" fill="#e6d2b2"/>
      <circle cx="260.5" cy="171" r="1.2" fill="#d9b863"/>
      <rect x="282" y="152" width="22" height="16" fill="#cfe0e0"/>
      <rect x="282" y="152" width="22" height="16" fill="none" stroke="#efe3cc" stroke-width="2"/>
      <path d="M293,152 L293,168 M282,160 L304,160" stroke="#efe3cc" stroke-width="1.2"/>
      <rect x="280" y="168" width="26" height="3" fill="#e6d2b2"/>
      <ellipse cx="287" cy="156" rx="2" ry="1.4" fill="#fff" opacity="0.7"/>
      <rect x="240" y="188" width="30" height="4" rx="1" fill="#d2b08a"/>
      <rect x="236" y="191" width="38" height="4" rx="1" fill="#c49e76"/>

      <!-- 门边的椅子 -->
      <g stroke="#d6c4a6" stroke-width="2" stroke-linecap="round" fill="none">
        <path d="M226,184 L225,199 M243,186.5 L242.5,201 M250,180 L250.5,195"/>
      </g>
      <path d="M237,154 L253,157 L251,181 L235,178 Z" fill="#f3e9d8"/>
      <g stroke="#dccbb0" stroke-width="1"><line x1="241" y1="155" x2="239.5" y2="178.8"/><line x1="245" y1="155.8" x2="243.5" y2="179.6"/><line x1="249" y1="156.5" x2="247.5" y2="180.4"/></g>
      <path d="M229,178 L251,181 L244,187.5 L223,184.5 Z" fill="#efe3cc"/>
      <path d="M223,184.5 L244,187.5 L244,190 L223,187 Z" fill="#d6c4a6"/>
      <path d="M227,170 L238,171.6 M227,170 L226,184" stroke="#e8dcc4" stroke-width="2" stroke-linecap="round" fill="none"/>

      <!-- 一摞木柴 -->
      <g>
        <use href="#logEnd" transform="translate(308,186)"/><use href="#logEnd" transform="translate(316.4,186)"/><use href="#logEnd" transform="translate(324.8,186)"/><use href="#logEnd" transform="translate(333.2,186)"/>
        <use href="#logEnd" transform="translate(312.2,178.6)"/><use href="#logEnd" transform="translate(320.6,178.6)"/><use href="#logEnd" transform="translate(329,178.6)"/>
        <use href="#logEnd" transform="translate(316.4,171.2)"/><use href="#logEnd" transform="translate(324.8,171.2)"/>
        <use href="#logEnd" transform="translate(320.6,163.8)"/>
      </g>
      <path d="M340,190 L356,188" stroke="#9e7450" stroke-width="3" stroke-linecap="round"/>
      <path d="M346,193 L360,192" stroke="#b08860" stroke-width="2.6" stroke-linecap="round"/>

      <!-- 小路通到湖边 -->
      <path d="M244,196 C236,204 214,206 196,212 C178,218 168,226 160,236 L176,238 C182,228 196,222 214,216 C232,210 254,206 262,196 Z" fill="#e6d8bc"/>

      <!-- 前景的草丛、野花和一棵小松 -->
      <use href="#pine" transform="translate(30,246) scale(1.05)"/>
      <g fill="#9cbd80">
        <ellipse cx="96" cy="240" rx="18" ry="6"/><ellipse cx="340" cy="232" rx="24" ry="7"/><ellipse cx="226" cy="246" rx="16" ry="5"/>
      </g>
      <g fill="#fbf7ee"><circle cx="90" cy="236" r="1.6"/><circle cx="100" cy="238" r="1.6"/><circle cx="334" cy="228" r="1.6"/><circle cx="346" cy="230" r="1.6"/><circle cx="222" cy="243" r="1.5"/></g>
      <g fill="#f1cf6e"><circle cx="96" cy="234" r="1.4"/><circle cx="340" cy="226" r="1.5"/><circle cx="230" cy="244" r="1.3"/></g>
      <g stroke="#8db06f" stroke-width="1.2" fill="none" stroke-linecap="round">
        <path d="M130,216 l-2,-6 M134,216 l1,-7 M138,216 l3,-5"/><path d="M286,214 l-2,-6 M290,214 l1,-7"/><path d="M372,206 l-2,-6 M376,206 l1,-7"/><path d="M190,232 l-2,-5 M194,232 l1,-6"/>
      </g>
      <!-- 湖边的石头 -->
      <ellipse cx="146" cy="203" rx="8" ry="3.6" fill="#c9c5bb"/><ellipse cx="156" cy="205" rx="5" ry="2.6" fill="#d7d2c6"/>
    </g>

    <!-- 地面阴影 -->
    <g filter="url(#soft2)" opacity="0.2" fill="#5f7a4a">
      <ellipse cx="238" cy="199" rx="16" ry="2.2"/><ellipse cx="322" cy="191" rx="20" ry="2.2"/><ellipse cx="30" cy="246" rx="18" ry="2.4"/>
    </g>
    <!-- 纸纹 -->
    <rect width="400" height="260" filter="url(#grain)"/>
  </g>
</svg>
