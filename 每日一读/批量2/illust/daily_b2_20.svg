<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 260" width="400" height="260">
  <!-- 原创插图：青年旅舍的房间，上下铺、床上的大背包、墙上一张打开的地图（不写字）、柜子上的水壶（水彩风格，纯 SVG 手绘，无外部素材） -->
  <defs>
    <filter id="wc" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="0.35"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="g"/>
      <feColorMatrix in="g" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.38  0 0 0 0 0.3  0 0 0 0.09 0"/>
    </filter>
    <filter id="edge" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="5"/></filter>
    <mask id="fade" maskUnits="userSpaceOnUse" x="0" y="0" width="400" height="260">
      <rect x="7" y="7" width="386" height="246" rx="4" fill="#fff" filter="url(#edge)"/>
    </mask>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf3e6"/><stop offset="0.6" stop-color="#f8e9d6"/><stop offset="1" stop-color="#f4dfc8"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3c6a0"/><stop offset="1" stop-color="#d9b991"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe4ee"/><stop offset="0.7" stop-color="#e6f0ef"/><stop offset="1" stop-color="#f4f2e6"/>
    </linearGradient>
    <linearGradient id="woodV" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c99d74"/><stop offset="0.5" stop-color="#d8b088"/><stop offset="1" stop-color="#c3966c"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8b088"/><stop offset="1" stop-color="#c39669"/>
    </linearGradient>
    <linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8f4ec"/><stop offset="1" stop-color="#e9e2d6"/>
    </linearGradient>
    <linearGradient id="blanketG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b6cfa3"/><stop offset="1" stop-color="#9fbd8c"/>
    </linearGradient>
    <linearGradient id="blanketR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3a588"/><stop offset="1" stop-color="#cf8a6c"/>
    </linearGradient>
    <linearGradient id="pack" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6f9fb0"/><stop offset="0.5" stop-color="#86b3c2"/><stop offset="1" stop-color="#6a98a8"/>
    </linearGradient>
    <linearGradient id="locker" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#bfcdd3"/><stop offset="0.5" stop-color="#cfdade"/><stop offset="1" stop-color="#b3c2c9"/>
    </linearGradient>
    <linearGradient id="bottle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7fb0aa"/><stop offset="0.45" stop-color="#a8d0ca"/><stop offset="1" stop-color="#74a49e"/>
    </linearGradient>
    <linearGradient id="curtain" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6e4b8"/><stop offset="0.5" stop-color="#fbedc8"/><stop offset="1" stop-color="#efd9a8"/>
    </linearGradient>
    <radialGradient id="bulb" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff1c2" stop-opacity="0.9"/><stop offset="1" stop-color="#fbe4a6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g mask="url(#fade)">
    <!-- 墙面和地板 -->
    <rect width="400" height="260" fill="url(#wall)"/>
    <rect x="0" y="222" width="400" height="38" fill="url(#floor)"/>
    <g stroke="#cfae86" stroke-width="0.8" opacity="0.7">
      <line x1="0" y1="234" x2="400" y2="234"/><line x1="0" y1="247" x2="400" y2="247"/>
      <line x1="70" y1="222" x2="66" y2="234"/><line x1="210" y1="234" x2="207" y2="247"/><line x1="330" y1="222" x2="332" y2="234"/>
      <line x1="140" y1="247" x2="138" y2="260"/><line x1="290" y1="247" x2="292" y2="260"/>
    </g>
    <rect x="0" y="219" width="400" height="4" fill="#e7cfb0"/>

    <g filter="url(#wc)">
      <!-- 窗户和窗外的老城屋顶 -->
      <rect x="292" y="46" width="86" height="84" fill="url(#sky)"/>
      <g filter="url(#soft2)" fill="#ffffff" opacity="0.85"><ellipse cx="320" cy="62" rx="14" ry="4"/><ellipse cx="330" cy="59" rx="8" ry="4"/></g>
      <path d="M292,130 L292,104 L304,98 L316,104 L316,96 L330,88 L344,96 L344,102 L356,96 L368,102 L378,98 L378,130 Z" fill="#ead8c6"/>
      <g fill="#d99a7c"><path d="M290,105 L304,96 L318,105 Z"/><path d="M314,97 L330,86 L346,97 Z"/><path d="M342,103 L356,94 L370,103 Z"/></g>
      <path d="M292,130 L292,116 L318,116 L318,110 L340,110 L340,118 L362,118 L362,112 L378,112 L378,130 Z" fill="#e2cdb9"/>
      <g fill="#f4ece0"><rect x="298" y="120" width="4" height="5"/><rect x="306" y="120" width="4" height="5"/><rect x="326" y="115" width="4" height="5"/><rect x="348" y="122" width="4" height="5"/><rect x="368" y="117" width="4" height="5"/></g>
      <g fill="none" stroke="#efe2cf" stroke-linejoin="round">
        <rect x="290" y="44" width="90" height="88" stroke-width="5"/>
        <line x1="335" y1="44" x2="335" y2="132" stroke-width="3.5"/>
      </g>
      <rect x="284" y="131" width="102" height="5" rx="1.5" fill="#ecdcc4"/>
      <!-- 窗帘 -->
      <rect x="276" y="38" width="118" height="3" rx="1.5" fill="#c9a57c"/>
      <path d="M278,40 L296,40 C294,70 298,100 292,136 L280,136 C282,104 276,70 278,40 Z" fill="url(#curtain)"/>
      <path d="M374,40 L392,40 C390,72 394,104 392,136 L378,136 C380,100 372,70 374,40 Z" fill="url(#curtain)"/>

      <!-- 墙上打开的地图（不写字） -->
      <rect x="146" y="118" width="64" height="42" fill="#cfe2e6"/>
      <path d="M146,124 C156,122 160,130 170,128 C180,126 182,136 176,144 C170,152 158,150 150,156 L146,158 Z" fill="#cfe3b4"/>
      <path d="M190,118 C186,126 194,134 204,132 C208,140 202,150 210,154 L210,118 Z" fill="#e3dcae"/>
      <path d="M184,150 C188,146 196,148 196,154 C196,158 188,160 184,156 Z" fill="#cfe3b4"/>
      <path d="M156,130 C164,126 170,138 180,140 C188,141 194,132 200,138" stroke="#d9775e" stroke-width="1" stroke-dasharray="2 1.6" fill="none"/>
      <g stroke="#b9cbd0" stroke-width="0.8" opacity="0.9"><line x1="167" y1="118" x2="167" y2="160"/><line x1="189" y1="118" x2="189" y2="160"/><line x1="146" y1="139" x2="210" y2="139"/></g>
      <rect x="146" y="118" width="64" height="42" fill="none" stroke="#e8dfcf" stroke-width="1.2"/>
      <g fill="#d9775e"><circle cx="148.6" cy="120.4" r="1.4"/><circle cx="207.4" cy="120.4" r="1.4"/></g>
      <circle cx="156" cy="130" r="1.6" fill="#d9775e"/><circle cx="200" cy="138" r="1.6" fill="#d9775e"/>

      <!-- 上下铺 -->
      <!-- 立柱 -->
      <rect x="40" y="58" width="7" height="166" fill="url(#woodV)"/>
      <rect x="244" y="58" width="7" height="166" fill="url(#woodV)"/>
      <rect x="39" y="55" width="9" height="5" rx="2" fill="#dcb68c"/><rect x="243" y="55" width="9" height="5" rx="2" fill="#dcb68c"/>
      <!-- 上铺：床垫、枕头、被子 -->
      <rect x="47" y="86" width="197" height="12" rx="3" fill="url(#sheet)"/>
      <path d="M52,87 C52,80 56,78 66,78 L82,78 C88,78 90,82 90,87 Z" fill="#fbf8f2"/>
      <path d="M92,90 C92,84 98,82 110,82 L214,82 C222,82 226,86 226,92 L226,98 L92,98 Z" fill="url(#blanketG)"/>
      <g stroke="#a9c595" stroke-width="0.9" opacity="0.8" fill="none"><path d="M118,84 C122,88 122,94 120,98"/><path d="M160,83 C164,88 164,94 162,98"/><path d="M196,83 C200,88 200,94 198,98"/></g>
      <rect x="40" y="98" width="211" height="9" fill="url(#rail)"/>
      <!-- 上铺护栏 -->
      <rect x="47" y="66" width="150" height="4" rx="1.5" fill="#d8b088"/>
      <rect x="194" y="66" width="4" height="32" fill="#cfa77d"/>
      <!-- 灯串 -->
      <path d="M50,70 C70,80 90,80 110,72 C130,82 150,82 170,72 C180,76 188,78 196,72" stroke="#b5a48e" stroke-width="0.7" fill="none"/>
      <!-- 挂在护栏上的毛巾 -->
      <path d="M200,98 L222,98 L224,128 L202,128 Z" fill="#dfe9ee"/>
      <g fill="#9db4c6"><rect x="200.5" y="106" width="22.5" height="3"/><rect x="201" y="118" width="22.6" height="3"/></g>

      <!-- 下铺：床垫、枕头、被子 -->
      <rect x="47" y="168" width="197" height="12" rx="3" fill="url(#sheet)"/>
      <path d="M52,169 C52,162 56,160 66,160 L82,160 C88,160 90,164 90,169 Z" fill="#fbf8f2"/>
      <path d="M176,172 C176,166 182,164 192,164 L218,164 C226,164 230,168 230,174 L230,180 L176,180 Z" fill="url(#blanketR)"/>
      <path d="M176,172 L230,172" stroke="#c47e61" stroke-width="0.9" opacity="0.8"/>
      <rect x="40" y="180" width="211" height="10" fill="url(#rail)"/>

      <!-- 床上的大背包 -->
      <g>
        <!-- 绑在底部的防潮垫 -->
        <rect x="94" y="158" width="52" height="12" rx="6" fill="#e6b85c"/>
        <g stroke="#cf9f45" stroke-width="0.8"><line x1="104" y1="158.6" x2="104" y2="169.4"/><line x1="136" y1="158.6" x2="136" y2="169.4"/></g>
        <!-- 包身 -->
        <path d="M100,160 C98,140 98,124 102,114 C106,106 114,104 120,104 C128,104 136,106 139,114 C142,124 142,140 140,160 Z" fill="url(#pack)"/>
        <!-- 顶盖 -->
        <path d="M100,118 C100,106 110,100 120,100 C130,100 140,106 140,118 C134,114 106,114 100,118 Z" fill="#5f8fa0"/>
        <!-- 前袋 -->
        <path d="M107,132 L133,132 C135,132 136,134 136,136 L135,154 C135,156 133,157 131,157 L109,157 C107,157 105,156 105,154 L104,136 C104,134 105,132 107,132 Z" fill="#78a7b7"/>
        <path d="M107,138 L133,138" stroke="#5f8fa0" stroke-width="0.9"/>
        <!-- 背带和扣子 -->
        <g stroke="#d9775e" stroke-width="2.2" fill="none"><path d="M110,116 L110,132"/><path d="M130,116 L130,132"/></g>
        <g fill="#efe4cf"><rect x="108" y="126" width="4" height="3" rx="0.8"/><rect x="128" y="126" width="4" height="3" rx="0.8"/></g>
        <!-- 侧袋 -->
        <path d="M140,134 C146,134 148,140 147,150 C146,156 142,158 140,158 Z" fill="#6a98a8"/>
        <path d="M100,134 C94,134 92,140 93,150 C94,156 98,158 100,158 Z" fill="#6a98a8"/>
        <!-- 提手 -->
        <path d="M114,101 C114,95 126,95 126,101" stroke="#5f8fa0" stroke-width="2" fill="none"/>
        <rect x="104" y="140" width="3" height="16" rx="1.5" fill="#ffffff" opacity="0.2"/>
      </g>

      <!-- 梯子 -->
      <g fill="#d3aa80">
        <rect x="226" y="66" width="4" height="158"/><rect x="240" y="66" width="4" height="158"/>
      </g>
      <g fill="#c99f74">
        <rect x="226" y="84" width="18" height="3.4"/><rect x="226" y="116" width="18" height="3.4"/><rect x="226" y="148" width="18" height="3.4"/>
        <rect x="226" y="198" width="18" height="3.4"/>
      </g>

      <!-- 储物柜和上面的水壶 -->
      <rect x="298" y="160" width="52" height="62" rx="2" fill="url(#locker)"/>
      <rect x="296" y="157" width="56" height="5" rx="1.5" fill="#d6e0e4"/>
      <line x1="324" y1="162" x2="324" y2="220" stroke="#a9b9c0" stroke-width="0.9"/>
      <g stroke="#a9b9c0" stroke-width="1"><line x1="304" y1="168" x2="318" y2="168"/><line x1="304" y1="171" x2="318" y2="171"/><line x1="304" y1="174" x2="318" y2="174"/><line x1="330" y1="168" x2="344" y2="168"/><line x1="330" y1="171" x2="344" y2="171"/><line x1="330" y1="174" x2="344" y2="174"/></g>
      <g fill="#c9a66e"><rect x="318" y="190" width="3" height="8" rx="1"/><rect x="327" y="190" width="3" height="8" rx="1"/></g>
      <path d="M326,198 C326,194 331,194 331,198 L331,202 L326,202 Z" fill="none" stroke="#9aa1a3" stroke-width="1"/>
      <rect x="325" y="200" width="7" height="6" rx="1" fill="#d6b47c"/>
      <!-- 水壶 -->
      <path d="M310,130 C310,128 311,126 313,126 L319,126 C321,126 322,128 322,130 L322,155 C322,156.5 321,157.4 319.6,157.4 L312.4,157.4 C311,157.4 310,156.5 310,155 Z" fill="url(#bottle)"/>
      <rect x="311" y="120" width="10" height="7" rx="1.6" fill="#d9846b"/>
      <path d="M321,121 C326,121 326,126 321,126" stroke="#d9846b" stroke-width="1.4" fill="none"/>
      <rect x="310" y="138" width="12" height="2.4" fill="#e3f0ec" opacity="0.7"/>
      <ellipse cx="313" cy="146" rx="1.2" ry="6" fill="#ffffff" opacity="0.35"/>
      <!-- 柜子上的一小盆多肉 -->
      <path d="M332,148 L344,148 L342,157 L334,157 Z" fill="#dc9067"/>
      <g fill="#8cc171"><circle cx="335" cy="146" r="3"/><circle cx="341" cy="146" r="3"/><circle cx="338" cy="143" r="3"/></g>

      <!-- 地上的登山靴 -->
      <g>
        <path d="M256,222 L256,203 C256,200 259,199 262,199 L268,199 C270,199 271,201 271,203 L272,211 C278,212 284,214 285,218 L285,222 Z" fill="#a9785a"/>
        <rect x="256" y="220" width="29.4" height="3" rx="1" fill="#7d5a44"/>
        <g stroke="#e8d4b4" stroke-width="0.7"><line x1="259" y1="204" x2="269" y2="204"/><line x1="259" y1="207.4" x2="269" y2="207.4"/><line x1="259" y1="210.8" x2="270" y2="210.8"/></g>
        <path d="M256,213 L272,213" stroke="#8f6449" stroke-width="0.8"/>
      </g>
      <g transform="translate(14,3)">
        <path d="M256,222 L256,203 C256,200 259,199 262,199 L268,199 C270,199 271,201 271,203 L272,211 C278,212 284,214 285,218 L285,222 Z" fill="#b98762"/>
        <rect x="256" y="220" width="29.4" height="3" rx="1" fill="#7d5a44"/>
        <g stroke="#efdcbc" stroke-width="0.7"><line x1="259" y1="204" x2="269" y2="204"/><line x1="259" y1="207.4" x2="269" y2="207.4"/><line x1="259" y1="210.8" x2="270" y2="210.8"/></g>
        <path d="M256,213 L272,213" stroke="#9a6d50" stroke-width="0.8"/>
      </g>
    </g>

    <!-- 灯串的小灯 -->
    <g>
      <circle cx="58" cy="74" r="3.6" fill="url(#bulb)"/><circle cx="78" cy="78" r="3.6" fill="url(#bulb)"/><circle cx="98" cy="77" r="3.6" fill="url(#bulb)"/>
      <circle cx="122" cy="76" r="3.6" fill="url(#bulb)"/><circle cx="142" cy="79" r="3.6" fill="url(#bulb)"/><circle cx="162" cy="76" r="3.6" fill="url(#bulb)"/><circle cx="184" cy="75" r="3.6" fill="url(#bulb)"/>
      <g fill="#fbe3a0"><circle cx="58" cy="74" r="1.3"/><circle cx="78" cy="78" r="1.3"/><circle cx="98" cy="77" r="1.3"/><circle cx="122" cy="76" r="1.3"/><circle cx="142" cy="79" r="1.3"/><circle cx="162" cy="76" r="1.3"/><circle cx="184" cy="75" r="1.3"/></g>
    </g>

    <!-- 地面阴影 -->
    <g filter="url(#soft2)" opacity="0.2" fill="#8a6a4a">
      <ellipse cx="146" cy="226" rx="112" ry="4"/><ellipse cx="324" cy="225" rx="30" ry="3"/><ellipse cx="280" cy="226" rx="24" ry="2.4"/>
      <ellipse cx="122" cy="170" rx="28" ry="2"/>
    </g>
    <!-- 纸纹 -->
    <rect width="400" height="260" filter="url(#grain)"/>
  </g>
</svg>
