<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 260" width="400" height="260">
  <!-- 原创插图：在乡下的一天（水彩风格，纯 SVG 手绘，无外部素材） -->
  <defs>
    <filter id="wc" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="0.35"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="g"/>
      <feColorMatrix in="g" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.38  0 0 0 0 0.3  0 0 0 0.09 0"/>
    </filter>
    <filter id="edge" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="5"/></filter>
    <mask id="fade" maskUnits="userSpaceOnUse" x="0" y="0" width="400" height="260">
      <rect x="7" y="7" width="386" height="246" rx="4" fill="#fff" filter="url(#edge)"/>
    </mask>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4e7ef"/><stop offset="0.65" stop-color="#e9f1ec"/><stop offset="1" stop-color="#f5f2e2"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4e6ae"/><stop offset="1" stop-color="#bcd794"/>
    </linearGradient>
    <linearGradient id="trunk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a5805e"/><stop offset="0.45" stop-color="#bf9a74"/><stop offset="1" stop-color="#94704f"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9a27a"/><stop offset="1" stop-color="#ad8560"/>
    </linearGradient>
    <g id="sheep">
      <g fill="#7d746c"><rect x="-10" y="7" width="3" height="10" rx="1"/><rect x="-3" y="8" width="3" height="10" rx="1"/><rect x="6" y="8" width="3" height="10" rx="1"/><rect x="12" y="7" width="3" height="9" rx="1"/></g>
      <g fill="#ece8df"><circle cx="3" cy="5" r="8"/><circle cx="-6" cy="5" r="7"/><circle cx="12" cy="4" r="6.5"/></g>
      <g fill="#fbf8f1"><circle cx="0" cy="-1" r="9"/><circle cx="9" cy="-3" r="8"/><circle cx="-9" cy="-1" r="7.5"/><circle cx="15" cy="1" r="6"/><circle cx="-13" cy="3" r="5.5"/><circle cx="4" cy="-7" r="6"/><circle cx="-5" cy="-6" r="5.5"/></g>
      <ellipse cx="-19" cy="-1" rx="5" ry="6.8" fill="#8a8078" transform="rotate(20 -19 -1)"/>
      <ellipse cx="-15" cy="-6" rx="3.4" ry="1.5" fill="#8a8078" transform="rotate(-25 -15 -6)"/>
      <circle cx="-16" cy="-7" r="3.2" fill="#fbf8f1"/>
      <circle cx="-20" cy="-2" r="0.9" fill="#4a4038"/>
      <circle cx="2" cy="-5" r="3" fill="#fff" opacity="0.8"/>
    </g>
    <path id="tuft" d="M0,0 l-2,-6 M2,0 l1,-7 M4,0 l3,-5"/>
  </defs>

  <g mask="url(#fade)">
    <!-- 天空 -->
    <rect width="400" height="260" fill="url(#sky)"/>
    <g filter="url(#soft2)" fill="#ffffff" opacity="0.85">
      <ellipse cx="214" cy="44" rx="26" ry="6.5"/><ellipse cx="230" cy="39" rx="14" ry="6.5"/><ellipse cx="300" cy="70" rx="18" ry="5"/>
    </g>

    <g filter="url(#wc)">
      <!-- 远处的小山和田地 -->
      <path d="M0,112 C40,94 90,88 140,98 C180,106 210,90 260,84 C310,78 360,92 400,100 L400,150 L0,150 Z" fill="#cfe0c4"/>
      <path d="M150,104 C190,100 220,92 262,88 L270,104 C230,108 190,112 160,116 Z" fill="#e1e7b4" opacity="0.9"/>
      <path d="M60,108 C90,102 120,102 146,106 L150,118 C120,116 90,116 62,120 Z" fill="#dbe6bc" opacity="0.9"/>
      <path d="M270,94 C300,90 330,92 360,98 L356,112 C330,108 300,106 276,108 Z" fill="#c7ddaf" opacity="0.9"/>
      <path d="M0,128 C60,114 140,112 210,120 C270,126 330,112 400,116 L400,160 L0,160 Z" fill="#c2da9f"/>
      <!-- 远处的小房子 -->
      <rect x="128" y="104" width="22" height="14" fill="#f7efe2"/>
      <polygon points="124,106 139,94 154,106" fill="#d98c72"/>
      <rect x="146" y="96" width="3.4" height="7" fill="#c48466"/>
      <rect x="134" y="109" width="5" height="5" fill="#c9d8dc"/><rect x="142" y="110" width="4" height="8" fill="#c49e7e"/>
      <rect x="160" y="108" width="2" height="9" fill="#a98466"/>
      <g fill="#9fc483"><circle cx="161" cy="104" r="6.5"/><circle cx="157" cy="108" r="4.5"/><circle cx="165" cy="108" r="4.5"/></g>
      <!-- 远处的一排小树 -->
      <g fill="#a9cb8e"><circle cx="24" cy="122" r="7"/><circle cx="34" cy="120" r="8"/><circle cx="46" cy="123" r="6"/><circle cx="236" cy="118" r="6"/><circle cx="246" cy="116" r="7"/></g>

      <!-- 近处的草地 -->
      <path d="M0,150 C80,140 200,138 400,146 L400,260 L0,260 Z" fill="url(#field)"/>

      <!-- 大树 -->
      <path d="M332,206 C336,180 338,152 336,124 C335,110 330,100 322,92 L327,88 C334,96 339,104 342,114 C346,102 354,92 366,86 L369,90 C358,98 350,110 349,124 C348,152 350,180 356,206 Z" fill="url(#trunk)"/>
      <g fill="#8fb874"><circle cx="344" cy="70" r="42"/><circle cx="306" cy="94" r="28"/><circle cx="384" cy="92" r="32"/><circle cx="344" cy="108" r="28"/><circle cx="312" cy="60" r="24"/></g>
      <g fill="#a3c886"><circle cx="336" cy="60" r="28"/><circle cx="374" cy="78" r="18"/><circle cx="308" cy="88" r="15"/><circle cx="354" cy="98" r="14"/></g>
      <g fill="#bedb9f" opacity="0.75" filter="url(#soft2)"><circle cx="326" cy="48" r="12"/><circle cx="368" cy="70" r="8"/><circle cx="302" cy="80" r="6"/></g>
      <g fill="#7fa866" opacity="0.5"><circle cx="350" cy="120" r="12"/><circle cx="316" cy="110" r="10"/><circle cx="388" cy="112" r="12"/></g>

      <!-- 远处的两只羊 -->
      <use href="#sheep" transform="translate(206,150) scale(0.5)"/>
      <use href="#sheep" transform="translate(240,156) scale(-0.55,0.55)"/>

      <!-- 斜斜伸向远处的木栅栏 -->
      <g fill="url(#wood)">
        <rect x="16" y="194" width="7" height="44" rx="1.2"/><rect x="59" y="185" width="6.4" height="39" rx="1.2"/><rect x="101" y="176" width="5.8" height="35" rx="1.1"/>
        <rect x="143" y="167" width="5.2" height="31" rx="1"/><rect x="185" y="158" width="4.6" height="27" rx="1"/><rect x="227" y="149" width="4" height="23" rx="0.9"/><rect x="269" y="141" width="3.4" height="19" rx="0.8"/>
      </g>
      <g fill="#e2c39d"><rect x="16" y="194" width="7" height="2" rx="1"/><rect x="59" y="185" width="6.4" height="1.8" rx="0.9"/><rect x="101" y="176" width="5.8" height="1.6" rx="0.8"/><rect x="143" y="167" width="5.2" height="1.5" rx="0.7"/></g>
      <g stroke="#b98f66" fill="none" stroke-linecap="round">
        <path d="M14,203 L62,193 L104,184 L146,174 L187,164 L229,155 L271,146" stroke-width="3.6"/>
        <path d="M14,219 L62,208 L104,197 L146,186 L187,175 L229,164 L271,154" stroke-width="3.4"/>
      </g>
      <g stroke="#dcb68e" fill="none" stroke-linecap="round" stroke-width="1">
        <path d="M14,202 L62,192 L104,183 L146,173 L187,163 L229,154 L271,145"/><path d="M14,218 L62,207 L104,196 L146,185 L187,174 L229,163 L271,153"/>
      </g>

      <!-- 近处的羊 -->
      <use href="#sheep" transform="translate(120,212) scale(1.05)"/>
      <use href="#sheep" transform="translate(222,226) scale(-1.25,1.25)"/>
      <use href="#sheep" transform="translate(296,214) scale(1.1)"/>

      <!-- 草叶和小花 -->
      <g stroke="#9cc07e" stroke-width="1" fill="none" stroke-linecap="round">
        <use href="#tuft" transform="translate(40,252)"/><use href="#tuft" transform="translate(150,250)"/><use href="#tuft" transform="translate(260,254)"/><use href="#tuft" transform="translate(360,248)"/>
        <use href="#tuft" transform="translate(80,236)"/><use href="#tuft" transform="translate(190,200)"/><use href="#tuft" transform="translate(320,190)"/><use href="#tuft" transform="translate(30,170)"/>
      </g>
      <g fill="#ffffff"><circle cx="60" cy="246" r="1.8"/><circle cx="176" cy="252" r="1.6"/><circle cx="338" cy="236" r="1.7"/><circle cx="96" cy="166" r="1.4"/><circle cx="270" cy="196" r="1.4"/></g>
      <g fill="#f4cf6e"><circle cx="66" cy="250" r="1.6"/><circle cx="244" cy="250" r="1.6"/><circle cx="380" cy="230" r="1.6"/><circle cx="210" cy="184" r="1.3"/></g>
      <g fill="#f2a59c"><circle cx="30" cy="244" r="1.7"/><circle cx="300" cy="250" r="1.6"/><circle cx="150" cy="226" r="1.4"/></g>
    </g>

    <!-- 地面阴影 -->
    <g filter="url(#soft2)" opacity="0.2" fill="#5f7a4a">
      <ellipse cx="342" cy="206" rx="34" ry="4"/><ellipse cx="121" cy="230" rx="22" ry="3"/><ellipse cx="220" cy="248" rx="26" ry="3.4"/><ellipse cx="297" cy="233" rx="24" ry="3"/>
      <ellipse cx="206" cy="159" rx="11" ry="1.6"/><ellipse cx="240" cy="166" rx="12" ry="1.6"/>
    </g>
    <!-- 纸纹 -->
    <rect width="400" height="260" filter="url(#grain)"/>
  </g>
</svg>
