<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 260" width="400" height="260">
  <!-- 原创插图：围墙里的小花园，石子小路、小水池、花丛、一张铁艺椅子（水彩风格，纯 SVG 手绘） -->
  <defs>
    <filter id="wc" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="0.35"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="g"/>
      <feColorMatrix in="g" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.38  0 0 0 0 0.3  0 0 0 0.09 0"/>
    </filter>
    <filter id="edge" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="5"/></filter>
    <mask id="fade" maskUnits="userSpaceOnUse" x="0" y="0" width="400" height="260">
      <rect x="7" y="7" width="386" height="246" rx="4" fill="#fff" filter="url(#edge)"/>
    </mask>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e4eeee"/><stop offset="0.7" stop-color="#f1f1e8"/><stop offset="1" stop-color="#f7f0e2"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6e6cf"/><stop offset="1" stop-color="#eed6b8"/>
    </linearGradient>
    <linearGradient id="wallS" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e3c7a6"/><stop offset="1" stop-color="#ecd4b6"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c3d9a0"/><stop offset="1" stop-color="#a9c789"/>
    </linearGradient>
    <linearGradient id="path" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe4d0"/><stop offset="1" stop-color="#e2d2b8"/>
    </linearGradient>
    <linearGradient id="pool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bcdad8"/><stop offset="1" stop-color="#9cc4c3"/>
    </linearGradient>
    <linearGradient id="door" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#93ae9f"/><stop offset="0.5" stop-color="#a8c0b2"/><stop offset="1" stop-color="#8aa596"/>
    </linearGradient>
    <radialGradient id="crown" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#a9cb8a"/><stop offset="1" stop-color="#7fac6a"/>
    </radialGradient>
    <radialGradient id="bush" cx="0.4" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#a8c98a"/><stop offset="1" stop-color="#7ea769"/>
    </radialGradient>
    <path id="spike" d="M0,0 C-1.6,-4 -1.4,-9 0,-13 C1.4,-9 1.6,-4 0,0 Z"/>
    <g id="daisy"><g fill="#fbf7ee"><ellipse cx="0" cy="-2.6" rx="1.3" ry="2.4"/><ellipse cx="0" cy="2.6" rx="1.3" ry="2.4"/><ellipse cx="-2.6" cy="0" rx="2.4" ry="1.3"/><ellipse cx="2.6" cy="0" rx="2.4" ry="1.3"/></g><circle r="1.3" fill="#efc35c"/></g>
    <g id="rose"><circle r="3.2" fill="#e48d86"/><circle cx="-0.6" cy="-0.6" r="1.7" fill="#f0aaa2"/></g>
    <g id="lav">
      <path d="M0,0 L-3,-14 M0,0 L0,-17 M0,0 L3,-13 M0,0 L6,-10 M0,0 L-6,-10" stroke="#8aa774" stroke-width="0.9" fill="none"/>
      <g fill="#a596c6"><use href="#spike" transform="translate(-3,-13) rotate(-12) scale(0.6)"/><use href="#spike" transform="translate(0,-16) scale(0.65)"/><use href="#spike" transform="translate(3,-12) rotate(12) scale(0.6)"/><use href="#spike" transform="translate(6,-9) rotate(28) scale(0.5)"/><use href="#spike" transform="translate(-6,-9) rotate(-28) scale(0.5)"/></g>
    </g>
  </defs>

  <g mask="url(#fade)">
    <!-- 天空 -->
    <rect width="400" height="260" fill="url(#sky)"/>
    <g filter="url(#soft2)" fill="#ffffff" opacity="0.8">
      <ellipse cx="250" cy="40" rx="22" ry="6"/><ellipse cx="264" cy="36" rx="13" ry="5.5"/>
    </g>

    <g filter="url(#wc)">
      <!-- 墙外的柠檬树 -->
      <circle cx="318" cy="64" r="38" fill="url(#crown)"/>
      <circle cx="286" cy="78" r="24" fill="#8fb874"/>
      <circle cx="356" cy="80" r="28" fill="#86b06e"/>
      <g fill="#b9d79c" opacity="0.8"><ellipse cx="306" cy="50" rx="12" ry="7"/><ellipse cx="340" cy="62" rx="9" ry="5"/><ellipse cx="282" cy="72" rx="8" ry="4.5"/></g>
      <g fill="#f0cf6a"><ellipse cx="300" cy="74" rx="3.6" ry="3"/><ellipse cx="330" cy="82" rx="3.6" ry="3"/><ellipse cx="318" cy="56" rx="3.4" ry="2.8"/><ellipse cx="350" cy="70" rx="3.6" ry="3"/><ellipse cx="290" cy="90" rx="3.4" ry="2.8"/><ellipse cx="366" cy="92" rx="3.4" ry="2.8"/></g>

      <!-- 后墙和右侧墙 -->
      <rect x="0" y="92" width="356" height="70" fill="url(#wall)"/>
      <rect x="-4" y="86" width="362" height="7" rx="1.5" fill="#d98b62"/>
      <rect x="-4" y="92" width="362" height="2.4" fill="#c27552" opacity="0.7"/>
      <path d="M356,92 L404,62 L404,204 L356,162 Z" fill="url(#wallS)"/>
      <path d="M354,86 L404,55 L404,63 L356,93 Z" fill="#cf8160"/>
      <g fill="#e9cfae" opacity="0.7">
        <rect x="30" y="112" width="14" height="6" rx="2"/><rect x="222" y="104" width="12" height="5" rx="2"/><rect x="300" y="132" width="14" height="6" rx="2"/><rect x="92" y="138" width="10" height="5" rx="2"/>
      </g>

      <!-- 拱门 -->
      <path d="M154,162 L154,124 C154,104 196,104 196,124 L196,162 Z" fill="#e4c7a5"/>
      <path d="M158,162 L158,125 C158,109 192,109 192,125 L192,162 Z" fill="url(#door)"/>
      <g stroke="#7f9a8b" stroke-width="0.9" opacity="0.8"><line x1="166.5" y1="113" x2="166.5" y2="162"/><line x1="175" y1="110" x2="175" y2="162"/><line x1="183.5" y1="113" x2="183.5" y2="162"/></g>
      <circle cx="187" cy="140" r="1.6" fill="#c9a050"/>

      <!-- 墙上的三角梅 -->
      <path d="M224,162 C220,142 226,122 240,108 C250,98 262,94 274,96" stroke="#7a9a5e" stroke-width="1.8" fill="none"/>
      <path d="M232,128 C244,126 254,118 258,108 M228,146 C236,146 242,142 246,136" stroke="#7a9a5e" stroke-width="1.2" fill="none"/>
      <g fill="#8db56d">
        <ellipse cx="236" cy="118" rx="9" ry="6"/><ellipse cx="249" cy="106" rx="10" ry="6"/><ellipse cx="264" cy="98" rx="9" ry="5.5"/><ellipse cx="226" cy="138" rx="8" ry="6"/>
        <ellipse cx="244" cy="124" rx="8" ry="5"/><ellipse cx="256" cy="112" rx="7" ry="4.5"/><ellipse cx="240" cy="140" rx="7" ry="4.5"/><ellipse cx="225" cy="152" rx="6" ry="5"/><ellipse cx="276" cy="98" rx="6" ry="4"/>
      </g>
      <g fill="#a3c784"><ellipse cx="247" cy="103" rx="5" ry="2.6"/><ellipse cx="234" cy="115" rx="4.6" ry="2.4"/><ellipse cx="262" cy="96" rx="4.4" ry="2.2"/><ellipse cx="224" cy="135" rx="4" ry="2.2"/></g>
      <g fill="#e59aa6">
        <circle cx="240" cy="112" r="3.4"/><circle cx="244" cy="115" r="2.8"/><circle cx="252" cy="100" r="3.2"/><circle cx="256" cy="104" r="2.6"/><circle cx="266" cy="94" r="3"/><circle cx="270" cy="98" r="2.4"/>
        <circle cx="230" cy="132" r="3.2"/><circle cx="233" cy="136" r="2.6"/><circle cx="246" cy="120" r="2.8"/><circle cx="222" cy="146" r="2.8"/><circle cx="240" cy="136" r="2.6"/><circle cx="259" cy="110" r="2.4"/><circle cx="278" cy="96" r="2.2"/><circle cx="228" cy="124" r="2.2"/>
      </g>
      <g fill="#f2bcc4"><circle cx="239" cy="110.5" r="1.5"/><circle cx="251" cy="98.5" r="1.4"/><circle cx="229" cy="130.5" r="1.4"/><circle cx="265" cy="92.5" r="1.3"/><circle cx="245" cy="118.5" r="1.2"/></g>

      <!-- 门边的陶土花盆 -->
      <path d="M128,146 L148,146 L145,162 L131,162 Z" fill="#d4835c"/>
      <rect x="126" y="143" width="24" height="4.5" rx="1.5" fill="#e09a72"/>
      <ellipse cx="138" cy="138" rx="12" ry="8" fill="#8db56d"/>
      <g fill="#e2655a"><circle cx="132" cy="134" r="2.6"/><circle cx="140" cy="131" r="2.8"/><circle cx="145" cy="137" r="2.4"/><circle cx="135" cy="140" r="2.2"/></g>
      <g fill="#f29a8c"><circle cx="139.5" cy="130" r="1.2"/><circle cx="131.5" cy="133" r="1.1"/></g>

      <!-- 草地 -->
      <path d="M0,160 L356,160 L404,202 L404,264 L0,264 Z" fill="url(#grass)"/>
      <g fill="#b7d196" opacity="0.8"><ellipse cx="300" cy="200" rx="40" ry="6"/><ellipse cx="60" cy="236" rx="40" ry="5"/><ellipse cx="320" cy="248" rx="30" ry="4"/></g>

      <!-- 墙根的花丛 -->
      <ellipse cx="30" cy="158" rx="30" ry="15" fill="url(#bush)"/>
      <ellipse cx="74" cy="160" rx="22" ry="11" fill="#93b97a"/>
      <g><use href="#rose" transform="translate(16,152)"/><use href="#rose" transform="translate(30,146)"/><use href="#rose" transform="translate(42,156)"/><use href="#rose" transform="translate(22,162)"/><use href="#rose" transform="translate(48,148)"/></g>
      <g><use href="#lav" transform="translate(66,166)"/><use href="#lav" transform="translate(78,166) scale(1.1)"/><use href="#lav" transform="translate(90,166)"/><use href="#lav" transform="translate(104,166) scale(0.95)"/><use href="#lav" transform="translate(122,166) scale(1.05)"/><use href="#lav" transform="translate(136,166) scale(0.9)"/></g>
      <ellipse cx="216" cy="162" rx="16" ry="8" fill="#93b97a"/>
      <g><use href="#daisy" transform="translate(208,158)"/><use href="#daisy" transform="translate(218,154)"/><use href="#daisy" transform="translate(226,160)"/><use href="#daisy" transform="translate(212,164) scale(0.85)"/></g>
      <ellipse cx="270" cy="162" rx="26" ry="10" fill="url(#bush)"/>
      <g><use href="#lav" transform="translate(252,168) scale(0.9)"/><use href="#lav" transform="translate(264,168)"/><use href="#lav" transform="translate(278,168) scale(1.05)"/><use href="#lav" transform="translate(292,168) scale(0.9)"/></g>
      <g fill="#f1cf6e"><circle cx="318" cy="158" r="2.6"/><circle cx="326" cy="154" r="2.4"/><circle cx="334" cy="160" r="2.6"/><circle cx="342" cy="155" r="2.2"/></g>
      <ellipse cx="330" cy="166" rx="22" ry="7" fill="#9cc07f"/>

      <!-- 石子小路 -->
      <path d="M140,264 C150,236 186,220 182,196 C180,182 164,174 160,162 L190,162 C198,172 214,182 216,198 C220,222 244,240 262,264 Z" fill="url(#path)"/>
      <g fill="#d6c4a6">
        <ellipse cx="170" cy="168" rx="2" ry="1"/><ellipse cx="182" cy="174" rx="2.2" ry="1.1"/><ellipse cx="192" cy="186" rx="2.4" ry="1.2"/><ellipse cx="200" cy="196" rx="2" ry="1"/>
        <ellipse cx="190" cy="208" rx="2.6" ry="1.3"/><ellipse cx="204" cy="214" rx="2.4" ry="1.2"/><ellipse cx="182" cy="224" rx="2.8" ry="1.4"/><ellipse cx="214" cy="228" rx="3" ry="1.5"/>
        <ellipse cx="170" cy="240" rx="3.2" ry="1.6"/><ellipse cx="200" cy="244" rx="3.4" ry="1.7"/><ellipse cx="232" cy="246" rx="3.2" ry="1.6"/><ellipse cx="160" cy="254" rx="3.4" ry="1.7"/><ellipse cx="216" cy="256" rx="3.6" ry="1.8"/>
      </g>
      <g fill="#c7cdc6">
        <ellipse cx="176" cy="180" rx="1.8" ry="0.9"/><ellipse cx="208" cy="204" rx="2.2" ry="1.1"/><ellipse cx="196" cy="230" rx="2.6" ry="1.3"/><ellipse cx="184" cy="250" rx="3" ry="1.5"/><ellipse cx="244" cy="256" rx="3" ry="1.5"/>
      </g>
      <g fill="#f8f2e6"><ellipse cx="186" cy="196" rx="1.8" ry="0.9"/><ellipse cx="174" cy="232" rx="2.2" ry="1.1"/><ellipse cx="226" cy="236" rx="2.4" ry="1.2"/><ellipse cx="196" cy="168" rx="1.6" ry="0.8"/></g>
    </g>

    <!-- 墙根的阴影 -->
    <g filter="url(#soft)" opacity="0.18" fill="#5f7a4a">
      <rect x="0" y="162" width="356" height="7"/>
    </g>
    <!-- 地面阴影 -->
    <g filter="url(#soft2)" opacity="0.2" fill="#5f7a4a">
      <ellipse cx="92" cy="218" rx="54" ry="5"/><ellipse cx="296" cy="226" rx="32" ry="4"/>
    </g>

    <g filter="url(#wc)">
      <!-- 小水池 -->
      <ellipse cx="90" cy="204" rx="56" ry="18" fill="#d8cdbb"/>
      <ellipse cx="90" cy="206" rx="56" ry="18" fill="none" stroke="#c4b69e" stroke-width="1.2"/>
      <ellipse cx="90" cy="202" rx="47" ry="12.5" fill="url(#pool)"/>
      <g stroke="#c4b69e" stroke-width="0.9"><line x1="48" y1="194" x2="42" y2="191"/><line x1="72" y1="189" x2="70" y2="186"/><line x1="108" y1="189" x2="110" y2="186"/><line x1="132" y1="194" x2="138" y2="191"/><line x1="128" y1="211" x2="136" y2="215"/><line x1="90" y1="214.5" x2="90" y2="220"/><line x1="52" y1="211" x2="44" y2="215"/></g>
      <g stroke="#eef6f4" stroke-width="1" stroke-linecap="round" opacity="0.9"><line x1="62" y1="200" x2="80" y2="200"/><line x1="96" y1="206" x2="112" y2="206"/><line x1="70" y1="208" x2="80" y2="208"/></g>
      <path d="M100,198 a7,3 0 1,0 14,0 a7,3 0 1,0 -14,0 Z M107,198 L114,197 L113,199 Z" fill="#8fb874"/>
      <path d="M68,204 a5,2.2 0 1,0 10,0 a5,2.2 0 1,0 -10,0 Z" fill="#9cc07f"/>
      <g><ellipse cx="106" cy="196.5" rx="3" ry="1.6" fill="#f2bcc4"/><ellipse cx="106" cy="195.5" rx="1.6" ry="1.2" fill="#fbe0e2"/></g>

      <!-- 铁艺椅子 -->
      <g fill="none" stroke="#5f7570" stroke-linecap="round" stroke-linejoin="round">
        <path d="M274,190 L276,218 M300,190 L298,218" stroke-width="2"/>
        <path d="M268,148 L268,192 M306,148 L306,192" stroke-width="2.4"/>
        <path d="M268,150 C268,134 306,134 306,150" stroke-width="2.4"/>
        <path d="M287,140 C281,146 281,154 287,158 C293,154 293,146 287,140 Z" stroke-width="1.4"/>
        <path d="M287,158 L287,182" stroke-width="1.4"/>
        <path d="M274,160 C270,166 272,172 278,172 C282,172 283,168 280,166" stroke-width="1.3"/>
        <path d="M300,160 C304,166 302,172 296,172 C292,172 291,168 294,166" stroke-width="1.3"/>
        <ellipse cx="287" cy="206" rx="16" ry="3.6" stroke-width="1.2"/>
        <path d="M262,192 C260,204 260,214 256,226 M312,192 C314,204 314,214 318,226" stroke-width="2.4"/>
        <path d="M256,226 C254,227 253,226 253,225 M318,226 C320,227 321,226 321,225" stroke-width="1.6"/>
      </g>
      <path d="M262,186 C262,182 312,182 312,186 L312,192 C312,195 262,195 262,192 Z" fill="#8aa09a"/>
      <ellipse cx="287" cy="186" rx="25" ry="4.6" fill="#a6bab4"/>
      <g stroke="#8aa09a" stroke-width="0.8" opacity="0.9"><line x1="272" y1="184" x2="272" y2="188"/><line x1="282" y1="182" x2="282" y2="190"/><line x1="292" y1="182" x2="292" y2="190"/><line x1="302" y1="184" x2="302" y2="188"/></g>
      <path d="M270,140 C276,136 284,135 290,136" stroke="#a6bab4" stroke-width="1" fill="none"/>

      <!-- 前景的花丛 -->
      <ellipse cx="368" cy="236" rx="34" ry="16" fill="url(#bush)"/>
      <g><use href="#daisy" transform="translate(352,230)"/><use href="#daisy" transform="translate(366,224)"/><use href="#daisy" transform="translate(380,232)"/><use href="#daisy" transform="translate(360,240) scale(0.9)"/><use href="#daisy" transform="translate(376,242) scale(0.9)"/></g>
      <g><use href="#lav" transform="translate(22,250) scale(1.2)"/><use href="#lav" transform="translate(36,252) scale(1.3)"/><use href="#lav" transform="translate(50,250) scale(1.15)"/></g>
      <g stroke="#8db06f" stroke-width="1.2" fill="none" stroke-linecap="round">
        <path d="M126,250 l-2,-7 M130,250 l1,-8 M134,250 l3,-6"/><path d="M310,250 l-2,-6 M314,250 l1,-7"/><path d="M240,212 l-2,-5 M244,212 l1,-6"/><path d="M146,190 l-2,-5 M150,190 l1,-6"/><path d="M336,206 l-2,-5 M340,206 l1,-6 M343,206 l3,-4"/><path d="M20,190 l-2,-5 M24,190 l1,-6"/>
      </g>
    </g>

    <!-- 纸纹 -->
    <rect width="400" height="260" filter="url(#grain)"/>
  </g>
</svg>
