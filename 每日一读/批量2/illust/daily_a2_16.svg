<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 260" width="400" height="260">
  <!-- 原创插图：农场的一天（红色谷仓、母鸡、奶牛、干草捆、木栅栏；水彩风格，纯 SVG 手绘） -->
  <defs>
    <filter id="wc" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="0.35"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="g"/>
      <feColorMatrix in="g" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.38  0 0 0 0 0.3  0 0 0 0.09 0"/>
    </filter>
    <filter id="edge" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="5"/></filter>
    <mask id="fade" maskUnits="userSpaceOnUse" x="0" y="0" width="400" height="260">
      <rect x="7" y="7" width="386" height="246" rx="4" fill="#fff" filter="url(#edge)"/>
    </mask>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dae8ef"/><stop offset="0.3" stop-color="#ebf1ec"/><stop offset="0.5" stop-color="#f8f2e3"/><stop offset="1" stop-color="#f8f2e3"/>
    </linearGradient>
    <linearGradient id="meadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cde1a4"/><stop offset="0.5" stop-color="#bdd795"/><stop offset="1" stop-color="#abc985"/>
    </linearGradient>
    <linearGradient id="barn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d27560"/><stop offset="1" stop-color="#bb5f4a"/>
    </linearGradient>
    <linearGradient id="barnS" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ad5744"/><stop offset="1" stop-color="#a0503f"/>
    </linearGradient>
    <linearGradient id="hay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0d48d"/><stop offset="1" stop-color="#dcb56a"/>
    </linearGradient>
    <radialGradient id="hayF" cx="0.45" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#f6dfa0"/><stop offset="1" stop-color="#e2bd72"/>
    </radialGradient>
    <linearGradient id="cow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdfbf6"/><stop offset="1" stop-color="#ebe4d8"/>
    </linearGradient>
    <linearGradient id="trunk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ab8566"/><stop offset="0.6" stop-color="#957257"/><stop offset="1" stop-color="#7e5f47"/>
    </linearGradient>
    <linearGradient id="path" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ead8b6"/><stop offset="1" stop-color="#e2c9a0"/>
    </linearGradient>
    <path id="clump" d="M-22,8 C-29,3 -26,-8 -17,-9 C-17,-18 -6,-22 0,-17 C6,-23 18,-19 17,-10 C26,-9 28,3 21,8 C17,14 6,13 0,12 C-8,14 -17,13 -22,8 Z"/>
    <g id="henB">
      <path d="M6,-11 C9,-17 13,-21 16,-22 C17,-17 16,-11 13,-7 Z" fill="#b06d42"/>
      <path d="M8,-12 C11,-16 13,-18 14.6,-18.6 C14.6,-15 13.6,-11 12,-8.6 Z" fill="#c78150"/>
      <ellipse cx="2" cy="-8" rx="10" ry="7" fill="#c98a5a"/>
      <path d="M-1,-9 C3,-12 9,-11 10,-7 C7,-4 1,-4 -1,-9 Z" fill="#dca474"/>
      <g stroke="#d48f45" stroke-width="1" stroke-linecap="round"><line x1="0" y1="-1.6" x2="-0.6" y2="3"/><line x1="4" y1="-1.6" x2="4.4" y2="3"/></g>
    </g>
    <g id="henW">
      <path d="M6,-11 C9,-17 13,-21 16,-22 C17,-17 16,-11 13,-7 Z" fill="#e3dacb"/>
      <path d="M8,-12 C11,-16 13,-18 14.6,-18.6 C14.6,-15 13.6,-11 12,-8.6 Z" fill="#f2ece1"/>
      <ellipse cx="2" cy="-8" rx="10" ry="7" fill="#f8f4ec"/>
      <path d="M-1,-9 C3,-12 9,-11 10,-7 C7,-4 1,-4 -1,-9 Z" fill="#e8e0d2"/>
      <g stroke="#d48f45" stroke-width="1" stroke-linecap="round"><line x1="0" y1="-1.6" x2="-0.6" y2="3"/><line x1="4" y1="-1.6" x2="4.4" y2="3"/></g>
    </g>
    <g id="headUp">
      <path d="M-6,-10 C-8,-14 -8,-18 -6,-20 L-2,-12 Z" fill="inherit"/>
      <circle cx="-7" cy="-18" r="3.8"/>
      <path d="M-9.6,-21 C-9.6,-23.4 -8,-23.6 -7.4,-22 C-7,-24 -5,-24 -5,-21.6 C-4,-22.6 -3,-21.4 -4,-20 Z" fill="#df6a55"/>
      <path d="M-10.6,-18.4 L-13.6,-17.4 L-10.6,-16.2 Z" fill="#e2a24c"/>
      <path d="M-10,-15.8 C-11,-13.6 -9.6,-12.6 -8.6,-14.4 Z" fill="#df6a55"/>
      <circle cx="-8" cy="-18.6" r="0.6" fill="#4a4038"/>
    </g>
    <g id="headDown">
      <path d="M-6,-10 C-9,-9 -11,-7 -12,-4 L-4,-7 Z"/>
      <circle cx="-12" cy="-4" r="3.6"/>
      <path d="M-14.4,-7 C-14.6,-9.4 -13,-9.6 -12.4,-8 C-12,-10 -10,-9.8 -10.2,-7.6 C-9.2,-8.4 -8.4,-7 -9.4,-6 Z" fill="#df6a55"/>
      <path d="M-14.6,-2.6 L-16,0.4 L-13.2,-0.8 Z" fill="#e2a24c"/>
      <circle cx="-13" cy="-4.4" r="0.6" fill="#4a4038"/>
    </g>
  </defs>

  <g mask="url(#fade)">
    <!-- 天空 -->
    <rect width="400" height="260" fill="url(#sky)"/>

    <g filter="url(#wc)">
      <g filter="url(#soft2)" fill="#ffffff" opacity="0.85">
        <ellipse cx="290" cy="40" rx="24" ry="6"/><ellipse cx="304" cy="36" rx="12" ry="5.5"/><ellipse cx="130" cy="74" rx="18" ry="4"/>
      </g>
      <!-- 远处的山丘 -->
      <path d="M0,124 C40,110 90,106 140,114 C180,120 210,110 250,106 C300,102 350,110 400,116 L400,150 L0,150 Z" fill="#d4e2c4"/>
      <g fill="#bdd2a8"><ellipse cx="160" cy="114" rx="5" ry="4"/><ellipse cx="168" cy="115" rx="4" ry="3.4"/><ellipse cx="214" cy="110" rx="3.4" ry="6"/><ellipse cx="222" cy="111" rx="3" ry="5"/></g>
      <!-- 草地 -->
      <path d="M0,136 C60,130 140,132 220,134 C290,136 350,132 400,134 L400,260 L0,260 Z" fill="url(#meadow)"/>
      <!-- 谷仓前的土路 -->
      <path d="M300,206 L336,206 C346,222 360,240 378,262 L296,262 C298,240 298,222 300,206 Z" fill="url(#path)"/>
      <g fill="#dcc398"><ellipse cx="318" cy="214" rx="6" ry="1.6"/><ellipse cx="324" cy="230" rx="9" ry="2.2"/><ellipse cx="330" cy="248" rx="12" ry="2.8"/></g>

      <!-- 左边的大树 -->
      <path d="M44,170 C48,150 50,128 48,104 L58,104 C58,128 62,150 70,170 Z" fill="url(#trunk)"/>
      <g fill="#7aa85f">
        <use href="#clump" transform="translate(38,96) scale(1.1)"/><use href="#clump" transform="translate(66,84) scale(-1.2,1.2)"/><use href="#clump" transform="translate(44,72) scale(1)"/><use href="#clump" transform="translate(80,104) scale(0.9)"/><use href="#clump" transform="translate(18,108) scale(-0.8,0.8)"/>
      </g>
      <g fill="#93bd76">
        <use href="#clump" transform="translate(35,92) scale(-0.7)"/><use href="#clump" transform="translate(63,79) scale(0.85)"/><use href="#clump" transform="translate(41,67) scale(-0.6,0.6)"/><use href="#clump" transform="translate(77,100) scale(0.55)"/>
      </g>

      <!-- 红色谷仓：侧墙 -->
      <polygon points="352,204 352,132 394,126 394,196" fill="url(#barnS)"/>
      <polygon points="352,132 364,104 404,98 404,126 394,126" fill="#8b7468"/>
      <polygon points="352,132 364,104 368,104 356,132" fill="#7a655a"/>
      <g stroke="#984a3a" stroke-width="0.8" opacity="0.7"><line x1="362" y1="132" x2="362" y2="202"/><line x1="372" y1="130" x2="372" y2="200"/><line x1="382" y1="128" x2="382" y2="198"/></g>
      <rect x="364" y="150" width="14" height="14" fill="#f4ede0" transform="skewY(-8) translate(0,53)"/>
      <rect x="366" y="152" width="10" height="10" fill="#c9b9a6" transform="skewY(-8) translate(0,53)"/>
      <!-- 谷仓正面 -->
      <polygon points="244,204 244,132 256,104 298,84 340,104 352,132 352,204" fill="url(#barn)"/>
      <g stroke="#c2634e" stroke-width="0.8" opacity="0.7">
        <line x1="256" y1="110" x2="256" y2="204"/><line x1="268" y1="98" x2="268" y2="204"/><line x1="280" y1="92" x2="280" y2="204"/><line x1="316" y1="92" x2="316" y2="204"/><line x1="328" y1="98" x2="328" y2="204"/><line x1="340" y1="108" x2="340" y2="204"/>
      </g>
      <path d="M240,134 L254,103 L298,81 L342,103 L356,134" fill="none" stroke="#857065" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M244,132 L256,105 L298,85 L340,105 L352,132" fill="none" stroke="#f4ede0" stroke-width="1.6" stroke-linejoin="round"/>
      <g fill="none" stroke="#f4ede0" stroke-width="2"><line x1="245" y1="134" x2="245" y2="204"/><line x1="351" y1="134" x2="351" y2="204"/></g>
      <!-- 干草阁楼小门 -->
      <rect x="286" y="104" width="24" height="22" fill="#9f4a3a"/>
      <rect x="286" y="104" width="24" height="22" fill="none" stroke="#f4ede0" stroke-width="1.8"/>
      <path d="M287,105 L309,125 M309,105 L287,125" stroke="#f4ede0" stroke-width="1.4"/>
      <rect x="296" y="96" width="4" height="7" fill="#857065"/>
      <g stroke="#e8c87c" stroke-width="1" stroke-linecap="round"><line x1="290" y1="126" x2="288" y2="130"/><line x1="294" y1="126" x2="294" y2="131"/><line x1="300" y1="126" x2="301" y2="130"/><line x1="305" y1="126" x2="307" y2="129"/></g>
      <!-- 大门 -->
      <rect x="268" y="148" width="60" height="56" fill="#a9503f"/>
      <rect x="268" y="148" width="60" height="56" fill="none" stroke="#f4ede0" stroke-width="2.2"/>
      <line x1="298" y1="148" x2="298" y2="204" stroke="#f4ede0" stroke-width="1.8"/>
      <path d="M269,149 L297,203 M297,149 L269,203 M299,149 L327,203 M327,149 L299,203" stroke="#f4ede0" stroke-width="1.5"/>
      <rect x="262" y="142" width="72" height="4" fill="#857065"/>
      <!-- 谷仓外的干草 -->
      <path d="M252,205 C256,200 262,199 266,204 Z M332,204 C336,198 344,198 348,204 Z" fill="#e6c77e"/>

      <!-- 木栅栏 -->
      <g fill="#c9a37a"><rect x="0" y="164" width="244" height="3.6"/><rect x="0" y="176" width="244" height="3.6"/></g>
      <g fill="#b88f66">
        <rect x="4" y="158" width="4.6" height="34"/><rect x="34" y="158" width="4.6" height="34"/><rect x="64" y="158" width="4.6" height="34"/><rect x="94" y="158" width="4.6" height="34"/><rect x="124" y="158" width="4.6" height="34"/><rect x="154" y="158" width="4.6" height="34"/><rect x="184" y="158" width="4.6" height="34"/><rect x="214" y="158" width="4.6" height="34"/><rect x="236" y="158" width="4.6" height="34"/>
      </g>
      <g fill="#d6b48c"><rect x="4" y="157" width="4.6" height="2"/><rect x="34" y="157" width="4.6" height="2"/><rect x="64" y="157" width="4.6" height="2"/><rect x="94" y="157" width="4.6" height="2"/><rect x="124" y="157" width="4.6" height="2"/><rect x="154" y="157" width="4.6" height="2"/><rect x="184" y="157" width="4.6" height="2"/><rect x="214" y="157" width="4.6" height="2"/><rect x="236" y="157" width="4.6" height="2"/></g>

      <!-- 干草捆 -->
      <g>
        <rect x="44" y="170" width="50" height="34" rx="4" fill="url(#hay)"/>
        <g stroke="#d1aa60" stroke-width="0.8" opacity="0.8"><line x1="50" y1="178" x2="90" y2="178"/><line x1="48" y1="188" x2="92" y2="188"/><line x1="50" y1="197" x2="90" y2="197"/></g>
        <ellipse cx="44" cy="187" rx="11" ry="17" fill="url(#hayF)"/>
        <path d="M44,187 C47,186 47,190 44,191 C40,191 39,185 43,183 C48,181 51,187 49,192 C46,197 38,195 37,188 C36,180 44,176 50,180" fill="none" stroke="#cfa65e" stroke-width="0.9"/>
        <rect x="88" y="182" width="44" height="30" rx="4" fill="url(#hay)"/>
        <g stroke="#d1aa60" stroke-width="0.8" opacity="0.8"><line x1="94" y1="190" x2="128" y2="190"/><line x1="92" y1="199" x2="130" y2="199"/><line x1="94" y1="207" x2="128" y2="207"/></g>
        <ellipse cx="88" cy="197" rx="10" ry="15" fill="url(#hayF)"/>
        <path d="M88,197 C91,196 91,200 88,201 C84,201 83,195 87,193 C92,191 95,197 93,202 C90,207 82,205 81,198 C80,190 88,186 94,190" fill="none" stroke="#cfa65e" stroke-width="0.9"/>
        <g stroke="#e6c77e" stroke-width="0.9" stroke-linecap="round"><line x1="70" y1="205" x2="66" y2="208"/><line x1="76" y1="205" x2="78" y2="209"/><line x1="112" y1="213" x2="108" y2="216"/><line x1="120" y1="213" x2="123" y2="216"/></g>
      </g>

      <!-- 奶牛 -->
      <g>
        <path d="M206,170 C212,174 214,184 214,196 C214,198 216,200 216,203 C216,206 213,206 213,203" fill="none" stroke="#e7dfd2" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M212.4,202 C211,206 212,209 214,209 C216,209 217,206 215.6,202 Z" fill="#9b7660"/>
        <g fill="#e7dfd3"><rect x="194" y="194" width="7" height="22" rx="2"/><rect x="150" y="194" width="7" height="22" rx="2"/></g>
        <path d="M150,170 C150,162 158,158 168,158 L196,158 C206,158 212,164 212,174 L212,190 C212,197 206,200 198,200 L160,200 C152,200 146,196 146,188 Z" fill="url(#cow)"/>
        <path d="M166,159 C172,158 182,158 186,160 C188,168 184,176 176,178 C168,180 162,174 162,168 C162,164 163,161 166,159 Z" fill="#a17c64"/>
        <path d="M198,170 C204,168 210,172 212,178 L212,188 C206,192 198,190 196,184 C194,178 194,172 198,170 Z" fill="#a17c64"/>
        <path d="M150,182 C154,180 160,182 160,188 C160,194 154,198 148,196 C146,192 146,186 150,182 Z" fill="#a17c64"/>
        <path d="M182,198 C182,203 192,203 192,198 Z" fill="#efb6a8"/>
        <g stroke="#e8a99a" stroke-width="1.2" stroke-linecap="round"><line x1="184.6" y1="201" x2="184.6" y2="204"/><line x1="189.4" y1="201" x2="189.4" y2="204"/></g>
        <g fill="#f8f4ec"><rect x="200" y="194" width="7" height="22" rx="2"/><rect x="156" y="194" width="7" height="22" rx="2"/></g>
        <g fill="#8a7465"><rect x="200" y="213" width="7" height="4" rx="1"/><rect x="156" y="213" width="7" height="4" rx="1"/><rect x="194" y="213" width="7" height="4" rx="1" opacity="0.8"/><rect x="150" y="213" width="7" height="4" rx="1" opacity="0.8"/></g>
        <!-- 头 -->
        <path d="M152,166 C146,162 140,160 134,162 L148,174 Z" fill="#ece5d9"/>
        <path d="M134,160 C140,158 146,162 146,170 C146,178 142,186 136,190 C130,192 124,190 124,184 C124,176 126,164 134,160 Z" fill="#fbf8f2"/>
        <path d="M134,160 C140,158 144,162 145,168 C140,170 134,168 131,163 Z" fill="#a17c64"/>
        <ellipse cx="130" cy="186" rx="8" ry="6" fill="#efb6a8"/>
        <g fill="#d48f82"><ellipse cx="127" cy="186" rx="1.2" ry="0.9"/><ellipse cx="133" cy="186.4" rx="1.2" ry="0.9"/></g>
        <circle cx="132.6" cy="171" r="1.2" fill="#4a4038"/>
        <path d="M126,163 C120,160 116,162 114,165 C118,167 123,167 127,166 Z" fill="#ece5d9"/>
        <path d="M143,163 C148,159 152,160 154,163 C150,165 146,165 142,165 Z" fill="#e2d9cb"/>
        <path d="M129,160 C128,155 130,152 133,151 C132,154 132,157 133,160 Z" fill="#efe4cc"/>
        <path d="M138,159 C140,155 143,153 146,154 C144,156 142,158 141,161 Z" fill="#efe4cc"/>
      </g>

      <!-- 母鸡 -->
      <g fill="#c98a5a"><use href="#henB" transform="translate(236,232)"/><use href="#headUp" transform="translate(236,232)"/></g>
      <g fill="#f8f4ec"><use href="#henW" transform="translate(270,240) scale(-1,1)"/><use href="#headDown" transform="translate(270,240) scale(-1,1)"/></g>
      <g fill="#c98a5a"><use href="#henB" transform="translate(262,218) scale(0.85)"/><use href="#headDown" transform="translate(262,218) scale(0.85)"/></g>
      <g fill="#e4c98c"><circle cx="248" cy="236" r="0.9"/><circle cx="252" cy="238" r="0.8"/><circle cx="256" cy="234" r="0.9"/><circle cx="249" cy="240" r="0.8"/><circle cx="246" cy="223" r="0.8"/><circle cx="250" cy="221" r="0.8"/></g>

      <!-- 草丛 -->
      <g stroke="#93b672" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.85">
        <path d="M18,232 l2,-8 M22,232 l-1,-7 M26,232 l3,-6 M108,246 l2,-7 M112,246 l-1,-6 M116,246 l3,-6 M190,240 l2,-6 M194,240 l-1,-5 M362,226 l2,-7 M366,226 l-1,-6 M370,226 l3,-6 M60,250 l2,-6 M64,250 l-1,-5"/>
      </g>
      <g fill="#f8f2e6"><circle cx="24" cy="226" r="1.5"/><circle cx="112" cy="240" r="1.4"/><circle cx="366" cy="220" r="1.5"/></g>
      <g fill="#f3d27e"><circle cx="20" cy="228" r="1.4"/><circle cx="116" cy="241" r="1.3"/><circle cx="370" cy="221" r="1.4"/></g>
    </g>

    <!-- 地面阴影 -->
    <g filter="url(#soft2)" opacity="0.2" fill="#5f7a45">
      <ellipse cx="178" cy="217" rx="38" ry="3.4"/><ellipse cx="86" cy="208" rx="52" ry="3.4"/><ellipse cx="318" cy="205" rx="84" ry="3"/>
      <ellipse cx="238" cy="235" rx="12" ry="2"/><ellipse cx="270" cy="243" rx="12" ry="2"/><ellipse cx="262" cy="221" rx="10" ry="1.8"/><ellipse cx="58" cy="170" rx="18" ry="2.4"/>
    </g>
    <!-- 纸纹 -->
    <rect width="400" height="260" filter="url(#grain)"/>
  </g>
</svg>
