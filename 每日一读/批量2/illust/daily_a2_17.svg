        <rect x="72" y="150" width="78" height="62" fill="url(#kiosk)"/>
        <rect x="80" y="158" width="62" height="32" fill="#e9dfcf"/>
        <g>
          <rect x="82" y="161" width="58" height="1.6" fill="#c9b9a2"/><rect x="82" y="174" width="58" height="1.6" fill="#c9b9a2"/>
          <rect x="83" y="162.6" width="7" height="10" fill="#e29a7e"/><rect x="91" y="163.6" width="7" height="9" fill="#9fbfd1"/><rect x="99" y="162.6" width="7" height="10" fill="#f0cf86"/><rect x="107" y="163.6" width="7" height="9" fill="#a9c89a"/><rect x="115" y="162.6" width="7" height="10" fill="#e8b9b6"/><rect x="123" y="163.6" width="7" height="9" fill="#c6b2d0"/><rect x="131" y="162.6" width="8" height="10" fill="#f2dcb4"/>
          <rect x="83" y="175.6" width="8" height="10" fill="#a9c6d3"/><rect x="92" y="176.6" width="7" height="9" fill="#efc38f"/><rect x="100" y="175.6" width="8" height="10" fill="#d99c90"/><rect x="109" y="176.6" width="7" height="9" fill="#f3e2c2"/><rect x="117" y="175.6" width="8" height="10" fill="#9fc39a"/><rect x="126" y="176.6" width="6" height="9" fill="#e6b47c"/><rect x="133" y="175.6" width="6" height="10" fill="#a6b9cd"/>
        </g>
        <rect x="76" y="189" width="70" height="5" rx="1" fill="#6f8f7c"/>
        <g fill="none" stroke="#6c8b78" stroke-width="0.9"><rect x="80" y="197" width="28" height="12"/><rect x="114" y="197" width="28" height="12"/></g>
        <!-- 顶棚 -->
        <path d="M64,150 L158,150 L150,138 L72,138 Z" fill="#6c8a77"/>
        <path d="M64,150 C68,154 72,154 76,150 C80,154 84,154 88,150 C92,154 96,154 100,150 C104,154 108,154 112,150 C116,154 120,154 124,150 C128,154 132,154 136,150 C140,154 144,154 148,150 C152,154 156,154 158,150 Z" fill="#7c9b87"/>
        <rect x="70" y="134" width="82" height="5" rx="1.5" fill="#7f9e8a"/>
        <path d="M100,134 C100,128 122,128 122,134 Z" fill="#6c8a77"/>
        <circle cx="111" cy="127" r="2" fill="#c9a96c"/>
      </g>

      <!-- 鸽子 -->
      <use href="#pigeon" transform="translate(188,232)"/><use href="#pigeon" transform="translate(206,240) scale(-1,1)"/><use href="#pigeon" transform="translate(270,236) scale(0.9)"/>
      <!-- 落叶 -->
      <g fill="#d9b97a" opacity="0.8"><ellipse cx="282" cy="226" rx="2" ry="1.1" transform="rotate(30 282 226)"/><ellipse cx="362" cy="232" rx="2" ry="1.1" transform="rotate(-20 362 232)"/><ellipse cx="316" cy="246" rx="2" ry="1.1"/></g>
