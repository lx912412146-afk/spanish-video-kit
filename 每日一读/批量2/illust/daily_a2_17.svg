      <!-- 路灯 -->
      <g>
        <rect x="236" y="214" width="8" height="4" rx="1" fill="#7f8b88"/>
        <rect x="238.6" y="138" width="2.8" height="77" fill="#87938f"/>
        <rect x="237" y="160" width="6" height="2" fill="#7f8b88"/>
        <path d="M234,128 L246,128 L244,138 L236,138 Z" fill="#f5ecd0" stroke="#7f8b88" stroke-width="1.2"/>
        <path d="M232,128 L248,128 L240,121 Z" fill="#7f8b88"/>
        <circle cx="240" cy="119.6" r="1.4" fill="#7f8b88"/>
      </g>

      <!-- 报亭 -->
      <g>
        <rect x="58" y="160" width="14" height="44" fill="#86a490"/>
        <rect x="150" y="160" width="14" height="44" fill="#86a490"/>
        <g fill="none" stroke="#6c8b78" stroke-width="0.8"><rect x="59" y="161" width="12" height="42"/><rect x="151" y="161" width="12" height="42"/></g>
        <g>
          <rect x="60.5" y="164" width="9" height="11" fill="#e8b27a"/><rect x="60.5" y="178" width="9" height="11" fill="#a6c4d4"/><rect x="60.5" y="192" width="9" height="10" fill="#f0d38c"/>
          <rect x="152.5" y="164" width="9" height="11" fill="#d9a3a6"/><rect x="152.5" y="178" width="9" height="11" fill="#b6cf9e"/><rect x="152.5" y="192" width="9" height="10" fill="#e9c6a0"/>
