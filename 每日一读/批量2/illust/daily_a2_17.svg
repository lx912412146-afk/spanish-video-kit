      <ellipse cx="111" cy="212" rx="58" ry="3.6"/><ellipse cx="322" cy="224" rx="40" ry="3"/><ellipse cx="331" cy="215" rx="30" ry="2.4"/>
      <ellipse cx="240" cy="218" rx="8" ry="1.6"/><ellipse cx="188" cy="234" rx="5" ry="1.2"/><ellipse cx="206" cy="242" rx="5" ry="1.2"/><ellipse cx="270" cy="238" rx="5" ry="1.2"/>
    </g>
    <g filter="url(#soft)" opacity="0.22" fill="#7f8f5e"><ellipse cx="330" cy="222" rx="70" ry="8"/></g>
    <!-- 纸纹 -->
    <rect width="400" height="260" filter="url(#grain)"/>
