<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 260" width="400" height="260">
  <!-- 原创插图：乡间的爷爷奶奶家（白墙红瓦、木栅栏、花园小路、大树、远处田野；水彩风格，纯 SVG 手绘） -->
  <defs>
    <filter id="wc" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="0.35"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="g"/>
      <feColorMatrix in="g" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.38  0 0 0 0 0.3  0 0 0 0.09 0"/>
    </filter>
    <filter id="edge" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="5"/></filter>
    <mask id="fade" maskUnits="userSpaceOnUse" x="0" y="0" width="400" height="260">
      <rect x="7" y="7" width="386" height="246" rx="4" fill="#fff" filter="url(#edge)"/>
    </mask>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0ebf0"/><stop offset="0.35" stop-color="#edf2ec"/><stop offset="0.55" stop-color="#f8f2e2"/><stop offset="1" stop-color="#f8f2e2"/>
    </linearGradient>
    <linearGradient id="meadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe2a6"/><stop offset="0.5" stop-color="#bfd796"/><stop offset="1" stop-color="#accb86"/>
    </linearGradient>
    <linearGradient id="wallF" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fcf8f0"/><stop offset="1" stop-color="#f1e8da"/>
    </linearGradient>
    <linearGradient id="wallS" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ebe1d1"/><stop offset="1" stop-color="#e2d6c3"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d7795a"/><stop offset="1" stop-color="#c9684b"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#dbe8ec"/><stop offset="1" stop-color="#a9c2cc"/>
    </linearGradient>
    <linearGradient id="door" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#95bab3"/><stop offset="1" stop-color="#7ea59f"/>
    </linearGradient>
    <linearGradient id="trunk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ab8566"/><stop offset="0.6" stop-color="#957257"/><stop offset="1" stop-color="#7e5f47"/>
    </linearGradient>
    <linearGradient id="picket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9d3b2"/><stop offset="1" stop-color="#cfae86"/>
    </linearGradient>
    <linearGradient id="path" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe1c6"/><stop offset="1" stop-color="#e6d0ae"/>
    </linearGradient>
    <clipPath id="roofclip"><polygon points="110,121 268,121 290,73 136,73"/></clipPath>
    <path id="clump" d="M-22,8 C-29,3 -26,-8 -17,-9 C-17,-18 -6,-22 0,-17 C6,-23 18,-19 17,-10 C26,-9 28,3 21,8 C17,14 6,13 0,12 C-8,14 -17,13 -22,8 Z"/>
    <path id="pk" d="M-3,30 L-3,3 L0,0 L3,3 L3,30 Z"/>
    <g id="shutter"><rect x="0" y="0" width="8" height="25" fill="#9fc1a2"/><g stroke="#86ab8a" stroke-width="0.7"><line x1="1" y1="4" x2="7" y2="4"/><line x1="1" y1="8" x2="7" y2="8"/><line x1="1" y1="12" x2="7" y2="12"/><line x1="1" y1="16" x2="7" y2="16"/><line x1="1" y1="20" x2="7" y2="20"/></g></g>
    <g id="flowers"><circle cx="0" cy="0" r="2.4" fill="#e7685a"/><circle cx="4.5" cy="-1.5" r="2.2" fill="#f08a7c"/><circle cx="9" cy="0.5" r="2.4" fill="#e7685a"/><circle cx="13.5" cy="-1" r="2.2" fill="#f2a0a0"/><circle cx="18" cy="0.5" r="2.3" fill="#e7685a"/><circle cx="22.5" cy="-1" r="2.1" fill="#f08a7c"/></g>
  </defs>

  <g mask="url(#fade)">
