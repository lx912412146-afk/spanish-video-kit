<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 260" width="400" height="260">
  <!-- 原创插图：湖边钓鱼（小木船、两根钓竿、芦苇、远处的树林和山；水彩风格，纯 SVG 手绘） -->
  <defs>
    <filter id="wc" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="0.35"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="g"/>
      <feColorMatrix in="g" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.38  0 0 0 0 0.3  0 0 0 0.09 0"/>
    </filter>
    <filter id="edge" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="5"/></filter>
    <mask id="fade" maskUnits="userSpaceOnUse" x="0" y="0" width="400" height="260">
      <rect x="7" y="7" width="386" height="246" rx="4" fill="#fff" filter="url(#edge)"/>
    </mask>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e1ecf0"/><stop offset="0.25" stop-color="#eef1ec"/><stop offset="0.4" stop-color="#f8eee0"/><stop offset="0.52" stop-color="#f7e2d2"/><stop offset="1" stop-color="#f7e2d2"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9e8e8"/><stop offset="0.4" stop-color="#c0dadf"/><stop offset="1" stop-color="#a6c8d1"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c79a6e"/><stop offset="1" stop-color="#a87d56"/>
    </linearGradient>
    <linearGradient id="inside" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a47b57"/><stop offset="1" stop-color="#8f6a4b"/>
    </linearGradient>
    <linearGradient id="bank" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bcd394"/><stop offset="1" stop-color="#a6c482"/>
    </linearGradient>
    <linearGradient id="bucket" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9fb6c2"/><stop offset="0.45" stop-color="#c4d5dd"/><stop offset="1" stop-color="#93abb8"/>
    </linearGradient>
    <path id="pine" d="M0,0 L-5,10 L-2.5,10 L-7,19 L-3,19 L-9,29 L9,29 L3,19 L7,19 L2.5,10 L5,10 Z"/>
  </defs>

  <g mask="url(#fade)">
    <!-- 天空 -->
    <rect width="400" height="260" fill="url(#sky)"/>

    <g filter="url(#wc)">
      <g filter="url(#soft2)" fill="#ffffff" opacity="0.85">
        <ellipse cx="300" cy="34" rx="26" ry="6"/><ellipse cx="316" cy="30" rx="14" ry="6"/><ellipse cx="160" cy="76" rx="20" ry="4.5"/>
      </g>
      <!-- 远山 -->
      <path d="M120,140 C150,128 180,112 210,100 C226,94 236,80 252,70 C262,64 270,58 282,56 C292,58 300,66 310,74 C322,84 332,78 344,70 C354,64 362,66 372,74 C382,82 392,88 400,92 L400,140 Z" fill="#b6c6de"/>
      <path d="M272,62 L282,56 L292,60 L286,66 L280,62 Z" fill="#eef2f4" opacity="0.9"/>
      <path d="M0,140 L0,116 C20,110 44,106 66,110 C90,114 108,104 130,108 C160,114 186,104 214,108 C244,112 262,100 290,98 C320,96 340,104 366,102 C380,101 392,104 400,106 L400,140 Z" fill="#9fb3d0"/>
      <!-- 对岸树林 -->
      <path d="M0,142 L0,128 C10,124 18,126 24,122 C32,118 40,124 48,122 C58,118 66,124 74,121 C86,116 96,124 108,122 C120,118 132,126 146,124 C160,120 174,126 188,124 C204,120 218,126 232,124 C246,120 262,124 276,122 C292,118 306,124 322,122 C338,118 352,124 368,122 C382,120 392,124 400,122 L400,142 Z" fill="#9fbc94"/>
      <g fill="#86a983">
        <use href="#pine" transform="translate(30,112) scale(0.9)"/><use href="#pine" transform="translate(42,116) scale(0.75)"/><use href="#pine" transform="translate(84,110) scale(0.95)"/>
        <use href="#pine" transform="translate(96,115) scale(0.8)"/><use href="#pine" transform="translate(150,112) scale(0.9)"/><use href="#pine" transform="translate(206,113) scale(0.85)"/>
        <use href="#pine" transform="translate(262,110) scale(0.95)"/><use href="#pine" transform="translate(274,115) scale(0.8)"/><use href="#pine" transform="translate(330,111) scale(0.9)"/>
        <use href="#pine" transform="translate(372,113) scale(0.85)"/>
      </g>
      <g fill="#a9c69a">
        <circle cx="60" cy="130" r="8"/><circle cx="122" cy="129" r="9"/><circle cx="182" cy="130" r="8"/><circle cx="238" cy="129" r="9"/><circle cx="300" cy="130" r="8"/><circle cx="352" cy="130" r="9"/>
      </g>

      <!-- 湖面 -->
      <rect x="0" y="140" width="400" height="120" fill="url(#lake)"/>
      <!-- 倒影 -->
      <g opacity="0.35">
        <path d="M0,140 L400,140 L400,152 C380,154 360,150 340,153 C320,156 300,151 280,154 C260,156 240,151 220,154 C200,156 180,151 160,154 C140,156 120,151 100,154 C80,156 60,151 40,154 C20,156 10,152 0,153 Z" fill="#8fb18a"/>
      </g>
      <g opacity="0.25" fill="#9fb3c2"><path d="M120,140 L400,140 L400,176 C380,172 360,168 344,174 C330,178 320,170 310,166 C300,162 290,160 282,166 C270,172 256,164 240,158 C220,152 180,148 120,140 Z"/></g>
      <g stroke="#f4f8f6" stroke-width="1" opacity="0.8" stroke-linecap="round">
        <line x1="20" y1="160" x2="60" y2="160"/><line x1="90" y1="166" x2="120" y2="166"/><line x1="300" y1="162" x2="350" y2="162"/>
        <line x1="40" y1="182" x2="90" y2="182"/><line x1="330" y1="180" x2="372" y2="180"/><line x1="120" y1="230" x2="170" y2="230"/>
        <line x1="250" y1="236" x2="300" y2="236"/><line x1="180" y1="172" x2="216" y2="172"/>
      </g>

      <!-- 清晨湖面的薄雾 -->
      <g filter="url(#soft)" fill="#ffffff" opacity="0.55">
        <ellipse cx="90" cy="145" rx="96" ry="4"/><ellipse cx="310" cy="147" rx="104" ry="4"/>
      </g>
      <!-- 钓竿（在船后面伸出去） -->
      <g stroke="#7f6048" stroke-linecap="round" fill="none">
        <path d="M244,190 L330,104" stroke-width="1.8"/><path d="M262,190 L358,124" stroke-width="1.8"/>
      </g>
      <g stroke="#e9e4da" stroke-width="0.6" fill="none" opacity="0.95">
        <path d="M330,104 C334,140 338,170 340,192"/><path d="M358,124 C362,156 366,184 368,204"/>
      </g>
      <g>
        <circle cx="340" cy="193" r="2.4" fill="#e2685a"/><path d="M337.6,193 A2.4,2.4 0 0 0 342.4,193 Z" fill="#fbf6ee"/>
        <circle cx="368" cy="205" r="2.4" fill="#e2685a"/><path d="M365.6,205 A2.4,2.4 0 0 0 370.4,205 Z" fill="#fbf6ee"/>
      </g>
      <g fill="none" stroke="#f6faf8" stroke-width="0.8" opacity="0.9">
        <ellipse cx="340" cy="195.5" rx="7" ry="1.6"/><ellipse cx="340" cy="196" rx="12" ry="2.6" opacity="0.6"/>
        <ellipse cx="368" cy="207.5" rx="7" ry="1.6"/><ellipse cx="368" cy="208" rx="12" ry="2.6" opacity="0.6"/>
      </g>

      <!-- 小木船 -->
      <path d="M152,206 C176,222 262,222 290,202 L290,212 C262,230 176,230 152,214 Z" fill="#7f9fae" opacity="0.35"/>
      <path d="M146,184 C168,173 270,171 294,182 C270,189 170,190 146,184 Z" fill="url(#inside)"/>
      <!-- 另一支桨（远侧） -->
      <path d="M204,177 L160,166" stroke="#c09a73" stroke-width="2" stroke-linecap="round"/>
      <path d="M163,167 C156,165 148,164 143,165 C147,168 155,170 162,170 Z" fill="#cfa982"/>
      <!-- 船里的东西 -->
      <polygon points="186,177.6 196,177.2 198,189.2 188,189.6" fill="#d2a87c"/>
      <polygon points="246,176.6 256,176.8 256,188.6 246,188.8" fill="#d2a87c"/>
      <ellipse cx="192" cy="178" rx="13" ry="3.4" fill="#ead39b"/>
      <ellipse cx="192" cy="175.6" rx="6.4" ry="3.8" fill="#f0dca6"/>
      <path d="M186,176.6 C190,178 195,178 198.4,176.6" stroke="#d98a6f" stroke-width="1.4" fill="none"/>
      <path d="M220,186 L222,174 L234,174 L236,186 Z" fill="url(#bucket)"/>
      <ellipse cx="228" cy="174" rx="6" ry="1.6" fill="#d8e4ea"/>
      <path d="M222,175 C222,168 234,168 234,175" stroke="#8ea6b3" stroke-width="0.9" fill="none"/>
      <rect x="240" y="183" width="5" height="4" rx="1" fill="#9aa4aa"/><rect x="258" y="183" width="5" height="4" rx="1" fill="#9aa4aa"/>
      <!-- 船身 -->
      <path d="M146,184 C170,190 270,189 294,182 C292,194 282,206 262,210 C230,216 190,214 172,206 C160,200 150,194 146,184 Z" fill="url(#hull)"/>
      <g stroke="#9a714d" stroke-width="0.8" fill="none" opacity="0.8">
        <path d="M151,193 C176,200 264,199 290,191"/><path d="M158,201 C186,208 258,207 284,199"/>
      </g>
      <path d="M146,184 C170,190 270,189 294,182" stroke="#e0bc90" stroke-width="2.8" fill="none" stroke-linecap="round"/>
      <path d="M146,184 C168,173 270,171 294,182" stroke="#c99d72" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M166,195 C190,201 240,201 270,196" stroke="#d9b48a" stroke-width="1.2" fill="none" opacity="0.6"/>
      <!-- 船桨 -->
      <path d="M210,188 L160,207" stroke="#c9a27a" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M163,205 C156,206 146,211 142,214 C146,216 156,214 163,210 Z" fill="#d6b089"/>
      <ellipse cx="150" cy="214" rx="12" ry="2.2" fill="none" stroke="#f4f8f6" stroke-width="0.8" opacity="0.9"/>
      <rect x="207" y="185" width="5" height="3.6" rx="1" fill="#8d8a86"/>

      <!-- 左下的岸和芦苇 -->
      <path d="M0,214 C30,210 64,216 92,226 C110,232 120,244 126,262 L0,262 Z" fill="url(#bank)"/>
      <g fill="#c9c1ad"><ellipse cx="96" cy="236" rx="5" ry="2.6"/><ellipse cx="106" cy="246" rx="4" ry="2"/><ellipse cx="86" cy="244" rx="3" ry="1.6"/></g>
      <g stroke-linecap="round" fill="none">
        <g stroke="#93ad72" stroke-width="1.6">
          <path d="M20,240 C22,200 26,176 30,150"/><path d="M34,238 C36,204 38,184 42,164"/><path d="M48,236 C48,208 52,190 58,172"/>
          <path d="M62,236 C62,214 64,200 70,186"/><path d="M12,242 C10,214 10,196 8,178"/>
        </g>
        <g stroke="#a9c085" stroke-width="2.2">
          <path d="M26,240 C18,220 10,206 2,198"/><path d="M40,238 C50,220 60,210 76,204"/><path d="M54,238 C44,222 38,212 28,204"/><path d="M70,238 C78,226 86,220 98,216"/>
        </g>
      </g>
      <g fill="#ab8160">
        <rect x="27.6" y="146" width="5" height="16" rx="2.5" transform="rotate(8 30 154)"/><rect x="39.6" y="160" width="4.6" height="14" rx="2.3" transform="rotate(10 42 167)"/>
        <rect x="56" y="168" width="4.4" height="13" rx="2.2" transform="rotate(16 58 174)"/><rect x="5.6" y="174" width="4.4" height="13" rx="2.2" transform="rotate(-6 8 180)"/>
      </g>
      <!-- 右下的芦苇 -->
      <path d="M300,262 C320,246 350,238 400,234 L400,262 Z" fill="url(#bank)"/>
      <g stroke-linecap="round" fill="none">
        <g stroke="#93ad72" stroke-width="1.6">
          <path d="M372,246 C372,214 376,196 380,176"/><path d="M386,246 C388,220 390,204 394,190"/><path d="M358,250 C356,226 354,212 350,198"/>
        </g>
        <g stroke="#a9c085" stroke-width="2.2">
          <path d="M376,248 C366,232 356,224 342,220"/><path d="M390,246 C396,234 400,228 404,224"/><path d="M362,250 C354,240 346,236 334,234"/>
        </g>
      </g>
      <g fill="#ab8160">
        <rect x="377.8" y="172" width="4.6" height="14" rx="2.3" transform="rotate(10 380 179)"/><rect x="347.8" y="192" width="4.4" height="13" rx="2.2" transform="rotate(-10 350 198)"/>
      </g>
    </g>

    <!-- 阴影 -->
    <g filter="url(#soft2)" opacity="0.16" fill="#5f7a85">
      <ellipse cx="222" cy="212" rx="74" ry="4"/>
    </g>
    <!-- 纸纹 -->
    <rect width="400" height="260" filter="url(#grain)"/>
  </g>
</svg>
