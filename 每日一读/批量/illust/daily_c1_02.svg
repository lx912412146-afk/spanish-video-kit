<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 260" width="400" height="260">
  <!-- 原创插图：用金线修补过裂纹的陶碗、架子上的手工陶器（水彩风格，纯 SVG 手绘） -->
  <defs>
    <filter id="wc" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="0.35"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="g"/>
      <feColorMatrix in="g" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.38  0 0 0 0 0.3  0 0 0 0.09 0"/>
    </filter>
    <filter id="edge" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="5"/></filter>
    <mask id="fade" maskUnits="userSpaceOnUse" x="0" y="0" width="400" height="260">
      <rect x="7" y="7" width="386" height="246" rx="4" fill="#fff" filter="url(#edge)"/>
    </mask>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf3e6"/><stop offset="0.6" stop-color="#f8e9d6"/><stop offset="1" stop-color="#f3dec6"/>
    </linearGradient>
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dcb995"/><stop offset="1" stop-color="#cfa77f"/>
    </linearGradient>
    <linearGradient id="tableF" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b88d66"/><stop offset="1" stop-color="#a77d58"/>
    </linearGradient>
    <linearGradient id="glaze" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9dbcb7"/><stop offset="0.3" stop-color="#bcd5cf"/><stop offset="0.7" stop-color="#8fb0ab"/><stop offset="1" stop-color="#6f9490"/>
    </linearGradient>
    <radialGradient id="inner" cx="0.5" cy="0.75" r="0.7">
      <stop offset="0" stop-color="#e6efe7"/><stop offset="0.7" stop-color="#c9dcd5"/><stop offset="1" stop-color="#a9c4be"/>
    </radialGradient>
    <linearGradient id="clay" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e2c29c"/><stop offset="1" stop-color="#c79f77"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0cf78"/><stop offset="0.5" stop-color="#d9a743"/><stop offset="1" stop-color="#e8bf5c"/>
    </linearGradient>
    <linearGradient id="sage" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b7cda6"/><stop offset="0.4" stop-color="#cddcbc"/><stop offset="1" stop-color="#97b28a"/>
    </linearGradient>
    <linearGradient id="terra" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d98c66"/><stop offset="0.4" stop-color="#e7a684"/><stop offset="1" stop-color="#c47552"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9fb4c6"/><stop offset="0.4" stop-color="#bccbd7"/><stop offset="1" stop-color="#8399ad"/>
    </linearGradient>
    <linearGradient id="ochre" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e3bb73"/><stop offset="0.4" stop-color="#efcf92"/><stop offset="1" stop-color="#cfa25a"/>
    </linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f1e6d2"/><stop offset="0.4" stop-color="#fbf5ea"/><stop offset="1" stop-color="#e2d4bc"/>
    </linearGradient>
    <linearGradient id="linen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6ecdb"/><stop offset="1" stop-color="#eddcc2"/>
    </linearGradient>
  </defs>

  <g mask="url(#fade)">
    <!-- 墙面与窗光 -->
    <rect width="400" height="260" fill="url(#wall)"/>
    <g filter="url(#soft)" opacity="0.45">
      <path d="M30,70 L120,70 L150,180 L60,180 Z" fill="#fffaf0"/>
    </g>

    <!-- 工坊里宽大的木架（碗就放在这一层） -->
    <g filter="url(#soft)" opacity="0.22" fill="#8a6a4a">
      <rect x="0" y="232" width="400" height="10"/>
    </g>
    <g filter="url(#wc)">
      <path d="M44,230 L56,230 L56,250 Z" fill="#c9a57c"/><path d="M356,230 L344,230 L344,250 Z" fill="#c9a57c"/>
      <path d="M50,230 L50,248 M350,230 L350,248" stroke="#b48e66" stroke-width="2"/>
    </g>
    <path d="M0,188 L400,188 L400,222 L0,222 Z" fill="url(#table)"/>
    <rect x="0" y="186" width="400" height="3" fill="#e6caa7"/>
    <rect x="0" y="222" width="400" height="9" fill="url(#tableF)"/>
    <rect x="0" y="220.5" width="400" height="2.5" fill="#e2c39d"/>
    <g stroke="#c39b74" stroke-width="0.8" opacity="0.6" fill="none">
      <path d="M0,200 C80,198 160,202 240,199 C300,197 360,200 400,199"/><path d="M0,212 C90,210 170,215 260,211 C320,209 370,212 400,211"/>
    </g>

    <!-- 墙上架子的影子 -->
    <g filter="url(#soft2)" opacity="0.16" fill="#8a6a4a">
      <rect x="244" y="94" width="148" height="5"/><rect x="244" y="156" width="148" height="5"/>
    </g>

    <g filter="url(#wc)">
      <!-- 墙上的木架 -->
      <rect x="238" y="86" width="156" height="6" rx="1.5" fill="#d6b48c"/>
      <rect x="238" y="148" width="156" height="6" rx="1.5" fill="#d6b48c"/>
      <path d="M252,92 L258,104 M380,92 L374,104 M252,154 L258,166 M380,154 L374,166" stroke="#c9a57c" stroke-width="2.2"/>

      <!-- 上层：高花瓶和干枝 -->
      <g stroke="#a98058" stroke-width="1.1" fill="none" stroke-linecap="round">
        <path d="M266,42 C264,30 258,22 250,14"/><path d="M268,42 C270,28 276,18 284,10"/><path d="M262,30 C258,26 254,26 250,26"/><path d="M272,26 C276,22 280,22 284,22"/>
      </g>
      <g fill="#c99a6a">
        <ellipse cx="250" cy="13" rx="2.2" ry="1.6"/><ellipse cx="249" cy="26" rx="2" ry="1.5"/><ellipse cx="285" cy="9" rx="2.2" ry="1.6"/><ellipse cx="285" cy="22" rx="2" ry="1.5"/><ellipse cx="258" cy="20" rx="1.8" ry="1.3"/><ellipse cx="278" cy="15" rx="1.8" ry="1.3"/>
      </g>
      <path d="M262,40 L274,40 L274,48 C284,54 288,66 284,76 C281,82 278,86 274,86 L262,86 C258,86 255,82 252,76 C248,66 252,54 262,48 Z" fill="url(#sage)"/>
      <rect x="260" y="38" width="16" height="4" rx="1.5" fill="#c4d6b2"/>
      <path d="M254,64 C262,66 274,66 282,64" stroke="#a3bb94" stroke-width="1.2" fill="none"/>
      <ellipse cx="259" cy="62" rx="2" ry="7" fill="#fff" opacity="0.3"/>

      <!-- 上层：陶土小壶 -->
      <path d="M302,56 L322,56 C330,62 334,72 330,80 C328,84 324,86 320,86 L304,86 C300,86 296,84 294,80 C290,72 294,62 302,56 Z" fill="url(#terra)"/>
      <path d="M300,56 L324,56 L322,52 L302,52 Z" fill="#d38a63"/>
      <path d="M302,53 L294,50 L300,58 Z" fill="#cf8560"/>
      <path d="M326,60 C338,60 338,76 328,78" stroke="#c97b56" stroke-width="3" fill="none"/>
      <path d="M296,70 C306,72 318,72 330,70" stroke="#f1c7a6" stroke-width="1.2" fill="none" opacity="0.8"/>

      <!-- 上层：两只叠放的小杯 -->
      <path d="M346,70 L370,70 L367,86 L349,86 Z" fill="url(#cream)"/>
      <path d="M347,76 L369,76" stroke="#9fb4c6" stroke-width="1.6"/>
      <path d="M344,62 L372,62 L369,72 L347,72 Z" fill="url(#cream)"/>
      <ellipse cx="358" cy="62" rx="14" ry="2.6" fill="#efe4d0"/>
      <path d="M346,67 L370,67" stroke="#9fb4c6" stroke-width="1.6"/>

      <!-- 下层：灰蓝带盖罐子 -->
      <path d="M258,116 L282,116 C292,122 294,136 288,144 C286,147 282,148 278,148 L262,148 C258,148 254,147 252,144 C246,136 248,122 258,116 Z" fill="url(#blue)"/>
      <path d="M256,116 L284,116 C284,112 280,110 270,110 C260,110 256,112 256,116 Z" fill="#a9bccc"/>
      <circle cx="270" cy="108" r="3" fill="#93a8bb"/>
      <path d="M252,130 C262,133 280,133 290,130" stroke="#d9e2e8" stroke-width="1.4" fill="none" opacity="0.8"/>
      <ellipse cx="258" cy="130" rx="2" ry="7" fill="#fff" opacity="0.3"/>

      <!-- 下层：赭黄小碗 -->
      <path d="M300,132 L338,132 C336,142 328,148 319,148 C310,148 302,142 300,132 Z" fill="url(#ochre)"/>
      <ellipse cx="319" cy="132" rx="19" ry="3.6" fill="#f3dcae"/>
      <ellipse cx="319" cy="132.5" rx="15" ry="2.3" fill="#e2bd78"/>

      <!-- 下层：深色细口瓶 -->
      <path d="M362,118 L370,118 L370,126 C378,130 380,140 376,146 C375,147 373,148 371,148 L361,148 C359,148 357,147 356,146 C352,140 354,130 362,126 Z" fill="url(#terra)" opacity="0.85"/>
      <rect x="360" y="116" width="12" height="3" rx="1" fill="#c8805c"/>
      <path d="M356,136 C362,138 370,138 377,136" stroke="#8fb0ab" stroke-width="2" fill="none" opacity="0.8"/>

      <!-- 亚麻布 -->
      <path d="M72,197 L240,195 L247,219 L64,220 Z" fill="url(#linen)"/>
      <path d="M70,201 L242,199 M66,214 L246,212" stroke="#d9b49a" stroke-width="1.2" opacity="0.7"/>
      <path d="M72,197 L240,195 L247,219 L64,220 Z" fill="none" stroke="#e8d6bb" stroke-width="1"/>

      <!-- 主角：金缮陶碗 -->
      <ellipse cx="154" cy="213" rx="28" ry="5.5" fill="#bf976f"/>
      <path d="M128,204 L180,204 L180,212 C172,215 136,215 128,212 Z" fill="url(#clay)"/>
      <path d="M84,146 C86,176 110,202 130,206 L178,206 C198,202 222,176 224,146 A70,18 0 0 1 84,146 Z" fill="url(#glaze)"/>
      <!-- 碗底露胎 -->
      <path d="M106,188 C116,192 124,190 132,194 C142,197 150,193 160,196 C170,198 180,193 190,194 C196,192 200,190 202,188 C196,198 188,204 178,206 L130,206 C120,204 112,198 106,188 Z" fill="url(#clay)" opacity="0.95"/>
      <path d="M106,188 C116,192 124,190 132,194 C142,197 150,193 160,196 C170,198 180,193 190,194 C196,192 200,190 202,188" stroke="#7fa29d" stroke-width="1.2" fill="none" opacity="0.8"/>
      <path d="M98,160 C100,172 108,182 116,188" stroke="#e1ece6" stroke-width="3" fill="none" opacity="0.6" stroke-linecap="round"/>
      <!-- 碗口与碗内 -->
      <ellipse cx="154" cy="146" rx="70" ry="18" fill="#d8e5de"/>
      <ellipse cx="154" cy="146.6" rx="66" ry="15.6" fill="url(#inner)"/>
      <path d="M90,146 A64,14 0 0 1 218,146" stroke="#9cbab5" stroke-width="1.4" fill="none" opacity="0.7"/>
      <path d="M90,147 A64,14 0 0 1 218,147 A64,9 0 0 0 90,147 Z" fill="#a8c3bd" opacity="0.45"/>
      <ellipse cx="160" cy="153" rx="28" ry="5" fill="#eef4ee" opacity="0.7"/>

      <!-- 金色修补线 -->
      <g fill="none" stroke-linecap="round" stroke-linejoin="round">
        <g stroke="url(#gold)" stroke-width="2.2">
          <path d="M118,162 C120,166 125,168 123,173 C121,178 126,182 128,187 C129,191 126,194 127,198"/>
          <path d="M123,173 C128,175 133,176 135,181 C137,184 136,186 139,189"/>
          <path d="M197,160 C195,165 191,168 192,173 C193,178 196,181 193,186 C191,189 190,191 190,195"/>
          <path d="M126,134 C131,137 137,137 139,141 C141,145 145,147 150,148 C155,149 158,146 162,149 C166,152 165,156 169,158"/>
          <path d="M150,148 C150,152 147,154 148,158"/>
          <path d="M202,136 C199,139 194,140 193,144"/>
        </g>
        <g fill="#e2b252">
          <ellipse cx="123" cy="173" rx="2" ry="1.6"/><ellipse cx="150" cy="148" rx="2.2" ry="1.4"/><ellipse cx="192" cy="173" rx="1.6" ry="1.4"/>
        </g>
        <g stroke="#f8e2a4" stroke-width="0.8" opacity="0.9">
          <path d="M118.6,162.4 C120.4,166 124.6,168 122.8,172"/><path d="M196.6,161 C194.8,165 191.4,168 191.6,172"/><path d="M127,134 C131,136.6 136.6,136.8 138.6,140.4"/><path d="M154,148.4 C157,147 159,146.6 161.6,148.6"/>
        </g>
      </g>

      <!-- 小碟金粉和细笔 -->
      <path d="M262,210 C262,216 270,220 284,220 C298,220 306,216 306,210 Z" fill="#e4d8c4"/>
      <ellipse cx="284" cy="210" rx="22" ry="6" fill="#f4ecdf"/>
      <ellipse cx="284" cy="210.6" rx="16" ry="4" fill="#e6dac6"/>
      <ellipse cx="284" cy="211" rx="10" ry="2.6" fill="url(#gold)"/>
      <ellipse cx="281" cy="210.4" rx="3" ry="0.8" fill="#fbe9b4"/>
      <path d="M254,218 L298,206" stroke="#c9a57c" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M298,206 L306,203" stroke="#a8a49a" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M306,203 L314,200" stroke="#6f5f50" stroke-width="2" stroke-linecap="round"/>
      <circle cx="315" cy="199.6" r="1" fill="#e2b04f"/>
    </g>

    <!-- 地面阴影 -->
    <g filter="url(#soft2)" opacity="0.2" fill="#8a6a4a">
      <ellipse cx="158" cy="218" rx="46" ry="4.5"/><ellipse cx="286" cy="218" rx="20" ry="2.2"/><ellipse cx="278" cy="219" rx="22" ry="1.6"/>
      <ellipse cx="270" cy="88" rx="16" ry="1.8"/><ellipse cx="314" cy="88" rx="18" ry="1.8"/><ellipse cx="358" cy="88" rx="12" ry="1.6"/>
      <ellipse cx="270" cy="150" rx="20" ry="1.8"/><ellipse cx="319" cy="150" rx="16" ry="1.6"/><ellipse cx="366" cy="150" rx="12" ry="1.6"/>
    </g>
    <!-- 纸纹 -->
    <rect width="400" height="260" filter="url(#grain)"/>
  </g>
</svg>
