        <ellipse cx="72" cy="214" rx="56" ry="10"/><ellipse cx="338" cy="214" rx="56" ry="10"/>
      </g>

      <!-- 路灯 -->
      <rect x="266.5" y="128" width="3.4" height="112" fill="#66766d"/>
      <path d="M263,240 L273,240 L272,232 L264,232 Z" fill="#5d6c64"/>
      <path d="M261,116 L276,116 L274,128 L263,128 Z" fill="#f7ecd0"/>
      <path d="M260,116 L277,116 L268.2,108 Z" fill="#66766d"/><rect x="262" y="127" width="13" height="2.6" fill="#66766d"/>
      <circle cx="268.2" cy="106.6" r="1.8" fill="#66766d"/>

      <!-- 长椅 -->
      <g fill="#6a776f">
        <path d="M160,212 L163,212 L165,196 L162,196 Z"/><path d="M240,212 L237,212 L235,196 L238,196 Z"/>
        <path d="M162,196 C160,190 160,184 162,178 L165,178 C163,184 163,190 165,196 Z"/><path d="M238,196 C240,190 240,184 238,178 L235,178 C237,184 237,190 235,196 Z"/>
        <path d="M156,194 C158,190 164,190 168,192 L166,195 C162,193 159,193 158,195 Z"/><path d="M244,194 C242,190 236,190 232,192 L234,195 C238,193 241,193 242,195 Z"/>
      </g>
      <rect x="158" y="178" width="84" height="5" rx="1.5" fill="#c08c62"/>
      <rect x="158" y="185" width="84" height="5" rx="1.5" fill="#b58159"/>
      <path d="M156,195 L244,195 L246,201 L154,201 Z" fill="#c99a6e"/>
      <rect x="154" y="200" width="92" height="2.4" fill="#a87650"/>
      <line x1="160" y1="179.5" x2="240" y2="179.5" stroke="#e0b58c" stroke-width="1" opacity="0.7"/>

      <!-- 树 -->
      <path d="M64,238 C66,210 62,180 66,150 C68,136 70,128 70,118 L80,118 C80,130 80,140 82,152 C84,182 80,212 82,238 Z" fill="url(#trunk)"/>
      <path d="M70,140 C64,130 56,124 46,120 M80,136 C88,128 96,124 104,122" stroke="#a99a7e" stroke-width="3.4" fill="none" stroke-linecap="round"/>
      <g fill="#ddd3ba" opacity="0.85"><ellipse cx="70" cy="176" rx="3" ry="6"/><ellipse cx="76" cy="206" rx="2.6" ry="5"/><ellipse cx="72" cy="150" rx="2.2" ry="4"/></g>
      <g fill="#8f8268" opacity="0.6"><ellipse cx="78" cy="190" rx="2" ry="4"/><ellipse cx="68" cy="222" rx="2" ry="3.4"/></g>
      <rect x="54" y="236" width="38" height="5" rx="1" fill="#b9ad97"/>
      <use href="#canopy" transform="translate(72,97) scale(1.05)"/>

      <path d="M330,238 C332,210 328,180 332,150 C334,136 336,128 336,118 L346,118 C346,130 346,140 348,152 C350,182 346,212 348,238 Z" fill="url(#trunk)"/>
      <path d="M336,140 C330,130 322,124 312,120 M346,136 C354,128 362,124 370,122" stroke="#a99a7e" stroke-width="3.4" fill="none" stroke-linecap="round"/>
      <g fill="#ddd3ba" opacity="0.85"><ellipse cx="336" cy="170" rx="3" ry="6"/><ellipse cx="342" cy="204" rx="2.6" ry="5"/><ellipse cx="338" cy="146" rx="2.2" ry="4"/></g>
      <g fill="#8f8268" opacity="0.6"><ellipse cx="344" cy="186" rx="2" ry="4"/><ellipse cx="334" cy="222" rx="2" ry="3.4"/></g>
      <rect x="320" y="236" width="38" height="5" rx="1" fill="#b9ad97"/>
      <use href="#canopy" transform="translate(340,84) scale(-1.08,1.05)"/>

      <!-- 落叶 -->
      <g fill="#c9b36a" opacity="0.9">
        <ellipse cx="104" cy="222" rx="3" ry="1.6" transform="rotate(20 104 222)"/><ellipse cx="250" cy="218" rx="3" ry="1.6" transform="rotate(-30 250 218)"/>
        <ellipse cx="160" cy="238" rx="3" ry="1.6" transform="rotate(40 160 238)"/><ellipse cx="372" cy="226" rx="3" ry="1.6" transform="rotate(-10 372 226)"/>
      </g>
      <ellipse cx="312" cy="220" rx="3" ry="1.6" transform="rotate(30 312 220)" fill="#a9c27a"/><ellipse cx="40" cy="226" rx="3" ry="1.6" transform="rotate(-20 40 226)" fill="#a9c27a"/>
      <!-- 面包屑 -->
      <g fill="#efdcb4"><circle cx="146" cy="233" r="1"/><circle cx="152" cy="236" r="0.9"/><circle cx="200" cy="230" r="1"/><circle cx="208" cy="236" r="0.9"/><circle cx="213" cy="232" r="1"/><circle cx="284" cy="232" r="1"/><circle cx="278" cy="236" r="0.9"/><circle cx="240" cy="238" r="1"/></g>
      <!-- 鸽子 -->
      <use href="#pigeon" transform="translate(132,228)"/>
      <use href="#pigeon" transform="translate(190,222) scale(-1,1)"/>
      <use href="#pigeon" transform="translate(222,234) rotate(24)"/>
      <use href="#pigeon" transform="translate(298,226) scale(-0.95,0.95)"/>
