      <rect x="4" y="122" width="5" height="8" fill="#d6dcda"/><rect x="14" y="122" width="5" height="8" fill="#d6dcda"/>

      <!-- 楼房 1（左，被树挡住大半） -->
      <rect x="24" y="96" width="82" height="78" fill="#f1d2b2"/>
      <rect x="22" y="92" width="86" height="5" fill="#cf8463"/><rect x="22" y="96" width="86" height="3" fill="#f8e8d4"/>
      <use href="#win" transform="translate(40,108)"/><use href="#win" transform="translate(78,108)"/>
      <path d="M50,174 L50,150 C50,143 66,143 66,150 L66,174 Z" fill="#a8805f"/>

      <!-- 楼房 2 -->
      <rect x="104" y="64" width="84" height="110" fill="#f4e3bd"/>
      <rect x="102" y="59" width="88" height="5" fill="#cc7d5c"/><rect x="102" y="63" width="88" height="3.5" fill="#fbf1dc"/>
      <rect x="104" y="98" width="84" height="2.4" fill="#fbf1dc"/><rect x="104" y="132" width="84" height="2.4" fill="#fbf1dc"/>
      <use href="#win" transform="translate(118,74)"/><use href="#win" transform="translate(156,74)"/>
      <use href="#win" transform="translate(118,106)"/><use href="#win" transform="translate(156,106)"/>
      <use href="#balc" transform="translate(118,124)"/><use href="#balc" transform="translate(156,124)"/>
      <path d="M114,174 L114,150 C114,142 132,142 132,150 L132,174 Z" fill="#a8805f"/><line x1="123" y1="146" x2="123" y2="174" stroke="#94704f" stroke-width="1"/>
      <rect x="142" y="150" width="38" height="24" fill="#c9d6d4"/><rect x="142" y="150" width="38" height="24" fill="none" stroke="#9c7a5c" stroke-width="1.5"/>
      <rect x="146" y="153" width="6" height="12" fill="#fff" opacity="0.4"/>
      <path d="M138,140 L184,140 L188,150 L134,150 Z" fill="#f5ead8"/><g clip-path="url(#awnClip)" fill="#d9846a"><rect x="134" y="140" width="4" height="10"/><rect x="142" y="140" width="4" height="10"/><rect x="150" y="140" width="4" height="10"/><rect x="158" y="140" width="4" height="10"/><rect x="166" y="140" width="4" height="10"/><rect x="174" y="140" width="4" height="10"/><rect x="182" y="140" width="4" height="10"/></g>
      <path d="M134,150 C138,153 141,153 144,150 C147,153 150,153 153,150 C156,153 159,153 162,150 C165,153 168,153 171,150 C174,153 177,153 180,150 C183,153 186,153 188,150" fill="#d9846a"/>

      <!-- 楼房 3 -->
      <rect x="188" y="58" width="76" height="116" fill="#ebc0a6"/>
      <rect x="186" y="53" width="80" height="5" fill="#c46f50"/><rect x="186" y="57" width="80" height="3.5" fill="#f8e4d6"/>
      <rect x="188" y="98" width="76" height="2.4" fill="#f8e4d6"/><rect x="188" y="132" width="76" height="2.4" fill="#f8e4d6"/>
      <use href="#win" transform="translate(202,72)"/><use href="#win" transform="translate(240,72)"/>
      <use href="#win" transform="translate(202,106)"/><use href="#win" transform="translate(240,106)"/>
      <rect x="192" y="124" width="68" height="2.4" fill="#f5e6d8"/>
      <g stroke="#6e6159" stroke-width="0.8"><line x1="193" y1="116" x2="259" y2="116"/>
        <line x1="194" y1="116" x2="194" y2="124"/><line x1="200" y1="116" x2="200" y2="124"/><line x1="206" y1="116" x2="206" y2="124"/><line x1="212" y1="116" x2="212" y2="124"/><line x1="218" y1="116" x2="218" y2="124"/><line x1="224" y1="116" x2="224" y2="124"/><line x1="230" y1="116" x2="230" y2="124"/><line x1="236" y1="116" x2="236" y2="124"/><line x1="242" y1="116" x2="242" y2="124"/><line x1="248" y1="116" x2="248" y2="124"/><line x1="254" y1="116" x2="254" y2="124"/><line x1="259" y1="116" x2="259" y2="124"/></g>
      <path d="M216,174 L216,152 C216,140 238,140 238,152 L238,174 Z" fill="#9c7656"/>
      <path d="M216,152 C216,140 238,140 238,152" fill="none" stroke="#f8e4d6" stroke-width="2.4"/>
      <line x1="227" y1="146" x2="227" y2="174" stroke="#87664a" stroke-width="1"/>
      <rect x="196" y="150" width="12" height="14" fill="#c5d3d3"/><rect x="246" y="150" width="12" height="14" fill="#c5d3d3"/>

      <!-- 楼房 4、5（右） -->
      <rect x="264" y="34" width="82" height="140" fill="#f0dcb6"/>
      <rect x="262" y="29" width="86" height="5" fill="#cc7d5c"/><rect x="262" y="33" width="86" height="3.5" fill="#fbf0dc"/>
      <use href="#win" transform="translate(278,44)"/><use href="#win" transform="translate(316,44)"/>
      <use href="#win" transform="translate(278,76)"/><use href="#win" transform="translate(316,76)"/>
      <use href="#win" transform="translate(278,108)"/><use href="#win" transform="translate(316,108)"/>
      <use href="#balc" transform="translate(278,94)"/><use href="#balc" transform="translate(316,94)"/>
      <rect x="272" y="146" width="66" height="28" fill="#c9d6d4"/><rect x="272" y="146" width="66" height="28" fill="none" stroke="#8c9e93" stroke-width="1.6"/>
      <line x1="305" y1="146" x2="305" y2="174" stroke="#8c9e93" stroke-width="1.4"/>
      <rect x="346" y="50" width="56" height="124" fill="#e7c6a6"/>
