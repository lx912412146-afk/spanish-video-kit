      <path d="M-9,0 C-9,-6 -2,-8.5 4,-7.5 C7,-7 9,-4 8.5,-1 C8,2.6 4,4.2 -2,4.2 C-6,4.2 -9,3 -9,0 Z" fill="#aab3bc"/>
      <path d="M-6,-1.6 C-2,-6 4,-5.4 5.4,-1.4 C2,0.8 -3,0.8 -6,-1.6 Z" fill="#96a0aa"/>
      <path d="M-3,-2.4 L1,-3.4 M-2,-0.6 L2,-1.6" stroke="#7d8792" stroke-width="0.9"/>
      <ellipse cx="6" cy="-6" rx="3.4" ry="3.8" fill="#93b3ab"/>
      <circle cx="7.6" cy="-9.6" r="3.2" fill="#a5afb8"/>
      <circle cx="8.6" cy="-10.2" r="0.75" fill="#5a4a40"/>
      <path d="M10.6,-10 L13.4,-9.2 L10.6,-8.5 Z" fill="#d6a08a"/>
      <path d="M-1,4 L-1,7 M2.4,4 L2.4,7" stroke="#d58a7c" stroke-width="1.1" stroke-linecap="round"/>
    </g>
    <g id="canopy">
      <path d="M-44,14 C-54,8 -52,-8 -42,-12 C-46,-26 -32,-36 -20,-32 C-14,-44 4,-46 12,-38 C22,-44 38,-38 38,-26 C50,-22 52,-6 46,2 C54,10 48,24 36,24 C30,34 14,34 8,28 C0,36 -16,34 -20,26 C-32,32 -46,26 -44,14 Z" fill="#7ea66c"/>
      <path d="M-38,-6 C-40,-18 -28,-26 -18,-24 C-12,-34 4,-36 10,-28 C18,-32 30,-28 30,-18 C38,-14 38,-4 30,0 C22,6 6,2 0,6 C-8,10 -20,8 -26,4 C-34,4 -38,0 -38,-6 Z" fill="#91b77b"/>
      <path d="M-32,-12 C-32,-20 -22,-23 -17,-19 C-11,-26 -1,-26 1,-20 C-5,-14 -14,-12 -20,-12 C-24,-9 -32,-8 -32,-12 Z" fill="#a8c98f"/>
      <path d="M8,-30 C14,-37 27,-33 27,-24 C21,-21 13,-22 8,-30 Z" fill="#a8c98f"/>
      <path d="M14,-8 C20,-14 30,-12 32,-6 C26,-2 18,-2 14,-8 Z" fill="#9fc187"/>
      <path d="M-42,14 C-32,20 -20,15 -10,21 C0,26 12,19 22,21 C32,23 42,17 46,4 C51,13 45,24 36,24 C30,34 14,34 8,28 C0,36 -16,34 -20,26 C-32,32 -46,26 -42,14 Z" fill="#6b955c"/>
      <g fill="#b3d19a" opacity="0.8"><ellipse cx="-24" cy="-26" rx="3" ry="2"/><ellipse cx="-2" cy="-34" rx="3" ry="2"/><ellipse cx="26" cy="-34" rx="2.6" ry="1.8"/><ellipse cx="-38" cy="-8" rx="2.6" ry="1.8"/><ellipse cx="38" cy="-14" rx="2.6" ry="1.8"/></g>
      <g fill="#628b54" opacity="0.8"><ellipse cx="-30" cy="22" rx="3" ry="2"/><ellipse cx="0" cy="28" rx="3" ry="2"/><ellipse cx="28" cy="26" rx="3" ry="2"/><ellipse cx="42" cy="10" rx="2.6" ry="1.8"/></g>
