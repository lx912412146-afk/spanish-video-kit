      <ellipse cx="200" cy="213" rx="46" ry="3"/><ellipse cx="268" cy="241" rx="8" ry="2"/>
      <ellipse cx="129" cy="235" rx="12" ry="2"/><ellipse cx="192" cy="229" rx="12" ry="2"/><ellipse cx="220" cy="241" rx="12" ry="2"/><ellipse cx="300" cy="233" rx="12" ry="2"/>
    </g>
    <!-- 纸纹 -->
