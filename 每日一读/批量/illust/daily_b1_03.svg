<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 260" width="400" height="260">
  <!-- 原创插图：树荫下的人行道、老楼房、长椅、鸽子（水彩风格，纯 SVG 手绘） -->
  <defs>
    <filter id="wc" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="0.35"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="g"/>
      <feColorMatrix in="g" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.38  0 0 0 0 0.3  0 0 0 0.09 0"/>
    </filter>
    <filter id="edge" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="5"/></filter>
    <mask id="fade" maskUnits="userSpaceOnUse" x="0" y="0" width="400" height="260">
      <rect x="7" y="7" width="386" height="246" rx="4" fill="#fff" filter="url(#edge)"/>
    </mask>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d5e8ef"/><stop offset="0.5" stop-color="#eaf2ee"/><stop offset="1" stop-color="#f7f0e2"/>
    </linearGradient>
    <linearGradient id="walk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6dccb"/><stop offset="1" stop-color="#eee6d8"/>
    </linearGradient>
    <linearGradient id="trunk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a99a7e"/><stop offset="0.5" stop-color="#c9bc9f"/><stop offset="1" stop-color="#9d8f74"/>
    </linearGradient>
    <clipPath id="awnClip"><path d="M138,140 L184,140 L188,150 L134,150 Z"/></clipPath>
    <g id="win">
      <rect x="-6" y="0" width="5" height="18" fill="#97b0a2"/><rect x="13" y="0" width="5" height="18" fill="#97b0a2"/>
      <g stroke="#82998c" stroke-width="0.6"><line x1="-6" y1="4" x2="-1" y2="4"/><line x1="-6" y1="8" x2="-1" y2="8"/><line x1="-6" y1="12" x2="-1" y2="12"/><line x1="13" y1="4" x2="18" y2="4"/><line x1="13" y1="8" x2="18" y2="8"/><line x1="13" y1="12" x2="18" y2="12"/></g>
      <rect x="0" y="0" width="12" height="18" fill="#bfcfd1"/>
      <rect x="0" y="0" width="12" height="18" fill="none" stroke="#f8f0e3" stroke-width="1.4"/>
      <line x1="6" y1="0" x2="6" y2="18" stroke="#f8f0e3" stroke-width="1"/>
      <rect x="1.6" y="1.6" width="3" height="7" fill="#fff" opacity="0.45"/>
    </g>
    <g id="balc">
      <rect x="-8" y="0" width="28" height="2.4" fill="#efe4d2"/>
      <g stroke="#6e6159" stroke-width="0.8" fill="none"><line x1="-7" y1="-8" x2="19" y2="-8"/><line x1="-7" y1="-8" x2="-7" y2="0"/><line x1="-3" y1="-8" x2="-3" y2="0"/><line x1="1" y1="-8" x2="1" y2="0"/><line x1="5" y1="-8" x2="5" y2="0"/><line x1="9" y1="-8" x2="9" y2="0"/><line x1="13" y1="-8" x2="13" y2="0"/><line x1="17" y1="-8" x2="17" y2="0"/><line x1="19" y1="-8" x2="19" y2="0"/></g>
      <rect x="-5" y="-12" width="6" height="4" fill="#cf7c58"/><circle cx="-3.5" cy="-13.5" r="2.4" fill="#7fae67"/><circle cx="-1" cy="-14.5" r="1.8" fill="#e2574c"/><circle cx="-4" cy="-15.5" r="1.5" fill="#e86a5c"/>
      <rect x="11" y="-12" width="6" height="4" fill="#cf7c58"/><circle cx="14" cy="-13.5" r="2.4" fill="#7fae67"/><circle cx="12.5" cy="-15" r="1.8" fill="#e2574c"/><circle cx="16" cy="-15" r="1.6" fill="#e86a5c"/>
    </g>
