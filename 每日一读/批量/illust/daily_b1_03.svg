        <line x1="40" y1="175" x2="38" y2="190"/><line x1="120" y1="175" x2="118" y2="190"/><line x1="200" y1="175" x2="198" y2="190"/><line x1="280" y1="175" x2="278" y2="190"/><line x1="360" y1="175" x2="358" y2="190"/>
        <line x1="80" y1="190" x2="77" y2="211"/><line x1="160" y1="190" x2="157" y2="211"/><line x1="240" y1="190" x2="237" y2="211"/><line x1="320" y1="190" x2="317" y2="211"/>
        <line x1="36" y1="211" x2="32" y2="230"/><line x1="118" y1="211" x2="114" y2="230"/><line x1="198" y1="211" x2="194" y2="230"/><line x1="278" y1="211" x2="274" y2="230"/><line x1="358" y1="211" x2="354" y2="230"/>
      </g>
      <rect x="0" y="242" width="400" height="7" fill="#ddd3c3"/><rect x="0" y="242" width="400" height="2" fill="#f2ebdf"/>
      <rect x="0" y="249" width="400" height="11" fill="#cfc9c0"/>

      <!-- 树影与阳光 -->
