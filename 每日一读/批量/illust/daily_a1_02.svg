        <path d="M323.5,106 L353.75,106 L353.75,111 A15.125,7 0 0 1 323.5,111 Z" fill="#d97059"/>
        <path d="M353.75,106 L384,106 L384,111 A15.125,7 0 0 1 353.75,111 Z" fill="#f3e6d3"/>
        <path d="M158,82 L368,82" stroke="#c96a55" stroke-width="2"/>
