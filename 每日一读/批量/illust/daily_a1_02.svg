    <g id="t"><circle r="5.2" fill="url(#tom)"/><path d="M-2.6,-4.4 L0,-3.1 L2.6,-4.4 L1.2,-2.7 L3.3,-1.9 L0,-2.2 L-3.3,-1.9 L-1.2,-2.7 Z" fill="#5f9a4c"/><ellipse cx="-1.8" cy="-1.2" rx="1.3" ry="0.8" fill="#fff" opacity="0.55"/></g>
    <g id="a"><path d="M0,-3.4 C2.6,-5.8 6,-4.4 6,-0.4 C6,3.6 3,6 0,5.2 C-3,6 -6,3.6 -6,-0.4 C-6,-4.4 -2.6,-5.8 0,-3.4 Z" fill="url(#app)"/><path d="M0,-3.4 L0.9,-6.6" stroke="#8a6a4a" stroke-width="0.9"/><ellipse cx="-2.4" cy="-1" rx="1.4" ry="1" fill="#fff" opacity="0.45"/></g>
    <g id="ga"><path d="M0,-3.4 C2.6,-5.8 6,-4.4 6,-0.4 C6,3.6 3,6 0,5.2 C-3,6 -6,3.6 -6,-0.4 C-6,-4.4 -2.6,-5.8 0,-3.4 Z" fill="url(#gap)"/><path d="M0,-3.4 L0.9,-6.6" stroke="#8a6a4a" stroke-width="0.9"/><ellipse cx="-2.4" cy="-1" rx="1.4" ry="1" fill="#fff" opacity="0.45"/></g>
    <g id="l"><circle r="10" fill="url(#let)"/><circle cx="-5.5" cy="-3" r="5.8" fill="#c9e39b"/><circle cx="5.5" cy="-3.5" r="5.8" fill="#bfdc8f"/><circle cx="0" cy="-6" r="4.6" fill="#e1f0bd"/><path d="M0,-2 L0,7 M-4,1 L0,5 M4,1 L0,5" stroke="#a6cc80" stroke-width="0.8" fill="none"/></g>
    <g id="lm"><ellipse rx="3.8" ry="3" fill="url(#lem)"/><ellipse cx="-1.2" cy="-1" rx="1" ry="0.6" fill="#fff" opacity="0.5"/></g>
    <g id="sm"><circle r="3.6" fill="url(#tom)"/><path d="M-1.5,-3 L0,-2.2 L1.5,-3 L0,-3.8 Z" fill="#5f9a4c"/></g>
    <g id="sg"><circle r="3.6" fill="url(#gap)"/></g>
    <g id="crate">
      <rect x="0" y="0" width="52" height="24" rx="1" fill="url(#wood)"/>
      <rect x="-1" y="-1.5" width="54" height="3.5" rx="1" fill="#dcb68c"/>
      <g stroke="#a67b55" stroke-width="0.9" opacity="0.85"><line x1="2" y1="8.5" x2="50" y2="8.5"/><line x1="2" y1="16" x2="50" y2="16"/></g>
      <rect x="0" y="0" width="3.5" height="24" fill="#b28660"/><rect x="48.5" y="0" width="3.5" height="24" fill="#b28660"/>
    </g>
