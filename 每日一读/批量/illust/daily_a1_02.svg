        <use href="#l" transform="translate(346,140) scale(1.05)"/><use href="#l" transform="translate(328,145) scale(0.9)"/><use href="#l" transform="translate(364,145) scale(0.9)"/>
      </g>
      <use href="#crate" transform="translate(158,146)"/><use href="#crate" transform="translate(212,146)"/>
      <use href="#crate" transform="translate(266,146)"/><use href="#crate" transform="translate(320,146)"/>
