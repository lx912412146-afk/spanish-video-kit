<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 260" width="400" height="260">
  <!-- 原创插图：周六的露天集市（水彩风格，纯 SVG 手绘，无外部素材） -->
  <defs>
    <filter id="wc" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="0.35"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="g"/>
      <feColorMatrix in="g" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.38  0 0 0 0 0.3  0 0 0 0.09 0"/>
    </filter>
    <filter id="edge" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="5"/></filter>
    <mask id="fade" maskUnits="userSpaceOnUse" x="0" y="0" width="400" height="260">
      <rect x="7" y="7" width="386" height="246" rx="4" fill="#fff" filter="url(#edge)"/>
    </mask>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d7e9ef"/><stop offset="0.6" stop-color="#eaf1ec"/><stop offset="1" stop-color="#f6f0e2"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe3cf"/><stop offset="1" stop-color="#e4d0b4"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d2a77c"/><stop offset="1" stop-color="#b98c63"/>
    </linearGradient>
    <linearGradient id="under" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9c1a6"/><stop offset="1" stop-color="#ead9c4"/>
    </linearGradient>
    <linearGradient id="cloth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3ecd5"/><stop offset="1" stop-color="#d3e1c0"/>
    </linearGradient>
    <linearGradient id="bask" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ddb582"/><stop offset="1" stop-color="#c49464"/>
    </linearGradient>
    <radialGradient id="or" cx="0.38" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#fbc37e"/><stop offset="0.6" stop-color="#f29a48"/><stop offset="1" stop-color="#e07f33"/>
    </radialGradient>
    <radialGradient id="tom" cx="0.38" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#f69a86"/><stop offset="0.55" stop-color="#e9604f"/><stop offset="1" stop-color="#cf4338"/>
    </radialGradient>
    <radialGradient id="app" cx="0.38" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#f5a68e"/><stop offset="0.55" stop-color="#d9584a"/><stop offset="1" stop-color="#bd463b"/>
    </radialGradient>
    <radialGradient id="gap" cx="0.38" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#e6f2b8"/><stop offset="0.6" stop-color="#b5d47a"/><stop offset="1" stop-color="#93ba5c"/>
    </radialGradient>
    <radialGradient id="lem" cx="0.38" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#fbeaa2"/><stop offset="1" stop-color="#ecc75a"/>
    </radialGradient>
