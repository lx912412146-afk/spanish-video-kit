<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 260" width="400" height="260">
  <!-- 原创插图：街角面包店的柜台（水彩风格，纯 SVG 手绘，无外部素材） -->
  <defs>
    <filter id="wc" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="0.35"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="g"/>
      <feColorMatrix in="g" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.38  0 0 0 0 0.3  0 0 0 0.09 0"/>
    </filter>
    <filter id="edge" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="5"/></filter>
    <mask id="fade" maskUnits="userSpaceOnUse" x="0" y="0" width="400" height="260">
      <rect x="7" y="7" width="386" height="246" rx="4" fill="#fff" filter="url(#edge)"/>
    </mask>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf3e6"/><stop offset="0.6" stop-color="#f8e9d6"/><stop offset="1" stop-color="#f4dfc8"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d0a77d"/><stop offset="1" stop-color="#b98c63"/>
    </linearGradient>
    <linearGradient id="woodL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e1bf95"/><stop offset="1" stop-color="#d4ae84"/>
    </linearGradient>
    <linearGradient id="bask" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ddb582"/><stop offset="1" stop-color="#c49464"/>
    </linearGradient>
    <linearGradient id="caseIn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7efe3"/><stop offset="1" stop-color="#efe2cf"/>
    </linearGradient>
    <radialGradient id="crust" cx="0.4" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#f2cf94"/><stop offset="0.55" stop-color="#dfa665"/><stop offset="1" stop-color="#c68646"/>
    </radialGradient>
    <radialGradient id="crustD" cx="0.4" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#eebd80"/><stop offset="0.6" stop-color="#d4924f"/><stop offset="1" stop-color="#b9763b"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3d2" stop-opacity="0.95"/><stop offset="1" stop-color="#fff3d2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9fbfb6"/><stop offset="0.45" stop-color="#bcd6cf"/><stop offset="1" stop-color="#93b5ab"/>
    </linearGradient>
    <g id="boule"><ellipse rx="15" ry="9.5" fill="url(#crust)"/><g stroke="#f5dcae" stroke-width="1.4" fill="none" stroke-linecap="round"><path d="M-8,-3.5 C-3,-6.5 3,-6.5 8,-3.5"/><path d="M-6,0.5 C-2,-1.5 2,-1.5 6,0.5"/></g><g fill="#fbf2e2" opacity="0.7"><circle cx="-9" cy="-1" r="0.6"/><circle cx="4" cy="-6" r="0.6"/><circle cx="9" cy="1" r="0.6"/></g></g>
    <g id="batard"><ellipse rx="22" ry="7" fill="url(#crust)"/><g stroke="#f5dcae" stroke-width="1.4" fill="none" stroke-linecap="round"><path d="M-14,1 L-8,-3"/><path d="M-5,1.5 L1,-2.5"/><path d="M4,1.5 L10,-2.5"/><path d="M13,1 L17,-2"/></g></g>
    <g id="bun"><circle r="7" fill="url(#crustD)"/><ellipse cx="-2.4" cy="-2.8" rx="2.6" ry="1.5" fill="#fff" opacity="0.4"/></g>
    <g id="baguette"><rect x="-32" y="-4" width="64" height="8" rx="4" fill="url(#crust)"/><g stroke="#f5dcae" stroke-width="1.3" fill="none" stroke-linecap="round"><path d="M-22,2 L-16,-2"/><path d="M-10,2 L-4,-2"/><path d="M2,2 L8,-2"/><path d="M14,2 L20,-2"/></g></g>
    <g id="cro" stroke="#c4834a" stroke-width="0.6">
      <ellipse cx="-11" cy="2" rx="4.2" ry="3" transform="rotate(-35 -11 2)" fill="url(#crustD)"/><ellipse cx="11" cy="2" rx="4.2" ry="3" transform="rotate(35 11 2)" fill="url(#crustD)"/>
      <ellipse cx="-6.5" cy="-1.5" rx="5" ry="5" fill="url(#crust)"/><ellipse cx="6.5" cy="-1.5" rx="5" ry="5" fill="url(#crust)"/>
      <ellipse cx="0" cy="-3" rx="5.5" ry="6.5" fill="url(#crust)"/>
    </g>
    <g id="roll"><circle r="8" fill="#e3b072"/><path d="M0,0 C2,-1 2,-3 0,-3.5 C-3,-4 -5,-1 -4.5,1.5 C-4,5 1,6.5 4,4.5 C7,2.5 7.5,-2 5.5,-5" stroke="#b97a45" stroke-width="1.1" fill="none"/><path d="M-6,-3 C-3,-1 0,-6 3,-4 C5,-3 6,0 7,-1" stroke="#fbf5ea" stroke-width="1.3" fill="none" stroke-linecap="round"/></g>
    <g id="tart"><path d="M-12,0 L12,0 L10,6 L-10,6 Z" fill="url(#crust)"/><g stroke="#c68646" stroke-width="0.7"><line x1="-7" y1="0.5" x2="-6.5" y2="5.5"/><line x1="-2.5" y1="0.5" x2="-2.3" y2="5.5"/><line x1="2.5" y1="0.5" x2="2.3" y2="5.5"/><line x1="7" y1="0.5" x2="6.5" y2="5.5"/></g><ellipse cx="0" cy="0" rx="12" ry="3" fill="#f3d9a6"/></g>
    <g id="puff"><path d="M-9,0 C-10,-12 10,-12 9,0 Z" fill="url(#crust)"/><path d="M-9,-4 C-4,-2 4,-2 9,-4" stroke="#fbf3e6" stroke-width="2.2" fill="none"/><ellipse cx="0" cy="-8" rx="5" ry="1.6" fill="#fffaf2" opacity="0.9"/></g>
    <g id="mag"><path d="M-8,0 L-10,-11 L10,-11 L8,0 Z" fill="#eaa48c"/><g stroke="#d98b72" stroke-width="0.7"><line x1="-5" y1="-10.5" x2="-4.2" y2="-0.5"/><line x1="0" y1="-10.5" x2="0" y2="-0.5"/><line x1="5" y1="-10.5" x2="4.2" y2="-0.5"/></g><path d="M-11.5,-10 C-12,-21 12,-21 11.5,-10 C6,-8 -6,-8 -11.5,-10 Z" fill="url(#crust)"/><ellipse cx="-3.5" cy="-15.5" rx="3.6" ry="1.8" fill="#fff" opacity="0.35"/><g fill="#fbf3e6"><circle cx="2" cy="-17" r="0.7"/><circle cx="5" cy="-14" r="0.7"/><circle cx="-1" cy="-13" r="0.7"/></g></g>
    <g id="ck"><path d="M-9,0 L-9,-3 C-9,-5 9,-5 9,-3 L9,0 C9,2 -9,2 -9,0 Z" fill="#d9a466"/><ellipse cx="0" cy="-3" rx="9" ry="2.4" fill="#e9bf82"/></g>
  </defs>

  <g mask="url(#fade)">
    <!-- 墙面和地板 -->
    <rect width="400" height="260" fill="url(#wall)"/>
    <rect x="0" y="240" width="400" height="20" fill="#e2c7a6"/>
    <!-- 吊灯的暖光 -->
    <ellipse cx="262" cy="52" rx="40" ry="26" fill="url(#glow)"/>
    <ellipse cx="346" cy="52" rx="40" ry="26" fill="url(#glow)"/>

    <g filter="url(#wc)">
      <!-- 吊灯 -->
      <line x1="262" y1="0" x2="262" y2="24" stroke="#9a8572" stroke-width="1"/><line x1="346" y1="0" x2="346" y2="24" stroke="#9a8572" stroke-width="1"/>
      <path d="M250,36 C250,28 255,23 262,23 C269,23 274,28 274,36 Z" fill="url(#shade)"/><ellipse cx="262" cy="37.5" rx="4" ry="2.2" fill="#fff6dc"/>
      <path d="M334,36 C334,28 339,23 346,23 C353,23 358,28 358,36 Z" fill="url(#shade)"/><ellipse cx="346" cy="37.5" rx="4" ry="2.2" fill="#fff6dc"/>

      <!-- 左墙的窗户：街对面 -->
      <rect x="104" y="56" width="80" height="58" fill="#d9eaf0"/>
      <g fill="#ece0d0"><rect x="104" y="76" width="34" height="38"/><rect x="150" y="70" width="34" height="44"/></g>
      <path d="M100,78 L121,66 L142,78 Z" fill="#e6b49a"/>
      <g fill="#cfdade"><rect x="112" y="86" width="6" height="8"/><rect x="124" y="86" width="6" height="8"/><rect x="158" y="80" width="6" height="8"/><rect x="170" y="80" width="6" height="8"/><rect x="158" y="96" width="6" height="8"/><rect x="170" y="96" width="6" height="8"/></g>
      <g fill="none" stroke="#f4e8d6" stroke-linejoin="round"><rect x="104" y="56" width="80" height="58" stroke-width="5"/><line x1="144" y1="56" x2="144" y2="114" stroke-width="3.5"/></g>
      <rect x="98" y="112" width="92" height="5" rx="1.5" fill="#efdcc2"/>
      <!-- 后墙的木架和面包 -->
      <rect x="208" y="52" width="176" height="82" fill="#f1dfc6"/>
      <rect x="202" y="47" width="188" height="6" rx="1.5" fill="#c99d74"/>
      <rect x="204" y="52" width="6" height="84" fill="url(#wood)"/><rect x="382" y="52" width="6" height="84" fill="url(#wood)"/>
      <use href="#boule" transform="translate(230,77)"/>
      <use href="#boule" transform="translate(264,77)"/>
      <use href="#baguette" transform="translate(314,82)"/>
      <use href="#bun" transform="translate(358,80)"/><use href="#bun" transform="translate(372,80)"/><use href="#bun" transform="translate(365,72)"/>
      <rect x="208" y="86" width="176" height="5" fill="#c99d74"/>
      <use href="#baguette" transform="translate(248,117)"/>
      <use href="#baguette" transform="translate(306,117)"/>
      <use href="#baguette" transform="translate(277,109)"/>
      <use href="#boule" transform="translate(360,112) scale(0.95)"/>
      <rect x="208" y="121" width="176" height="5" fill="#c99d74"/>

      <!-- 左边柜台：篮子里的长棍面包和圆面包 -->
      <polygon points="6,146 196,146 198,156 2,156" fill="url(#woodL)"/>
      <rect x="2" y="155" width="196" height="86" fill="url(#wood)"/>
      <g fill="#f1e3cd"><rect x="12" y="166" width="54" height="64" rx="2"/><rect x="73" y="166" width="54" height="64" rx="2"/><rect x="134" y="166" width="54" height="64" rx="2"/></g>
      <g fill="none" stroke="#e2cdb0" stroke-width="1.2"><rect x="17" y="171" width="44" height="54" rx="1.5"/><rect x="78" y="171" width="44" height="54" rx="1.5"/><rect x="139" y="171" width="44" height="54" rx="1.5"/></g>
      <rect x="2" y="155" width="196" height="4" fill="#c49a70"/>
      <use href="#baguette" transform="translate(44,112) rotate(-72)"/>
      <use href="#baguette" transform="translate(58,108) rotate(-84)"/>
      <use href="#baguette" transform="translate(72,112) rotate(-98)"/>
      <use href="#baguette" transform="translate(52,118) rotate(-62)"/>
      <use href="#baguette" transform="translate(66,118) rotate(-110)"/>
      <path d="M34,124 L84,124 L80,152 L38,152 Z" fill="url(#bask)"/>
      <g stroke="#b48556" stroke-width="0.9" opacity="0.85">
        <line x1="35" y1="132" x2="83" y2="132"/><line x1="36" y1="140" x2="82" y2="140"/><line x1="37" y1="147" x2="81" y2="147"/>
        <line x1="46" y1="124" x2="48" y2="152"/><line x1="59" y1="124" x2="59" y2="152"/><line x1="72" y1="124" x2="70" y2="152"/>
      </g>
      <rect x="31" y="121" width="56" height="5" rx="2.5" fill="#e2be8e"/>
      <path d="M38,124 C44,128 52,128 58,124 C64,128 74,128 80,124" stroke="#f3ead8" stroke-width="2.4" fill="none"/>
      <use href="#bun" transform="translate(116,134)"/><use href="#bun" transform="translate(131,132)"/><use href="#bun" transform="translate(146,132)"/><use href="#bun" transform="translate(161,134)"/>
      <use href="#bun" transform="translate(124,126)"/><use href="#bun" transform="translate(139,124)"/><use href="#bun" transform="translate(154,126)"/>
      <path d="M102,136 L178,136 L172,152 L108,152 Z" fill="url(#bask)"/>
      <g stroke="#b48556" stroke-width="0.9" opacity="0.8"><line x1="104" y1="142" x2="176" y2="142"/><line x1="106" y1="147" x2="174" y2="147"/>
        <line x1="118" y1="136" x2="120" y2="152"/><line x1="132" y1="136" x2="133" y2="152"/><line x1="148" y1="136" x2="147" y2="152"/><line x1="162" y1="136" x2="160" y2="152"/></g>
      <rect x="99" y="133" width="82" height="5" rx="2.5" fill="#e2be8e"/>
      <!-- 玻璃点心柜 -->
      <rect x="198" y="138" width="196" height="76" fill="url(#caseIn)"/>
      <rect x="198" y="176" width="196" height="3" fill="#e8d8c2"/>
      <use href="#mag" transform="translate(220,177) scale(1.05)"/>
      <use href="#mag" transform="translate(246,177) scale(1.05)"/>
      <use href="#mag" transform="translate(272,177) scale(1.05)"/>
      <use href="#mag" transform="translate(298,177) scale(1.05)"/>
      <ellipse cx="350" cy="176" rx="22" ry="3" fill="#fbf7ef"/>
      <use href="#ck" transform="translate(340,175)"/><use href="#ck" transform="translate(340,171)"/><use href="#ck" transform="translate(340,167)"/>
      <use href="#ck" transform="translate(361,175)"/><use href="#ck" transform="translate(361,171)"/>
      <g fill="#8f6446"><circle cx="337" cy="164" r="0.9"/><circle cx="342" cy="163.4" r="0.9"/><circle cx="345" cy="164.6" r="0.8"/><circle cx="358" cy="168" r="0.9"/><circle cx="363" cy="167.4" r="0.9"/><circle cx="366" cy="168.6" r="0.8"/></g>
      <rect x="198" y="208" width="196" height="3" fill="#e8d8c2"/>
      <g transform="translate(222,204) scale(1.3) translate(-222,-202)"><use href="#tart" transform="translate(222,202)"/><g fill="#e2564d"><circle cx="216" cy="201" r="2.2"/><circle cx="221" cy="200" r="2.2"/><circle cx="226" cy="201" r="2.2"/><circle cx="229" cy="202" r="1.8"/><circle cx="214" cy="202.5" r="1.6"/></g></g>
      <g transform="translate(254,204) scale(1.3) translate(-254,-202)"><use href="#tart" transform="translate(254,202)"/><g fill="#f0a24f"><ellipse cx="249" cy="201" rx="3" ry="1.6"/><ellipse cx="255" cy="200.4" rx="3" ry="1.6"/><ellipse cx="260" cy="201.4" rx="3" ry="1.6"/></g></g>
      <g transform="translate(286,204) scale(1.3) translate(-286,-202)"><use href="#tart" transform="translate(286,202)"/><g fill="#8fa9c9"><circle cx="280" cy="201" r="1.7"/><circle cx="284" cy="200" r="1.7"/><circle cx="288" cy="201" r="1.7"/><circle cx="292" cy="202" r="1.6"/><circle cx="286" cy="202.4" r="1.6"/></g></g>
      <use href="#puff" transform="translate(320,208) scale(1.25)"/>
      <use href="#puff" transform="translate(344,208) scale(1.25)"/>
      <use href="#puff" transform="translate(368,208) scale(1.25)"/>
      <!-- 玻璃和柜框 -->
      <rect x="198" y="138" width="196" height="76" fill="#e8f2f3" opacity="0.2"/>
      <g fill="#ffffff" opacity="0.4">
        <polygon points="232,140 246,140 220,212 206,212"/><polygon points="252,140 257,140 231,212 226,212"/>
        <polygon points="330,140 342,140 318,212 306,212"/>
      </g>
      <polygon points="200,130 392,130 396,138 196,138" fill="#eef5f4" opacity="0.85"/>
      <path d="M196,138 L396,138" stroke="#cdb894" stroke-width="2"/>
      <path d="M200,130 L392,130" stroke="#d8c6a6" stroke-width="1.4"/>
      <g stroke="#cdb894" stroke-width="2.2"><line x1="198" y1="130" x2="198" y2="214"/><line x1="394" y1="130" x2="394" y2="214"/></g>
      <rect x="194" y="213" width="204" height="28" fill="url(#wood)"/>
      <rect x="194" y="213" width="204" height="4" fill="#dcb68c"/>
      <g fill="#f1e3cd"><rect x="202" y="220" width="58" height="16" rx="1.5"/><rect x="267" y="220" width="58" height="16" rx="1.5"/><rect x="332" y="220" width="58" height="16" rx="1.5"/></g>
    </g>

    <!-- 地面阴影 -->
    <g filter="url(#soft2)" opacity="0.2" fill="#8a6a4a">
      <ellipse cx="200" cy="242" rx="196" ry="3"/>
    </g>
    <!-- 纸纹 -->
    <rect width="400" height="260" filter="url(#grain)"/>
  </g>
</svg>
