<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 260" width="400" height="260">
  <!-- 原创插图：湖上一条多人划的长船、几支桨、平静的水面和远处的树（水彩风格，纯 SVG 手绘） -->
  <defs>
    <filter id="wc" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="0.35"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="g"/>
      <feColorMatrix in="g" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.38  0 0 0 0 0.3  0 0 0 0.09 0"/>
    </filter>
    <filter id="edge" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="5"/></filter>
    <mask id="fade" maskUnits="userSpaceOnUse" x="0" y="0" width="400" height="260">
      <rect x="7" y="7" width="386" height="246" rx="4" fill="#fff" filter="url(#edge)"/>
    </mask>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2eef0"/><stop offset="0.6" stop-color="#eef2ea"/><stop offset="1" stop-color="#f6efdf"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3ece6"/><stop offset="0.35" stop-color="#cfe1df"/><stop offset="1" stop-color="#afcdcd"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c98f62"/><stop offset="1" stop-color="#a86d48"/>
    </linearGradient>
    <linearGradient id="inside" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9b48a"/><stop offset="1" stop-color="#ecd2ac"/>
    </linearGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfd2c2"/><stop offset="1" stop-color="#a9c3b1"/>
    </linearGradient>
    <g id="oarN"><line x1="0" y1="0" x2="-30" y2="36" stroke="#c9a57c" stroke-width="2"/><path d="M-27,32 C-30,34 -38,44 -40,48 C-38,50 -34,48 -32,46 C-30,42 -28,38 -26,34 Z" fill="#e8d3b0"/></g>
    <g id="oarF"><line x1="0" y1="0" x2="-22" y2="-24" stroke="#c9a57c" stroke-width="1.6"/><path d="M-20,-22 C-23,-24 -29,-30 -31,-33 C-29,-34 -27,-33 -25,-31 C-23,-28 -21,-26 -19,-23 Z" fill="#e3ccA8"/></g>
  </defs>

  <g mask="url(#fade)">
    <!-- 天空 -->
    <rect width="400" height="260" fill="url(#sky)"/>
    <g filter="url(#soft2)" fill="#ffffff" opacity="0.8">
      <ellipse cx="300" cy="44" rx="30" ry="6"/><ellipse cx="318" cy="40" rx="16" ry="6"/><ellipse cx="250" cy="70" rx="18" ry="4"/>
    </g>
    <!-- 远山 -->
    <path d="M0,104 C40,98 80,96 120,100 C170,90 210,76 250,70 C290,66 330,80 400,86 L400,120 L0,120 Z" fill="#d6e1e0"/>
    <path d="M150,104 C200,92 240,84 280,86 C320,88 360,94 400,96 L400,120 L150,120 Z" fill="#c9d8d6"/>
    <!-- 湖面 -->
    <rect x="0" y="118" width="400" height="142" fill="url(#lake)"/>

    <g filter="url(#wc)">
      <!-- 对岸的树林 -->
      <path d="M0,122 L0,108 C6,102 14,102 18,106 C22,98 32,96 38,102 C44,96 54,96 58,104 C66,98 76,100 80,106 C86,100 96,100 100,106 C108,98 120,98 124,104 C130,96 142,94 148,102 C154,96 164,96 168,102 C176,94 188,92 194,100 C200,92 214,90 220,98 C228,90 242,90 248,98 C256,92 266,92 272,98 C280,90 294,90 300,98 C308,92 318,92 324,98 C332,90 346,90 352,98 C360,92 372,92 376,98 C384,94 394,94 400,98 L400,122 Z" fill="url(#far)"/>
      <path d="M0,122 L0,114 C10,110 20,110 30,113 C46,108 62,108 78,112 C96,106 114,106 130,111 C150,105 170,105 190,110 C210,104 232,104 252,109 C272,104 292,104 312,109 C332,104 352,104 372,108 C384,106 394,106 400,107 L400,122 Z" fill="#9dbaa4"/>
      <g fill="#93b39b">
        <path d="M84,112 L90,88 L96,112 Z"/><path d="M228,108 L234,82 L240,108 Z"/><path d="M238,110 L243,90 L248,110 Z"/><path d="M330,108 L336,84 L342,108 Z"/>
      </g>
      <path d="M0,121 C100,119 200,122 300,120 C340,119 370,120 400,120 L400,124 L0,124 Z" fill="#e6efe9"/>
    </g>

    <!-- 树林的倒影 -->
    <g filter="url(#soft2)" opacity="0.35">
      <path d="M0,124 L0,134 C20,138 40,136 60,134 C90,138 120,138 150,134 C180,140 220,140 250,136 C280,140 320,140 350,136 C370,138 390,138 400,136 L400,124 Z" fill="#9dbaa4"/>
      <path d="M84,124 L90,146 L96,124 Z M228,124 L234,150 L240,124 Z M330,124 L336,148 L342,124 Z" fill="#93b39b"/>
    </g>
    <!-- 水面的光 -->
    <g stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.7">
      <path d="M40,142 C52,141 70,143 86,142"/><path d="M130,148 C140,147 150,149 160,148"/><path d="M268,144 C284,143 300,145 320,144"/>
      <path d="M70,238 C84,237 96,239 108,238"/><path d="M230,240 C250,239 270,241 290,240"/><path d="M330,226 C344,225 356,227 370,226"/>
      <path d="M150,248 C162,247 176,249 190,248"/>
    </g>
    <g stroke="#9cbfc0" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.6">
      <path d="M60,156 C72,155 84,157 96,156"/><path d="M300,160 C316,159 334,161 350,160"/><path d="M110,246 C120,245 130,247 140,246"/><path d="M290,252 C304,251 318,253 330,252"/>
    </g>

    <!-- 船和桨的倒影 -->
    <g filter="url(#soft2)" opacity="0.3" fill="#7d6450">
      <path d="M78,184 C120,200 280,200 326,182 C280,214 120,214 78,184 Z"/>
    </g>
    <g filter="url(#soft2)" opacity="0.18" stroke="#8a6a4a" stroke-width="2">
      <line x1="108" y1="210" x2="82" y2="232"/><line x1="164" y1="215" x2="138" y2="237"/><line x1="220" y1="215" x2="194" y2="237"/><line x1="276" y1="210" x2="250" y2="232"/>
    </g>

    <g filter="url(#wc)">
      <!-- 远侧的 4 支桨（8 人船，桨左右交替） -->
      <use href="#oarF" transform="translate(138,164)"/><use href="#oarF" transform="translate(194,164)"/><use href="#oarF" transform="translate(250,164)"/><use href="#oarF" transform="translate(306,164)"/>
      <g fill="none" stroke="#ffffff" stroke-width="1" opacity="0.75">
        <ellipse cx="112" cy="133" rx="10" ry="2.2"/><ellipse cx="168" cy="133" rx="10" ry="2.2"/><ellipse cx="224" cy="133" rx="10" ry="2.2"/><ellipse cx="280" cy="133" rx="10" ry="2.2"/>
      </g>

      <!-- 船：内侧、8 个座位、船身 -->
      <path d="M66,162 C110,156 290,154 336,160 C300,176 110,178 66,162 Z" fill="url(#inside)"/>
      <path d="M70,163 C120,168 290,166 332,161 C300,172 110,174 70,163 Z" fill="#c99f76" opacity="0.5"/>
      <g fill="#f0dcbb">
        <path d="M103,158.5 L113,158.5 L115,170.4 L105,170.4 Z"/><path d="M131,158.5 L141,158.5 L143,173.4 L133,173.4 Z"/><path d="M159,158.5 L169,158.5 L171,175.3 L161,175.3 Z"/><path d="M187,158.5 L197,158.5 L199,176.0 L189,176.0 Z"/>
        <path d="M215,158.5 L225,158.5 L227,175.6 L217,175.6 Z"/><path d="M243,158.5 L253,158.5 L255,173.9 L245,173.9 Z"/><path d="M271,158.5 L281,158.5 L283,171.0 L273,171.0 Z"/><path d="M299,158.5 L309,158.5 L311,166.9 L301,166.9 Z"/>
      </g>
      <g fill="#b98c63">
        <path d="M105,167.9 L115,167.9 L115,170.4 L105,170.4 Z"/><path d="M133,170.9 L143,170.9 L143,173.4 L133,173.4 Z"/><path d="M161,172.8 L171,172.8 L171,175.3 L161,175.3 Z"/><path d="M189,173.5 L199,173.5 L199,176.0 L189,176.0 Z"/>
        <path d="M217,173.1 L227,173.1 L227,175.6 L217,175.6 Z"/><path d="M245,171.4 L255,171.4 L255,173.9 L245,173.9 Z"/><path d="M273,168.5 L283,168.5 L283,171.0 L273,171.0 Z"/><path d="M301,164.4 L311,164.4 L311,166.9 L301,166.9 Z"/>
      </g>
      <path d="M66,162 C110,156 290,154 336,160" stroke="#b47a52" stroke-width="2.4" fill="none"/>
      <path d="M62,158 C66,160 70,164 76,168 C120,186 286,186 332,166 C336,164 338,160 342,154 C338,164 330,176 318,184 C270,196 130,196 86,184 C74,176 66,166 62,158 Z" fill="url(#hull)"/>
      <path d="M70,166 C110,182 290,182 336,162" stroke="#f1e2c8" stroke-width="3" fill="none"/>
      <path d="M78,176 C120,190 286,190 326,174" stroke="#d98a63" stroke-width="1.6" fill="none" opacity="0.8"/>
      <path d="M86,184 C130,196 270,196 318,184 C300,190 260,195 200,195 C140,195 100,190 86,184 Z" fill="#8f5a3c" opacity="0.45"/>
      <path d="M100,180 C140,188 240,188 300,180" stroke="#e2b48a" stroke-width="1.2" fill="none" opacity="0.6"/>
      <!-- 桨架 -->
      <g fill="#8f6446">
        <rect x="108" y="167.9" width="4" height="4" rx="1"/><rect x="164" y="172.8" width="4" height="4" rx="1"/><rect x="220" y="173.1" width="4" height="4" rx="1"/><rect x="276" y="168.5" width="4" height="4" rx="1"/>
      </g>
      <!-- 近侧的 4 支桨 -->
      <use href="#oarN" transform="translate(110,170.9)"/><use href="#oarN" transform="translate(166,175.8)"/><use href="#oarN" transform="translate(222,176.1)"/><use href="#oarN" transform="translate(278,171.5)"/>
      <g fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.8">
        <ellipse cx="75" cy="217.9" rx="13" ry="3"/><ellipse cx="131" cy="222.8" rx="13" ry="3"/><ellipse cx="187" cy="223.1" rx="13" ry="3"/><ellipse cx="243" cy="218.5" rx="13" ry="3"/>
        <ellipse cx="131" cy="222.8" rx="20" ry="4.6" opacity="0.5"/><ellipse cx="243" cy="218.5" rx="20" ry="4.6" opacity="0.5"/>
      </g>
      <!-- 船头的小绳圈 -->
      <path d="M338,158 C346,160 350,168 346,174" stroke="#c9b08a" stroke-width="1.2" fill="none"/>

      <!-- 前景：左下的芦苇 -->
      <g stroke="#8fae6e" stroke-width="2" stroke-linecap="round" fill="none">
        <path d="M18,262 C20,232 22,214 20,192"/><path d="M28,262 C30,238 34,220 38,204"/><path d="M38,262 C38,240 42,226 48,214"/><path d="M10,262 C10,240 8,226 4,212"/>
      </g>
      <g fill="#a6c487">
        <path d="M20,192 C14,206 14,224 18,240 C20,226 22,210 20,192 Z"/><path d="M38,204 C46,216 46,232 40,246 C38,232 36,218 38,204 Z"/>
        <path d="M48,214 C56,224 58,238 52,252 C50,240 48,226 48,214 Z"/><path d="M4,212 C0,222 0,236 4,248 C6,236 6,224 4,212 Z"/>
      </g>
      <g fill="#b98a5e">
        <rect x="18" y="182" width="4" height="14" rx="2"/><rect x="36" y="196" width="4" height="12" rx="2"/>
      </g>
      <!-- 前景：右下的睡莲叶 -->
      <g fill="#9cc18a">
        <path d="M352,240 C352,232 370,230 380,234 C390,238 388,246 376,248 C364,250 352,248 352,240 Z M366,240 L380,234 L376,242 Z"/>
        <path d="M318,250 C318,245 330,243 336,246 C342,249 340,254 332,255 C324,256 318,255 318,250 Z"/>
      </g>
      <path d="M366,240 L380,234" stroke="#aed09c" stroke-width="2"/>
      <g fill="#f6d6cc"><ellipse cx="360" cy="236" rx="4" ry="2.4"/><ellipse cx="357" cy="235" rx="2" ry="2.6"/><ellipse cx="363" cy="235" rx="2" ry="2.6"/></g>
    </g>

    <!-- 船下的阴影 -->
    <g filter="url(#soft2)" opacity="0.15" fill="#4f6e70">
      <ellipse cx="200" cy="192" rx="120" ry="5"/>
    </g>
    <!-- 纸纹 -->
    <rect width="400" height="260" filter="url(#grain)"/>
  </g>
</svg>
