      <polygon points="240,212 270,212 272,228 240,228"/><polygon points="300,212 330,212 334,228 302,228"/><polygon points="360,212 390,212 396,228 364,228"/>
      <polygon points="24,228 54,228 48,246 16,246"/><polygon points="86,228 116,228 112,246 80,246"/><polygon points="148,228 178,228 176,246 144,246"/><polygon points="210,228 240,228 240,246 208,246"/>
      <polygon points="272,228 302,228 304,246 272,246"/><polygon points="334,228 364,228 368,246 336,246"/>
      <polygon points="-8,246 16,246 10,262 -16,262"/><polygon points="48,246 80,246 76,262 42,262"/><polygon points="112,246 144,246 142,262 108,262"/><polygon points="176,246 208,246 208,262 174,262"/>
      <polygon points="240,246 272,246 274,262 240,262"/><polygon points="304,246 336,246 340,262 306,262"/><polygon points="368,246 400,246 406,262 372,262"/>
    </g>
    <rect x="0" y="209" width="400" height="4" fill="#9fb8a8" opacity="0.6"/>
