      <!-- 下层：咖啡豆罐、碟子、垂吊绿植 -->
      <path d="M36,112 L56,112 L56,134 L36,134 Z" fill="url(#jar)"/><rect x="35" y="108" width="22" height="5" rx="1.5" fill="#b98d63"/>
      <rect x="38" y="120" width="16" height="13" fill="#9a6c4c"/>
      <g fill="#c08d66"><circle cx="41" cy="124" r="1"/><circle cx="46" cy="127" r="1"/><circle cx="51" cy="123" r="1"/><circle cx="43" cy="130" r="1"/><circle cx="50" cy="130" r="1"/></g>
      <path d="M62,116 L80,116 L80,134 L62,134 Z" fill="url(#jar)"/><rect x="61" y="112" width="20" height="5" rx="1.5" fill="#b98d63"/>
      <rect x="64" y="124" width="14" height="9" fill="#ead6b4"/>
      <g fill="#f3ece0"><ellipse cx="102" cy="132" rx="13" ry="2.4"/><ellipse cx="102" cy="128.5" rx="12.5" ry="2.4"/><ellipse cx="102" cy="125" rx="12" ry="2.4"/></g>
      <path d="M89,132 C91,134.5 113,134.5 115,132 Z" fill="#8fb0c4"/><path d="M89.5,128.5 C91.5,131 112.5,131 114.5,128.5 Z" fill="#f0cf74"/><path d="M90,125 C92,127.5 112,127.5 114,125 Z" fill="#e59b7e"/>
