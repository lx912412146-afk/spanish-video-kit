<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 260" width="400" height="260">
  <!-- 原创插图：咖啡馆一角（水彩风格，纯 SVG 手绘，无外部素材） -->
  <defs>
    <filter id="wc" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="0.35"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="g"/>
      <feColorMatrix in="g" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.38  0 0 0 0 0.3  0 0 0 0.09 0"/>
    </filter>
    <filter id="edge" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="5"/></filter>
    <mask id="fade" maskUnits="userSpaceOnUse" x="0" y="0" width="400" height="260">
      <rect x="7" y="7" width="386" height="246" rx="4" fill="#fff" filter="url(#edge)"/>
    </mask>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf3e6"/><stop offset="0.6" stop-color="#f8e9d6"/><stop offset="1" stop-color="#f4dfc8"/>
    </linearGradient>
    <linearGradient id="wains" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c6d8cd"/><stop offset="1" stop-color="#b4cbbd"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ead2b4"/><stop offset="1" stop-color="#e0c19e"/>
    </linearGradient>
    <linearGradient id="marble" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#efe8de"/><stop offset="0.45" stop-color="#fdfaf4"/><stop offset="1" stop-color="#e8dfd2"/>
    </linearGradient>
    <linearGradient id="cup" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ebe3d7"/><stop offset="0.45" stop-color="#fffdf8"/><stop offset="1" stop-color="#ddd3c4"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9a466"/><stop offset="0.45" stop-color="#ebc48c"/><stop offset="1" stop-color="#cf9758"/>
    </linearGradient>
    <linearGradient id="pot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ebe1d2"/><stop offset="0.45" stop-color="#faf4ea"/><stop offset="1" stop-color="#ddd0bd"/>
    </linearGradient>
    <linearGradient id="jar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e3ece9"/><stop offset="0.5" stop-color="#f5f9f7"/><stop offset="1" stop-color="#d9e4e1"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3d2" stop-opacity="0.95"/><stop offset="1" stop-color="#fff3d2" stop-opacity="0"/>
    </radialGradient>
    <g id="cupS"><path d="M-7,-9 L7,-9 C7,-3 4,0 0,0 C-4,0 -7,-3 -7,-9 Z"/><path d="M6,-7 C10,-7 10,-2 5,-2" fill="none" stroke-width="1.6"/></g>
    <path id="fleaf" d="M0,0 C-7,-6 -8,-18 0,-26 C8,-18 7,-6 0,0 Z"/>
    <path id="bleaf" d="M0,0 C3,-6 10,-7 13,0 C10,6 3,6 0,0 Z"/>
