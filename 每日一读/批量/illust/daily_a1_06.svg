      <line x1="140" y1="154" x2="140" y2="212"/><line x1="164" y1="154" x2="164" y2="212"/><line x1="188" y1="154" x2="188" y2="212"/><line x1="212" y1="154" x2="212" y2="212"/><line x1="236" y1="154" x2="236" y2="212"/>
      <line x1="260" y1="154" x2="260" y2="212"/><line x1="284" y1="154" x2="284" y2="212"/><line x1="308" y1="154" x2="308" y2="212"/><line x1="332" y1="154" x2="332" y2="212"/><line x1="356" y1="154" x2="356" y2="212"/><line x1="380" y1="154" x2="380" y2="212"/>
    </g>
    <rect x="0" y="146" width="400" height="6" fill="#f1e4cf"/>
    <rect x="0" y="212" width="400" height="48" fill="url(#floor)"/>
    <g fill="#dcbf9b" opacity="0.55">
