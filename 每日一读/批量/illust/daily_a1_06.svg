      <ellipse cx="272" cy="238" rx="30" ry="3"/><ellipse cx="193" cy="237" rx="28" ry="3"/><ellipse cx="364" cy="239" rx="22" ry="3"/><ellipse cx="45" cy="239" rx="18" ry="2.6"/>
    </g>
    <!-- 纸纹 -->
    <rect width="400" height="260" filter="url(#grain)"/>
