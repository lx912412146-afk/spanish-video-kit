      <ellipse cx="270" cy="70" rx="18" ry="2.6" fill="#c98f52"/>
      <ellipse cx="270" cy="72" rx="6" ry="3.4" fill="#fff6dc"/>
      <line x1="348" y1="0" x2="348" y2="34" stroke="#9a8572" stroke-width="1"/>
      <path d="M336,46 C336,38 341,33 348,33 C355,33 360,38 360,46 Z" fill="url(#shade)"/>
      <ellipse cx="348" cy="46" rx="12" ry="1.8" fill="#c98f52"/>
      <ellipse cx="348" cy="47.5" rx="4" ry="2.4" fill="#fff6dc"/>

      <!-- 大盆绿植 -->
      <g stroke="#6f9f55" stroke-width="1.6" fill="none">
        <path d="M362,208 C360,180 356,150 350,124"/><path d="M366,208 C368,184 374,160 382,140"/><path d="M360,208 C352,190 344,176 334,168"/>
