      <path d="M34,102 L40,112 M164,102 L158,112 M34,140 L40,150 M164,140 L158,150" stroke="#b78a61" stroke-width="2.2"/>
      <g stroke-linecap="round">
        <use href="#cupS" transform="translate(38,96)" fill="#f0cf74" stroke="#e2bd5e"/>
        <use href="#cupS" transform="translate(56,96)" fill="#9cc3c3" stroke="#8ab3b3"/>
        <use href="#cupS" transform="translate(74,96)" fill="#e59b7e" stroke="#d98a6c"/>
        <use href="#cupS" transform="translate(92,96)" fill="#a9c79a" stroke="#97b888"/>
        <use href="#cupS" transform="translate(110,96)" fill="#f2b3ab" stroke="#e5a198"/>
      </g>
      <g fill="#ffffff" opacity="0.35"><rect x="33" y="88" width="2" height="6" rx="1"/><rect x="51" y="88" width="2" height="6" rx="1"/><rect x="69" y="88" width="2" height="6" rx="1"/><rect x="87" y="88" width="2" height="6" rx="1"/><rect x="105" y="88" width="2" height="6" rx="1"/></g>
      <!-- 架上的小咖啡壶 -->
