      <path d="M281,165 L302,165" stroke="#6e4632" stroke-width="1.6"/>
      <path d="M302,165 L302,169 M300,165 L300,167.5" stroke="#6e4632" stroke-width="1.2"/>
      <ellipse cx="295" cy="159.6" rx="3.4" ry="2.2" fill="#f6ead8"/>
      <path d="M293.6,157.2 C295,155.8 297,156.4 296.4,158" stroke="#f6ead8" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <path d="M292,157 L297,155.4" stroke="#6e4632" stroke-width="1.3" stroke-linecap="round"/>
