      <ellipse cx="292" cy="178" rx="11" ry="1.8" fill="#efe7da"/>
      <path d="M281,165 L302,165 L302,177 L281,177 Z" fill="#9a6748"/>
      <rect x="281" y="168.6" width="21" height="2.2" fill="#d2a47e"/>
