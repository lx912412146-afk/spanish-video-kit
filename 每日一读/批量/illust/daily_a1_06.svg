      </g>
      <g fill="#5f9a4e"><use href="#fleaf" transform="translate(358,140) rotate(-28) scale(0.9)"/><use href="#fleaf" transform="translate(372,150) rotate(36) scale(0.85)"/><use href="#fleaf" transform="translate(352,168) rotate(-48) scale(0.85)"/></g>
      <g fill="#a2cf86"><use href="#fleaf" transform="translate(360,128) rotate(8) scale(0.8)"/><use href="#fleaf" transform="translate(370,170) rotate(30) scale(0.7)"/><use href="#fleaf" transform="translate(362,190) rotate(-8) scale(0.7)"/></g>
      <path d="M344,206 L384,206 L379,238 L349,238 Z" fill="url(#pot)"/>
      <rect x="341" y="202" width="46" height="6" rx="2" fill="#f4ecdf"/>
      <path d="M345.5,216 L382.5,216" stroke="#e59b7e" stroke-width="2.4"/>

      <!-- 小圆桌 -->
      <path d="M268,186 L276,186 L275,230 L269,230 Z" fill="#7f6b5b"/>
      <path d="M252,236 C258,230 266,228 272,228 C278,228 286,230 292,236" stroke="#7f6b5b" stroke-width="3" fill="none" stroke-linecap="round"/>
      <ellipse cx="272" cy="236" rx="4" ry="1.5" fill="#7f6b5b"/>
      <rect x="223" y="180" width="98" height="5" rx="2.5" fill="#d8cfc2"/>
      <ellipse cx="272" cy="180" rx="49" ry="8" fill="url(#marble)"/>
      <path d="M238,181 C250,178 262,183 276,180" stroke="#e1d6c8" stroke-width="0.8" fill="none"/>
      <!-- 咖啡杯 -->
      <ellipse cx="252" cy="178" rx="13" ry="2.8" fill="#efe7da"/>
      <path d="M260,165 C266,165 266,172 259,172" stroke="#e6ddd0" stroke-width="2" fill="none"/>
      <path d="M243,164 L261,164 C261,172 257,177 252,177 C247,177 243,172 243,164 Z" fill="url(#cup)"/>
      <ellipse cx="252" cy="164" rx="9" ry="2.1" fill="#b98457"/>
      <path d="M252,165 C250,163 248,163.4 249.4,164.6 L252,166.2 L254.6,164.6 C256,163.4 254,163 252,165 Z" fill="#f6e6cc"/>
      <g stroke="#ffffff" stroke-width="1.3" fill="none" opacity="0.8" stroke-linecap="round">
