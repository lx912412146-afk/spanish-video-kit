<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 260" width="400" height="260">
  <!-- 原创插图：公园小路边靠在树旁的自行车（水彩风格，纯 SVG 手绘，无外部素材） -->
  <defs>
    <filter id="wc" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="0.35"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="g"/>
      <feColorMatrix in="g" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.38  0 0 0 0 0.3  0 0 0 0.09 0"/>
    </filter>
    <filter id="edge" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="5"/></filter>
    <mask id="fade" maskUnits="userSpaceOnUse" x="0" y="0" width="400" height="260">
      <rect x="7" y="7" width="386" height="246" rx="4" fill="#fff" filter="url(#edge)"/>
    </mask>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d6e8ef"/><stop offset="0.65" stop-color="#ebf2ea"/><stop offset="1" stop-color="#f6f1e0"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dbe8bd"/><stop offset="1" stop-color="#bfd79d"/>
    </linearGradient>
    <linearGradient id="path" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3e7cf"/><stop offset="1" stop-color="#ead8b8"/>
    </linearGradient>
    <linearGradient id="trunk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a5805e"/><stop offset="0.45" stop-color="#bf9a74"/><stop offset="1" stop-color="#94704f"/>
    </linearGradient>
    <linearGradient id="bask" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2bd8a"/><stop offset="1" stop-color="#c79766"/>
    </linearGradient>
    <g id="wheel">
      <g stroke="#d2cabe" stroke-width="0.7">
        <line x1="-27" y1="0" x2="27" y2="0"/><line x1="-23.4" y1="-13.5" x2="23.4" y2="13.5"/><line x1="-13.5" y1="-23.4" x2="13.5" y2="23.4"/>
        <line x1="0" y1="-27" x2="0" y2="27"/><line x1="13.5" y1="-23.4" x2="-13.5" y2="23.4"/><line x1="23.4" y1="-13.5" x2="-23.4" y2="13.5"/>
      </g>
      <circle r="27" fill="none" stroke="#c9c1b4" stroke-width="1.4"/>
      <circle r="30" fill="none" stroke="#6f645b" stroke-width="3.4"/>
      <circle r="3" fill="#a59a8e"/>
    </g>
    <g id="fl"><circle cx="0" cy="-2.2" r="1.9"/><circle cx="2.1" cy="-0.7" r="1.9"/><circle cx="1.3" cy="1.8" r="1.9"/><circle cx="-1.3" cy="1.8" r="1.9"/><circle cx="-2.1" cy="-0.7" r="1.9"/></g>
    <path id="leaf" d="M0,0 C4,-5.5 12,-5.5 16,0 C12,5.5 4,5.5 0,0 Z"/>
  </defs>

  <g mask="url(#fade)">
    <!-- 天空和草地 -->
    <rect width="400" height="260" fill="url(#sky)"/>
    <g filter="url(#soft2)" fill="#ffffff" opacity="0.8">
      <ellipse cx="196" cy="70" rx="22" ry="6"/><ellipse cx="210" cy="66" rx="13" ry="6"/>
    </g>
    <path d="M0,132 C60,122 120,126 180,130 C240,134 300,124 400,128 L400,260 L0,260 Z" fill="url(#grass)"/>

    <g filter="url(#wc)">
      <!-- 远处的树丛和长椅 -->
      <g opacity="0.85">
        <g fill="#c6dcae"><circle cx="20" cy="118" r="16"/><circle cx="44" cy="112" r="20"/><circle cx="72" cy="120" r="15"/><circle cx="150" cy="120" r="14"/><circle cx="170" cy="114" r="18"/><circle cx="196" cy="122" r="13"/></g>
        <g fill="#b6d19c"><circle cx="34" cy="124" r="12"/><circle cx="60" cy="125" r="11"/><circle cx="162" cy="126" r="11"/><circle cx="184" cy="127" r="10"/></g>
        <g fill="#c4a98c"><rect x="43" y="128" width="2.5" height="8"/><rect x="169" y="128" width="2.5" height="8"/></g>
      </g>
      <path d="M0,136 C60,128 120,130 180,134 C240,138 300,130 400,134 L400,140 L0,140 Z" fill="#d4e4b6"/>
      <g opacity="0.9">
        <rect x="88" y="146" width="30" height="2.4" fill="#c49c74"/><rect x="88" y="141" width="30" height="2" fill="#c49c74"/>
        <g stroke="#9c8a78" stroke-width="1.2"><line x1="90" y1="148" x2="90" y2="154"/><line x1="116" y1="148" x2="116" y2="154"/><line x1="90" y1="140" x2="90" y2="148"/><line x1="116" y1="140" x2="116" y2="148"/></g>
      </g>

      <!-- 小路 -->
      <path d="M0,250 C40,226 96,200 150,184 C188,172 214,160 238,146 L252,147 C232,162 208,178 182,194 C140,220 122,240 128,262 L0,262 Z" fill="url(#path)"/>
      <path d="M150,184 C188,172 214,160 238,146" stroke="#e2cfac" stroke-width="1.2" fill="none"/>
      <path d="M182,194 C208,178 232,162 252,147" stroke="#e2cfac" stroke-width="1.2" fill="none"/>
      <g fill="#e3d0b0"><ellipse cx="60" cy="236" rx="3" ry="1.4"/><ellipse cx="96" cy="222" rx="2.5" ry="1.2"/><ellipse cx="40" cy="250" rx="3" ry="1.4"/><ellipse cx="110" cy="246" rx="2.5" ry="1.2"/><ellipse cx="170" cy="190" rx="2" ry="1"/></g>

      <!-- 大树 -->
      <path d="M296,216 C302,184 300,144 304,96 L318,96 C318,144 318,184 328,216 C318,212 306,212 296,216 Z" fill="url(#trunk)"/>
      <path d="M306,124 C298,110 290,100 280,92 M314,116 C322,104 332,96 344,90" stroke="#a5805e" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M309,130 C310,150 308,170 310,200 M316,140 C318,160 317,180 320,204" stroke="#94704f" stroke-width="0.9" fill="none" opacity="0.7"/>
      <g fill="#97be7a">
        <circle cx="300" cy="44" r="44"/><circle cx="350" cy="34" r="42"/><circle cx="268" cy="72" r="30"/><circle cx="384" cy="74" r="32"/><circle cx="326" cy="84" r="36"/><circle cx="282" cy="22" r="28"/>
      </g>
      <g fill="#aacd8c">
        <circle cx="290" cy="34" r="30"/><circle cx="340" cy="26" r="30"/><circle cx="274" cy="64" r="20"/><circle cx="318" cy="66" r="26"/><circle cx="372" cy="62" r="22"/>
      </g>
      <g fill="#c2dea5" opacity="0.75" filter="url(#soft2)">
        <circle cx="282" cy="26" r="16"/><circle cx="330" cy="18" r="16"/><circle cx="306" cy="52" r="13"/><circle cx="362" cy="48" r="12"/>
      </g>
      <g fill="#86b06c" opacity="0.6" filter="url(#soft2)">
        <circle cx="262" cy="86" r="12"/><circle cx="300" cy="96" r="14"/><circle cx="346" cy="100" r="14"/><circle cx="388" cy="96" r="14"/>
      </g>
      <!-- 树下的花丛 -->
      <g fill="#a3c788"><circle cx="352" cy="214" r="13"/><circle cx="372" cy="208" r="16"/><circle cx="394" cy="214" r="13"/><circle cx="338" cy="220" r="9"/></g>
      <g fill="#b9d89c"><circle cx="366" cy="204" r="9"/><circle cx="386" cy="206" r="8"/></g>
      <g fill="#f3b3aa"><use href="#fl" transform="translate(350,206)"/><use href="#fl" transform="translate(376,200)"/><use href="#fl" transform="translate(392,210)"/></g>
      <g fill="#ffffff"><use href="#fl" transform="translate(362,214)"/><use href="#fl" transform="translate(384,218)"/></g>
      <g fill="#f4d47c"><circle cx="350" cy="206" r="1.2"/><circle cx="376" cy="200" r="1.2"/><circle cx="392" cy="210" r="1.2"/><circle cx="362" cy="214" r="1.2"/><circle cx="384" cy="218" r="1.2"/></g>

      <!-- 自行车 -->
      <path d="M150,198 A30,30 0 0 1 196,184" stroke="#7fb3b4" stroke-width="3" fill="none" stroke-linecap="round"/>
      <use href="#wheel" transform="translate(176,206)"/>
      <use href="#wheel" transform="translate(276,206)"/>
      <path d="M256,186 A30,30 0 0 1 302,194" stroke="#7fb3b4" stroke-width="3" fill="none" stroke-linecap="round"/>
      <g stroke="#8b7f74" stroke-width="1" fill="none">
        <line x1="214" y1="203" x2="176" y2="202.5"/><line x1="214" y1="217" x2="176" y2="209.5"/>
      </g>
      <circle cx="214" cy="210" r="7" fill="none" stroke="#9d9287" stroke-width="1.8"/>
      <circle cx="176" cy="206" r="4" fill="none" stroke="#9d9287" stroke-width="1.4"/>
      <g stroke="#79aeb0" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M214,210 L176,206"/>
        <path d="M206,160 L176,206"/>
        <path d="M214,210 L204,154"/>
        <path d="M266,166 C252,190 232,206 214,210"/>
        <path d="M264,158 C248,180 228,194 208,198"/>
        <path d="M266,164 C269,180 272,194 276,206"/>
        <path d="M262,148 L267,168"/>
      </g>
      <path d="M204,156 L215,210" stroke="#a6d0cf" stroke-width="1.2" opacity="0.8"/>
      <path d="M262,160 C248,182 230,196 212,200" stroke="#a6d0cf" stroke-width="1.2" fill="none" opacity="0.7"/>
      <!-- 车座、车把、脚踏 -->
      <line x1="203" y1="154" x2="202" y2="146" stroke="#9d9287" stroke-width="2.4"/>
      <path d="M187,146 C191,141 207,141 213,145 C211,150 196,151 187,146 Z" fill="#9a7458"/>
      <path d="M262,149 L259,138 C252,136 246,137 240,141" stroke="#9d9287" stroke-width="2.6" fill="none" stroke-linecap="round"/>
      <path d="M240,141 L233,145" stroke="#9a7458" stroke-width="4" stroke-linecap="round"/>
      <line x1="214" y1="210" x2="222" y2="223" stroke="#8b7f74" stroke-width="2.4" stroke-linecap="round"/>
      <rect x="216" y="222" width="12" height="3.2" rx="1" fill="#8b7f74"/>
      <circle cx="214" cy="210" r="2.6" fill="#8b7f74"/>
      <!-- 车筐里的花 -->
      <g stroke="#6f9f55" stroke-width="1.2" fill="none">
        <path d="M276,138 C274,128 270,122 268,116"/><path d="M284,138 C284,126 286,118 286,110"/><path d="M292,138 C294,128 298,122 302,116"/>
        <path d="M280,138 C278,130 276,126 274,122"/><path d="M296,138 C298,132 302,128 306,126"/>
      </g>
      <g fill="#79b062">
        <use href="#leaf" transform="translate(272,132) rotate(-150) scale(0.7)"/><use href="#leaf" transform="translate(296,130) rotate(-30) scale(0.7)"/>
        <use href="#leaf" transform="translate(285,128) rotate(-75) scale(0.6)"/><use href="#leaf" transform="translate(268,136) rotate(170) scale(0.6)"/>
      </g>
      <g fill="#f2a59c"><use href="#fl" transform="translate(268,116) scale(1.5)"/><use href="#fl" transform="translate(302,116) scale(1.4)"/></g>
      <g fill="#f8f2e6"><use href="#fl" transform="translate(286,109) scale(1.6)"/><use href="#fl" transform="translate(306,126) scale(1.2)"/></g>
      <g fill="#f4cf6e"><use href="#fl" transform="translate(274,122) scale(1.2)"/><use href="#fl" transform="translate(293,121) scale(1.3)"/></g>
      <g fill="#e48a7e"><circle cx="268" cy="116" r="1.6"/><circle cx="302" cy="116" r="1.5"/></g>
      <g fill="#f0c25c"><circle cx="286" cy="109" r="1.8"/><circle cx="306" cy="126" r="1.4"/></g>
      <g fill="#e0a840"><circle cx="274" cy="122" r="1.3"/><circle cx="293" cy="121" r="1.4"/></g>
      <path d="M266,136 L306,136 L301,162 L271,162 Z" fill="url(#bask)"/>
      <g stroke="#b78a5c" stroke-width="0.9" opacity="0.9">
        <line x1="267.5" y1="144" x2="304.5" y2="144"/><line x1="269" y1="152" x2="303" y2="152"/>
        <line x1="276" y1="136" x2="278" y2="162"/><line x1="286" y1="136" x2="286" y2="162"/><line x1="296" y1="136" x2="294" y2="162"/>
      </g>
      <rect x="264" y="133" width="44" height="4.5" rx="2" fill="#e8c898"/>
      <line x1="270" y1="162" x2="268" y2="168" stroke="#9d9287" stroke-width="1.4"/>

      <!-- 前景的花丛 -->
      <g fill="#a3c788"><circle cx="14" cy="226" r="18"/><circle cx="40" cy="236" r="16"/><circle cx="4" cy="246" r="14"/><circle cx="62" cy="248" r="12"/></g>
      <g fill="#b9d89c"><circle cx="24" cy="218" r="10"/><circle cx="46" cy="230" r="8"/></g>
      <g fill="#f2a59c"><use href="#fl" transform="translate(12,216)"/><use href="#fl" transform="translate(36,226)"/><use href="#fl" transform="translate(56,242)"/></g>
      <g fill="#f4cf6e"><use href="#fl" transform="translate(26,234)"/><use href="#fl" transform="translate(8,236)"/></g>
      <g fill="#ffffff"><use href="#fl" transform="translate(46,240)"/><use href="#fl" transform="translate(24,206)"/></g>
      <g fill="#e48a7e"><circle cx="12" cy="216" r="1.1"/><circle cx="36" cy="226" r="1.1"/><circle cx="56" cy="242" r="1.1"/></g>
      <g fill="#e0a840"><circle cx="26" cy="234" r="1.1"/><circle cx="8" cy="236" r="1.1"/><circle cx="46" cy="240" r="1.1"/><circle cx="24" cy="206" r="1.1"/></g>
      <!-- 草叶 -->
      <g stroke="#9cc07e" stroke-width="1" fill="none" stroke-linecap="round">
        <path d="M150,246 l-2,-6 M153,246 l1,-7 M156,246 l3,-5"/><path d="M300,244 l-2,-6 M303,244 l1,-7 M306,244 l3,-5"/>
        <path d="M232,252 l-2,-5 M235,252 l1,-6"/><path d="M250,176 l-1,-4 M252,176 l1,-5"/><path d="M340,170 l-1,-4 M342,170 l1,-5"/>
      </g>
    </g>

    <!-- 地面阴影 -->
    <g filter="url(#soft2)" opacity="0.18" fill="#5f7a4a">
      <ellipse cx="226" cy="237" rx="68" ry="4"/><ellipse cx="312" cy="216" rx="34" ry="4"/>
    </g>
    <!-- 纸纹 -->
    <rect width="400" height="260" filter="url(#grain)"/>
  </g>
</svg>
