<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 260" width="400" height="260">
  <!-- 原创插图：桌上的棋盘游戏、骰子（只画圆点）、棋子、卡片（不写字）、一碗爆米花（水彩风格，纯 SVG 手绘） -->
  <defs>
    <filter id="wc" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="0.35"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="g"/>
      <feColorMatrix in="g" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.38  0 0 0 0 0.3  0 0 0 0.09 0"/>
    </filter>
    <filter id="edge" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="5"/></filter>
    <mask id="fade" maskUnits="userSpaceOnUse" x="0" y="0" width="400" height="260">
      <rect x="7" y="7" width="386" height="246" rx="4" fill="#fff" filter="url(#edge)"/>
    </mask>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf3e6"/><stop offset="0.6" stop-color="#f8e9d6"/><stop offset="1" stop-color="#f4dfc8"/>
    </linearGradient>
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9b088"/><stop offset="1" stop-color="#cfa47a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff4d6" stop-opacity="0.75"/><stop offset="1" stop-color="#fff4d6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#93b3a2"/><stop offset="0.45" stop-color="#b8d2c3"/><stop offset="1" stop-color="#86a796"/>
    </linearGradient>
    <linearGradient id="bowl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8eabbb"/><stop offset="0.45" stop-color="#b3cad6"/><stop offset="1" stop-color="#7f9dae"/>
    </linearGradient>
    <linearGradient id="cupL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#93603f"/><stop offset="0.45" stop-color="#b47e55"/><stop offset="1" stop-color="#875839"/>
    </linearGradient>
    <g id="pawn">
      <ellipse cx="0" cy="0" rx="5.6" ry="2.2"/>
      <path d="M-4.6,-0.6 C-4,-4 -2.2,-7 -1.9,-9.2 L1.9,-9.2 C2.2,-7 4,-4 4.6,-0.6 Z"/>
      <ellipse cx="0" cy="-9.3" rx="3.2" ry="1.2"/>
      <circle cx="0" cy="-12.6" r="3.3"/>
      <path d="M1.4,-1 C2.6,-4 1.6,-7 1.2,-9 L1.9,-9.2 C2.2,-7 4,-4 4.6,-0.6 Z M2.2,-14.4 C4,-13 3.6,-10.8 2,-10" fill="#4a4038" opacity="0.14"/>
      <ellipse cx="-1.2" cy="-13.6" rx="1.1" ry="0.8" fill="#fff" opacity="0.65"/>
      <path d="M-3,-2 C-2.6,-4 -1.8,-6 -1.4,-7.6" stroke="#fff" stroke-width="0.9" opacity="0.45" fill="none"/>
    </g>
    <g id="alm"><ellipse rx="4" ry="2.4" fill="#c38a5a"/><ellipse cx="-0.8" cy="-0.8" rx="2" ry="0.9" fill="#dcae80" opacity="0.8"/></g>
    <g id="haz"><circle r="3.2" fill="#b87b4a"/><path d="M-3,-0.6 C-2.6,-3.4 2.6,-3.4 3,-0.6 C1.4,-1.4 -1.4,-1.4 -3,-0.6 Z" fill="#dcb48a"/><circle cx="-1" cy="0.8" r="0.9" fill="#d29a68" opacity="0.8"/></g>
    <g id="wal"><ellipse rx="4.2" ry="3.4" fill="#cfa877"/><path d="M-3,-1 C-1.4,-2 1.4,0 3,-1 M-3,1.2 C-1.4,0.2 1.4,2.2 3,1.2 M0,-3.2 L0,3.2" stroke="#b08a5c" stroke-width="0.7" fill="none"/></g>
    <g id="pea"><path d="M-4.4,0 C-4.4,-2.6 -2,-2.8 -0.6,-1.8 C0.4,-1.2 0.8,-1.6 1.6,-2.2 C3.4,-3 4.6,-1.6 4.6,0 C4.6,1.8 3.4,3 1.6,2.2 C0.8,1.6 0.4,1.2 -0.6,1.8 C-2,2.8 -4.4,2.6 -4.4,0 Z" fill="#e1bb85"/></g>
    <g id="cardBack">
      <rect x="-14" y="-20" width="28" height="40" rx="2.5" fill="#fbf6ec"/>
      <rect x="-11.5" y="-17.5" width="23" height="35" rx="1.5" fill="#d98c6a"/>
      <path d="M0,-12 L7,0 L0,12 L-7,0 Z" fill="none" stroke="#f6dcc8" stroke-width="1.4"/>
      <circle cx="0" cy="0" r="2.6" fill="#f6dcc8"/>
    </g>
  </defs>

  <g mask="url(#fade)">
    <!-- 墙面与桌面 -->
    <rect width="400" height="260" fill="url(#wall)"/>
    <rect x="0" y="92" width="400" height="168" fill="url(#table)"/>
    <rect x="0" y="90" width="400" height="4" fill="#e7cba6"/>
    <g stroke="#c2976c" stroke-width="1" opacity="0.55">
      <line x1="40" y1="94" x2="-52" y2="260"/><line x1="100" y1="94" x2="42" y2="260"/><line x1="160" y1="94" x2="137" y2="260"/>
      <line x1="220" y1="94" x2="231" y2="260"/><line x1="280" y1="94" x2="326" y2="260"/><line x1="340" y1="94" x2="420" y2="260"/>
    </g>
    <ellipse cx="214" cy="168" rx="170" ry="80" fill="url(#glow)"/>

    <g filter="url(#wc)">
      <!-- 吊灯 -->
      <line x1="302" y1="0" x2="302" y2="27" stroke="#9a8a78" stroke-width="1.3"/>
      <path d="M280,46 C280,33 289,26 302,26 C315,26 324,33 324,46 Z" fill="url(#shade)"/>
      <ellipse cx="302" cy="46" rx="22" ry="3.2" fill="#d6e6dc"/>
      <circle cx="302" cy="48" r="3.6" fill="#fff4cc"/>
      <path d="M288,38 C290,32 295,29 300,28" stroke="#d3e5da" stroke-width="1.6" fill="none" opacity="0.8"/>

      <!-- 骰盅 -->
      <path d="M50,104 L78,104 L77,136 C77,139 72,140 64,140 C56,140 51,139 51,136 Z" fill="url(#cupL)"/>
      <ellipse cx="64" cy="104" rx="14" ry="4" fill="#bd8b62"/>
      <ellipse cx="64" cy="104.6" rx="11.4" ry="2.8" fill="#6e5040"/>
      <path d="M51,110 C58,112 70,112 77,110 M51,131 C58,133 70,133 77,131" fill="none" stroke="#e1b88f" stroke-width="0.9" stroke-dasharray="2 1.6"/>
      <ellipse cx="57" cy="122" rx="2" ry="8" fill="#fff" opacity="0.15"/>

      <!-- 一碗坚果 -->
      <path d="M308,124 C310,112 324,101 338,100 C352,100 364,110 366,124 Z" fill="#b5834f"/>
      <use href="#alm" transform="translate(313,122) rotate(49) scale(0.95)"/> <use href="#haz" transform="translate(320,123) rotate(-22) scale(0.95)"/> <use href="#wal" transform="translate(326,122) rotate(-23) scale(0.95)"/> <use href="#pea" transform="translate(332,122) rotate(-47) scale(0.95)"/>
      <use href="#alm" transform="translate(339,123) rotate(-60) scale(0.95)"/> <use href="#haz" transform="translate(347,122) rotate(45) scale(0.95)"/> <use href="#alm" transform="translate(354,122) rotate(-30) scale(0.95)"/> <use href="#haz" transform="translate(361,123) rotate(-54) scale(0.95)"/>
      <use href="#wal" transform="translate(316,116) rotate(-63) scale(0.95)"/> <use href="#pea" transform="translate(324,117) rotate(-20) scale(0.95)"/> <use href="#alm" transform="translate(331,117) rotate(57) scale(0.95)"/> <use href="#haz" transform="translate(337,116) rotate(1) scale(0.95)"/>
      <use href="#alm" transform="translate(344,117) rotate(-49) scale(0.95)"/> <use href="#haz" transform="translate(351,117) rotate(-12) scale(0.95)"/> <use href="#wal" transform="translate(321,112) rotate(-43) scale(0.95)"/> <use href="#pea" transform="translate(328,113) rotate(28) scale(0.95)"/>
      <use href="#alm" transform="translate(335,111) rotate(-70) scale(0.95)"/> <use href="#haz" transform="translate(342,113) rotate(-57) scale(0.95)"/> <use href="#alm" transform="translate(349,113) rotate(31) scale(0.95)"/> <use href="#haz" transform="translate(328,106) rotate(-1) scale(0.95)"/>
      <use href="#wal" transform="translate(335,107) rotate(-67) scale(0.95)"/> <use href="#pea" transform="translate(343,108) rotate(-40) scale(0.95)"/> <use href="#alm" transform="translate(334,101) rotate(49) scale(0.95)"/> <use href="#haz" transform="translate(341,101) rotate(-22) scale(0.95)"/>
      <path d="M306,123 C308,140 322,148 336,148 C350,148 364,140 366,123 Z" fill="url(#bowl)"/>
      <path d="M306,123 C320,128 352,128 366,123 L366,126 C352,131 320,131 306,126 Z" fill="#eef3f5"/>
      <g fill="#e6eef1" opacity="0.8"><circle cx="318" cy="136" r="1.4"/><circle cx="330" cy="140" r="1.4"/><circle cx="344" cy="140" r="1.4"/><circle cx="356" cy="136" r="1.4"/></g>
      <use href="#alm" transform="translate(376,142) rotate(20)"/><use href="#haz" transform="translate(296,148)"/>

      <!-- 棋盘（只有色块和格子） -->
      <g transform="translate(200,166) scale(1,0.52) rotate(-8)">
        <rect x="-77" y="-77" width="154" height="154" rx="3" fill="#a87a54"/>
      </g>
      <g transform="translate(200,160) scale(1,0.52) rotate(-8)">
        <rect x="-77" y="-77" width="154" height="154" rx="3" fill="#c99a6c"/>
        <rect x="-73" y="-73" width="146" height="146" fill="#f8f1e2"/>
        <rect x="-73" y="-73" width="50" height="50" fill="#e5917a"/><rect x="23" y="-73" width="50" height="50" fill="#efc56e"/>
        <rect x="23" y="23" width="50" height="50" fill="#9fc58c"/><rect x="-73" y="23" width="50" height="50" fill="#92b5ca"/>
        <circle cx="-48" cy="-48" r="17" fill="#f7d6ca"/><circle cx="48" cy="-48" r="17" fill="#f9e6b6"/>
        <circle cx="48" cy="48" r="17" fill="#d8eacb"/><circle cx="-48" cy="48" r="17" fill="#d0e2ee"/>
        <rect x="-7.7" y="-73" width="15.4" height="50" fill="#f6c9b9"/><rect x="23" y="-7.7" width="50" height="15.4" fill="#f8e2a8"/>
        <rect x="-7.7" y="23" width="15.4" height="50" fill="#d0e5c3"/><rect x="-73" y="-7.7" width="50" height="15.4" fill="#c9dcea"/>
        <g stroke="#d6c4a6" stroke-width="1.2" fill="none">
          <rect x="-23" y="-73" width="46" height="146"/><rect x="-73" y="-23" width="146" height="46"/>
          <line x1="-7.7" y1="-73" x2="-7.7" y2="-23"/><line x1="7.7" y1="-73" x2="7.7" y2="-23"/><line x1="-7.7" y1="23" x2="-7.7" y2="73"/><line x1="7.7" y1="23" x2="7.7" y2="73"/>
          <line x1="-73" y1="-7.7" x2="-23" y2="-7.7"/><line x1="-73" y1="7.7" x2="-23" y2="7.7"/><line x1="23" y1="-7.7" x2="73" y2="-7.7"/><line x1="23" y1="7.7" x2="73" y2="7.7"/>
          <line x1="-23" y1="-63" x2="23" y2="-63"/><line x1="-23" y1="-53" x2="23" y2="-53"/><line x1="-23" y1="-43" x2="23" y2="-43"/><line x1="-23" y1="-33" x2="23" y2="-33"/>
          <line x1="-23" y1="63" x2="23" y2="63"/><line x1="-23" y1="53" x2="23" y2="53"/><line x1="-23" y1="43" x2="23" y2="43"/><line x1="-23" y1="33" x2="23" y2="33"/>
          <line x1="-63" y1="-23" x2="-63" y2="23"/><line x1="-53" y1="-23" x2="-53" y2="23"/><line x1="-43" y1="-23" x2="-43" y2="23"/><line x1="-33" y1="-23" x2="-33" y2="23"/>
          <line x1="63" y1="-23" x2="63" y2="23"/><line x1="53" y1="-23" x2="53" y2="23"/><line x1="43" y1="-23" x2="43" y2="23"/><line x1="33" y1="-23" x2="33" y2="23"/>
        </g>
        <polygon points="-23,-23 23,-23 0,0" fill="#e5917a"/><polygon points="23,-23 23,23 0,0" fill="#efc56e"/>
        <polygon points="23,23 -23,23 0,0" fill="#9fc58c"/><polygon points="-23,23 -23,-23 0,0" fill="#92b5ca"/>
        <g fill="#e2d3ba"><circle cx="-15.4" cy="-68" r="3"/><circle cx="68" cy="-15.4" r="3"/><circle cx="15.4" cy="68" r="3"/><circle cx="-68" cy="15.4" r="3"/></g>
      </g>

      <!-- 棋子 -->
      <use href="#pawn" fill="#d9775c" transform="translate(140,140)"/><use href="#pawn" fill="#d9775c" transform="translate(152,134)"/>
      <use href="#pawn" fill="#d9775c" transform="translate(140,170)"/>
      <use href="#pawn" fill="#e8b852" transform="translate(242,132)"/><use href="#pawn" fill="#e8b852" transform="translate(245,153)"/>
      <use href="#pawn" fill="#7fb06c" transform="translate(255,182)"/><use href="#pawn" fill="#7fb06c" transform="translate(266,176)"/>
      <use href="#pawn" fill="#6f9cb8" transform="translate(199,188)"/><use href="#pawn" fill="#6f9cb8" transform="translate(158,189)"/>

      <!-- 骰子（只画圆点） -->
      <g transform="translate(92,214)">
        <g stroke-linejoin="round" stroke-width="1.6">
          <polygon points="0,-15 12,-9 0,-3 -12,-9" fill="#fdfaf3" stroke="#fdfaf3"/>
          <polygon points="-12,-9 0,-3 0,11 -12,5" fill="#eee6d8" stroke="#eee6d8"/>
          <polygon points="0,-3 12,-9 12,5 0,11" fill="#ddd3c2" stroke="#ddd3c2"/>
        </g>
        <g fill="#6a5a4e">
          <ellipse cx="0" cy="-9" rx="1.6" ry="0.9"/><ellipse cx="0" cy="-12.3" rx="1.6" ry="0.9"/><ellipse cx="6.6" cy="-9" rx="1.6" ry="0.9"/><ellipse cx="0" cy="-5.7" rx="1.6" ry="0.9"/><ellipse cx="-6.6" cy="-9" rx="1.6" ry="0.9"/>
          <circle cx="-9.6" cy="-2" r="1.3"/><circle cx="-6" cy="4" r="1.3"/><circle cx="-2.4" cy="10" r="1.3"/>
          <circle cx="3" cy="9" r="1.3"/><circle cx="9" cy="-1" r="1.3"/>
        </g>
      </g>
      <g transform="translate(122,230) rotate(-8)">
        <g stroke-linejoin="round" stroke-width="1.6">
          <polygon points="0,-15 12,-9 0,-3 -12,-9" fill="#fdfaf3" stroke="#fdfaf3"/>
          <polygon points="-12,-9 0,-3 0,11 -12,5" fill="#eee6d8" stroke="#eee6d8"/>
          <polygon points="0,-3 12,-9 12,5 0,11" fill="#ddd3c2" stroke="#ddd3c2"/>
        </g>
        <g fill="#6a5a4e">
          <ellipse cx="-6.6" cy="-9" rx="1.6" ry="0.9"/><ellipse cx="0" cy="-9" rx="1.6" ry="0.9"/><ellipse cx="6.6" cy="-9" rx="1.6" ry="0.9"/>
          <circle cx="-6" cy="4" r="1.4"/>
          <circle cx="3" cy="0.5" r="1.2"/><circle cx="9" cy="-2.5" r="1.2"/><circle cx="9" cy="4.5" r="1.2"/><circle cx="3" cy="7.5" r="1.2"/>
        </g>
      </g>

      <!-- 卡片（背面花纹，不写字） -->
      <g transform="translate(318,212) scale(1,0.56) rotate(-14)"><use href="#cardBack" transform="translate(1,6)"/><use href="#cardBack" transform="translate(0.5,3)"/><use href="#cardBack"/></g>
      <g transform="translate(352,226) scale(1,0.56) rotate(22)"><use href="#cardBack"/></g>
      <g transform="translate(290,232) scale(1,0.56) rotate(-40)">
        <rect x="-14" y="-20" width="28" height="40" rx="2.5" fill="#fbf6ec"/>
        <rect x="-11" y="-17" width="22" height="34" rx="1.5" fill="#f3e9d5"/>
        <path d="M0,-8 L2.4,-2.6 L8,-2.2 L3.6,1.4 L5,7 L0,4 L-5,7 L-3.6,1.4 L-8,-2.2 L-2.4,-2.6 Z" fill="#e9b85c"/>
      </g>
    </g>

    <!-- 地面阴影 -->
    <g filter="url(#soft2)" opacity="0.22" fill="#7a5a3c">
      <ellipse cx="210" cy="206" rx="80" ry="4"/><ellipse cx="64" cy="140" rx="16" ry="2.4"/><ellipse cx="336" cy="148" rx="30" ry="3"/>
      <ellipse cx="94" cy="226" rx="13" ry="2.4"/><ellipse cx="124" cy="242" rx="13" ry="2.4"/><ellipse cx="320" cy="226" rx="22" ry="2.4"/>
    </g>
    <!-- 纸纹 -->
    <rect width="400" height="260" filter="url(#grain)"/>
  </g>
</svg>
