<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 260" width="400" height="260">
  <!-- 原创插图：两把面对面的扶手椅、小茶几上两杯茶、落地灯（水彩风格，纯 SVG 手绘） -->
  <defs>
    <filter id="wc" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="0.35"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="g"/>
      <feColorMatrix in="g" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.38  0 0 0 0 0.3  0 0 0 0.09 0"/>
    </filter>
    <filter id="edge" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="5"/></filter>
    <mask id="fade" maskUnits="userSpaceOnUse" x="0" y="0" width="400" height="260">
      <rect x="7" y="7" width="386" height="246" rx="4" fill="#fff" filter="url(#edge)"/>
    </mask>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf3e6"/><stop offset="0.6" stop-color="#f8e9d6"/><stop offset="1" stop-color="#f3dec6"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e7cdac"/><stop offset="1" stop-color="#dcbd97"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff2c8" stop-opacity="0.9"/><stop offset="1" stop-color="#fff2c8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6e2b6"/><stop offset="0.5" stop-color="#fdf1d4"/><stop offset="1" stop-color="#ecd29f"/>
    </linearGradient>
    <linearGradient id="tableTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c99d74"/><stop offset="0.45" stop-color="#ddb48a"/><stop offset="1" stop-color="#b98c63"/>
    </linearGradient>
    <linearGradient id="cup" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#efe5d3"/><stop offset="0.35" stop-color="#fcf7ee"/><stop offset="1" stop-color="#dccdb4"/>
    </linearGradient>
    <!-- 扶手椅（朝右），颜色用 currentColor -->
    <g id="chair">
      <rect x="-48" y="-13" width="5" height="13" rx="1.5" fill="#9c7656"/><rect x="44" y="-13" width="5" height="13" rx="1.5" fill="#9c7656"/>
      <path d="M-58,-20 L-64,-112 C-65,-124 -56,-131 -45,-129 C-34,-127 -30,-119 -31,-108 L-26,-20 Z" fill="currentColor"/>
      <path d="M-58,-20 L-64,-112 C-65,-124 -56,-131 -45,-129 L-48,-20 Z" fill="#5a4636" opacity="0.14"/>
      <path d="M-44,-34 L-46,-110 C-46,-119 -39,-121 -35,-115 L-32,-34 Z" fill="#ffffff" opacity="0.16"/>
      <path d="M-38,-30 L-38,-80 C-38,-86 -34,-90 -28,-90 L40,-90 C48,-90 54,-84 54,-76 L54,-30 Z" fill="currentColor"/>
      <path d="M-38,-30 L-38,-80 C-38,-86 -34,-90 -28,-90 L40,-90 C48,-90 54,-84 54,-76 L54,-30 Z" fill="#5a4636" opacity="0.2"/>
      <path d="M-34,-60 L54,-60 C59,-60 62,-57 62,-53 L62,-44 L-34,-44 Z" fill="currentColor"/>
      <path d="M-34,-60 L54,-60 C59,-60 62,-57 62,-53 L-34,-53 Z" fill="#ffffff" opacity="0.28"/>
      <path d="M-54,-12 L-54,-72 C-54,-78 -50,-82 -44,-82 L50,-82 C58,-82 64,-76 64,-68 C64,-60 58,-55 52,-55 L52,-12 Z" fill="currentColor"/>
      <path d="M-54,-74 C-54,-79 -50,-82 -44,-82 L50,-82 C56,-82 60,-79 62,-75 Z" fill="#ffffff" opacity="0.25"/>
      <circle cx="51" cy="-68" r="9" fill="none" stroke="#5a4636" stroke-width="1.2" opacity="0.3"/>
      <path d="M-54,-26 L52,-26 L52,-12 L-54,-12 Z" fill="#5a4636" opacity="0.14"/>
      <path d="M-50,-26 L48,-26" stroke="#ffffff" stroke-width="1" opacity="0.35"/>
      <path d="M-44,-46 C-20,-44 10,-44 40,-46" stroke="#5a4636" stroke-width="0.8" opacity="0.18" fill="none"/>
    </g>
  </defs>

  <g mask="url(#fade)">
    <!-- 墙和地板 -->
    <rect width="400" height="260" fill="url(#wall)"/>
    <rect x="0" y="200" width="400" height="60" fill="url(#floor)"/>
    <g stroke="#d4b38e" stroke-width="0.8" opacity="0.7">
      <line x1="0" y1="216" x2="400" y2="216"/><line x1="0" y1="236" x2="400" y2="236"/><line x1="0" y1="254" x2="400" y2="254"/>
      <line x1="80" y1="200" x2="77" y2="216"/><line x1="250" y1="216" x2="246" y2="236"/><line x1="140" y1="236" x2="137" y2="254"/><line x1="340" y1="236" x2="337" y2="254"/>
    </g>
    <rect x="0" y="195" width="400" height="6" fill="#efdcc2"/>
    <rect x="0" y="200" width="400" height="1.5" fill="#dcc4a3"/>

    <!-- 落地灯的光晕 -->
    <ellipse cx="364" cy="64" rx="90" ry="70" fill="url(#glow)"/>
    <g filter="url(#soft)" opacity="0.4">
      <path d="M346,62 L384,62 L420,200 L310,200 Z" fill="#fff6dc"/>
    </g>

    <!-- 地毯 -->
    <g filter="url(#wc)">
      <ellipse cx="200" cy="226" rx="176" ry="22" fill="#e9c7a6"/>
      <ellipse cx="200" cy="226" rx="166" ry="18" fill="none" stroke="#d6987a" stroke-width="2.4"/>
      <ellipse cx="200" cy="226" rx="152" ry="14" fill="none" stroke="#b7c9a6" stroke-width="1.6" stroke-dasharray="6 4"/>
      <ellipse cx="200" cy="226" rx="120" ry="9" fill="#f0d6ba"/>
    </g>
    <g filter="url(#soft2)" opacity="0.2" fill="#8a6a4a">
      <ellipse cx="98" cy="216" rx="60" ry="4"/><ellipse cx="302" cy="216" rx="60" ry="4"/><ellipse cx="200" cy="214" rx="22" ry="3"/>
    </g>

    <g filter="url(#wc)">
      <!-- 墙上的小画（只有色块） -->
      <rect x="170" y="62" width="62" height="46" fill="#e3c9a6"/>
      <rect x="174" y="66" width="54" height="38" fill="#eaf1ee"/>
      <path d="M174,92 C186,84 198,82 210,86 C218,82 224,82 228,84 L228,104 L174,104 Z" fill="#b9cfa6"/>
      <path d="M174,98 C190,94 206,96 228,94 L228,104 L174,104 Z" fill="#e3b98c"/>
      <circle cx="214" cy="76" r="5" fill="#f2cf8a"/>

      <!-- 落地灯 -->
      <rect x="363" y="60" width="3" height="152" fill="#a98a6a"/>
      <ellipse cx="364.5" cy="213" rx="14" ry="3.5" fill="#9c7e60"/>
      <path d="M346,62 L384,62 L376,30 L354,30 Z" fill="url(#shade)"/>
      <path d="M346,62 L384,62" stroke="#e2c38c" stroke-width="2"/>
      <path d="M354,30 L376,30" stroke="#e7cd9c" stroke-width="1.6"/>

      <!-- 左边的扶手椅（鼠尾草绿） -->
      <use href="#chair" transform="translate(98,216)" color="#a7c2b6"/>
      <!-- 右边的扶手椅（陶土色），镜像 -->
      <use href="#chair" transform="translate(302,216) scale(-1,1)" color="#dfa588"/>
      <!-- 抱枕 -->
      <path d="M54,135 C52,128 52,120 56,114 C62,112 70,113 76,116 C79,122 79,129 77,135 Z" fill="#efd6a0"/>
      <path d="M56,114 C62,112 70,113 76,116 C70,118 62,118 56,114 Z" fill="#f7e6c0"/>
      <path d="M346,135 C348,128 348,120 344,114 C338,112 330,113 324,116 C321,122 321,129 323,135 Z" fill="#c4d6c0"/>
      <path d="M344,114 C338,112 330,113 324,116 C330,118 338,118 344,114 Z" fill="#dce8d8"/>

      <!-- 小茶几 -->
      <path d="M197,176 L203,176 L204,206 L196,206 Z" fill="#b98c63"/>
      <path d="M200,204 L184,213 M200,204 L216,213 M200,204 L200,214" stroke="#a7795a" stroke-width="3" stroke-linecap="round"/>
      <path d="M166,170 L234,170 L234,175 C234,178 220,180 200,180 C180,180 166,178 166,175 Z" fill="#b98c63"/>
      <ellipse cx="200" cy="170" rx="34" ry="7" fill="url(#tableTop)"/>
      <ellipse cx="196" cy="168.5" rx="18" ry="2.6" fill="#e9c69e" opacity="0.6"/>

      <!-- 两杯茶 -->
      <ellipse cx="185" cy="169" rx="11" ry="2.8" fill="#f6efe2"/>
      <path d="M177,158 C177,165 180,168 185,168 C190,168 193,165 193,158 Z" fill="url(#cup)"/>
      <path d="M177.4,161 C181,162 189,162 192.6,161" stroke="#a7c2b6" stroke-width="1.4" fill="none"/>
      <path d="M177,160 C172,160 172,166 177,166" stroke="#e2d4bc" stroke-width="1.8" fill="none"/>
      <ellipse cx="185" cy="158" rx="8" ry="2" fill="#faf5ec"/><ellipse cx="185" cy="158.4" rx="6.6" ry="1.4" fill="#c98f4f"/>

      <ellipse cx="215" cy="170" rx="11" ry="2.8" fill="#f6efe2"/>
      <path d="M207,159 C207,166 210,169 215,169 C220,169 223,166 223,159 Z" fill="url(#cup)"/>
      <path d="M207.4,162 C211,163 219,163 222.6,162" stroke="#dfa588" stroke-width="1.4" fill="none"/>
      <path d="M223,161 C228,161 228,167 223,167" stroke="#e2d4bc" stroke-width="1.8" fill="none"/>
      <ellipse cx="215" cy="159" rx="8" ry="2" fill="#faf5ec"/><ellipse cx="215" cy="159.4" rx="6.6" ry="1.4" fill="#c98f4f"/>
    </g>

    <!-- 热气 -->
    <g filter="url(#soft2)" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" opacity="0.9">
      <path d="M184,154 C180,146 188,142 184,134"/><path d="M216,155 C220,147 212,143 216,135"/>
    </g>
    <!-- 纸纹 -->
    <rect width="400" height="260" filter="url(#grain)"/>
  </g>
</svg>
