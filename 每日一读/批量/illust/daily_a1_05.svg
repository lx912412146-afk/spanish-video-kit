<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 260" width="400" height="260">
  <!-- 原创插图：下雨天，从屋里看窗外（水彩风格，纯 SVG 手绘，无外部素材） -->
  <defs>
    <filter id="wc" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="0.35"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="g"/>
      <feColorMatrix in="g" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.38  0 0 0 0 0.3  0 0 0 0.09 0"/>
    </filter>
    <filter id="edge" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="5"/></filter>
    <mask id="fade" maskUnits="userSpaceOnUse" x="0" y="0" width="400" height="260">
      <rect x="7" y="7" width="386" height="246" rx="4" fill="#fff" filter="url(#edge)"/>
    </mask>
    <clipPath id="win"><rect x="200" y="50" width="156" height="108"/></clipPath>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf3e7"/><stop offset="0.6" stop-color="#f6e9d8"/><stop offset="1" stop-color="#f0dfca"/>
    </linearGradient>
    <linearGradient id="rsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2d1da"/><stop offset="1" stop-color="#dfe5e2"/>
    </linearGradient>
    <linearGradient id="street" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8c4c8"/><stop offset="1" stop-color="#a9b8bd"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8d0b2"/><stop offset="1" stop-color="#dfc29f"/>
    </linearGradient>
    <linearGradient id="door" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c99f76"/><stop offset="0.5" stop-color="#d6b088"/><stop offset="1" stop-color="#c39870"/>
    </linearGradient>
    <linearGradient id="boot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e6bb55"/><stop offset="0.45" stop-color="#f4d47e"/><stop offset="1" stop-color="#dfb04a"/>
    </linearGradient>
    <linearGradient id="umb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cf6b56"/><stop offset="0.5" stop-color="#e48c74"/><stop offset="1" stop-color="#c9644f"/>
    </linearGradient>
    <linearGradient id="mug" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9dfd0"/><stop offset="0.45" stop-color="#fbf6ee"/><stop offset="1" stop-color="#ddd1bf"/>
    </linearGradient>
    <linearGradient id="pot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d4835c"/><stop offset="0.45" stop-color="#e59b74"/><stop offset="1" stop-color="#c8734d"/>
    </linearGradient>
    <radialGradient id="lampg" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff1c6" stop-opacity="0.95"/><stop offset="1" stop-color="#fff1c6" stop-opacity="0"/>
    </radialGradient>
    <path id="bleaf" d="M0,0 C3,-6 10,-7 13,0 C10,6 3,6 0,0 Z"/>
    <g id="boot1">
      <path d="M0,0 L15,0 L15,25 C15,28 18,29 23,30 C29,31 31,34 30,38 L0,38 Z" fill="url(#boot)"/>
      <rect x="-1" y="-2" width="17" height="4" rx="1.5" fill="#f6dc94"/>
      <path d="M0,35 L30.5,35 L30,38 L0,38 Z" fill="#c99a40"/>
      <ellipse cx="5" cy="14" rx="1.8" ry="7" fill="#fff" opacity="0.35"/>
    </g>
    <g id="drop"><path d="M0,-2.6 C1.4,-0.6 2,0.4 2,1.2 C2,2.4 1.1,3 0,3 C-1.1,3 -2,2.4 -2,1.2 C-2,0.4 -1.4,-0.6 0,-2.6 Z" fill="#eef4f6" opacity="0.85"/><circle cx="-0.6" cy="0.9" r="0.6" fill="#fff"/></g>
  </defs>

  <g mask="url(#fade)">
    <!-- 墙面和地板 -->
    <rect width="400" height="260" fill="url(#wall)"/>
    <rect x="0" y="200" width="400" height="60" fill="url(#floor)"/>
    <g stroke="#d5b48f" stroke-width="0.8" opacity="0.7">
      <line x1="0" y1="216" x2="400" y2="216"/><line x1="0" y1="234" x2="400" y2="234"/><line x1="0" y1="252" x2="400" y2="252"/>
      <line x1="150" y1="200" x2="147" y2="216"/><line x1="290" y1="200" x2="288" y2="216"/><line x1="60" y1="216" x2="56" y2="234"/><line x1="230" y1="216" x2="228" y2="234"/>
      <line x1="360" y1="216" x2="358" y2="234"/><line x1="130" y1="234" x2="126" y2="252"/><line x1="300" y1="234" x2="298" y2="252"/>
    </g>
    <rect x="0" y="196" width="400" height="5" fill="#e6ccab"/>

    <g filter="url(#wc)">
      <!-- 窗外：雨天的街道 -->
      <g clip-path="url(#win)">
        <rect x="200" y="50" width="156" height="108" fill="url(#rsky)"/>
        <g filter="url(#soft2)" fill="#eef2f1" opacity="0.7"><ellipse cx="236" cy="62" rx="26" ry="6"/><ellipse cx="318" cy="68" rx="30" ry="7"/></g>
        <!-- 对面的房子 -->
        <rect x="196" y="84" width="54" height="62" fill="#d7bcab"/><path d="M193,86 L223,72 L253,86 Z" fill="#c7a090"/>
        <rect x="250" y="76" width="56" height="70" fill="#bccbd0"/><rect x="247" y="72" width="62" height="5" fill="#a9b9bf"/>
        <rect x="306" y="88" width="54" height="58" fill="#e2d6c4"/><path d="M302,90 L333,76 L364,90 Z" fill="#c9a492"/>
        <g fill="#f3d796">
          <rect x="206" y="96" width="9" height="12" rx="1"/><rect x="230" y="116" width="9" height="12" rx="1"/>
          <rect x="262" y="88" width="9" height="12" rx="1"/><rect x="284" y="108" width="9" height="12" rx="1"/>
          <rect x="318" y="100" width="9" height="12" rx="1"/>
        </g>
        <g fill="#a8b4b8">
          <rect x="230" y="96" width="9" height="12" rx="1"/><rect x="206" y="116" width="9" height="12" rx="1"/>
          <rect x="284" y="88" width="9" height="12" rx="1"/><rect x="262" y="108" width="9" height="12" rx="1"/>
          <rect x="340" y="100" width="9" height="12" rx="1"/><rect x="318" y="120" width="9" height="12" rx="1"/><rect x="340" y="120" width="9" height="12" rx="1"/>
        </g>
        <rect x="266" y="126" width="22" height="20" rx="2" fill="#9fb0b6"/>
        <!-- 湿漉漉的街道和倒影 -->
        <rect x="196" y="144" width="164" height="16" fill="url(#street)"/>
        <rect x="196" y="143" width="164" height="2.5" fill="#cdd6d8"/>
        <g opacity="0.55" filter="url(#soft2)">
          <rect x="207" y="147" width="7" height="10" fill="#f3d796"/><rect x="263" y="147" width="7" height="10" fill="#f3d796"/>
          <rect x="319" y="147" width="7" height="10" fill="#f3d796"/><rect x="226" y="146" width="5" height="12" fill="#fff1c6"/>
        </g>
        <!-- 街上打伞的行人（很小的远景剪影） -->
        <g fill="#8e9ba1"><rect x="252" y="139" width="5" height="9" rx="2"/><rect x="331" y="140" width="4.6" height="8.5" rx="2"/><rect x="301" y="141" width="4" height="7.5" rx="2"/></g>
        <g stroke="#8e9ba1" stroke-width="0.9"><line x1="253.5" y1="148" x2="253" y2="152"/><line x1="255.5" y1="148" x2="256.5" y2="152"/><line x1="332.5" y1="148.5" x2="332" y2="152"/><line x1="334" y1="148.5" x2="335" y2="152"/></g>
        <path d="M244.5,139 C244.5,131 264.5,131 264.5,139 Z" fill="#f0c95e"/>
        <path d="M323,140 C323,132.5 342,132.5 342,140 Z" fill="#7fb3b4"/>
        <path d="M295,141 C295,135 311,135 311,141 Z" fill="#e48c74"/>
        <g stroke="#7d8a8f" stroke-width="0.8"><line x1="254.5" y1="133" x2="254.5" y2="140"/><line x1="332.5" y1="134" x2="332.5" y2="141"/><line x1="303" y1="136.5" x2="303" y2="142"/></g>
        <!-- 路灯 -->
        <circle cx="228" cy="84" r="12" fill="url(#lampg)"/>
        <line x1="228" y1="88" x2="228" y2="146" stroke="#7d8a8f" stroke-width="2"/>
        <path d="M223,84 L233,84 L231,90 L225,90 Z" fill="#7d8a8f"/>
        <rect x="224.5" y="88" width="7" height="3.5" fill="#fbe7b0"/>
        <!-- 雨丝 -->
        <g stroke="#ffffff" stroke-width="0.9" opacity="0.75" stroke-linecap="round">
          <line x1="210" y1="54" x2="205" y2="66"/><line x1="232" y1="60" x2="227" y2="72"/><line x1="256" y1="52" x2="251" y2="64"/><line x1="282" y1="58" x2="277" y2="70"/>
          <line x1="306" y1="54" x2="301" y2="66"/><line x1="332" y1="60" x2="327" y2="72"/><line x1="350" y1="52" x2="345" y2="64"/>
          <line x1="218" y1="80" x2="213" y2="92"/><line x1="244" y1="86" x2="239" y2="98"/><line x1="270" y1="78" x2="265" y2="90"/><line x1="296" y1="84" x2="291" y2="96"/>
          <line x1="322" y1="80" x2="317" y2="92"/><line x1="346" y1="86" x2="341" y2="98"/>
          <line x1="212" y1="108" x2="207" y2="120"/><line x1="238" y1="112" x2="233" y2="124"/><line x1="262" y1="104" x2="257" y2="116"/><line x1="290" y1="110" x2="285" y2="122"/>
          <line x1="314" y1="106" x2="309" y2="118"/><line x1="340" y1="112" x2="335" y2="124"/>
          <line x1="224" y1="130" x2="219" y2="142"/><line x1="250" y1="134" x2="245" y2="146"/><line x1="278" y1="130" x2="273" y2="142"/><line x1="304" y1="134" x2="299" y2="146"/><line x1="330" y1="130" x2="325" y2="142"/><line x1="352" y1="134" x2="347" y2="146"/>
        </g>
        <g fill="#eef4f6" opacity="0.8">
          <ellipse cx="214" cy="152" rx="3" ry="0.8"/><ellipse cx="248" cy="155" rx="3" ry="0.8"/><ellipse cx="300" cy="152" rx="3" ry="0.8"/><ellipse cx="338" cy="156" rx="3" ry="0.8"/>
        </g>
        <!-- 玻璃上的雨滴 -->
        <use href="#drop" transform="translate(214,72)"/><use href="#drop" transform="translate(244,104)"/><use href="#drop" transform="translate(262,66)"/>
        <use href="#drop" transform="translate(296,92) scale(1.2)"/><use href="#drop" transform="translate(320,62)"/><use href="#drop" transform="translate(342,96) scale(1.2)"/>
        <use href="#drop" transform="translate(226,128)"/><use href="#drop" transform="translate(308,132)"/><use href="#drop" transform="translate(268,118)"/>
      </g>
      <!-- 窗框 -->
      <g fill="none" stroke="#f4e9d8" stroke-linejoin="round">
        <rect x="200" y="50" width="156" height="108" stroke-width="7"/>
        <line x1="278" y1="50" x2="278" y2="158" stroke-width="5"/>
      </g>
      <rect x="192" y="156" width="172" height="8" rx="2" fill="#efdcc2"/>
      <rect x="194" y="163" width="168" height="3" fill="#dfc7a6"/>

      <!-- 窗台：热茶和小盆栽 -->
      <path d="M216,144 L232,144 L229,157 L219,157 Z" fill="url(#pot)"/><rect x="214" y="141" width="20" height="4" rx="1" fill="#e09a70"/>
      <g fill="#79b062">
        <use href="#bleaf" transform="translate(224,141) rotate(-90) scale(0.9)"/><use href="#bleaf" transform="translate(223,140) rotate(-130) scale(0.85)"/>
        <use href="#bleaf" transform="translate(225,140) rotate(-50) scale(0.85)"/><use href="#bleaf" transform="translate(221,142) rotate(-165) scale(0.75)"/><use href="#bleaf" transform="translate(227,142) rotate(-15) scale(0.75)"/>
      </g>
      <rect x="268" y="150" width="34" height="6.5" rx="1.2" fill="#a9c79a"/>
      <rect x="270" y="152.6" width="31" height="2.6" fill="#f8f1e4"/>
      <rect x="268" y="150" width="34" height="2" rx="1" fill="#bcd6ae"/>
      <rect x="290" y="148.6" width="2.6" height="9" fill="#e59b7e"/>
      <ellipse cx="324" cy="157" rx="14" ry="2.6" fill="#e2d6c4"/>
      <path d="M333,141 C341,141 341,152 332,152" stroke="#e3d8c8" stroke-width="2.6" fill="none"/>
      <path d="M314,136 L334,136 L333,153 C333,156 330,157 327,157 L321,157 C318,157 315,156 315,153 Z" fill="url(#mug)"/>
      <path d="M314.4,142 L333.6,142 L333.4,146 L314.6,146 Z" fill="#e59b7e"/>
      <ellipse cx="324" cy="136" rx="10" ry="2" fill="#b98457"/>
      <path d="M318,136 L316,148" stroke="#d7cbb8" stroke-width="0.6"/>
      <rect x="313.4" y="147" width="4" height="5" fill="#f2d48c"/>
      <g stroke="#ffffff" stroke-width="1.4" fill="none" opacity="0.8" stroke-linecap="round">
        <path d="M320,131 C317,126 323,122 320,116"/><path d="M327,131 C324,125 330,121 327,113"/>
      </g>

      <!-- 门 -->
      <rect x="20" y="58" width="82" height="140" fill="url(#door)"/>
      <g fill="none" stroke="#b88c62" stroke-width="1.4">
        <rect x="30" y="70" width="62" height="52" rx="2"/><rect x="30" y="132" width="62" height="56" rx="2"/>
      </g>
      <g fill="none" stroke="#e2c29c" stroke-width="1" opacity="0.8">
        <rect x="33" y="73" width="56" height="46" rx="1.5"/><rect x="33" y="135" width="56" height="50" rx="1.5"/>
      </g>
      <path d="M14,198 L14,54 L108,54 L108,198" fill="none" stroke="#efdcc2" stroke-width="6" stroke-linejoin="round"/>
      <circle cx="91" cy="128" r="3.2" fill="#d9b25e"/><circle cx="90" cy="127" r="1.2" fill="#f6e2a8"/>

      <!-- 门边的小地垫和雨靴 -->
      <path d="M36,232 L150,232 L156,244 L30,244 Z" fill="#b9c9c8"/>
      <g stroke="#a6b8b7" stroke-width="1.2"><line x1="40" y1="236" x2="146" y2="236"/><line x1="36" y1="240" x2="150" y2="240"/></g>
      <use href="#boot1" transform="translate(60,198)"/>
      <use href="#boot1" transform="translate(84,200)"/>
      <g fill="#dbe6ea" opacity="0.9"><ellipse cx="120" cy="244" rx="5" ry="1.2"/><ellipse cx="54" cy="242" rx="3" ry="0.9"/></g>

      <!-- 挂钩上的雨衣 -->
      <g transform="translate(20,0)">
      <circle cx="140" cy="76" r="2.4" fill="#b98d63"/>
      <path d="M120,100 C113,110 110,126 110,142 L118,143 C118,130 120,118 125,108 Z" fill="#e8c15e"/>
      <path d="M160,100 C167,110 170,126 170,142 L162,143 C162,130 160,118 155,108 Z" fill="#e3b955"/>
      <path d="M129,90 C124,92 120,96 119,104 L115,152 C126,155 154,155 165,152 L161,104 C160,96 156,92 151,90 Z" fill="url(#boot)"/>
      <path d="M131,90 C130,80 134,76 140,76 C146,76 150,80 149,90 C146,94 134,94 131,90 Z" fill="#f2d27c"/>
      <path d="M134,89 C134,83 136,80 140,80 C144,80 146,83 146,89" fill="#d9a948" opacity="0.6"/>
      <line x1="140" y1="94" x2="140.5" y2="153" stroke="#d4a646" stroke-width="1.2"/>
      <g fill="#c99a40"><circle cx="143.5" cy="106" r="1.3"/><circle cx="143.5" cy="120" r="1.3"/><circle cx="143.5" cy="134" r="1.3"/></g>
      <path d="M122,130 L134,130" stroke="#d4a646" stroke-width="1.2"/>
      <ellipse cx="126" cy="112" rx="2" ry="9" fill="#fff" opacity="0.3"/>
      </g>
      <!-- 靠在墙边的雨伞 -->
      <g transform="translate(116,210) rotate(5)">
        <line x1="0" y1="0" x2="0" y2="-10" stroke="#9e7450" stroke-width="1.8" stroke-linecap="round"/>
        <line x1="0" y1="-60" x2="0" y2="-82" stroke="#9e7450" stroke-width="2" stroke-linecap="round"/>
        <path d="M0,-82 C0,-91 -9,-91 -9,-84" stroke="#9e7450" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path d="M0,-8 C3,-20 7,-48 6.5,-60 C5,-64 -5,-64 -6.5,-60 C-7,-48 -3,-20 0,-8 Z" fill="url(#umb)"/>
        <g stroke="#b95a47" stroke-width="0.8" fill="none" opacity="0.8"><path d="M0,-9 C1,-30 2.5,-48 2.5,-60"/><path d="M0,-9 C-1.5,-30 -3.5,-48 -3.5,-60"/></g>
        <rect x="-5.4" y="-40" width="10.8" height="3.2" rx="1" fill="#b95a47"/>
        <ellipse cx="0" cy="-61" rx="4.5" ry="1.6" fill="#b95a47"/>
      </g>
      <ellipse cx="118" cy="212" rx="8" ry="1.6" fill="#dbe6ea"/>
      <!-- 右边地上的绿植 -->
      <path d="M352,214 C346,196 336,186 324,180" stroke="#6f9f55" stroke-width="1.4" fill="none"/>
      <path d="M356,214 C356,192 352,176 346,164" stroke="#6f9f55" stroke-width="1.4" fill="none"/>
      <path d="M360,214 C364,194 372,182 384,176" stroke="#6f9f55" stroke-width="1.4" fill="none"/>
      <g fill="#79b062">
        <path d="M324,180 C330,170 344,170 348,180 C342,188 330,188 324,180 Z"/>
        <path d="M346,164 C344,152 352,144 362,146 C362,156 354,164 346,164 Z"/>
        <path d="M384,176 C384,166 372,160 364,164 C366,174 374,180 384,176 Z"/>
      </g>
      <g fill="#8cc171">
        <path d="M338,198 C334,188 342,180 352,182 C352,192 346,198 338,198 Z"/>
        <path d="M370,196 C376,186 386,186 390,192 C384,200 376,200 370,196 Z"/>
        <path d="M356,184 C350,176 352,166 360,162 C364,170 362,180 356,184 Z"/>
      </g>
      <path d="M340,212 L376,212 L371,238 L345,238 Z" fill="#dcb380"/>
      <g stroke="#bf9364" stroke-width="0.9" opacity="0.85"><line x1="341" y1="220" x2="375" y2="220"/><line x1="342.5" y1="228" x2="373.5" y2="228"/><line x1="352" y1="212" x2="353" y2="238"/><line x1="364" y1="212" x2="363" y2="238"/></g>
      <rect x="338" y="209" width="40" height="5" rx="2" fill="#e6c595"/>
    </g>

    <!-- 地面阴影 -->
    <g filter="url(#soft2)" opacity="0.18" fill="#8a6a4a">
      <ellipse cx="90" cy="238" rx="36" ry="3"/><ellipse cx="118" cy="211" rx="7" ry="1.6"/><ellipse cx="358" cy="239" rx="22" ry="2.6"/><ellipse cx="61" cy="199" rx="46" ry="2.5"/>
    </g>
    <!-- 纸纹 -->
    <rect width="400" height="260" filter="url(#grain)"/>
  </g>
</svg>
