<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450">
  <rect width="600" height="450" fill="#fff"/>
  <!-- 一盘烤鸡（整只，侧面） -->
  <g stroke="#222" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 -18)">
    <!-- 盘子 -->
    <ellipse cx="300" cy="250" rx="262" ry="158" fill="#fff"/>
    <ellipse cx="300" cy="250" rx="206" ry="118" fill="none" stroke="#999" stroke-width="4"/>
    <!-- 后面那只鸡腿的骨头 -->
    <path d="M352 182 L372 132" fill="none" stroke-width="24"/>
    <path d="M352 182 L372 132" fill="none" stroke="#fff" stroke-width="11"/>
    <circle cx="364" cy="124" r="11" fill="#fff" stroke-width="6"/>
    <circle cx="380" cy="128" r="11" fill="#fff" stroke-width="6"/>
    <!-- 鸡身 -->
    <path d="M150 284 C130 214 196 158 286 160 C370 162 430 200 444 252 C452 288 428 312 388 314 L196 314 C170 312 156 300 150 284 Z" fill="#f6b26b"/>
    <!-- 烤出来的焦色和光泽 -->
    <path d="M200 196 Q250 172 306 176" fill="none" stroke="#fff" stroke-width="9" opacity="0.75"/>
    <path d="M172 262 Q182 296 214 304" fill="none" stroke="#c99a6e" stroke-width="6"/>
    <!-- 腿和身子之间的折线 -->
    <path d="M232 300 Q262 262 300 262" fill="none" stroke="#c99a6e" stroke-width="6"/>
    <!-- 前面那只鸡腿 -->
    <path d="M408 222 L452 180" fill="none" stroke-width="24"/>
    <path d="M408 222 L452 180" fill="none" stroke="#fff" stroke-width="11"/>
    <circle cx="452" cy="168" r="11" fill="#fff" stroke-width="6"/>
    <circle cx="463" cy="180" r="11" fill="#fff" stroke-width="6"/>
    <path d="M300 262 C300 222 344 196 386 206 C422 214 428 248 404 266 C380 286 330 296 312 286 C304 280 300 272 300 262 Z" fill="#c99a6e"/>
    <path d="M330 232 Q352 218 378 222" fill="none" stroke="#fff" stroke-width="7" opacity="0.75"/>
  </g>
</svg>
