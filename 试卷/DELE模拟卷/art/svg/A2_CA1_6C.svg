    <path d="M292 280 L290 318 M308 280 L310 318" fill="none" stroke-width="16"/>
    <path d="M292 280 L290 318 M308 280 L310 318" fill="none" stroke="#f4d6c0" stroke-width="6"/>
    <path d="M300 172 C276 172 272 194 278 222 L322 222 C328 194 324 172 300 172 Z" fill="#a67c52"/>
    <path d="M284 208 L316 208 L330 284 L270 284 Z" fill="#b4a7d6"/>
    <circle cx="300" cy="188" r="17" fill="#f4d6c0"/>
    <path d="M283 186 C284 168 316 166 317 186 C306 178 294 178 283 186 Z" fill="#a67c52" stroke-width="4"/>
    <!-- 举起的手和拿话筒的手 -->
    <path d="M286 214 L268 196 L258 168" fill="none" stroke-width="16"/>
    <path d="M286 214 L268 196 L258 168" fill="none" stroke="#f4d6c0" stroke-width="6"/>
    <path d="M314 214 L326 226 L330 206" fill="none" stroke-width="16"/>
    <path d="M314 214 L326 226 L330 206" fill="none" stroke="#f4d6c0" stroke-width="6"/>
