    <rect x="512" y="270" width="22" height="112" fill="#a67c52"/>
    <path d="M523 166 C556 166 576 190 572 214 C588 230 582 262 558 268 C546 280 502 280 490 268 C466 262 460 230 476 214 C470 190 490 166 523 166 Z" fill="#93c47d"/>
    <!-- 舞台：柱子、顶棚、台面 -->
    <rect x="146" y="118" width="14" height="210" fill="#999" stroke-width="5"/>
    <rect x="440" y="118" width="14" height="210" fill="#999" stroke-width="5"/>
    <path d="M124 126 L476 126 L442 72 L158 72 Z" fill="#eb5757"/>
    <g stroke-width="4">
      <path d="M140 126 L156 146 L172 126 Z" fill="#f2c94c"/>
      <path d="M188 126 L204 146 L220 126 Z" fill="#6fa8dc"/>
      <path d="M236 126 L252 146 L268 126 Z" fill="#f2c94c"/>
      <path d="M284 126 L300 146 L316 126 Z" fill="#6fa8dc"/>
      <path d="M332 126 L348 146 L364 126 Z" fill="#f2c94c"/>
      <path d="M380 126 L396 146 L412 126 Z" fill="#6fa8dc"/>
      <path d="M428 126 L444 146 L460 126 Z" fill="#f2c94c"/>
    </g>
    <rect x="128" y="322" width="344" height="44" fill="#a67c52"/>
    <path d="M128 340 L472 340" fill="none" stroke-width="4"/>

    <!-- 吉他手 -->
    <path d="M204 268 L200 318 M218 268 L222 318" fill="none" stroke-width="20"/>
    <path d="M204 268 L200 318 M218 268 L222 318" fill="none" stroke="#6fa8dc" stroke-width="9"/>
    <rect x="188" y="206" width="46" height="66" rx="12" fill="#f2c94c"/>
    <circle cx="211" cy="186" r="18" fill="#c99a6e"/>
    <path d="M193 184 C192 166 230 162 229 182 C220 176 204 176 193 184 Z" fill="#222" stroke-width="4"/>
    <!-- 吉他 -->
    <path d="M226 244 L276 198" fill="none" stroke-width="12"/>
    <path d="M226 244 L276 198" fill="none" stroke="#a67c52" stroke-width="4"/>
    <rect x="270" y="186" width="16" height="16" rx="3" fill="#a67c52" stroke-width="4" transform="rotate(-42 278 194)"/>
    <path d="M182 256 C176 236 196 226 208 236 C214 224 234 228 232 244 C240 260 220 276 202 270 C190 274 184 266 182 256 Z" fill="#a67c52"/>
    <circle cx="210" cy="250" r="6" fill="#222" stroke-width="3"/>
    <!-- 吉他手的手臂 -->
    <path d="M192 214 L186 240 L204 252" fill="none" stroke-width="16"/>
    <path d="M192 214 L186 240 L204 252" fill="none" stroke="#c99a6e" stroke-width="6"/>
    <path d="M230 214 L246 232 L262 214" fill="none" stroke-width="16"/>
    <path d="M230 214 L246 232 L262 214" fill="none" stroke="#c99a6e" stroke-width="6"/>

