    <path d="M336 322 L336 212 M322 322 L336 300 L350 322" fill="none" stroke-width="5"/>
    <rect x="320" y="192" width="26" height="12" rx="6" fill="#222" stroke-width="3" transform="rotate(-30 333 198)"/>

    <!-- 鼓手 -->
    <rect x="374" y="206" width="42" height="62" rx="12" fill="#6fa8dc"/>
    <circle cx="395" cy="186" r="18" fill="#f4d6c0"/>
    <path d="M377 184 C376 164 414 162 413 182 C404 176 388 176 377 184 Z" fill="#999" stroke-width="4"/>
    <!-- 举着鼓槌的手 -->
    <path d="M378 214 L366 232 L360 212" fill="none" stroke-width="16"/>
    <path d="M378 214 L366 232 L360 212" fill="none" stroke="#f4d6c0" stroke-width="6"/>
    <path d="M412 214 L424 232 L430 212" fill="none" stroke-width="16"/>
    <path d="M412 214 L424 232 L430 212" fill="none" stroke="#f4d6c0" stroke-width="6"/>
    <path d="M360 212 L348 186 M430 212 L444 188" fill="none" stroke-width="5"/>
    <!-- 鼓 -->
    <circle cx="395" cy="290" r="34" fill="#fff"/>
    <circle cx="395" cy="290" r="20" fill="none" stroke="#6fa8dc" stroke-width="8"/>
    <path d="M352 258 L352 280 Q366 288 380 280 L380 258" fill="#eb5757" stroke-width="5"/>
    <ellipse cx="366" cy="258" rx="14" ry="6" fill="#fff" stroke-width="5"/>

    <!-- 音符 -->
    <g fill="#222" stroke-width="5">
      <ellipse cx="94" cy="136" rx="11" ry="8" transform="rotate(-20 94 136)"/>
      <path d="M104 132 L104 94 Q114 104 124 108" fill="none"/>
      <ellipse cx="486" cy="140" rx="11" ry="8" transform="rotate(-20 486 140)"/>
      <ellipse cx="520" cy="132" rx="11" ry="8" transform="rotate(-20 520 132)"/>
      <path d="M496 136 L496 98 L530 90 L530 128" fill="none"/>
      <path d="M496 106 L530 98" fill="none" stroke-width="7"/>
