    <g transform="rotate(6 360 282)">
      <rect x="215.0" y="184.0" width="290" height="196" rx="6" fill="#fff"/>
      <!-- 中间分隔线 -->
      <path d="M360 206.0 L360 358.0" fill="none" stroke="#999" stroke-width="4"/>
      <!-- 左边：手写的几行（只是波浪线，不写字） -->
      <g fill="none" stroke="#999" stroke-width="4">
        <path d="M235.0 244.0 q8 -8 16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0"/>
