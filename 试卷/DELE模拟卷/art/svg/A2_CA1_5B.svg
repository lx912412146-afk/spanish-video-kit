        <path d="M115.0 169.0 q8 -8 16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0"/>
        <path d="M115.0 201.0 q8 -8 16 0 t16 0 t16 0 t16 0 t16 0 t16 0"/>
        <path d="M115.0 233.0 q8 -8 16 0 t16 0 t16 0 t16 0"/>
