<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450">
  <rect width="600" height="450" fill="#fff"/>
  <!-- 一座带花园和一棵树的平房 -->
  <g stroke="#222" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <!-- 花园草地 -->
    <path d="M40 392 Q300 376 560 392 L560 424 L40 424 Z" fill="#93c47d"/>
    <!-- 树 -->
    <g transform="translate(14 0)">
    <rect x="460" y="270" width="26" height="118" fill="#a67c52"/>
    <path d="M473 116 C520 116 548 150 540 190 C566 214 556 262 520 272 C500 290 446 290 426 272 C390 262 382 214 406 190 C398 150 426 116 473 116 Z" fill="#93c47d"/>
    </g>
    <g transform="translate(-30 0)">
    <!-- 房子 -->
    <rect x="90" y="246" width="300" height="142" fill="#f2c94c"/>
    <path d="M66 254 L240 136 L414 254 Z" fill="#eb5757"/>
    <!-- 门 -->
    <rect x="212" y="300" width="56" height="88" fill="#a67c52"/>
    <circle cx="256" cy="346" r="4" fill="#222" stroke-width="2"/>
    <!-- 窗 -->
    <rect x="114" y="282" width="68" height="56" fill="#6fa8dc"/>
    <path d="M148 282 L148 338 M114 310 L182 310" fill="none" stroke-width="5"/>
    <rect x="298" y="282" width="68" height="56" fill="#6fa8dc"/>
    <path d="M332 282 L332 338 M298 310 L366 310" fill="none" stroke-width="5"/>
    </g>
    <!-- 花园里的小路和花 -->
    <path d="M182 388 L166 424 M238 388 L254 424" fill="none" stroke-width="5"/>
    <g stroke-width="4">
      <circle cx="80" cy="404" r="7" fill="#eb5757"/>
      <circle cx="118" cy="406" r="7" fill="#f2c94c"/>
      <circle cx="310" cy="406" r="7" fill="#eb5757"/>
      <circle cx="348" cy="404" r="7" fill="#f2c94c"/>
    </g>
  </g>
</svg>
