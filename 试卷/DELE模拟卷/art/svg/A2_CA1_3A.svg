      <rect x="242" y="71" width="30" height="13"/><rect x="285" y="71" width="30" height="13"/><rect x="328" y="71" width="30" height="13"/>
      <rect x="242" y="94" width="30" height="13"/><rect x="285" y="94" width="30" height="13"/><rect x="328" y="94" width="30" height="13"/>
      <rect x="242" y="117" width="30" height="13"/><rect x="285" y="117" width="30" height="13"/><rect x="328" y="117" width="30" height="13"/>
      <rect x="242" y="140" width="30" height="13"/><rect x="285" y="140" width="30" height="13"/><rect x="328" y="140" width="30" height="13"/>
      <rect x="242" y="163" width="30" height="13"/><rect x="285" y="163" width="30" height="13"/><rect x="328" y="163" width="30" height="13"/>
      <rect x="242" y="186" width="30" height="13"/><rect x="285" y="186" width="30" height="13"/><rect x="328" y="186" width="30" height="13"/>
      <rect x="242" y="209" width="30" height="13"/><rect x="285" y="209" width="30" height="13"/><rect x="328" y="209" width="30" height="13"/>
      <rect x="242" y="232" width="30" height="13"/><rect x="285" y="232" width="30" height="13"/><rect x="328" y="232" width="30" height="13"/>
      <rect x="242" y="255" width="30" height="13"/><rect x="285" y="255" width="30" height="13"/><rect x="328" y="255" width="30" height="13"/>
      <rect x="242" y="278" width="30" height="13"/><rect x="285" y="278" width="30" height="13"/><rect x="328" y="278" width="30" height="13"/>
      <rect x="242" y="301" width="30" height="13"/><rect x="285" y="301" width="30" height="13"/><rect x="328" y="301" width="30" height="13"/>
      <rect x="242" y="324" width="30" height="13"/><rect x="328" y="324" width="30" height="13"/>
      <rect x="242" y="347" width="30" height="13"/><rect x="328" y="347" width="30" height="13"/>
