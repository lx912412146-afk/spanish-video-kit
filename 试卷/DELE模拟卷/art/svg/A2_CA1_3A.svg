    <!-- 街道 -->
    <path d="M40 392 L560 392" fill="none"/>
    <path d="M70 418 L120 418 M170 418 L220 418 M270 418 L330 418 M380 418 L430 418 M480 418 L530 418" fill="none" stroke="#999" stroke-width="6"/>
    <!-- 左边的楼 -->
    <rect x="82" y="236" width="130" height="156" fill="#f6b26b"/>
    <g fill="#fff" stroke-width="5">
      <rect x="100" y="256" width="28" height="26"/><rect x="166" y="256" width="28" height="26"/>
      <rect x="100" y="300" width="28" height="26"/><rect x="166" y="300" width="28" height="26"/>
      <rect x="100" y="344" width="28" height="26"/><rect x="166" y="344" width="28" height="26"/>
