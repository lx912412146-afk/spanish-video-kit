<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450">
  <rect width="600" height="450" fill="#fff"/>
  <!-- 一位女士（侧面）用手捂着喉咙：嗓子疼 -->
  <g stroke="#222" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- 腿和鞋 -->
    <rect x="279" y="336" width="18" height="70" fill="#f4d6c0"/>
    <rect x="304" y="336" width="18" height="70" fill="#f4d6c0"/>
    <path d="M276 400 L300 400 Q318 402 318 414 L276 414 Z" fill="#a67c52"/>
    <path d="M301 400 L325 400 Q343 402 343 414 L301 414 Z" fill="#a67c52"/>
    <!-- 裙子 -->
    <path d="M276 252 L328 252 L350 348 Q302 360 254 348 Z" fill="#6fa8dc"/>
    <!-- 脖子 -->
    <rect x="292" y="118" width="20" height="36" fill="#f4d6c0"/>
    <!-- 上衣 -->
    <path d="M280 148 Q302 140 324 148 Q342 172 338 206 Q334 236 328 262 L276 262 Q266 230 266 200 Q266 168 280 148 Z" fill="#b4a7d6"/>
    <!-- 头（侧脸，朝右） -->
    <path d="M305 50 C330 50 346 66 346 84 L355 100 L346 105 C346 114 342 124 330 128 C318 133 300 132 290 128 C272 120 265 106 265 90 C265 66 282 50 305 50 Z" fill="#f4d6c0"/>
    <!-- 头发 -->
    <path d="M346 72 C342 48 320 42 302 44 C276 46 258 66 258 92 C258 118 260 136 266 148 L300 148 C296 130 293 112 295 98 C297 84 322 72 346 72 Z" fill="#a67c52"/>
    <!-- 五官：皱眉、闭眼、嘴角向下 -->
    <path d="M322 86 L338 81" fill="none" stroke-width="4"/>
    <path d="M323 95 Q330 100 337 95" fill="none" stroke-width="4"/>
    <path d="M332 118 Q338 113 344 118" fill="none" stroke-width="4"/>
    <!-- 手臂：手捂喉咙 -->
    <path d="M300 168 L352 214 L322 146" fill="none" stroke-width="30"/>
    <path d="M300 168 L352 214 L322 146" fill="none" stroke="#b4a7d6" stroke-width="18"/>
    <ellipse cx="318" cy="142" rx="17" ry="13" fill="#f4d6c0" transform="rotate(-15 318 142)"/>
    <!-- 疼痛标记 -->
    <g stroke="#eb5757" stroke-width="7" fill="none">
      <path d="M350 142 L372 142"/>
      <path d="M348 126 L366 116"/>
      <path d="M348 158 L366 168"/>
    </g>
  </g>
</svg>
