<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450">
  <rect width="600" height="450" fill="#fff"/>
  <!-- 一个打开的空纸箱（盖子四片都翻开，里面是空的） -->
  <g stroke="#222" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <!-- 后面的盖片 -->
    <path d="M236 168 L456 168 L436 96 L222 96 Z" fill="#f6b26b"/>
    <!-- 左边的盖片 -->
    <path d="M146 216 L236 168 L170 124 L84 168 Z" fill="#f6b26b"/>
    <!-- 箱子里面（空的） -->
    <path d="M146 216 L366 216 L456 168 L236 168 Z" fill="#a67c52"/>
    <path d="M146 216 L236 168 L236 216 Z" fill="#222" opacity="0.3" stroke="none"/>
    <path d="M236 168 L236 216" fill="none" stroke-width="5"/>
    <path d="M146 216 L366 216 L456 168 L236 168 Z" fill="none"/>
    <!-- 右侧面 -->
    <path d="M366 216 L456 168 L456 340 L366 392 Z" fill="#a67c52"/>
    <!-- 正面 -->
    <rect x="146" y="216" width="220" height="176" fill="#c99a6e"/>
    <!-- 右边的盖片 -->
    <path d="M366 216 L456 168 L528 196 L440 246 Z" fill="#f6b26b"/>
    <!-- 前面的盖片（向前翻下） -->
    <path d="M146 216 L366 216 L388 262 L124 262 Z" fill="#f6b26b"/>
  </g>
</svg>
